<!DOCTYPE html>
<html lang="{{ 'fa' if user_preferences.direction_resolved == 'rtl' else 'en' }}" dir="{{ user_preferences.direction_resolved }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="premium-bg text-slate-100 min-h-screen antialiased">
{% extends "base.html" %}

{% block content %}
<div class="p-6 max-w-[800px] mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('marketing.costs_list') }}" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6">
        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('cost_date', 'Cost Date') }}</label>
                    <input type="date" name="cost_date" value="{{ cost.cost_date[:10] if cost and cost.cost_date else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                    <input type="number" name="amount" step="0.01" value="{{ cost.amount if cost else '0' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('cost_type', 'Cost Type') }}</label>
                <select name="cost_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select --</option>
                    <option value="Advertising" {% if cost and cost.cost_type == 'Advertising' %}selected{% endif %}>Advertising</option>
                    <option value="Content Creation" {% if cost and cost.cost_type == 'Content Creation' %}selected{% endif %}>Content Creation</option>
                    <option value="Campaign" {% if cost and cost.cost_type == 'Campaign' %}selected{% endif %}>Campaign</option>
                    <option value="Exhibition" {% if cost and cost.cost_type == 'Exhibition' %}selected{% endif %}>Exhibition</option>
                    <option value="Print" {% if cost and cost.cost_type == 'Print' %}selected{% endif %}>Print</option>
                    <option value="Digital" {% if cost and cost.cost_type == 'Digital' %}selected{% endif %}>Digital</option>
                    <option value="Other" {% if cost and cost.cost_type == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('description', 'Description') }}</label>
                <input type="text" name="description" value="{{ cost.description if cost else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('vendor', 'Vendor') }}</label>
                <input type="text" name="vendor_name" value="{{ cost.vendor_name if cost else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('campaign', 'Campaign') }}</label>
                    <select name="linked_campaign_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">-- None --</option>
                        {% for c in campaigns %}
                        <option value="{{ c.id }}" {% if cost and cost.linked_campaign_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('channel', 'Channel') }}</label>
                    <select name="linked_channel_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">-- None --</option>
                        {% for c in channels %}
                        <option value="{{ c.id }}" {% if cost and cost.linked_channel_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.costs_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all"><i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
        </div>
    </form>

</div>
{% endblock %}
