<!DOCTYPE html>
<html lang="{{ 'fa' if user_preferences.direction_resolved == 'rtl' else 'en' }}" dir="{{ user_preferences.direction_resolved }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="premium-bg text-slate-100 min-h-screen antialiased">
{% extends "base.html" %}

{% block content %}
<div class="p-6 max-w-[1000px] mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('marketing.advertisements_list') }}" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="md:col-span-2">
                <h3 class="text-lg font-bold text-white mb-4 pb-2 border-b border-white/10">{{ t('basic_info', 'Basic Information') }}</h3>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('title', 'Title') }} <span class="text-rose-400">*</span></label>
                <input type="text" name="title" value="{{ ad.title if ad else '' }}" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('ad_type', 'Advertisement Type') }}</label>
                <select name="advertisement_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select --</option>
                    {% for at in ad_types %}
                    <option value="{{ at }}" {% if ad and ad.advertisement_type == at %}selected{% endif %}>{{ at }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Draft" {% if ad and ad.status == 'Draft' %}selected{% endif %}>Draft</option>
                    <option value="Active" {% if ad and ad.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Completed" {% if ad and ad.status == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('channel', 'Channel') }}</label>
                <select name="channel_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select --</option>
                    {% for c in channels %}
                    <option value="{{ c.id }}" {% if ad and ad.channel_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('publish_date', 'Publish Date') }}</label>
                <input type="date" name="publish_date" value="{{ ad.publish_date[:10] if ad and ad.publish_date else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('budget', 'Budget') }}</label>
                <input type="number" name="budget" step="0.01" value="{{ ad.budget if ad else '0' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('validity', 'Validity Date') }}</label>
                <input type="date" name="validity_date" value="{{ ad.validity_date[:10] if ad and ad.validity_date else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div class="md:col-span-2">
                <h3 class="text-lg font-bold text-white mb-4 pb-2 border-t border-white/10 pt-4">{{ t('content', 'Content') }}</h3>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('ad_content', 'Advertisement Content') }}</label>
                <textarea name="content_text" rows="4" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ ad.content_text if ad else '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('cta_text', 'CTA Text') }}</label>
                <input type="text" name="cta_text" value="{{ ad.cta_text if ad else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('cta_url', 'CTA URL') }}</label>
                <input type="url" name="cta_url" value="{{ ad.cta_url if ad else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                <textarea name="notes" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ ad.notes if ad else '' }}</textarea>
            </div>

        </div>

        <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.advertisements_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all"><i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
        </div>
    </form>

</div>
{% endblock %}
