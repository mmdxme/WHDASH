<!DOCTYPE html>
<html lang="{{ 'fa' if user_preferences.direction_resolved == 'rtl' else 'en' }}" dir="{{ user_preferences.direction_resolved }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="premium-bg text-slate-100 min-h-screen antialiased">
{% extends "base.html" %}

{% block content %}
<div class="p-6 max-w-[800px] mx-auto">

    <!-- Page Header -->
    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('marketing.channels_list') }}" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <div>
            <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
            <p class="text-slate-400 mt-1">{{ t('channel_form_desc', 'Enter channel details') }}</p>
        </div>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-2xl p-6">
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('channel_name', 'Channel Name') }} <span class="text-rose-400">*</span></label>
                <input type="text" name="name" value="{{ channel.name if channel else '' }}" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('channel_code', 'Channel Code') }}</label>
                <input type="text" name="code" value="{{ channel.code if channel else '' }}" placeholder="{{ t('auto_generated', 'Auto-generated') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white font-mono focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('channel_type', 'Channel Type') }} <span class="text-rose-400">*</span></label>
                <select name="channel_type" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select Type --</option>
                    <option value="Digital" {% if channel and channel.channel_type == 'Digital' %}selected{% endif %}>Digital</option>
                    <option value="Social Media" {% if channel and channel.channel_type == 'Social Media' %}selected{% endif %}>Social Media</option>
                    <option value="Messaging" {% if channel and channel.channel_type == 'Messaging' %}selected{% endif %}>Messaging</option>
                    <option value="Offline" {% if channel and channel.channel_type == 'Offline' %}selected{% endif %}>Offline</option>
                    <option value="Event" {% if channel and channel.channel_type == 'Event' %}selected{% endif %}>Event</option>
                    <option value="Print" {% if channel and channel.channel_type == 'Print' %}selected{% endif %}>Print</option>
                    <option value="Partnership" {% if channel and channel.channel_type == 'Partnership' %}selected{% endif %}>Partnership</option>
                    <option value="Direct" {% if channel and channel.channel_type == 'Direct' %}selected{% endif %}>Direct</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('description', 'Description') }}</label>
                <textarea name="description" rows="3" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ channel.description if channel else '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Active" {% if channel and channel.status == 'Active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                    <option value="Inactive" {% if channel and channel.status == 'Inactive' %}selected{% endif %}>{{ t('inactive', 'Inactive') }}</option>
                </select>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.channels_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">
                {{ t('cancel', 'Cancel') }}
            </a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}
            </button>
        </div>
    </form>

</div>
{% endblock %}
