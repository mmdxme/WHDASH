<!DOCTYPE html>
<html lang="{{ 'fa' if user_preferences.direction_resolved == 'rtl' else 'en' }}" dir="{{ user_preferences.direction_resolved }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="premium-bg text-slate-100 min-h-screen antialiased">
{% extends "base.html" %}

{% block content %}
<div class="p-6 max-w-[1000px] mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('marketing.offers_list') }}" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('offer_number', 'Offer Number') }}</label>
                <input type="text" name="offer_number" value="{{ offer.offer_number if offer else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white font-mono focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('offer_date', 'Offer Date') }}</label>
                <input type="date" name="offer_date" value="{{ offer.offer_date[:10] if offer and offer.offer_date else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('target_customer', 'Target Customer') }}</label>
                <input type="text" name="target_customer" value="{{ offer.target_customer if offer else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('validity_period', 'Validity Period') }}</label>
                <input type="date" name="validity_period" value="{{ offer.validity_period[:10] if offer and offer.validity_period else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('discount', 'Discount (%)') }}</label>
                <input type="number" name="discount_percentage" step="0.01" value="{{ offer.discount_percentage if offer else '0' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Sent" {% if offer and offer.status == 'Sent' %}selected{% endif %}>Sent</option>
                    <option value="Accepted" {% if offer and offer.status == 'Accepted' %}selected{% endif %}>Accepted</option>
                    <option value="Rejected" {% if offer and offer.status == 'Rejected' %}selected{% endif %}>Rejected</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('responsible', 'Responsible Salesperson') }}</label>
                <select name="responsible_salesperson_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Not Assigned --</option>
                    {% for sp in salespersons %}
                    <option value="{{ sp.id }}" {% if offer and offer.responsible_salesperson_id == sp.id %}selected{% endif %}>{{ sp.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('campaign', 'Campaign') }}</label>
                <select name="linked_campaign_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- None --</option>
                    {% for c in campaigns %}
                    <option value="{{ c.id }}" {% if offer and offer.linked_campaign_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('products', 'Products Included') }}</label>
                <textarea name="products_included" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ offer.products_included if offer else '' }}</textarea>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                <textarea name="notes" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ offer.notes if offer else '' }}</textarea>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.offers_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all"><i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
        </div>
    </form>

</div>
{% endblock %}
