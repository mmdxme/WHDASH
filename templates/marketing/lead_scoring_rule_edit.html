<!DOCTYPE html>
<html lang="{{ 'fa' if user_preferences.direction_resolved == 'rtl' else 'en' }}" dir="{{ user_preferences.direction_resolved }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="premium-bg text-slate-100 min-h-screen antialiased">
{% extends "base.html" %}

{% block content %}
<div class="p-6 max-w-[900px] mx-auto">

    <!-- Page Header -->
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('marketing.lead_scoring_list') }}" class="p-2 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <div>
            <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
            <p class="text-slate-400 mt-1">{{ t('scoring_rule_desc', 'Configure lead scoring rule parameters') }}</p>
        </div>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-2xl p-8">
        <div class="space-y-6">
            <!-- Basic Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('rule_name', 'Rule Name') }} *</label>
                    <input type="text" name="rule_name" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500" placeholder="{{ t('rule_name_placeholder', 'e.g., High Industry Match') }}">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('rule_code', 'Rule Code') }}</label>
                    <input type="text" name="rule_code" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500" placeholder="{{ t('auto_generated', 'Auto-generated if empty') }}">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('rule_type', 'Rule Type') }} *</label>
                    <select name="rule_type" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="demographic">{{ t('demographic', 'Demographic') }}</option>
                        <option value="behavioral">{{ t('behavioral', 'Behavioral') }}</option>
                        <option value="engagement">{{ t('engagement', 'Engagement') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('category', 'Category') }} *</label>
                    <select name="category" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="industry">{{ t('industry', 'Industry') }}</option>
                        <option value="customer_type">{{ t('customer_type', 'Customer Type') }}</option>
                        <option value="buying_power">{{ t('buying_power', 'Buying Power') }}</option>
                        <option value="engagement_action">{{ t('engagement_action', 'Engagement Action') }}</option>
                        <option value="followup_requested">{{ t('followup_requested', 'Follow-up Requested') }}</option>
                        <option value="quotation_requested">{{ t('quotation_requested', 'Quotation Requested') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('score_change', 'Score Change') }} *</label>
                    <input type="number" name="score_change" required value="10" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
            </div>

            <!-- Criteria -->
            <div class="border-t border-white/10 pt-6">
                <h3 class="text-lg font-bold text-white mb-4">{{ t('criteria', 'Matching Criteria') }}</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('attribute_field', 'Attribute Field') }}</label>
                        <input type="text" name="attribute_field" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('e_g_field_name', 'e.g., industry') }}">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('operator', 'Operator') }}</label>
                        <select name="operator" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="equals">{{ t('equals', 'Equals') }}</option>
                            <option value="contains">{{ t('contains', 'Contains') }}</option>
                            <option value="greater_than">{{ t('greater_than', 'Greater Than') }}</option>
                            <option value="less_than">{{ t('less_than', 'Less Than') }}</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('attribute_value', 'Value') }}</label>
                        <input type="text" name="attribute_value" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('e_g_value', 'e.g., Auto Parts') }}">
                    </div>
                </div>
            </div>

            <!-- Priority & Description -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('priority', 'Priority') }}</label>
                    <input type="number" name="priority" value="0" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('description', 'Description') }}</label>
                    <input type="text" name="description" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('optional_description', 'Optional description') }}">
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-4 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.lead_scoring_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">
                {{ t('cancel', 'Cancel') }}
            </a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('save_rule', 'Save Rule') }}
            </button>
        </div>
    </form>

</div>
{% endblock %}
</body>
</html>
