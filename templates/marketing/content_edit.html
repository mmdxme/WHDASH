<!DOCTYPE html>
<html lang="{{ 'fa' if user_preferences.direction_resolved == 'rtl' else 'en' }}" dir="{{ user_preferences.direction_resolved }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="premium-bg text-slate-100 min-h-screen antialiased">
{% extends "base.html" %}

{% block content %}
<div class="p-6 max-w-[1000px] mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('marketing.content_list') }}" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('topic', 'Topic') }} <span class="text-rose-400">*</span></label>
                <input type="text" name="topic" value="{{ content.topic if content else '' }}" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('content_type', 'Content Type') }}</label>
                <select name="content_objective" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select --</option>
                    {% for ct in content_types %}
                    <option value="{{ ct }}" {% if content and content.content_objective == ct %}selected{% endif %}>{{ ct }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('format', 'Format') }}</label>
                <select name="content_format" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select --</option>
                    {% for cf in content_formats %}
                    <option value="{{ cf }}" {% if content and content.content_format == cf %}selected{% endif %}>{{ cf }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('channel', 'Channel') }}</label>
                <select name="channel_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">-- Select --</option>
                    {% for c in channels %}
                    <option value="{{ c.id }}" {% if content and content.channel_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('publish_date', 'Publish Date') }}</label>
                <input type="date" name="publish_date" value="{{ content.publish_date[:10] if content and content.publish_date else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('title', 'Title') }}</label>
                <input type="text" name="title" value="{{ content.title if content else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('content_text', 'Content Text') }}</label>
                <textarea name="content_text" rows="5" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ content.content_text if content else '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Draft" {% if content and content.status == 'Draft' %}selected{% endif %}>Draft</option>
                    <option value="Published" {% if content and content.status == 'Published' %}selected{% endif %}>Published</option>
                    <option value="Scheduled" {% if content and content.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                <textarea name="notes" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ content.notes if content else '' }}</textarea>
            </div>

        </div>

        <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.content_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all"><i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
        </div>
    </form>

</div>
{% endblock %}
