{% extends "base.html" %}

{% block extra_head %}
<title>{{ t('app_name', 'Enterprise Hub') }} - {{ t(title, title) }}</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block content %}
<div class="p-6 max-w-[800px] mx-auto">

    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('marketing.budgets_list') }}" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
            <i class="fa-solid fa-arrow-left text-slate-400"></i>
        </a>
        <h1 class="text-3xl font-extrabold text-white">{{ title }}</h1>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6">
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('budget_name', 'Budget Name') }} <span class="text-rose-400">*</span></label>
                <input type="text" name="name" value="{{ budget.name if budget else '' }}" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('period_type', 'Period Type') }}</label>
                    <select name="period_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Monthly" {% if budget and budget.period_type == 'Monthly' %}selected{% endif %}>Monthly</option>
                        <option value="Quarterly" {% if budget and budget.period_type == 'Quarterly' %}selected{% endif %}>Quarterly</option>
                        <option value="Yearly" {% if budget and budget.period_type == 'Yearly' %}selected{% endif %}>Yearly</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('budget_type', 'Budget Type') }}</label>
                    <select name="budget_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Overall" {% if budget and budget.budget_type == 'Overall' %}selected{% endif %}>Overall</option>
                        <option value="Campaign" {% if budget and budget.budget_type == 'Campaign' %}selected{% endif %}>Campaign</option>
                        <option value="Channel" {% if budget and budget.budget_type == 'Channel' %}selected{% endif %}>Channel</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('start_date', 'Start Date') }}</label>
                    <input type="date" name="period_start" value="{{ budget.period_start[:10] if budget and budget.period_start else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('end_date', 'End Date') }}</label>
                    <input type="date" name="period_end" value="{{ budget.period_end[:10] if budget and budget.period_end else '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('total_budget', 'Total Budget') }}</label>
                    <input type="number" name="total_budget" step="0.01" value="{{ budget.total_budget if budget else '0' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                    <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Draft" {% if budget and budget.status == 'Draft' %}selected{% endif %}>Draft</option>
                        <option value="Approved" {% if budget and budget.status == 'Approved' %}selected{% endif %}>Approved</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('digital_budget', 'Digital Budget') }}</label>
                    <input type="number" name="digital_budget" step="0.01" value="{{ budget.digital_budget if budget else '0' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('print_budget', 'Print Budget') }}</label>
                    <input type="number" name="print_budget" step="0.01" value="{{ budget.print_budget if budget else '0' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                <textarea name="notes" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ budget.notes if budget else '' }}</textarea>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 mt-8 pt-6 border-t border-white/10">
            <a href="{{ url_for('marketing.budgets_list') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 rounded-xl text-sm font-semibold transition-all"><i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
        </div>
    </form>

</div>
{% endblock %}
