<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Global Warehouse Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .colorplot-bg {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.25), transparent 35%),
                              radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.25), transparent 35%),
                              radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.15), transparent 45%);
            animation: pulse-bg 15s ease-in-out infinite alternate;
        }
        @keyframes pulse-bg {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glass:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.25);
        }
    </style>
</head>
<body class="colorplot-bg min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <!-- Glowing Animated Orbs -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-500/20 rounded-full blur-[120px] pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none animate-pulse" style="animation-delay: 2s;"></div>

    <div class="max-w-md w-full glass-card rounded-[2rem] p-10 relative z-10 transition-all duration-500 transform hover:scale-[1.02]">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-brand-400 via-brand-600 to-purple-600 shadow-[0_0_40px_rgba(14,165,233,0.4)] text-white mb-6 transform -rotate-6 transition-transform hover:rotate-0 duration-300">
                <i class="fa-solid fa-layer-group text-4xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Enterprise Hub</h2>
            <p class="text-slate-400 mt-2 font-light">Global Warehouse Management</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-6 p-4 rounded-xl text-sm font-medium flex items-center gap-3 animate-bounce-in {% if category == 'error' %}bg-red-500/20 text-red-200 border border-red-500/30 shadow-[0_0_15px_rgba(239,68,68,0.2)]{% else %}bg-brand-500/20 text-brand-200 border border-brand-500/30 shadow-[0_0_15px_rgba(14,165,233,0.2)]{% endif %}">
                        <i class="fa-solid {% if category == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %} text-lg"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-2 ml-1">Account Identifier</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-brand-400 text-slate-500">
                        <i class="fa-solid fa-at"></i>
                    </div>
                    <input id="username" name="username" type="text" required class="block w-full pl-11 pr-4 py-3.5 input-glass rounded-xl text-white placeholder-slate-500 outline-none transition-all duration-300" placeholder="Username or Email" value="admin">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2 ml-1 pr-1">
                    <label for="password" class="block text-sm font-medium text-slate-300">Security Key</label>
                    <a href="#" class="text-xs font-medium text-brand-400 hover:text-brand-300 transition-colors">Recover Access</a>
                </div>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-brand-400 text-slate-500">
                        <i class="fa-solid fa-fingerprint"></i>
                    </div>
                    <input id="password" name="password" type="password" required class="block w-full pl-11 pr-4 py-3.5 input-glass rounded-xl text-white placeholder-slate-500 outline-none transition-all duration-300" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center items-center py-4 px-4 border border-transparent rounded-xl shadow-[0_10px_25px_-5px_rgba(2,132,199,0.5)] text-base font-bold text-white bg-gradient-to-r from-brand-600 via-brand-500 to-brand-400 hover:from-brand-500 hover:to-brand-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-brand-500 transition-all transform hover:-translate-y-1">
                Authenticate Securely <i class="fa-solid fa-arrow-right-to-bracket ml-3"></i>
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-slate-700/50">
            <p class="text-center text-sm text-slate-400 mb-5">Enterprise Federation</p>
            <a href="{{ url_for('login_google') }}" class="w-full flex justify-center items-center py-3.5 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-medium text-white transition-all transform hover:-translate-y-0.5">
                <img class="h-5 w-5 mr-3" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                Continue with Google Workspace
            </a>
        </div>
        
    </div>
    
</body>
</html>
