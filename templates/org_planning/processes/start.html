{% extends "org_planning/base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <!-- Back Button -->
    <a href="{{ url_for('org_planning.processes') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_processes', lang) }}
    </a>

    <!-- Page Header -->
    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('start_process', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('start_process_desc', lang) }}</p>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="max-w-2xl space-y-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('workflow', lang) }} *</label>
                <select name="workflow_id" class="input-field w-full px-4 py-2 rounded-lg" required>
                    <option value="">{{ t('select_workflow', lang) }}</option>
                    {% for wf in workflows %}
                    <option value="{{ wf.id }}">{{ wf.name }} ({{ wf.category or 'General' }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('title', lang) }} *</label>
                <input type="text" name="title" class="input-field w-full px-4 py-2 rounded-lg" required placeholder="{{ t('process_title', lang) }}">
            </div>
            
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('description', lang) }}</label>
                <textarea name="description" class="input-field w-full px-4 py-2 rounded-lg h-24" placeholder="{{ t('process_description', lang) }}"></textarea>
            </div>
            
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('priority', lang) }}</label>
                <select name="priority" class="input-field w-full px-4 py-2 rounded-lg">
                    <option value="low">{{ t('low', lang) }}</option>
                    <option value="medium" selected>{{ t('medium', lang) }}</option>
                    <option value="high">{{ t('high', lang) }}</option>
                    <option value="critical">{{ t('critical', lang) }}</option>
                </select>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-700/50">
                <a href="{{ url_for('org_planning.processes') }}" class="btn-secondary px-6 py-2 rounded-lg">
                    {{ t('cancel', lang) }}
                </a>
                <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                    <i class="fas fa-play mr-2"></i>
                    {{ t('start_process', lang) }}
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
