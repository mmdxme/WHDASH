{% extends "org_planning/base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <a href="{{ url_for('org_planning.approval_matrix') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_matrix', lang) }}
    </a>

    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('create_approval_matrix', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('create_matrix_desc', lang) }}</p>
    </div>

    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('name', lang) }} *</label>
                <input type="text" name="name" class="input-field w-full px-4 py-2 rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('module', lang) }} *</label>
                <select name="module" class="input-field w-full px-4 py-2 rounded-lg" required>
                    <option value="org_planning">Org Planning</option>
                    <option value="hr">HR</option>
                    <option value="finance">Finance</option>
                    <option value="procurement">Procurement</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('document_type', lang) }} *</label>
                <input type="text" name="document_type" class="input-field w-full px-4 py-2 rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('approval_type', lang) }}</label>
                <select name="approval_type" class="input-field w-full px-4 py-2 rounded-lg">
                    <option value="sequential">Sequential</option>
                    <option value="parallel">Parallel</option>
                    <option value="conditional">Conditional</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('min_amount', lang) }}</label>
                <input type="number" name="min_amount" class="input-field w-full px-4 py-2 rounded-lg" step="0.01" value="0">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('max_amount', lang) }}</label>
                <input type="number" name="max_amount" class="input-field w-full px-4 py-2 rounded-lg" step="0.01" value="999999999">
            </div>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.approval_matrix') }}" class="btn-secondary px-6 py-2 rounded-lg">{{ t('cancel', lang) }}</a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>{{ t('create_matrix', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
