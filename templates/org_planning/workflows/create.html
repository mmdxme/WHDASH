{% extends "org_planning/base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <!-- Back Button -->
    <a href="{{ url_for('org_planning.workflows') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_workflows', lang) }}
    </a>

    <!-- Page Header -->
    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('create_workflow', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('create_workflow_desc', lang) }}</p>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Basic Info -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-white mb-4">{{ t('basic_information', lang) }}</h3>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('name', lang) }} *</label>
                    <input type="text" name="name" class="input-field w-full px-4 py-2 rounded-lg" required placeholder="{{ t('workflow_name', lang) }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('code', lang) }} *</label>
                    <input type="text" name="code" class="input-field w-full px-4 py-2 rounded-lg" required placeholder="WF-XXX">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('category', lang) }}</label>
                    <select name="category" class="input-field w-full px-4 py-2 rounded-lg">
                        <option value="Finance">Finance</option>
                        <option value="HR">HR</option>
                        <option value="Operations">Operations</option>
                        <option value="IT">IT</option>
                        <option value="Quality">Quality</option>
                        <option value="General">General</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('module', lang) }}</label>
                    <select name="module" class="input-field w-full px-4 py-2 rounded-lg">
                        <option value="org_planning">Org Planning</option>
                        <option value="hr">HR</option>
                        <option value="finance">Finance</option>
                        <option value="procurement">Procurement</option>
                        <option value="operations">Operations</option>
                    </select>
                </div>
            </div>

            <!-- Additional Info -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-white mb-4">{{ t('settings', lang) }}</h3>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('description', lang) }}</label>
                    <textarea name="description" class="input-field w-full px-4 py-2 rounded-lg h-24" placeholder="{{ t('workflow_description', lang) }}"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('estimated_duration_hours', lang) }}</label>
                    <input type="number" name="estimated_duration_hours" class="input-field w-full px-4 py-2 rounded-lg" value="24">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('risk_level', lang) }}</label>
                    <select name="risk_level" class="input-field w-full px-4 py-2 rounded-lg">
                        <option value="low">{{ t('low', lang) }}</option>
                        <option value="medium" selected>{{ t('medium', lang) }}</option>
                        <option value="high">{{ t('high', lang) }}</option>
                        <option value="critical">{{ t('critical', lang) }}</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.workflows') }}" class="btn-secondary px-6 py-2 rounded-lg">
                {{ t('cancel', lang) }}
            </a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>
                {{ t('create_workflow', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
