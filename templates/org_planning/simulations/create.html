{% extends "org_planning/base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <a href="{{ url_for('org_planning.simulations') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_simulations', lang) }}
    </a>

    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('create_simulation', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('create_simulation_desc', lang) }}</p>
    </div>

    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('name', lang) }} *</label>
                <input type="text" name="name" class="input-field w-full px-4 py-2 rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('scenario_type', lang) }} *</label>
                <select name="scenario_type" class="input-field w-full px-4 py-2 rounded-lg" required>
                    <option value="restructure">Restructure</option>
                    <option value="merger">Merger</option>
                    <option value="acquisition">Acquisition</option>
                    <option value="cost_cut">Cost Cut</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm text-gray-400 mb-2">{{ t('description', lang) }}</label>
                <textarea name="description" class="input-field w-full px-4 py-2 rounded-lg h-24"></textarea>
            </div>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.simulations') }}" class="btn-secondary px-6 py-2 rounded-lg">{{ t('cancel', lang) }}</a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>{{ t('create_simulation', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
