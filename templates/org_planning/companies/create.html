{% extends "org_planning/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="space-y-6 fade-in">
    <a href="{{ url_for('org_planning.companies') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_companies', lang) }}
    </a>

    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('create_company', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('create_company_desc', lang) }}</p>
    </div>

    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('name', lang) }} *</label>
                <input type="text" name="name" class="input-field w-full px-4 py-2 rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('code', lang) }} *</label>
                <input type="text" name="code" class="input-field w-full px-4 py-2 rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('name_arabic', lang) }}</label>
                <input type="text" name="name_ar" class="input-field w-full px-4 py-2 rounded-lg" dir="auto">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('name_persian', lang) }}</label>
                <input type="text" name="name_fa" class="input-field w-full px-4 py-2 rounded-lg" dir="auto">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('registration_number', lang) }}</label>
                <input type="text" name="registration_number" class="input-field w-full px-4 py-2 rounded-lg">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('tax_id', lang) }}</label>
                <input type="text" name="tax_id" class="input-field w-full px-4 py-2 rounded-lg">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('city', lang) }}</label>
                <input type="text" name="city" class="input-field w-full px-4 py-2 rounded-lg">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('country', lang) }}</label>
                <input type="text" name="country" class="input-field w-full px-4 py-2 rounded-lg">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('phone', lang) }}</label>
                <input type="text" name="phone" class="input-field w-full px-4 py-2 rounded-lg">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('email', lang) }}</label>
                <input type="email" name="email" class="input-field w-full px-4 py-2 rounded-lg">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm text-gray-400 mb-2">{{ t('address', lang) }}</label>
                <textarea name="address" class="input-field w-full px-4 py-2 rounded-lg h-20"></textarea>
            </div>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.companies') }}" class="btn-secondary px-6 py-2 rounded-lg">{{ t('cancel', lang) }}</a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>{{ t('create_company', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
