{% extends "org_planning/base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <!-- Back Button -->
    <a href="{{ url_for('org_planning.structure_unit_detail', unit_id=unit.id) }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_unit', lang) }}
    </a>

    <!-- Page Header -->
    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('edit_org_unit', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('edit_org_unit_desc', lang) }}</p>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Basic Info -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-white mb-4">{{ t('basic_information', lang) }}</h3>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('name', lang) }} *</label>
                    <input type="text" name="name" class="input-field w-full px-4 py-2 rounded-lg" required value="{{ unit.name }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('name_arabic', lang) }}</label>
                    <input type="text" name="name_ar" class="input-field w-full px-4 py-2 rounded-lg" dir="auto" value="{{ unit.name_ar or '' }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('name_persian', lang) }}</label>
                    <input type="text" name="name_fa" class="input-field w-full px-4 py-2 rounded-lg" dir="auto" value="{{ unit.name_fa or '' }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('code', lang) }}</label>
                    <input type="text" name="code" class="input-field w-full px-4 py-2 rounded-lg" value="{{ unit.code or '' }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('description', lang) }}</label>
                    <textarea name="description" class="input-field w-full px-4 py-2 rounded-lg h-24">{{ unit.description or '' }}</textarea>
                </div>
            </div>

            <!-- Additional Info -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-white mb-4">{{ t('additional_information', lang) }}</h3>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('cost_center', lang) }}</label>
                    <input type="text" name="cost_center" class="input-field w-full px-4 py-2 rounded-lg" value="{{ unit.cost_center or '' }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('budget', lang) }}</label>
                    <input type="number" name="budget" class="input-field w-full px-4 py-2 rounded-lg" step="0.01" value="{{ unit.budget or 0 }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('location', lang) }}</label>
                    <input type="text" name="location" class="input-field w-full px-4 py-2 rounded-lg" value="{{ unit.location or '' }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('address', lang) }}</label>
                    <textarea name="address" class="input-field w-full px-4 py-2 rounded-lg h-20">{{ unit.address or '' }}</textarea>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('phone', lang) }}</label>
                    <input type="text" name="phone" class="input-field w-full px-4 py-2 rounded-lg" value="{{ unit.phone or '' }}">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">{{ t('email', lang) }}</label>
                    <input type="email" name="email" class="input-field w-full px-4 py-2 rounded-lg" value="{{ unit.email or '' }}">
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="mt-6 pt-6 border-t border-gray-700/50">
            <h3 class="text-lg font-semibold text-white mb-4">{{ t('status', lang) }}</h3>
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="is_active" value="1" {{ 'checked' if unit.is_active else '' }} class="w-5 h-5 rounded bg-slate-700 border-gray-600 text-blue-500 focus:ring-blue-500 focus:ring-offset-0">
                <span class="text-white">{{ t('active', lang) }}</span>
            </label>
        </div>

        <!-- Form Actions -->
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.structure_unit_detail', unit_id=unit.id) }}" class="btn-secondary px-6 py-2 rounded-lg">
                {{ t('cancel', lang) }}
            </a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>
                {{ t('save_changes', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
