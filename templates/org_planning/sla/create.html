{% extends "org_planning/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="space-y-6 fade-in">
    <!-- Back Button -->
    <a href="{{ url_for('org_planning.sla') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_sla', lang) }}
    </a>

    <!-- Page Header -->
    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('create_sla_policy', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('create_sla_desc', lang) }}</p>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('name', lang) }} *</label>
                <input type="text" name="name" class="input-field w-full px-4 py-2 rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('module', lang) }} *</label>
                <select name="module" class="input-field w-full px-4 py-2 rounded-lg" required>
                    <option value="org_planning">Org Planning</option>
                    <option value="hr">HR</option>
                    <option value="finance">Finance</option>
                    <option value="operations">Operations</option>
                    <option value="it">IT</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('priority', lang) }}</label>
                <select name="priority" class="input-field w-full px-4 py-2 rounded-lg">
                    {% for key, value in sla_priorities.items() %}
                    <option value="{{ key }}">{{ value }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('response_hours', lang) }}</label>
                <input type="number" name="response_hours" class="input-field w-full px-4 py-2 rounded-lg" value="24">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('resolution_hours', lang) }}</label>
                <input type="number" name="resolution_hours" class="input-field w-full px-4 py-2 rounded-lg" value="72">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('warning_threshold_pct', lang) }}</label>
                <input type="number" name="warning_threshold_pct" class="input-field w-full px-4 py-2 rounded-lg" value="75">
            </div>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.sla') }}" class="btn-secondary px-6 py-2 rounded-lg">{{ t('cancel', lang) }}</a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>{{ t('create_sla', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
