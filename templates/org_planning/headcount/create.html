{% extends "org_planning/base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <a href="{{ url_for('org_planning.headcount') }}" class="inline-flex items-center gap-2 text-gray-400 hover:text-white">
        <i class="fas fa-arrow-left"></i>
        {{ t('back_to_headcount', lang) }}
    </a>

    <div>
        <h1 class="text-2xl font-bold text-white">{{ t('create_headcount_plan', lang) }}</h1>
        <p class="text-gray-400 mt-1">{{ t('create_headcount_desc', lang) }}</p>
    </div>

    <form method="POST" class="glass-panel rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('org_unit', lang) }} *</label>
                <select name="org_unit_id" class="input-field w-full px-4 py-2 rounded-lg" required>
                    <option value="">Select Unit</option>
                    {% for ou in org_units %}
                    <option value="{{ ou.id }}">{{ ou.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('year', lang) }} *</label>
                <select name="plan_year" class="input-field w-full px-4 py-2 rounded-lg" required>
                    {% for year in years %}
                    <option value="{{ year }}" {{ 'selected' if year == selected_year else '' }}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('headcount_approved', lang) }}</label>
                <input type="number" name="headcount_approved" class="input-field w-full px-4 py-2 rounded-lg" value="0">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('headcount_current', lang) }}</label>
                <input type="number" name="headcount_current" class="input-field w-full px-4 py-2 rounded-lg" value="0">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">{{ t('budget_allocated', lang) }}</label>
                <input type="number" name="budget_allocated" class="input-field w-full px-4 py-2 rounded-lg" step="0.01" value="0">
            </div>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-700/50 flex items-center justify-end gap-3">
            <a href="{{ url_for('org_planning.headcount') }}" class="btn-secondary px-6 py-2 rounded-lg">{{ t('cancel', lang) }}</a>
            <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                <i class="fas fa-save mr-2"></i>{{ t('create_plan', lang) }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
