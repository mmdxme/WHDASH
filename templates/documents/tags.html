<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>body{font-family:'Segoe UI',system-ui,sans-serif;background:#F9FAFB}.card{border:none;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.card-header{background:#fff;border-bottom:2px solid #E5E7EB;font-weight:600}</style>
</head>
<body>
{% include 'base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-1"><i class="fas fa-tags me-2 text-primary"></i>{{ page_title }}</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTagModal"><i class="fas fa-plus me-1"></i> Add Tag</button>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2">
            {% for tag in tags %}
                <div class="d-flex align-items-center p-2 border rounded">
                    <span class="me-2" style="color:{{ tag.color }}"><i class="fas fa-tag"></i></span>
                    <span class="fw-medium">{{ tag.name }}</span>
                    <span class="ms-2 text-muted small">({{ tag.document_count }})</span>
                    <a href="/documents/tags/{{ tag.id }}/delete" class="btn btn-sm text-danger ms-2" onclick="return confirm('Delete?')"><i class="fas fa-times"></i></a>
                </div>
            {% else %}
                <p class="text-muted">No tags yet</p>
            {% endfor %}
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addTagModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{{ url_for('documents_create_tag') }}">
                <div class="modal-header"><h5 class="modal-title">Add Tag</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Color</label><input type="color" name="color" class="form-control" value="#6c757d"></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Add</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
