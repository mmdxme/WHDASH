<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>body{font-family:'Segoe UI',system-ui,sans-serif;background:#F9FAFB}.card{border:none;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.card-header{background:#fff;border-bottom:2px solid #E5E7EB;font-weight:600}</style>
</head>
<body>
{% include 'base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-1"><i class="fas fa-sitemap me-2 text-primary"></i>{{ page_title }}</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal"><i class="fas fa-plus me-1"></i> Add Category</button>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead><tr><th>Name</th><th>Code</th><th>Documents</th><th>Retention</th><th>Actions</th></tr></thead>
                <tbody>
                {% for cat in categories %}
                <tr>
                    <td><i class="{{ cat.icon or 'fa-folder' }} me-2" style="color:{{ cat.color }}"></i>{{ cat.name }}</td>
                    <td><code>{{ cat.code }}</code></td>
                    <td>{{ cat.document_count }}</td>
                    <td>{{ cat.retention_period_days or 'Indefinite' }} days</td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary" onclick="editCategory({{ cat.id }}, '{{ cat.name }}', '{{ cat.description }}', '{{ cat.code }}')"><i class="fas fa-edit"></i></button>
                        <a href="/documents/categories/{{ cat.id }}/delete" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{{ url_for('documents_create_category') }}">
                <div class="modal-header"><h5 class="modal-title">Add Category</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Code</label><input type="text" name="code" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Add</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
