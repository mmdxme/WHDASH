<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>body{font-family:'Segoe UI',system-ui,sans-serif;background:#F9FAFB}.card{border:none;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.card-header{background:#fff;border-bottom:2px solid #E5E7EB;font-weight:600}</style>
</head>
<body>
{% include 'base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <h1 class="h3 mb-4"><i class="fas fa-link me-2 text-primary"></i>{{ page_title }}</h1>
    <div class="row">
        {% for module in modules %}
        <div class="col-md-3 mb-3">
            <a href="{{ url_for('documents_view_linked_record', module_name=module, record_id=1) }}" class="text-decoration-none">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-folder-open fa-2x text-primary mb-2"></i>
                        <h6>{{ module|title }}</h6>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
