<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome-6.4.0/css/all.min.css" rel="stylesheet">
    <style>body{font-family:'Segoe UI',system-ui,sans-serif;background:#F9FAFB}.card{border:none;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.card-header{background:#fff;border-bottom:2px solid #E5E7EB;font-weight:600}</style>
</head>
<body>
{% include 'base.html' %}
{% block content %}
<div class="container-fluid py-4">
    <h1 class="h3 mb-4"><i class="fas fa-history me-2 text-info"></i>{{ page_title }}</h1>
    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead><tr><th>Document</th><th>Category</th><th>Versions</th><th>Actions</th></tr></thead>
                <tbody>
                {% for doc in documents %}
                <tr>
                    <td><a href="{{ url_for('documents_detail', document_id=doc.id) }}" class="text-decoration-none">{{ doc.title }}</a><div class="small text-muted">{{ doc.document_code }}</div></td>
                    <td>{{ doc.category_name or '-' }}</td>
                    <td><span class="badge bg-info">{{ doc.version_count }}</span></td>
                    <td><a href="{{ url_for('documents_versions', document_id=doc.id) }}" class="btn btn-sm btn-outline-primary"><i class="fas fa-history"></i> View</a></td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center py-4 text-muted">No documents found</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
