{% extends "base.html" %}

{% block extra_head %}
<style>
    .planning-header {
        background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(139, 92, 246, 0.1) 100%);
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .stat-card {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px -5px rgba(0,0,0,0.3);
    }
    .severity-critical { color: #ef4444; }
    .severity-high { color: #f97316; }
    .severity-medium { color: #eab308; }
    .severity-low { color: #22c55e; }
    .status-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    .status-open { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .status-approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-draft { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .status-dismissed { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }
    .status-closed { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .tab-btn.active {
        border-bottom: 2px solid #38bdf8;
        color: #38bdf8;
    }
    .data-table th {
        position: sticky;
        top: 0;
        background: rgba(30, 41, 59, 0.95);
        backdrop-filter: blur(8px);
        z-index: 10;
    }
    .filter-bar {
        background: rgba(30, 41, 59, 0.4);
        border: 1px solid rgba(255,255,255,0.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-900/50">
    <!-- Planning Header Bar -->
    <div class="planning-header px-6 py-4 mb-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-purple-500 flex items-center justify-center">
                    <i class="fas fa-chart-line text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">{{ title }}</h1>
                    <p class="text-slate-400 text-sm">Demand Forecasting & Inventory Planning</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="px-4 py-2 rounded-lg bg-slate-700/50 hover:bg-slate-600 text-slate-300 text-sm transition">
                    <i class="fas fa-print mr-2"></i>Print
                </button>
                <div class="relative">
                    <input type="text" id="globalSearch" placeholder="Search items..." 
                           class="w-64 px-4 py-2 pl-10 rounded-lg bg-slate-800/50 border border-slate-600 text-slate-200 text-sm focus:outline-none focus:border-sky-500">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="px-6">
        {% block planning_content %}{% endblock %}
    </div>
</div>

<script>
function showTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabName)?.classList.remove('hidden');
    document.querySelector(`[data-tab="${tabName}"]`)?.classList.add('active');
}

function exportTable(tableId) {
    const table = document.getElementById(tableId);
    if (!table) return;
    let csv = [];
    const rows = table.querySelectorAll('tr');
    for (const row of rows) {
        const cols = row.querySelectorAll('td, th');
        const rowData = Array.from(cols).map(c => '"' + (c.innerText || '').replace(/"/g, '""') + '"').join(',');
        csv.push(rowData);
    }
    const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = tableId + '_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
}

document.getElementById('globalSearch')?.addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll('.searchable-row').forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(query) ? '' : 'none';
    });
});
</script>
{% endblock %}
