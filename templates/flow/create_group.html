{% extends "flow/index.html" %}

{% block title %}Create Group - Flow{% endblock %}

{% block sidebar %}{% endblock %}

{% block main_content %}
<main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-900">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center px-4 flex-shrink-0">
        <a href="/flow/groups" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg mr-2">
            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h2 class="font-semibold text-slate-800 dark:text-white">Create Group</h2>
    </header>
    
    <div class="flex-1 overflow-y-auto p-4">
        <div class="max-w-xl mx-auto">
            <form onsubmit="createGroup(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Group Name</label>
                    <input type="text" id="group-name" required
                           class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Enter group name">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Description <span class="text-slate-400">(optional)</span></label>
                    <textarea id="group-description" rows="3"
                             class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                             placeholder="What's this group about?"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Add Members</label>
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                        <div id="selected-members" class="p-3 border-b border-slate-200 dark:border-slate-700 flex flex-wrap gap-2 min-h-[60px]">
                            <span class="text-slate-400 text-sm">Select members below</span>
                        </div>
                        <div class="max-h-64 overflow-y-auto">
                            {% for u in users %}
                            <label class="flex items-center gap-3 p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer border-b border-slate-100 dark:border-slate-700 last:border-0">
                                <input type="checkbox" name="members" value="{{ u.id }}" 
                                       class="w-4 h-4 text-blue-500 rounded focus:ring-blue-500"
                                       onchange="updateSelectedMembers()">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white text-sm font-medium">
                                    {{ u.display_name[0]|upper if u.display_name else u.username[0]|upper }}
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-slate-700 dark:text-white">{{ u.display_name or u.username }}</p>
                                    <p class="text-xs text-slate-500">{{ u.department or 'Team Member' }}</p>
                                </div>
                            </label>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Visibility</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer hover:border-blue-500 transition-colors">
                            <input type="radio" name="group-type" value="private" checked
                                   class="w-4 h-4 text-blue-500 focus:ring-blue-500">
                            <div>
                                <p class="font-medium text-slate-800 dark:text-white">Private</p>
                                <p class="text-sm text-slate-500">Only members can see messages and member list</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer hover:border-blue-500 transition-colors">
                            <input type="radio" name="group-type" value="public"
                                   class="w-4 h-4 text-blue-500 focus:ring-blue-500">
                            <div>
                                <p class="font-medium text-slate-800 dark:text-white">Public</p>
                                <p class="text-sm text-slate-500">Anyone can see the group and messages</p>
                            </div>
                        </label>
                    </div>
                </div>
                
                <div class="flex items-center justify-end gap-3 pt-4">
                    <a href="/flow/groups" class="px-6 py-3 text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white font-medium">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-3 bg-blue-500 text-white rounded-xl hover:bg-blue-600 font-medium transition-colors">
                        Create Group
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    const users = {{ users | tojson }};
    const selectedIds = new Set();
    
    function updateSelectedMembers() {
        const checkboxes = document.querySelectorAll('input[name="members"]:checked');
        selectedIds.clear();
        checkboxes.forEach(cb => selectedIds.add(parseInt(cb.value)));
        
        const container = document.getElementById('selected-members');
        if (selectedIds.size === 0) {
            container.innerHTML = '<span class="text-slate-400 text-sm">Select members below</span>';
        } else {
            container.innerHTML = Array.from(selectedIds).map(id => {
                const user = users.find(u => u.id === id);
                return user ? `
                    <span class="inline-flex items-center gap-1 px-2 py-1 bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 rounded-full text-sm">
                        ${user.display_name || user.username}
                        <button type="button" onclick="removeMember(${id})" class="hover:text-blue-900 dark:hover:text-blue-100">×</button>
                    </span>
                ` : '';
            }).join('');
        }
    }
    
    function removeMember(id) {
        const checkbox = document.querySelector(`input[name="members"][value="${id}"]`);
        if (checkbox) checkbox.checked = false;
        updateSelectedMembers();
    }
    
    function createGroup(event) {
        event.preventDefault();
        
        const name = document.getElementById('group-name').value.trim();
        const description = document.getElementById('group-description').value.trim();
        const groupType = document.querySelector('input[name="group-type"]:checked').value;
        const memberIds = Array.from(selectedIds);
        
        fetch('/flow/api/groups/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description, group_type: groupType, member_ids: memberIds })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                window.location.href = `/flow/groups/${data.group_id}`;
            } else {
                alert(data.error || 'Failed to create group');
            }
        });
    }
</script>
{% endblock %}
