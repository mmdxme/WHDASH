<!-- Admin Sidebar -->
<div class="fixed left-0 top-0 h-screen w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 z-40">
    <!-- Logo -->
    <div class="h-16 flex items-center px-6 border-b border-slate-200 dark:border-slate-700">
        <a href="{{ url_for('index') }}" class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-blue-700 rounded-lg flex items-center justify-center">
                <i class="fas fa-cog text-white text-sm"></i>
            </div>
            <span class="text-lg font-bold text-slate-800 dark:text-white">Admin</span>
        </a>
    </div>
    
    <!-- Navigation -->
    <nav class="p-4 space-y-1 overflow-y-auto h-[calc(100vh-4rem)]">
        <!-- Dashboard -->
        <a href="{{ url_for('admin_dashboard') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if request.path == url_for('admin_dashboard') %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-th-large w-5"></i>
            <span>Dashboard</span>
        </a>
        
        <!-- Settings Section -->
        <div class="pt-4 pb-2">
            <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Settings</p>
        </div>
        
        <a href="{{ url_for('admin_settings') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-sliders-h w-5"></i>
            <span>System Settings</span>
        </a>
        
        <a href="{{ url_for('admin_master_data') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/master-data' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-database w-5"></i>
            <span>Master Data</span>
        </a>
        
        <a href="{{ url_for('admin_numbering') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/numbering' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-hashtag w-5"></i>
            <span>Numbering Rules</span>
        </a>
        
        <a href="{{ url_for('admin_workflows') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/workflows' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-project-diagram w-5"></i>
            <span>Workflows</span>
        </a>
        
        <a href="{{ url_for('admin_notifications') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/notifications' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-bell w-5"></i>
            <span>Notifications</span>
        </a>
        
        <!-- Users & Security Section -->
        <div class="pt-4 pb-2">
            <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Users & Security</p>
        </div>
        
        <a href="{{ url_for('admin_settings_category', category='USERS') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/users' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-user-cog w-5"></i>
            <span>Users</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='ROLES') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/roles' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-shield-alt w-5"></i>
            <span>Roles & Permissions</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='AUDIT') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/audit' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-lock w-5"></i>
            <span>Audit & Security</span>
        </a>
        
        <!-- Module Settings Section -->
        <div class="pt-4 pb-2">
            <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Module Settings</p>
        </div>
        
        <a href="{{ url_for('admin_settings_category', category='SALES') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/sales' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-chart-line w-5"></i>
            <span>Sales</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='CRM') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/crm' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-users w-5"></i>
            <span>CRM</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='WAREHOUSE') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/warehouse' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-warehouse w-5"></i>
            <span>Warehouse</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='LOGISTICS') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/logistics' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-truck w-5"></i>
            <span>Logistics</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='HR') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/hr' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-user-tie w-5"></i>
            <span>HR</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='MARKETING') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/marketing' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-bullhorn w-5"></i>
            <span>Marketing</span>
        </a>
        
        <a href="{{ url_for('admin_settings_category', category='PLANNING') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/settings/planning' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-chart-area w-5"></i>
            <span>Planning</span>
        </a>
        
        <!-- Audit Section -->
        <div class="pt-4 pb-2">
            <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Audit</p>
        </div>
        
        <a href="{{ url_for('admin_audit') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/audit' in request.path and '/admin/audit/settings' not in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-history w-5"></i>
            <span>Audit Log</span>
        </a>
        
        <a href="{{ url_for('admin_audit_settings') }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
            {% if '/admin/audit/settings' in request.path %}bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400{% else %}text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
            <i class="fas fa-clipboard-list w-5"></i>
            <span>Settings History</span>
        </a>
    </nav>
</div>
