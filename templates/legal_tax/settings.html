{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ title }}</h1>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow p-6"><h3 class="font-semibold mb-4">Compliance Score</h3><div class="text-4xl font-bold text-blue-600">{{ settings.compliance_score or 0 }}%</div></div>
        <div class="bg-white rounded-lg shadow p-6"><h3 class="font-semibold mb-4">Filing On Time Rate</h3><div class="text-4xl font-bold text-green-600">{{ settings.filing_rate or 0 }}%</div></div>
        <div class="bg-white rounded-lg shadow p-6"><h3 class="font-semibold mb-4">Open Issues</h3><div class="text-4xl font-bold text-red-600">{{ settings.open_issues or 0 }}</div></div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mt-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Default Filing Frequency</label><select name="default_filing_frequency" class="w-full rounded border-gray-300"><option value="monthly" {% if settings.default_filing_frequency == 'monthly' %}selected{% endif %}>Monthly</option><option value="quarterly" {% if settings.default_filing_frequency == 'quarterly' %}selected{% endif %}>Quarterly</option><option value="annually" {% if settings.default_filing_frequency == 'annually' %}selected{% endif %}>Annually</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Auto-Lock Period After Days</label><input type="number" name="auto_lock_days" value="{{ settings.auto_lock_days or 30 }}" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Reminder Days Before Due</label><input type="number" name="reminder_days" value="{{ settings.reminder_days or 7 }}" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">High Risk Threshold</label><input type="number" name="high_risk_threshold" value="{{ settings.high_risk_threshold or 10000 }}" class="w-full rounded border-gray-300"></div>
            </div>
            <div class="flex justify-end pt-6 border-t"><button type="submit" class="btn btn-primary">Save Settings</button></div>
        </form>
    </div>
</div>
{% endblock %}
