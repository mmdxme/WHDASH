{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Title *</label><input type="text" name="title" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Obligation</label><select name="obligation_id" class="w-full rounded border-gray-300">{% for o in obligations %}<option value="{{ o.id }}">{{ o.title }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Due Date *</label><input type="date" name="due_date" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Priority</label><select name="priority" class="w-full rounded border-gray-300"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Description</label><textarea name="description" rows="3" class="w-full rounded border-gray-300"></textarea></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/compliance-tasks" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Task</button></div>
        </form>
    </div>
</div>
{% endblock %}
