{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Pack Name *</label><input type="text" name="name" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Filing Period</label><select name="period_id" class="w-full rounded border-gray-300">{% for p in periods %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction</label><select name="jurisdiction_id" class="w-full rounded border-gray-300">{% for j in jurisdictions %}<option value="{{ j.id }}">{{ j.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Description</label><textarea name="description" rows="3" class="w-full rounded border-gray-300"></textarea></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/audit-packs" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Generate Pack</button></div>
        </form>
    </div>
</div>
{% endblock %}
