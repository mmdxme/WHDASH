{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction *</label><select name="jurisdiction_id" required class="w-full rounded border-gray-300">{% for j in jurisdictions %}<option value="{{ j.id }}">{{ j.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Authority *</label><select name="authority_id" required class="w-full rounded border-gray-300">{% for a in authorities %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Tax Type *</label><select name="tax_type" required class="w-full rounded border-gray-300"><option value="">Select</option><option value="vat">VAT</option><option value="gst">GST</option><option value="sales">Sales Tax</option><option value="income">Income Tax</option><option value="withholding">Withholding Tax</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Registration Number *</label><input type="text" name="registration_number" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Effective From *</label><input type="date" name="effective_from" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Effective To</label><input type="date" name="effective_to" class="w-full rounded border-gray-300"></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/registrations" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Registration</button></div>
        </form>
    </div>
</div>
{% endblock %}
