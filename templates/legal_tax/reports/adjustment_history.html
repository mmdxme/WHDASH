{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ title }}</h1>
        <div class="flex space-x-2">
            <a href="/legal-tax/reports" class="btn btn-outline"><i class="fas fa-arrow-left mr-2"></i>Back to Reports</a>
            <button onclick="window.print()" class="btn btn-outline"><i class="fas fa-print mr-2"></i>Print</button>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <form method="GET" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div><label class="block text-sm">Company</label><select name="company_id" class="w-full rounded border-gray-300">{% for c in companies %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
            <div><label class="block text-sm">Start Date</label><input type="date" name="start_date" class="w-full rounded border-gray-300"></div>
            <div><label class="block text-sm">End Date</label><input type="date" name="end_date" class="w-full rounded border-gray-300"></div>
            <div class="flex items-end"><button type="submit" class="btn btn-primary w-full">Apply</button></div>
        </form>
    </div>
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Return</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Period</th><th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Variance</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reason</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reviewed By</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th></tr></thead>
            <tbody class="divide-y divide-gray-200">
            {% for row in data %}
            <tr>
                <td class="px-4 py-3">{{ row.return_code }}</td>
                <td class="px-4 py-3">{{ row.period }}</td>
                <td class="px-4 py-3 text-right {{ 'text-red-600' if row.variance < 0 else 'text-green-600' }}">{{ row.variance|format_currency }}</td>
                <td class="px-4 py-3">{{ row.reason }}</td>
                <td class="px-4 py-3">{{ row.reviewer }}</td>
                <td class="px-4 py-3">{{ row.review_date }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
