{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ title }}</h1>
        <div class="flex space-x-2">
            <a href="/legal-tax/reports" class="btn btn-outline"><i class="fas fa-arrow-left mr-2"></i>Back to Reports</a>
            <button onclick="window.print()" class="btn btn-outline"><i class="fas fa-print mr-2"></i>Print</button>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <form method="GET" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div><label class="block text-sm">Status</label><select name="status" class="w-full rounded border-gray-300"><option value="">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div>
            <div><label class="block text-sm">Type</label><select name="type" class="w-full rounded border-gray-300"><option value="">All</option><option value="assessment">Assessment</option><option value="demand">Demand</option><option value="penalty">Penalty</option></select></div>
            <div><label class="block text-sm">Year</label><select name="year" class="w-full rounded border-gray-300">{% for y in years %}<option value="{{ y }}">{{ y }}</option>{% endfor %}</select></div>
            <div class="flex items-end"><button type="submit" class="btn btn-primary w-full">Apply</button></div>
        </form>
    </div>
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reference</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Authority</th><th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Amount</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Due Date</th></tr></thead>
            <tbody class="divide-y divide-gray-200">
            {% for row in data %}
            <tr>
                <td class="px-4 py-3">{{ row.reference }}</td>
                <td class="px-4 py-3">{{ row.type }}</td>
                <td class="px-4 py-3">{{ row.authority }}</td>
                <td class="px-4 py-3 text-right">{{ row.amount|format_currency }}</td>
                <td class="px-4 py-3"><span class="badge badge-{{ 'success' if row.status == 'resolved' else 'warning' }}">{{ row.status }}</span></td>
                <td class="px-4 py-3">{{ row.due_date }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
