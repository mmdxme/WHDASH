{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">{{ title }}</h1>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Return Type *</label>
                        <select name="return_type" required class="w-full rounded border-gray-300">
                            <option value="">Select Type</option>
                            <option value="vat">VAT Return</option>
                            <option value="gst">GST Return</option>
                            <option value="sales_tax">Sales Tax</option>
                            <option value="withholding">Withholding Tax</option>
                            <option value="excise">Excise Duty</option>
                            <option value="customs">Customs</option>
                            <option value="payroll">Payroll Tax</option>
                            <option value="property">Property Tax</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Filing Period *</label>
                        <select name="filing_period_id" required class="w-full rounded border-gray-300">
                            <option value="">Select Period</option>
                            {% for p in periods %}
                            <option value="{{ p.id }}">{{ p.name }} ({{ p.start_date }} - {{ p.end_date }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction *</label>
                        <select name="jurisdiction_id" required class="w-full rounded border-gray-300">
                            <option value="">Select Jurisdiction</option>
                            {% for j in jurisdictions %}
                            <option value="{{ j.id }}">{{ j.name }} ({{ j.country }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tax Authority</label>
                        <select name="authority_id" class="w-full rounded border-gray-300">
                            <option value="">Select Authority</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Legal Entity *</label>
                        <select name="entity_id" required class="w-full rounded border-gray-300">
                            <option value="">Select Entity</option>
                            {% for e in entities %}
                            <option value="{{ e.id }}">{{ e.name }} ({{ e.vat_number }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="flex justify-end space-x-4 pt-6 border-t">
                    <a href="/legal-tax/returns" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Return</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
