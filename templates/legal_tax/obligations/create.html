{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Obligation Type *</label>
                    <select name="obligation_type" required class="w-full rounded border-gray-300">
                        <option value="">Select Type</option>
                        <option value="vat_return">VAT Return</option>
                        <option value="gst_return">GST Return</option>
                        <option value="tax_filing">Tax Filing</option>
                        <option value="audit">Audit</option>
                        <option value="report">Report</option>
                        <option value="payment">Payment</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date *</label>
                    <input type="date" name="due_date" required class="w-full rounded border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction</label>
                    <select name="jurisdiction_id" class="w-full rounded border-gray-300">
                        <option value="">Select Jurisdiction</option>
                        {% for j in jurisdictions %}
                        <option value="{{ j.id }}">{{ j.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                    <select name="priority" class="w-full rounded border-gray-300">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                    <textarea name="description" required rows="3" class="w-full rounded border-gray-300"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t">
                <a href="/legal-tax/obligations" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Obligation</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
