{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Notice Number *</label><input type="text" name="notice_number" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Notice Type *</label><select name="notice_type" required class="w-full rounded border-gray-300"><option value="">Select</option><option value="assessment">Assessment</option><option value="demand">Demand</option><option value="penalty">Penalty</option><option value="refund_denial">Refund Denial</option><option value="information_request">Information Request</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Issuing Authority</label><select name="authority_id" class="w-full rounded border-gray-300">{% for a in authorities %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Issue Date *</label><input type="date" name="issue_date" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label><input type="date" name="due_date" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Amount</label><input type="number" step="0.01" name="amount" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Description *</label><textarea name="description" required rows="3" class="w-full rounded border-gray-300"></textarea></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/notices" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Notice</button></div>
        </form>
    </div>
</div>
{% endblock %}
