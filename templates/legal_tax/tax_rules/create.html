{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Code *</label><input type="text" name="code" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Name *</label><input type="text" name="name" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Rule Type *</label><select name="rule_type" required class="w-full rounded border-gray-300"><option value="">Select Type</option><option value="output_vat">Output VAT</option><option value="input_vat">Input VAT</option><option value="reverse_charge">Reverse Charge</option><option value="zero_rated">Zero Rated</option><option value="exempt">Exempt</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Priority</label><input type="number" name="priority" value="0" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction</label><select name="jurisdiction_id" class="w-full rounded border-gray-300">{% for j in jurisdictions %}<option value="{{ j.id }}">{{ j.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Tax Code</label><select name="tax_code_id" class="w-full rounded border-gray-300">{% for tc in tax_codes %}<option value="{{ tc.id }}">{{ tc.code }}</option>{% endfor %}</select></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/tax-rules" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Tax Rule</button></div>
        </form>
    </div>
</div>
{% endblock %}
