{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Penalty Number *</label><input type="text" name="penalty_number" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Penalty Type *</label><select name="penalty_type" required class="w-full rounded border-gray-300"><option value="">Select</option><option value="late_filing">Late Filing</option><option value="late_payment">Late Payment</option><option value="underpayment">Underpayment</option><option value="non_filing">Non-Filing</option><option value="misdeclaration">Misdeclaration</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Tax Period</label><select name="period_id" class="w-full rounded border-gray-300">{% for p in periods %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Amount *</label><input type="number" step="0.01" name="amount" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Imposed Date *</label><input type="date" name="imposed_date" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label><input type="date" name="due_date" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Description *</label><textarea name="description" required rows="3" class="w-full rounded border-gray-300"></textarea></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/penalties" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Penalty</button></div>
        </form>
    </div>
</div>
{% endblock %}
