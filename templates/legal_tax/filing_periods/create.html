{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Code *</label><input type="text" name="code" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Name *</label><input type="text" name="name" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Period Type *</label><select name="period_type" required class="w-full rounded border-gray-300"><option value="">Select</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annually">Annually</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Filing Frequency</label><select name="filing_frequency" class="w-full rounded border-gray-300"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annually">Annually</option></select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Start Date *</label><input type="date" name="start_date" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">End Date *</label><input type="date" name="end_date" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label><input type="date" name="due_date" class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction</label><select name="jurisdiction_id" class="w-full rounded border-gray-300">{% for j in jurisdictions %}<option value="{{ j.id }}">{{ j.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Authority</label><select name="authority_id" class="w-full rounded border-gray-300">{% for a in authorities %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}</select></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/filing-periods" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Period</button></div>
        </form>
    </div>
</div>
{% endblock %}
