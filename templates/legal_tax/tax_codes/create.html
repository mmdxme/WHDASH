{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Code *</label><input type="text" name="code" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Name *</label><input type="text" name="name" required class="w-full rounded border-gray-300"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Tax Group</label><select name="tax_group_id" class="w-full rounded border-gray-300">{% for g in tax_groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction</label><select name="jurisdiction_id" class="w-full rounded border-gray-300">{% for j in jurisdictions %}<option value="{{ j.id }}">{{ j.name }}</option>{% endfor %}</select></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Tax Rate</label><select name="tax_rate_id" class="w-full rounded border-gray-300">{% for r in tax_rates %}<option value="{{ r.id }}">{{ r.name }} ({{ r.rate }}%)</option>{% endfor %}</select></div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t"><a href="/legal-tax/tax-codes" class="btn btn-outline">Cancel</a><button type="submit" class="btn btn-primary">Create Tax Code</button></div>
        </form>
    </div>
</div>
{% endblock %}
