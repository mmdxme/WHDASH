{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900">{{ title }}</h1>
        <a href="/legal-tax/tax-codes/create" class="btn btn-primary btn-sm"><i class="fas fa-plus mr-2"></i>Add Tax Code</a>
    </div>
    {% if tax_codes %}
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Code</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tax Group</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th></tr></thead>
            <tbody class="divide-y divide-gray-200">
                {% for tc in tax_codes %}
                <tr><td class="px-4 py-3 text-sm font-medium text-gray-900">{{ tc.code }}</td><td class="px-4 py-3 text-sm text-gray-500">{{ tc.name }}</td><td class="px-4 py-3 text-sm text-gray-500">{{ tc.tax_group_id }}</td><td class="px-4 py-3 text-sm"><a href="/legal-tax/tax-codes/{{ tc.id }}/edit" class="text-blue-600 hover:underline">Edit</a></td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="bg-white rounded-lg shadow p-12 text-center text-gray-500"><i class="fas fa-percentage text-4xl mb-3 text-gray-300"></i><p class="mb-4">No tax codes found</p><a href="/legal-tax/tax-codes/create" class="btn btn-primary btn-sm">Add First Tax Code</a></div>
    {% endif %}
</div>
{% endblock %}
