{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">{{ title }}</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Code *</label>
                    <input type="text" name="code" value="{{ jurisdiction.code }}" required class="w-full rounded border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                    <input type="text" name="name" value="{{ jurisdiction.name }}" required class="w-full rounded border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name (Arabic)</label>
                    <input type="text" name="name_ar" value="{{ jurisdiction.name_ar or '' }}" class="w-full rounded border-gray-300" dir="rtl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Country *</label>
                    <input type="text" name="country" value="{{ jurisdiction.country }}" required class="w-full rounded border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Region</label>
                    <input type="text" name="region" value="{{ jurisdiction.region or '' }}" class="w-full rounded border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tax Type *</label>
                    <select name="tax_type" required class="w-full rounded border-gray-300">
                        {% for t in ['vat','gst','sales_tax','excise','customs','withholding','income','corporate','federal'] %}
                        <option value="{{ t }}" {% if jurisdiction.tax_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Active</label>
                    <input type="checkbox" name="is_active" {% if jurisdiction.is_active %}checked{% endif %} class="rounded border-gray-300">
                </div>
            </div>
            <div class="flex justify-end space-x-4 pt-6 border-t">
                <a href="/legal-tax/jurisdictions" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
