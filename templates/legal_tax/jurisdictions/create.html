{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">{{ title }}</h1>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Code *</label>
                        <input type="text" name="code" required class="w-full rounded border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                        <input type="text" name="name" required class="w-full rounded border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name (Arabic)</label>
                        <input type="text" name="name_ar" class="w-full rounded border-gray-300" dir="rtl">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name (Farsi)</label>
                        <input type="text" name="name_fa" class="w-full rounded border-gray-300" dir="rtl">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Country *</label>
                        <input type="text" name="country" required class="w-full rounded border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Region</label>
                        <input type="text" name="region" class="w-full rounded border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tax Type *</label>
                        <select name="tax_type" required class="w-full rounded border-gray-300">
                            <option value="">Select Type</option>
                            <option value="vat">VAT</option>
                            <option value="gst">GST</option>
                            <option value="sales_tax">Sales Tax</option>
                            <option value="excise">Excise</option>
                            <option value="customs">Customs</option>
                            <option value="withholding">Withholding</option>
                            <option value="income">Income Tax</option>
                            <option value="corporate">Corporate Tax</option>
                            <option value="federal">Federal</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Active</label>
                        <input type="checkbox" name="is_active" checked class="rounded border-gray-300">
                    </div>
                </div>

                <div class="flex justify-end space-x-4 pt-6 border-t">
                    <a href="/legal-tax/jurisdictions" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Jurisdiction</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
