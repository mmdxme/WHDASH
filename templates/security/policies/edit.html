{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <a href="{{ url_for('security.policies') }}" class="text-blue-600 hover:text-blue-700 flex items-center mb-4">
            <i class="fa-solid fa-arrow-left mr-2"></i>{{ t('security_back', 'Back') }}
        </a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ t('security_edit_policy', 'Edit Policy') }}: {{ policy.policy_name }}</h1>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
            <form method="POST" class="p-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_min_length', 'Minimum Password Length') }}</label>
                        <input type="number" name="min_length" value="{{ rules.min_length|default(12) }}" min="6" max="32" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="require_uppercase" {% if rules.require_uppercase|default(true) %}checked{% endif %} class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_require_uppercase', 'Require Uppercase') }}</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="require_lowercase" {% if rules.require_lowercase|default(true) %}checked{% endif %} class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_require_lowercase', 'Require Lowercase') }}</span>
                        </label>
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="require_numbers" {% if rules.require_numbers|default(true) %}checked{% endif %} class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_require_numbers', 'Require Numbers') }}</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="require_special" {% if rules.require_special|default(true) %}checked{% endif %} class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_require_special', 'Require Special Characters') }}</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_password_expiry', 'Password Expiry (Days)') }}</label>
                            <input type="number" name="max_age_days" value="{{ rules.max_age_days|default(90) }}" min="1" max="365" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_password_history', 'Password History Count') }}</label>
                            <input type="number" name="history_count" value="{{ rules.history_count|default(5) }}" min="0" max="10" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="is_enabled" {% if policy.is_enabled %}checked{% endif %} class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_enabled', 'Enabled') }}</span>
                        </label>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-4">
                    <a href="{{ url_for('security.policies') }}" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                        {{ t('security_cancel', 'Cancel') }}
                    </a>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        {{ t('security_save', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
