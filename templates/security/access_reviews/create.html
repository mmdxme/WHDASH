{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <a href="{{ url_for('security.access_reviews') }}" class="text-blue-600 hover:text-blue-700 flex items-center mb-4">
            <i class="fa-solid fa-arrow-left mr-2"></i>{{ t('security_back', 'Back') }}
        </a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ t('security_create_campaign', 'Create Access Review Campaign') }}</h1>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
            <form method="POST" class="p-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_campaign_name', 'Campaign Name') }}</label>
                        <input type="text" name="campaign_name" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white" placeholder="Q2 2026 Access Review">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_campaign_type', 'Campaign Type') }}</label>
                            <select name="campaign_type" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="periodic">{{ t('security_periodic', 'Periodic') }}</option>
                                <option value="triggered">{{ t('security_triggered', 'Triggered') }}</option>
                                <option value="onboarding">{{ t('security_onboarding', 'Onboarding') }}</option>
                                <option value="offboarding">{{ t('security_offboarding', 'Offboarding') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_review_frequency', 'Review Frequency') }}</label>
                            <select name="review_frequency" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="quarterly">{{ t('security_quarterly', 'Quarterly') }}</option>
                                <option value="monthly">{{ t('security_monthly', 'Monthly') }}</option>
                                <option value="annually">{{ t('security_annually', 'Annually') }}</option>
                                <option value="one_time">{{ t('security_one_time', 'One Time') }}</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_description', 'Description') }}</label>
                        <textarea name="description" rows="3" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_start_date', 'Start Date') }}</label>
                            <input type="date" name="start_date" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_due_date', 'Due Date') }}</label>
                            <input type="date" name="due_date" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_scope_type', 'Scope') }}</label>
                        <select name="scope_type" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            <option value="all">{{ t('security_all_users', 'All Users') }}</option>
                            <option value="department">{{ t('security_department_scope', 'Department') }}</option>
                            <option value="role">{{ t('security_role_scope', 'Role') }}</option>
                            <option value="privilege_level">{{ t('security_privilege_level', 'Privilege Level') }}</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="include_mfa_status" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_include_mfa', 'Include MFA Status') }}</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="include_sso_status" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_include_sso', 'Include SSO Status') }}</span>
                        </label>
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="include_role_conflicts" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_include_conflicts', 'Include Role Conflicts') }}</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="include_inactive_users" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_include_inactive', 'Include Inactive Users') }}</span>
                        </label>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-4">
                    <a href="{{ url_for('security.access_reviews') }}" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                        {{ t('security_cancel', 'Cancel') }}
                    </a>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        {{ t('security_create_campaign', 'Create Campaign') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
