{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <a href="{{ url_for('security.sso_providers') }}" class="text-blue-600 hover:text-blue-700 flex items-center mb-4">
            <i class="fa-solid fa-arrow-left mr-2"></i>{{ t('security_back', 'Back') }}
        </a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ t('security_create_provider', 'Create SSO Provider') }}</h1>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
            <form method="POST" class="p-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_provider_code', 'Provider Code') }}</label>
                        <input type="text" name="provider_code" required pattern="[a-z0-9_-]+" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white" placeholder="azure_ad, google_workspace, okta">
                        <p class="mt-1 text-xs text-gray-500">Unique identifier (lowercase, numbers, underscore, hyphen)</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_provider_name', 'Provider Name') }}</label>
                        <input type="text" name="provider_name" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white" placeholder="Microsoft Entra ID">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_provider_type', 'Provider Type') }}</label>
                        <select name="provider_type" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            <option value="oidc">OpenID Connect (OIDC)</option>
                            <option value="saml">SAML 2.0</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_client_id', 'Client ID') }}</label>
                        <input type="text" name="client_id" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_client_secret', 'Client Secret') }}</label>
                        <input type="password" name="client_secret" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_discovery_url', 'Discovery URL') }}</label>
                        <input type="url" name="discovery_url" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white" placeholder="https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ t('security_scopes', 'Scopes') }}</label>
                        <input type="text" name="scopes" value="openid profile email" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="is_enabled" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_enabled', 'Enabled') }}</span>
                        </label>

                        <label class="flex items-center">
                            <input type="checkbox" name="is_visible" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_visible', 'Visible on Login') }}</span>
                        </label>

                        <label class="flex items-center">
                            <input type="checkbox" name="is_default" class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">{{ t('security_default', 'Default Provider') }}</span>
                        </label>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-4">
                    <a href="{{ url_for('security.sso_providers') }}" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                        {{ t('security_cancel', 'Cancel') }}
                    </a>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        {{ t('security_create', 'Create Provider') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
