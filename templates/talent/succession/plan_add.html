{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('talent.succession_detail', role_id=critical_role.id) }}" class="p-2 bg-white/5 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-3xl font-bold text-white">{{ t('add_succession_plan', 'Add Succession Plan') }}</h1>
                <p class="text-slate-400 mt-1">{{ critical_role.position_title }} - {{ t('for_role', 'for role') }}</p>
            </div>
        </div>
    </div>

    <!-- Add Plan Form -->
    <div class="glass-panel rounded-2xl p-6">
        <form action="{{ url_for('talent.succession_add_plan', role_id=critical_role.id) }}" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('successor', 'Successor') }} *</label>
                    <select name="successor_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:border-purple-500 focus:outline-none">
                        <option value="" class="bg-slate-800">{{ t('select_successor', 'Select a successor...') }}</option>
                        {% for emp in potential_successors %}
                        <option value="{{ emp.employee_id }}" class="bg-slate-800">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.employee_code }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('deputy_optional', 'Deputy (Optional)') }}</label>
                    <select name="deputy_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:border-purple-500 focus:outline-none">
                        <option value="" class="bg-slate-800">{{ t('select_deputy', 'Select a deputy...') }}</option>
                        {% for emp in potential_successors %}
                        <option value="{{ emp.employee_id }}" class="bg-slate-800">{{ emp.first_name }} {{ emp.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('readiness_level', 'Readiness Level') }} *</label>
                    <select name="readiness_level" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:border-purple-500 focus:outline-none">
                        <option value="Ready Now" class="bg-slate-800">{{ t('ready_now', 'Ready Now') }}</option>
                        <option value="6 Months" class="bg-slate-800">{{ t('ready_6mo', 'Ready in 6 Months') }}</option>
                        <option value="1 Year" selected class="bg-slate-800">{{ t('ready_1yr', 'Ready in 1 Year') }}</option>
                        <option value="2 Years" class="bg-slate-800">{{ t('ready_2yr', 'Ready in 2 Years') }}</option>
                        <option value="3+ Years" class="bg-slate-800">{{ t('ready_3yr_plus', 'Ready in 3+ Years') }}</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('development_needs', 'Development Needs') }}</label>
                <textarea name="development_needs" rows="4" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-500 focus:border-purple-500 focus:outline-none" placeholder="{{ t('describe_dev_needs', 'Describe the development needs for this successor...') }}"></textarea>
            </div>
            <div class="flex items-center justify-end gap-3">
                <a href="{{ url_for('talent.succession_detail', role_id=critical_role.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all">
                    {{ t('cancel', 'Cancel') }}
                </a>
                <button type="submit" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-semibold transition-all">
                    <i class="fa-solid fa-save mr-2"></i>{{ t('create_plan', 'Create Plan') }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
