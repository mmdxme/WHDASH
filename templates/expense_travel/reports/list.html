<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white">{{ page_title }}</h1>
            <p class="text-gray-400 mt-1">Expense & Travel Analytics and Reports</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <a href="/expense-travel/reports/expense-claims" class="card hover:no-underline">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-info/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-file-invoice-dollar text-info text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold">Expense Claims Report</h3>
                        <p class="text-gray-400 text-sm">Detailed analysis of all expense claims</p>
                    </div>
                </div>
            </a>

            <a href="/expense-travel/reports/travel-requests" class="card hover:no-underline">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-success/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-plane text-success text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold">Travel Requests Report</h3>
                        <p class="text-gray-400 text-sm">Travel patterns and cost analysis</p>
                    </div>
                </div>
            </a>

            <a href="/expense-travel/reports/cash-advances" class="card hover:no-underline">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-warning/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wallet text-warning text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold">Cash Advances Report</h3>
                        <p class="text-gray-400 text-sm">Advance requests and settlements</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
    {% endblock %}
</body>
</html>
