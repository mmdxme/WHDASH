<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; }
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; color: #e5e7eb; padding: 0.5rem 0.75rem; border-radius: 0.5rem; width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        label { display: block; color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .form-group { margin-bottom: 1rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ page_title }}</h1>
                <p class="text-gray-400 mt-1">Request a cash advance</p>
            </div>
            <a href="/expense-travel/advances" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <form method="post">
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Advance Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label>Request Date</label>
                        <input type="date" name="request_date" value="{{ today }}">
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select name="requested_currency">
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="required">Requested Amount</label>
                        <input type="number" step="0.01" name="requested_amount" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Expected Destination</label>
                        <input type="text" name="expected_destination" placeholder="Dubai, UAE">
                    </div>
                    <div class="form-group md:col-span-2">
                        <label>Purpose</label>
                        <textarea name="purpose" rows="2" placeholder="Business travel to Dubai for client meetings"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-4">
                <a href="/expense-travel/advances" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Advance Request
                </button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
