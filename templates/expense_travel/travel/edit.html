<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; }
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; color: #e5e7eb; padding: 0.5rem 0.75rem; border-radius: 0.5rem; width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        label { display: block; color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .form-group { margin-bottom: 1rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">Edit: {{ travel.travel_number }}</h1>
                <p class="text-gray-400 mt-1">Modify travel request details</p>
            </div>
            <a href="/expense-travel/travel/{{ travel.id }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <form method="post">
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Trip Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label>Trip Purpose</label>
                        <input type="text" name="trip_purpose" value="{{ travel.trip_purpose }}">
                    </div>
                    <div class="form-group">
                        <label>Trip Type</label>
                        <select name="trip_type">
                            <option value="business" {% if travel.trip_type == 'business' %}selected{% endif %}>Business</option>
                            <option value="training" {% if travel.trip_type == 'training' %}selected{% endif %}>Training</option>
                            <option value="conference" {% if travel.trip_type == 'conference' %}selected{% endif %}>Conference</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Destination Country</label>
                        <input type="text" name="destination_country" value="{{ travel.destination_country }}">
                    </div>
                    <div class="form-group">
                        <label>Destination City</label>
                        <input type="text" name="destination_city" value="{{ travel.destination_city }}">
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" name="travel_start_date" value="{{ travel.travel_start_date }}">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" name="travel_end_date" value="{{ travel.travel_end_date }}">
                    </div>
                </div>
            </div>

            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Estimated Costs</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="form-group">
                        <label>Estimated Total Cost</label>
                        <input type="number" step="0.01" name="estimated_total_cost" value="{{ travel.estimated_total_cost }}">
                    </div>
                    <div class="form-group">
                        <label>Pre-Approved Budget</label>
                        <input type="number" step="0.01" name="pre_approved_budget" value="{{ travel.pre_approved_budget }}">
                    </div>
                    <div class="form-group">
                        <label>Cash Advance Requested</label>
                        <input type="number" step="0.01" name="advance_requested" value="{{ travel.advance_requested }}">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-4">
                <a href="/expense-travel/travel/{{ travel.id }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
