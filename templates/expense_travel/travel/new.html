<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; }
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; color: #e5e7eb; padding: 0.5rem 0.75rem; border-radius: 0.5rem; width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        label { display: block; color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .form-group { margin-bottom: 1rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ page_title }}</h1>
                <p class="text-gray-400 mt-1">Create a new travel authorization request</p>
            </div>
            <a href="/expense-travel/travel" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <form method="post">
            <!-- Trip Details -->
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Trip Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group md:col-span-2">
                        <label class="required">Trip Purpose</label>
                        <input type="text" name="trip_purpose" required placeholder="Business meeting with client">
                    </div>
                    <div class="form-group">
                        <label>Trip Type</label>
                        <select name="trip_type">
                            <option value="business">Business</option>
                            <option value="training">Training</option>
                            <option value="conference">Conference</option>
                            <option value="client_visit">Client Visit</option>
                            <option value="internal">Internal Meeting</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select name="estimated_total_cost_currency">
                            <option value="AED">AED</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Destination -->
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Destination</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label class="required">Destination Country</label>
                        <input type="text" name="destination_country" required placeholder="UAE">
                    </div>
                    <div class="form-group">
                        <label class="required">Destination City</label>
                        <input type="text" name="destination_city" required placeholder="Dubai">
                    </div>
                </div>
            </div>

            <!-- Travel Dates -->
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Travel Dates</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="form-group">
                        <label class="required">Start Date</label>
                        <input type="date" name="travel_start_date" required>
                    </div>
                    <div class="form-group">
                        <label class="required">End Date</label>
                        <input type="date" name="travel_end_date" required>
                    </div>
                    <div class="form-group">
                        <label>Total Days</label>
                        <input type="text" disabled placeholder="Auto-calculated">
                    </div>
                </div>
            </div>

            <!-- Financial -->
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Estimated Costs</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="form-group">
                        <label>Estimated Total Cost</label>
                        <input type="number" step="0.01" name="estimated_total_cost" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Pre-Approved Budget</label>
                        <input type="number" step="0.01" name="pre_approved_budget" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Cash Advance Requested</label>
                        <input type="number" step="0.01" name="advance_requested" placeholder="0.00">
                    </div>
                </div>
            </div>

            <!-- Justification -->
            <div class="card mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Justification</h3>
                <div class="form-group">
                    <textarea name="justification" rows="4" placeholder="Provide detailed justification for this travel..."></textarea>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-4">
                <a href="/expense-travel/travel" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Travel Request
                </button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
