{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-3xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">New Social Ad</h2>
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Ad Name *</label>
                    <input type="text" name="ad_name" required placeholder="Summer Sale Ad 1" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Platform *</label>
                    <select name="platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">Select Platform</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="YouTube">YouTube</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Ad Copy</label>
                <textarea name="ad_copy" rows="4" placeholder="Write your ad copy..." class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Daily Budget (AED)</label>
                    <input type="number" name="daily_budget" min="0" step="0.01" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Total Budget (AED)</label>
                    <input type="number" name="total_budget" min="0" step="0.01" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
            </div>
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                <a href="{{ url_for('social_media.ads_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Create Ad</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
