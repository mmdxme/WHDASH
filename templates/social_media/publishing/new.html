{% extends "social_media/base_social.html" %}

{% block extra_head %}
<title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block page_content %}
<div class="max-w-3xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">Schedule Publishing</h2>
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Platform *</label>
                        <select name="platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                            <option value="">Select Platform</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Facebook">Facebook</option>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="YouTube">YouTube</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Publish Date *</label>
                        <input type="date" name="publish_date" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Publish Time</label>
                    <input type="time" name="publish_time" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Publishing Type</label>
                    <select name="publish_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Scheduled">Scheduled</option>
                        <option value="Instant">Instant</option>
                        <option value="Auto">Auto</option>
                    </select>
                </div>
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.publishing_queue') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Schedule</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
