<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen">
    {% extends "social_media/base_social.html" %}
    
    {% block page_content %}
    <div class="max-w-3xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">New Social Account</h2>
            
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Platform *</label>
                        <select name="platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Platform</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Facebook">Facebook</option>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="YouTube">YouTube</option>
                            <option value="TikTok">TikTok</option>
                            <option value="WhatsApp Business">WhatsApp Business</option>
                            <option value="Telegram">Telegram</option>
                            <option value="Twitter">Twitter / X</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Account Name *</label>
                        <input type="text" name="account_name" required placeholder="e.g. SDAD Official" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Username / Handle</label>
                        <input type="text" name="username" placeholder="e.g. @sdad_official" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Account Link</label>
                        <input type="url" name="account_link" placeholder="https://..." 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Company</label>
                        <select name="company_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Company</option>
                            {% for company in companies %}
                            <option value="{{ company.id }}">{{ company.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Target Market</label>
                        <input type="text" name="target_market" placeholder="e.g. UAE, GCC, Export" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Primary Language</label>
                        <select name="primary_language" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="en">English</option>
                            <option value="fa">Persian / Farsi</option>
                            <option value="ar">Arabic</option>
                            <option value="ru">Russian</option>
                            <option value="hi">Hindi</option>
                            <option value="es">Spanish</option>
                            <option value="zh">Chinese</option>
                            <option value="de">German</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Account Type</label>
                        <select name="account_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="Business">Business</option>
                            <option value="Personal">Personal</option>
                            <option value="Creator">Creator</option>
                            <option value="Enterprise">Enterprise</option>
                        </select>
                    </div>
                </div>
                
                <div class="border-t border-white/10 pt-6">
                    <h3 class="text-lg font-semibold text-white mb-4">Security & Access</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Connected Email</label>
                            <input type="email" name="connected_email" placeholder="account@email.com" 
                                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Connected Mobile</label>
                            <input type="tel" name="connected_mobile" placeholder="+971501234567" 
                                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">WhatsApp Linked Number</label>
                            <input type="tel" name="whatsapp_linked_number" placeholder="+971501234567" 
                                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Two-Factor Authentication</label>
                            <label class="flex items-center gap-3 cursor-pointer mt-3">
                                <input type="checkbox" name="two_factor_enabled" class="w-5 h-5 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500">
                                <span class="text-slate-300">2FA is enabled on this account</span>
                            </label>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Business Manager ID</label>
                            <input type="text" name="business_manager_id" placeholder="Meta Business Manager ID" 
                                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-2">Pixel / Tracking ID</label>
                            <input type="text" name="pixel_tracking_id" placeholder="Meta Pixel ID" 
                                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        </div>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="3" placeholder="Additional notes about this account..."
                              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
                </div>
                
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.accounts_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary">
                        <i class="fa-solid fa-save"></i> Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
