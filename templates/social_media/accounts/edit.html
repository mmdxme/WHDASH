<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen">
    {% extends "social_media/base_social.html" %}
    
    {% block page_content %}
    <div class="max-w-3xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">Edit Social Account</h2>
            
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Platform *</label>
                        <select name="platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Platform</option>
                            <option value="Instagram" {% if account.platform == 'Instagram' %}selected{% endif %}>Instagram</option>
                            <option value="Facebook" {% if account.platform == 'Facebook' %}selected{% endif %}>Facebook</option>
                            <option value="LinkedIn" {% if account.platform == 'LinkedIn' %}selected{% endif %}>LinkedIn</option>
                            <option value="YouTube" {% if account.platform == 'YouTube' %}selected{% endif %}>YouTube</option>
                            <option value="TikTok" {% if account.platform == 'TikTok' %}selected{% endif %}>TikTok</option>
                            <option value="WhatsApp Business" {% if account.platform == 'WhatsApp Business' %}selected{% endif %}>WhatsApp Business</option>
                            <option value="Telegram" {% if account.platform == 'Telegram' %}selected{% endif %}>Telegram</option>
                            <option value="Twitter" {% if account.platform == 'Twitter' %}selected{% endif %}>Twitter / X</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Account Name *</label>
                        <input type="text" name="account_name" required value="{{ account.account_name }}" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Username / Handle</label>
                        <input type="text" name="username" value="{{ account.username or '' }}" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Account Link</label>
                        <input type="url" name="account_link" value="{{ account.account_link or '' }}" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Status</label>
                        <select name="account_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="Active" {% if account.account_status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if account.account_status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            <option value="Archived" {% if account.account_status == 'Archived' %}selected{% endif %}>Archived</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Two-Factor Authentication</label>
                        <label class="flex items-center gap-3 cursor-pointer mt-3">
                            <input type="checkbox" name="two_factor_enabled" {% if account.two_factor_enabled %}checked{% endif %} class="w-5 h-5 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500">
                            <span class="text-slate-300">2FA is enabled</span>
                        </label>
                    </div>
                </div>
                
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.accounts_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary">
                        <i class="fa-solid fa-save"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
