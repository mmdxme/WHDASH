{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-4xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">Edit Campaign</h2>
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Campaign Name *</label>
                    <input type="text" name="campaign_name" required value="{{ campaign.campaign_name }}" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Status</label>
                    <select name="campaign_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Draft" {% if campaign.campaign_status == 'Draft' %}selected{% endif %}>Draft</option>
                        <option value="Active" {% if campaign.campaign_status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Paused" {% if campaign.campaign_status == 'Paused' %}selected{% endif %}>Paused</option>
                        <option value="Completed" {% if campaign.campaign_status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Main Message</label>
                <textarea name="main_message" rows="3" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ campaign.main_message or '' }}</textarea>
            </div>
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                <a href="{{ url_for('social_media.campaigns_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
