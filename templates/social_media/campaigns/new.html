{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-4xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">New Social Campaign</h2>
        
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Campaign Name *</label>
                    <input type="text" name="campaign_name" required placeholder="Summer Sale 2026" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Campaign Code</label>
                    <input type="text" name="campaign_code" placeholder="Auto-generated if empty" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Campaign Type</label>
                    <select name="campaign_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Type</option>
                        <option value="Brand Awareness">Brand Awareness</option>
                        <option value="Product Launch">Product Launch</option>
                        <option value="Sales Promotion">Sales Promotion</option>
                        <option value="Lead Generation">Lead Generation</option>
                        <option value="Seasonal">Seasonal</option>
                        <option value="Event">Event</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Platform</label>
                    <select name="platform" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Multi-platform</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="YouTube">YouTube</option>
                        <option value="TikTok">TikTok</option>
                        <option value="WhatsApp">WhatsApp</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Start Date</label>
                    <input type="date" name="start_date" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">End Date</label>
                    <input type="date" name="end_date" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Budget (AED)</label>
                    <input type="number" name="approved_budget" min="0" step="0.01" placeholder="0.00" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Campaign Manager</label>
                    <select name="campaign_manager_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Manager</option>
                        {% for m in managers %}
                        <option value="{{ m.id }}">{{ m.username }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Target Market</label>
                <input type="text" name="target_market" placeholder="UAE, GCC, Export" 
                       class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Main Message</label>
                <textarea name="main_message" rows="3" placeholder="Campaign main message..."
                          class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">CTA Text</label>
                <input type="text" name="cta_text" placeholder="Shop Now, Learn More, Get Quote" 
                       class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Status</label>
                <select name="campaign_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Draft">Draft</option>
                    <option value="Active">Active</option>
                    <option value="Paused">Paused</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                <textarea name="notes" rows="3" placeholder="Additional notes..."
                          class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
            </div>
            
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                <a href="{{ url_for('social_media.campaigns_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                <button type="submit" class="btn-social btn-social-primary">
                    <i class="fa-solid fa-save"></i> Create Campaign
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
