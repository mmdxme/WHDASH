{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-3xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">Assign Social Media Role to User</h2>
        <form method="POST" class="space-y-6 mb-8">
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">User *</label>
                    <select name="user_id" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">Select User</option>
                        {% for u in users %}
                        <option value="{{ u.id }}">{{ u.username }} ({{ u.email }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Social Media Role *</label>
                    <select name="social_role_id" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">Select Role</option>
                        {% for r in roles %}
                        <option value="{{ r.id }}">{{ r.role_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-user-plus"></i> Assign Role</button>
        </form>
        
        <h3 class="text-lg font-bold text-white mb-4">Current Assignments</h3>
        <div class="table-container">
            <table>
                <thead><tr><th>User</th><th>Role</th></tr></thead>
                <tbody>
                    {% for a in assignments %}
                    <tr><td class="text-white">{{ a.username }}</td><td class="text-brand-400">{{ a.role_name }}</td></tr>
                    {% else %}
                    <tr><td colspan="2" class="text-center py-4 text-slate-400">No assignments yet</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
