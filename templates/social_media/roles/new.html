{% extends "social_media/base_social.html" %}

{% block extra_head %}
<title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block page_content %}
<div class="max-w-3xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">New Social Media Role</h2>
            <form method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Role Name *</label>
                    <input type="text" name="role_name" required placeholder="Social Media Manager" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Role Code</label>
                    <input type="text" name="role_code" placeholder="SM-MANAGER" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Description</label>
                    <textarea name="description" rows="2" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white"></textarea>
                </div>
                <div class="border-t border-white/10 pt-4">
                    <h3 class="text-sm font-semibold text-white mb-3">Permissions</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center gap-3"><input type="checkbox" name="can_view_financials" class="rounded bg-white/10 border-white/20 text-brand-500"> View Financials</label>
                        <label class="flex items-center gap-3"><input type="checkbox" name="can_approve" class="rounded bg-white/10 border-white/20 text-brand-500"> Can Approve</label>
                        <label class="flex items-center gap-3"><input type="checkbox" name="can_publish" class="rounded bg-white/10 border-white/20 text-brand-500"> Can Publish</label>
                        <label class="flex items-center gap-3"><input type="checkbox" name="can_manage_team" class="rounded bg-white/10 border-white/20 text-brand-500"> Manage Team</label>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.roles_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Create Role</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
