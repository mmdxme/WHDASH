{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-4xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">Edit Content</h2>
        
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Internal Title *</label>
                    <input type="text" name="internal_title" required value="{{ content.internal_title }}" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Display Title</label>
                    <input type="text" name="display_title" value="{{ content.display_title or '' }}" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Target Platform *</label>
                    <select name="target_platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Instagram" {% if content.target_platform == 'Instagram' %}selected{% endif %}>Instagram</option>
                        <option value="Facebook" {% if content.target_platform == 'Facebook' %}selected{% endif %}>Facebook</option>
                        <option value="LinkedIn" {% if content.target_platform == 'LinkedIn' %}selected{% endif %}>LinkedIn</option>
                        <option value="YouTube" {% if content.target_platform == 'YouTube' %}selected{% endif %}>YouTube</option>
                        <option value="TikTok" {% if content.target_platform == 'TikTok' %}selected{% endif %}>TikTok</option>
                        <option value="WhatsApp" {% if content.target_platform == 'WhatsApp' %}selected{% endif %}>WhatsApp</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Priority</label>
                    <select name="priority" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="1" {% if content.priority == 1 %}selected{% endif %}>Urgent (1)</option>
                        <option value="2" {% if content.priority == 2 %}selected{% endif %}>High (2)</option>
                        <option value="3" {% if content.priority == 3 %}selected{% endif %}>Normal (3)</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Caption</label>
                <textarea name="caption" rows="5" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ content.caption or '' }}</textarea>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Hashtags</label>
                <input type="text" name="hashtags" value="{{ content.hashtags or '' }}" 
                       class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Production Status</label>
                <select name="production_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Idea" {% if content.production_status == 'Idea' %}selected{% endif %}>Idea</option>
                    <option value="In Production" {% if content.production_status == 'In Production' %}selected{% endif %}>In Production</option>
                    <option value="Ready for Review" {% if content.production_status == 'Ready for Review' %}selected{% endif %}>Ready for Review</option>
                    <option value="Approved" {% if content.production_status == 'Approved' %}selected{% endif %}>Approved</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                <textarea name="notes" rows="3" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ content.notes or '' }}</textarea>
            </div>
            
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                <a href="{{ url_for('social_media.content_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                <button type="submit" class="btn-social btn-social-primary">
                    <i class="fa-solid fa-save"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
