{% extends "social_media/base_social.html" %}

{% block extra_head %}
<title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block page_content %}
<div class="max-w-4xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">New Content</h2>
            
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Internal Title *</label>
                        <input type="text" name="internal_title" required placeholder="For internal reference" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Display Title</label>
                        <input type="text" name="display_title" placeholder="Shown to audience" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Target Platform *</label>
                        <select name="target_platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Platform</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Facebook">Facebook</option>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="YouTube">YouTube</option>
                            <option value="TikTok">TikTok</option>
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="Multiple">Multiple Platforms</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Content Type</label>
                        <select name="content_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Type</option>
                            <option value="Post">Post</option>
                            <option value="Carousel">Carousel</option>
                            <option value="Story">Story</option>
                            <option value="Reel">Reel</option>
                            <option value="Video">Video</option>
                            <option value="Article">Article</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Content Format</label>
                        <select name="content_format" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Format</option>
                            <option value="Image">Image</option>
                            <option value="Video">Video</option>
                            <option value="Carousel">Carousel</option>
                            <option value="Text Only">Text Only</option>
                            <option value="Link">Link</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Content Pillar</label>
                        <select name="content_pillar" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="">Select Pillar</option>
                            <option value="Product Showcase">Product Showcase</option>
                            <option value="Educational">Educational</option>
                            <option value="Entertaining">Entertaining</option>
                            <option value="Inspirational">Inspirational</option>
                            <option value="Promotional">Promotional</option>
                            <option value="Behind the Scenes">Behind the Scenes</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Caption</label>
                    <textarea name="caption" rows="5" placeholder="Write your caption here..."
                              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Hashtags</label>
                    <input type="text" name="hashtags" placeholder="#tag1 #tag2 #tag3" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Hook</label>
                        <input type="text" name="hook" placeholder="Attention-grabbing opening" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">CTA</label>
                        <input type="text" name="cta_text" placeholder="Call to action" 
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Priority</label>
                        <select name="priority" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                            <option value="3">Normal (3)</option>
                            <option value="2">High (2)</option>
                            <option value="1">Urgent (1)</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Production Status</label>
                    <select name="production_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Idea">Idea</option>
                        <option value="In Production">In Production</option>
                        <option value="Ready for Review">Ready for Review</option>
                        <option value="Approved">Approved</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="3" placeholder="Additional notes..."
                              class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
                </div>
                
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.content_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary">
                        <i class="fa-solid fa-save"></i> Create Content
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
