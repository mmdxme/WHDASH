{% extends "social_media/base_social.html" %}

{% block extra_head %}
<title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block page_content %}
<div class="max-w-3xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">Schedule Content</h2>
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Publish Date *</label>
                        <input type="date" name="publish_date" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Publish Time</label>
                        <input type="time" name="publish_time" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Platform *</label>
                    <select name="platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">Select Platform</option>
                        {% for p in platforms %}
                        <option value="{{ p }}">{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Link to Content</label>
                    <select name="content_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">Select Content</option>
                        {% for c in content_items %}
                        <option value="{{ c.id }}">{{ c.internal_title }} ({{ c.target_platform }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Status</label>
                    <select name="calendar_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Scheduled">Scheduled</option>
                        <option value="Draft">Draft</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="3" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white"></textarea>
                </div>
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.content_calendar') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Schedule</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
