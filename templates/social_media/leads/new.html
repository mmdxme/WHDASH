{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-4xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">New Social Media Lead</h2>
        
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Lead Name *</label>
                    <input type="text" name="lead_name" required placeholder="Contact name" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Phone</label>
                    <input type="tel" name="phone" placeholder="+971501234567" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">WhatsApp</label>
                    <input type="tel" name="whatsapp" placeholder="+971501234567" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Email</label>
                    <input type="email" name="email" placeholder="email@example.com" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Country</label>
                    <input type="text" name="country" placeholder="UAE" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">City</label>
                    <input type="text" name="city" placeholder="Dubai" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Source Platform *</label>
                    <select name="source_platform" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Platform</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="YouTube">YouTube</option>
                        <option value="TikTok">TikTok</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Website">Website</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Linked Campaign</label>
                    <select name="source_campaign_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Campaign</option>
                        {% for c in campaigns %}
                        <option value="{{ c.id }}">{{ c.campaign_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Customer Type</label>
                    <select name="customer_type" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Type</option>
                        <option value="Retail">Retail</option>
                        <option value="Wholesale">Wholesale</option>
                        <option value="B2B">B2B</option>
                        <option value="B2C">B2C</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Assigned Salesperson</label>
                    <select name="assigned_salesperson_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Unassigned</option>
                        {% for s in salespersons %}
                        <option value="{{ s.id }}">{{ s.username }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Brand Interest</label>
                    <input type="text" name="brand_interest" placeholder="Interested brand" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Product Interest</label>
                    <input type="text" name="product_interest" placeholder="Product name/number" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Estimated Value (AED)</label>
                    <input type="number" name="estimated_value" min="0" step="0.01" placeholder="0.00" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Urgency Level</label>
                    <select name="urgency_level" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                <textarea name="notes" rows="3" placeholder="Additional notes about this lead..."
                          class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
            </div>
            
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                <a href="{{ url_for('social_media.leads_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                <button type="submit" class="btn-social btn-social-primary">
                    <i class="fa-solid fa-save"></i> Create Lead
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
