{% extends "social_media/base_social.html" %}

{% block page_content %}
<div class="max-w-4xl mx-auto">
    <div class="glass-panel rounded-xl p-6">
        <h2 class="text-xl font-bold text-white mb-6">Edit Lead</h2>
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Lead Name *</label>
                    <input type="text" name="lead_name" required value="{{ lead.lead_name }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Phone</label>
                    <input type="tel" name="phone" value="{{ lead.phone or '' }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Status</label>
                    <select name="lead_status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="New" {% if lead.lead_status == 'New' %}selected{% endif %}>New</option>
                        <option value="In Progress" {% if lead.lead_status == 'In Progress' %}selected{% endif %}>In Progress</option>
                        <option value="Converted" {% if lead.lead_status == 'Converted' %}selected{% endif %}>Converted</option>
                        <option value="Lost" {% if lead.lead_status == 'Lost' %}selected{% endif %}>Lost</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Funnel Stage</label>
                    <select name="funnel_stage" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Message" {% if lead.funnel_stage == 'Message' %}selected{% endif %}>Message</option>
                        <option value="Lead" {% if lead.funnel_stage == 'Lead' %}selected{% endif %}>Lead</option>
                        <option value="Inquiry" {% if lead.funnel_stage == 'Inquiry' %}selected{% endif %}>Inquiry</option>
                        <option value="Offer Sent" {% if lead.funnel_stage == 'Offer Sent' %}selected{% endif %}>Offer Sent</option>
                        <option value="Negotiation" {% if lead.funnel_stage == 'Negotiation' %}selected{% endif %}>Negotiation</option>
                        <option value="Purchase" {% if lead.funnel_stage == 'Purchase' %}selected{% endif %}>Purchase</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Notes</label>
                <textarea name="notes" rows="3" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">{{ lead.notes or '' }}</textarea>
            </div>
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                <a href="{{ url_for('social_media.leads_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
