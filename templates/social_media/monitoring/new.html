<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - {{ t('app_name', 'MMDx') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen">
    {% extends "social_media/base_social.html" %}
    {% block page_content %}
    <div class="max-w-3xl mx-auto">
        <div class="glass-panel rounded-xl p-6">
            <h2 class="text-xl font-bold text-white mb-6">New Monitoring Record</h2>
            <form method="POST" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Monitoring Type *</label>
                        <select name="monitoring_type" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                            <option value="">Select Type</option>
                            <option value="Brand Mention">Brand Mention</option>
                            <option value="Competitor">Competitor</option>
                            <option value="Hashtag">Hashtag</option>
                            <option value="Trend">Trend</option>
                            <option value="Feedback">Feedback</option>
                            <option value="Crisis">Crisis</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Monitored Entity *</label>
                        <input type="text" name="monitored_entity" required placeholder="Brand name, competitor, hashtag..." class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Observed Text</label>
                    <textarea name="observed_text" rows="3" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Sentiment</label>
                        <select name="sentiment" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                            <option value="">Select</option>
                            <option value="Positive">Positive</option>
                            <option value="Neutral">Neutral</option>
                            <option value="Negative">Negative</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-300 mb-2">Importance</label>
                        <select name="importance_level" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
                    <a href="{{ url_for('social_media.monitoring_list') }}" class="btn-social btn-social-secondary">Cancel</a>
                    <button type="submit" class="btn-social btn-social-primary"><i class="fa-solid fa-save"></i> Create</button>
                </div>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
