{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center p-8">
    <div class="text-center max-w-lg">
        <!-- Error Icon -->
        <div class="w-32 h-32 mx-auto mb-8 rounded-full bg-gradient-to-br from-red-500/20 to-red-600/10 flex items-center justify-center border border-red-500/20">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-5xl"></i>
        </div>
        
        <!-- Error Code -->
        <div class="mb-4">
            <span class="text-8xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-red-600 tracking-tighter">404</span>
        </div>
        
        <!-- Title & Description -->
        <h1 class="text-2xl font-bold text-white mb-3">Page Not Found</h1>
        <p class="text-slate-400 mb-8 leading-relaxed">
            The page you're looking for doesn't exist or has been moved. 
            Check the URL or navigate back to the dashboard.
        </p>
        
        <!-- Actions -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <i class="fa-solid fa-house mr-2"></i>
                Go to Dashboard
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left mr-2"></i>
                Go Back
            </button>
        </div>
        
        <!-- Search (Optional) -->
        <div class="mt-12">
            <p class="text-sm text-slate-500 mb-4">Or search for what you need:</p>
            <div class="relative max-w-md mx-auto">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" placeholder="Search modules, reports, settings..." 
                       class="form-input pl-10 pr-4 py-3 rounded-xl w-full">
            </div>
        </div>
    </div>
</div>
{% endblock %}
