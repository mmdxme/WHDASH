{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">Run Depreciation</h1>
            <a href="{{ url_for('assets.depreciation') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form id="depreciationForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Period Month *</label>
                        <select name="period_month" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            {% for m in range(1, 13) %}
                            <option value="{{ m }}" {% if m == current_month %}selected{% endif %}>{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Period Year *</label>
                        <select name="period_year" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            {% for y in range(current_year-2, current_year+1) %}
                            <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mt-6 p-4 bg-slate-800/50 rounded-lg">
                    <h3 class="text-white font-medium mb-2">Summary Preview</h3>
                    <p class="text-slate-400 text-sm">Click "Run Depreciation" to calculate and create depreciation entries for all active assets in the selected period.</p>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="runDepreciation()" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-calculator mr-2"></i>Run Depreciation
                    </button>
                </div>
            </form>
        </div>

        <div id="result" class="mt-6 hidden">
            <div class="glass-panel rounded-xl p-5">
                <h3 class="text-lg font-semibold text-white mb-4">Run Complete</h3>
                <div id="resultContent"></div>
                <a id="viewRunLink" href="#" class="mt-4 inline-block px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium">
                    View Run Details
                </a>
            </div>
        </div>
    </div>
</div>

<script>
async function runDepreciation() {
    const form = document.getElementById('depreciationForm');
    const formData = new FormData(form);
    const data = {
        period_month: parseInt(formData.get('period_month')),
        period_year: parseInt(formData.get('period_year'))
    };

    try {
        const res = await fetch('{{ url_for("assets.depreciation_run") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();

        if (result.success) {
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('resultContent').innerHTML = `
                <p class="text-slate-300">Run Number: <span class="text-brand-400">${result.run_number}</span></p>
                <p class="text-slate-300">Assets Processed: <span class="text-white">${result.total_assets}</span></p>
                <p class="text-slate-300">Total Depreciation: <span class="text-yellow-400">${result.total_depreciation.toFixed(2)}</span></p>
            `;
            document.getElementById('viewRunLink').href = `/assets/depreciation/run/${result.run_id}`;
        } else {
            alert('Error: ' + result.error);
        }
    } catch (e) {
        alert('Error running depreciation');
    }
}
</script>
{% endblock %}
