{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">Transfer Asset</h1>
            <a href="{{ url_for('assets.register') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            {% if asset %}
            <div class="mb-6 p-4 bg-slate-800/50 rounded-lg">
                <h3 class="text-white font-medium">{{ asset.name }}</h3>
                <p class="text-slate-400 text-sm">{{ asset.asset_code }} | Current: {{ asset.location or '-' }}</p>
            </div>
            {% endif %}

            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Transfer Type</label>
                        <select name="transfer_type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="Relocation">Relocation</option>
                            <option value="Department Transfer">Department Transfer</option>
                            <option value="Custodian Change">Custodian Change</option>
                            <option value="Branch Transfer">Branch Transfer</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">To Company</label>
                            <select name="to_company_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                <option value="">Same Company</option>
                                {% for comp in companies %}
                                <option value="{{ comp.id }}">{{ comp.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">To Department</label>
                            <select name="to_department_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                <option value="">Same Department</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">To Location</label>
                        <input type="text" name="to_location" value="{{ asset.location if asset else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Transfer Date</label>
                        <input type="date" name="transfer_date" value="{{ today }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Reason</label>
                        <input type="text" name="reason" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Notes</label>
                        <textarea name="notes" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <a href="{{ url_for('assets.asset_detail', asset_id=asset.id) if asset else url_for('assets.register') }}" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-exchange-alt mr-2"></i>Transfer Asset
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
