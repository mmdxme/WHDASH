{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-100">New Assignment</h1>
                <p class="text-slate-400 text-sm mt-1">Assign asset to employee or department</p>
            </div>
            <a href="{{ url_for('assets.assignments') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-panel rounded-xl p-6">
            <div class="space-y-4">
                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Asset *</label>
                    <select name="asset_id" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                        <option value="">Select Asset</option>
                        {% for asset in assets %}
                        <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.name }} ({{ asset.status }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Assignment Type</label>
                        <select name="assignment_type" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="Employee">Employee</option>
                            <option value="Department">Department</option>
                            <option value="Project">Project</option>
                            <option value="Location">Location</option>
                            <option value="Temporary">Temporary</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Effective Date *</label>
                        <input type="date" name="effective_date" value="{{ today }}" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Assign To (Employee)</label>
                        <select name="assigned_to_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">Select Employee</option>
                            {% for emp in employees %}
                            <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.employee_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Department</label>
                        <select name="department_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">Select Department</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Cost Center</label>
                        <input type="text" name="cost_center" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Location</label>
                        <input type="text" name="location" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Condition at Assignment</label>
                    <textarea name="condition_at_assignment" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Notes</label>
                    <textarea name="notes" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Create Assignment
                </button>
                <a href="{{ url_for('assets.assignments') }}" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium text-center transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
