{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-100">New Capex Request</h1>
                <p class="text-slate-400 text-sm mt-1">Submit capital expenditure request</p>
            </div>
            <a href="{{ url_for('assets.capex_requests') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-panel rounded-xl p-6">
            <div class="space-y-4">
                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Asset Name *</label>
                    <input type="text" name="asset_name" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none" placeholder="e.g., Forklift Truck, Server Equipment">
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Description</label>
                    <textarea name="description" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Category</label>
                        <select name="category_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">Select Category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Quantity</label>
                        <input type="number" name="quantity" value="1" min="1" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Estimated Cost *</label>
                        <input type="number" name="estimated_cost" step="0.01" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Currency</label>
                        <select name="currency" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="SAR">SAR - Saudi Riyal</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Department</label>
                        <select name="department_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">Select Department</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Priority</label>
                        <select name="priority" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Justification</label>
                    <textarea name="justification" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none" placeholder="Explain why this capital expenditure is needed..."></textarea>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Notes</label>
                    <textarea name="notes" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Submit Request
                </button>
                <a href="{{ url_for('assets.capex_requests') }}" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium text-center transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
