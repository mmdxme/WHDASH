{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <h1 class="text-2xl font-bold text-slate-100 mb-6">Asset Settings</h1>

    {% for category, settings in settings_by_cat.items() %}
    <div class="glass-panel rounded-xl p-5 mb-4">
        <h2 class="text-lg font-semibold text-white mb-4">{{ category }}</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for setting in settings %}
            <div>
                <label class="block text-slate-400 text-xs mb-1">{{ setting.setting_key }}</label>
                <input type="text" name="{{ setting.setting_key }}" value="{{ setting.setting_value }}"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                {% if setting.description %}
                <p class="text-slate-500 text-xs mt-1">{{ setting.description }}</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <div class="flex justify-end">
        <button onclick="saveSettings()" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
            <i class="fas fa-save mr-2"></i>Save Settings
        </button>
    </div>
</div>

<script>
async function saveSettings() {
    const inputs = document.querySelectorAll('input[name]');
    const data = {};
    inputs.forEach(i => { if (i.name) data[i.name] = i.value; });

    try {
        const res = await fetch('{{ url_for("assets.settings_save") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) alert('Settings saved successfully');
        else alert('Error saving settings');
    } catch (e) { alert('Error saving settings'); }
}
</script>
{% endblock %}
