{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-100">New Impairment</h1>
                <p class="text-slate-400 text-sm mt-1">Record asset impairment</p>
            </div>
            <a href="{{ url_for('assets.impairments') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-panel rounded-xl p-6">
            <div class="space-y-4">
                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Asset *</label>
                    <select name="asset_id" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                        <option value="">Select Asset</option>
                        {% for asset in assets %}
                        <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.name }} (NBV: {{ asset.net_book_value | round(2) }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Impairment Date *</label>
                        <input type="date" name="impairment_date" value="{{ today }}" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Impairment Type</label>
                        <select name="impairment_type" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="Impairment">Impairment</option>
                            <option value="Write-down">Write-down</option>
                            <option value="Obsolescence">Obsolescence</option>
                            <option value="Damage">Damage</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Previous Value *</label>
                        <input type="number" name="previous_value" step="0.01" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">New Value *</label>
                        <input type="number" name="new_value" step="0.01" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Reason</label>
                    <textarea name="reason" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Notes</label>
                    <textarea name="notes" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Create Impairment
                </button>
                <a href="{{ url_for('assets.impairments') }}" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium text-center transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
