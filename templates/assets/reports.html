{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <h1 class="text-2xl font-bold text-slate-100 mb-6">Asset Reports</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <a href="{{ url_for('assets.report_register') }}" class="glass-panel rounded-xl p-5 hover:bg-slate-700/50 transition-colors">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-brand-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-list text-brand-400 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-white font-medium">Asset Register</h3>
                    <p class="text-slate-400 text-sm">Complete list of all assets</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('assets.report_depreciation') }}" class="glass-panel rounded-xl p-5 hover:bg-slate-700/50 transition-colors">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-yellow-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-calculator text-yellow-400 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-white font-medium">Depreciation Report</h3>
                    <p class="text-slate-400 text-sm">Depreciation schedules and values</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('assets.report_maintenance') }}" class="glass-panel rounded-xl p-5 hover:bg-slate-700/50 transition-colors">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-wrench text-green-400 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-white font-medium">Maintenance Report</h3>
                    <p class="text-slate-400 text-sm">Maintenance history and costs</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('assets.report_disposal') }}" class="glass-panel rounded-xl p-5 hover:bg-slate-700/50 transition-colors">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-red-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-trash-alt text-red-400 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-white font-medium">Disposal Report</h3>
                    <p class="text-slate-400 text-sm">Asset disposals and gains/losses</p>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
