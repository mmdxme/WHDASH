{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-100">New Verification</h1>
                <p class="text-slate-400 text-sm mt-1">Create physical verification record</p>
            </div>
            <a href="{{ url_for('assets.verifications') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-panel rounded-xl p-6">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Verification Date *</label>
                        <input type="date" name="verification_date" value="{{ today }}" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Verification Type</label>
                        <select name="verification_type" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="Annual">Annual</option>
                            <option value="Quarterly">Quarterly</option>
                            <option value="Monthly">Monthly</option>
                            <option value="Surprise">Surprise</option>
                            <option value="Spot Check">Spot Check</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Asset (Optional)</label>
                        <select name="asset_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">All Assets at Location</option>
                            {% for asset in assets %}
                            <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Location</label>
                        <select name="location_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">Select Location</option>
                            {% for loc in locations %}
                            <option value="{{ loc.id }}">{{ loc.code }} - {{ loc.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Scheduled Date</label>
                        <input type="date" name="scheduled_date" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Custodian</label>
                        <select name="custodian_id" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="">Select Custodian</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Notes</label>
                    <textarea name="notes" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Create Verification
                </button>
                <a href="{{ url_for('assets.verifications') }}" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium text-center transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
