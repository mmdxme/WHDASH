{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-100">Add Document</h1>
                <p class="text-slate-400 text-sm mt-1">Attach document to asset</p>
            </div>
            <a href="{{ url_for('assets.asset_documents') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-panel rounded-xl p-6">
            <div class="space-y-4">
                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Asset *</label>
                    <select name="asset_id" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                        <option value="">Select Asset</option>
                        {% for asset in assets %}
                        <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Document Type *</label>
                        <select name="document_type" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                            <option value="Purchase Order">Purchase Order</option>
                            <option value="Invoice">Invoice</option>
                            <option value="Delivery Note">Delivery Note</option>
                            <option value="Warranty Certificate">Warranty Certificate</option>
                            <option value="Insurance Policy">Insurance Policy</option>
                            <option value="Maintenance Contract">Maintenance Contract</option>
                            <option value="User Manual">User Manual</option>
                            <option value="Safety Certificate">Safety Certificate</option>
                            <option value="Calibration Certificate">Calibration Certificate</option>
                            <option value="Inspection Report">Inspection Report</option>
                            <option value="Photo">Photo</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Document Number</label>
                        <input type="text" name="document_number" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Document Name *</label>
                    <input type="text" name="document_name" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Issue Date</label>
                        <input type="date" name="issue_date" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs mb-1 block">Expiry Date</label>
                        <input type="date" name="expiry_date" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">File URL</label>
                    <input type="url" name="file_url" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none" placeholder="https://...">
                </div>

                <div>
                    <label class="text-slate-400 text-xs mb-1 block">Notes</label>
                    <textarea name="notes" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-brand-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Add Document
                </button>
                <a href="{{ url_for('assets.asset_documents') }}" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium text-center transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
