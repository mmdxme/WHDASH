{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">New Work Order</h1>
            <a href="{{ url_for('assets.maintenance') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Asset *</label>
                        <select name="asset_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Select Asset</option>
                            {% for a in assets %}
                            <option value="{{ a.id }}">{{ a.asset_code }} - {{ a.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Maintenance Type *</label>
                        <select name="maintenance_type_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Select Type</option>
                            {% for t in maintenance_types %}
                            <option value="{{ t.id }}">{{ t.name }} ({{ t.category }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Work Order Type</label>
                            <select name="work_order_type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                <option value="Corrective">Corrective</option>
                                <option value="Preventive">Preventive</option>
                                <option value="Emergency">Emergency</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Priority</label>
                            <select name="priority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Issue Date</label>
                        <input type="date" name="issue_date" value="{{ today }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Issue Description *</label>
                        <textarea name="issue_description" required rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Assigned Technician</label>
                            <select name="assigned_technician_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                <option value="">Select Technician</option>
                                {% for e in employees %}
                                <option value="{{ e.id }}">{{ e.first_name }} {{ e.last_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Estimated Cost</label>
                            <input type="number" step="0.01" name="estimated_cost" value="0" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>Create Work Order
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
