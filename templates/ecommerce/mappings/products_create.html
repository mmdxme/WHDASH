<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Product Mapping - E-commerce - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #94a3b8; }
        .form-input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #e5e7eb; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8">
        <div class="mb-6">
            <a href="/ecommerce/mappings/products" class="text-gray-400 hover:text-white"><i class="fas fa-arrow-left"></i> Back</a>
            <h1 class="text-3xl font-bold text-white mt-4">Create Product Mapping</h1>
        </div>

        <form method="POST" class="card max-w-2xl">
            <div class="form-group">
                <label class="form-label">Channel *</label>
                <select name="channel_id" class="form-input" required>
                    <option value="">Select Channel</option>
                    {% for ch in channels %}
                    <option value="{{ ch.id }}">{{ ch.channel_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Internal Item ID</label>
                <input type="number" name="internal_item_id" class="form-input" placeholder="Leave empty if mapping by SKU/barcode only">
            </div>
            <div class="form-group">
                <label class="form-label">Internal SKU</label>
                <input type="text" name="internal_sku" class="form-input" placeholder="Internal product SKU">
            </div>
            <div class="form-group">
                <label class="form-label">Internal Barcode</label>
                <input type="text" name="internal_barcode" class="form-input" placeholder="Internal product barcode">
            </div>
            <div class="form-group">
                <label class="form-label">External Product ID *</label>
                <input type="text" name="external_product_id" class="form-input" required placeholder="Product ID on the channel">
            </div>
            <div class="form-group">
                <label class="form-label">External SKU</label>
                <input type="text" name="external_sku" class="form-input" placeholder="SKU on the channel">
            </div>
            <div class="form-group">
                <label class="form-label">External Barcode</label>
                <input type="text" name="external_barcode" class="form-input" placeholder="Barcode on the channel">
            </div>
            <div class="form-group">
                <label class="form-label">External URL</label>
                <input type="url" name="external_url" class="form-input" placeholder="Product URL on the channel">
            </div>
            <div class="flex gap-4 mt-6">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Mapping</button>
                <a href="/ecommerce/mappings/products" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
