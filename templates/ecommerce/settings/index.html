{% extends "base.html" %}

{% block extra_head %}
<title>Settings - E-commerce - MMDx</title>
<meta charset="UTF-8">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #94a3b8; }
        .form-input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #e5e7eb; }
        .form-input:focus { outline: none; border-color: #6366f1; }
        .form-select { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #e5e7eb; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white">E-commerce Settings</h1>
            <p class="text-gray-400 mt-1">Configure global e-commerce integration settings</p>
        </div>

        <form method="POST" action="/ecommerce/settings/save">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- General Settings -->
                <div class="card">
                    <h3 class="text-lg font-semibold text-white mb-4">General Settings</h3>
                    <div class="form-group">
                        <label class="form-label">Default Currency</label>
                        <select name="ecommerce_default_currency" class="form-select">
                            <option value="USD" {{ 'selected' if settings.get('ecommerce_default_currency') == 'USD' else '' }}>USD</option>
                            <option value="EUR" {{ 'selected' if settings.get('ecommerce_default_currency') == 'EUR' else '' }}>EUR</option>
                            <option value="GBP" {{ 'selected' if settings.get('ecommerce_default_currency') == 'GBP' else '' }}>GBP</option>
                            <option value="AED" {{ 'selected' if settings.get('ecommerce_default_currency') == 'AED' else '' }}>AED</option>
                            <option value="SAR" {{ 'selected' if settings.get('ecommerce_default_currency') == 'SAR' else '' }}>SAR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Default Payment Status</label>
                        <select name="ecommerce_default_payment_status" class="form-select">
                            <option value="pending" {{ 'selected' if settings.get('ecommerce_default_payment_status') == 'pending' else '' }}>Pending</option>
                            <option value="paid" {{ 'selected' if settings.get('ecommerce_default_payment_status') == 'paid' else '' }}>Paid</option>
                            <option value="COD" {{ 'selected' if settings.get('ecommerce_default_payment_status') == 'COD' else '' }}>Cash on Delivery</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Default Fulfillment Status</label>
                        <select name="ecommerce_default_fulfillment_status" class="form-select">
                            <option value="unfulfilled" {{ 'selected' if settings.get('ecommerce_default_fulfillment_status') == 'unfulfilled' else '' }}>Unfulfilled</option>
                            <option value="processing" {{ 'selected' if settings.get('ecommerce_default_fulfillment_status') == 'processing' else '' }}>Processing</option>
                        </select>
                    </div>
                </div>

                <!-- Sync Settings -->
                <div class="card">
                    <h3 class="text-lg font-semibold text-white mb-4">Sync Settings</h3>
                    <div class="form-group">
                        <label class="form-label">Max Retry Attempts</label>
                        <input type="number" name="ecommerce_max_retry_attempts" class="form-input" value="{{ settings.get('ecommerce_max_retry_attempts', '3') }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Retry Interval (minutes)</label>
                        <input type="number" name="ecommerce_retry_interval_minutes" class="form-input" value="{{ settings.get('ecommerce_retry_interval_minutes', '5') }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Order Prefix</label>
                        <input type="text" name="ecommerce_order_prefix" class="form-input" value="{{ settings.get('ecommerce_order_prefix', 'ECO') }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Customer Prefix</label>
                        <input type="text" name="ecommerce_customer_prefix" class="form-input" value="{{ settings.get('ecommerce_customer_prefix', 'EC') }}">
                    </div>
                </div>

                <!-- Logging Settings -->
                <div class="card">
                    <h3 class="text-lg font-semibold text-white mb-4">Logging</h3>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3">
                            <input type="checkbox" name="ecommerce_enable_audit_log" value="1" {{ 'checked' if settings.get('ecommerce_enable_audit_log') == '1' else '' }} class="w-5 h-5">
                            <span>Enable audit logging</span>
                        </label>
                        <label class="flex items-center gap-3">
                            <input type="checkbox" name="ecommerce_enable_webhook_log" value="1" {{ 'checked' if settings.get('ecommerce_enable_webhook_log') == '1' else '' }} class="w-5 h-5">
                            <span>Enable webhook logging</span>
                        </label>
                        <label class="flex items-center gap-3">
                            <input type="checkbox" name="ecommerce_enable_api_log" value="1" {{ 'checked' if settings.get('ecommerce_enable_api_log') == '1' else '' }} class="w-5 h-5">
                            <span>Enable API call logging</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Settings</button>
            </div>
        </form>
    </div>
{% endblock %}
