{% extends "base.html" %}

{% block extra_head %}
<title>Edit Channel - E-commerce Integration - MMDx</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #94a3b8; }
        .form-input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #e5e7eb; }
        .form-input:focus { outline: none; border-color: #6366f1; }
        .form-select { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #e5e7eb; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .btn-danger { background: #ef4444; color: white; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
        <div class="mb-6">
            <a href="/ecommerce/channels" class="text-gray-400 hover:text-white mb-2 inline-flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to Channels
            </a>
            <h1 class="text-3xl font-bold text-white">Edit Channel</h1>
            <p class="text-gray-400 mt-1">{{ channel.channel_name }} ({{ channel.channel_code }})</p>
        </div>

        <div class="card max-w-4xl">
            <form method="POST">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label class="form-label">Channel Code</label>
                        <input type="text" class="form-input bg-gray-800" value="{{ channel.channel_code }}" readonly>
                        <small class="text-gray-500">Cannot change channel code</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Channel Name *</label>
                        <input type="text" name="channel_name" class="form-input" value="{{ channel.channel_name }}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Channel Type</label>
                        <select name="channel_type" class="form-select">
                            <option value="website" {{ 'selected' if channel.channel_type == 'website' else '' }}>Website / Own Store</option>
                            <option value="marketplace" {{ 'selected' if channel.channel_type == 'marketplace' else '' }}>Marketplace</option>
                            <option value="social" {{ 'selected' if channel.channel_type == 'social' else '' }}>Social Commerce</option>
                            <option value="POS" {{ 'selected' if channel.channel_type == 'POS' else '' }}>Point of Sale</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Default Warehouse</label>
                        <select name="warehouse_id" class="form-select">
                            <option value="0">-- Select Warehouse --</option>
                            {% for wh in warehouses %}
                            <option value="{{ wh.id }}" {{ 'selected' if channel.warehouse_id == wh.id else '' }}>{{ wh.warehouse_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">API Endpoint</label>
                        <input type="url" name="api_endpoint" class="form-input" value="{{ channel.api_endpoint }}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">API Key</label>
                        <input type="text" name="api_key" class="form-input" value="{{ channel.api_key }}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">API Secret</label>
                        <input type="password" name="api_secret" class="form-input" value="{{ channel.api_secret }}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Webhook URL</label>
                        <input type="url" name="webhook_url" class="form-input" value="{{ channel.webhook_url }}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Sync Direction</label>
                        <select name="sync_direction" class="form-select">
                            <option value="bidirectional" {{ 'selected' if channel.sync_direction == 'bidirectional' else '' }}>Bidirectional</option>
                            <option value="inbound" {{ 'selected' if channel.sync_direction == 'inbound' else '' }}>Inbound Only</option>
                            <option value="outbound" {{ 'selected' if channel.sync_direction == 'outbound' else '' }}>Outbound Only</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Active Status</label>
                        <div class="flex items-center gap-4 mt-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="is_active" value="1" {{ 'checked' if channel.is_active else '' }} class="w-5 h-5 rounded">
                                <span>Channel is active</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group mt-6">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-input" rows="3">{{ channel.notes }}</textarea>
                </div>

                <div class="flex gap-4 mt-8">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="/ecommerce/channels/{{ channel.id }}/view" class="btn btn-outline">View Details</a>
                    <form method="POST" action="/ecommerce/channels/{{ channel.id }}/delete" class="inline" onsubmit="return confirm('Are you sure you want to delete this channel?');">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </form>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
