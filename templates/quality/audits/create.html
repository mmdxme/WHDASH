<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --light-bg: #F9FAFB;
        }
        body { background: var(--light-bg); font-family: 'Segoe UI', system-ui, sans-serif; }
        .form-card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .form-label { font-weight: 500; margin-bottom: 0.25rem; }
        .form-section { border-left: 3px solid var(--primary); padding-left: 1rem; margin-bottom: 1.5rem; }
        .required-field::after { content: ' *'; color: var(--danger); }
    </style>
</head>
<body>
    {% include 'base.html' %}

    {% block content %}
    <div class="container-fluid py-4">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="{{ url_for('quality.audits_list') }}">Audits</a></li>
                        <li class="breadcrumb-item active">Create Audit Plan</li>
                    </ol>
                </nav>
                <h1 class="h3 mb-1"><i class="fas fa-plus-circle me-2 text-primary"></i>Create Audit Plan</h1>
                <p class="text-muted mb-0">Schedule a new audit or inspection</p>
            </div>
        </div>

        <form method="post" action="{{ url_for('quality.audits_create') }}">
            <div class="row">
                <div class="col-lg-8">
                    <!-- Basic Information -->
                    <div class="form-card">
                        <h5 class="mb-3"><i class="fas fa-clipboard-list me-2 text-primary"></i>Audit Information</h5>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Audit Type</label>
                                <select name="audit_type" class="form-select" required>
                                    <option value="">Select Type</option>
                                    <option value="INTERNAL">Internal Audit</option>
                                    <option value="SUPPLIER">Supplier Audit</option>
                                    <option value="EXTERNAL">External Audit</option>
                                    <option value="COMPLIANCE">Compliance Audit</option>
                                    <option value="PROCESS">Process Audit</option>
                                    <option value="PRODUCT">Product Audit</option>
                                    <option value="SYSTEM">System Audit</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Audit Standard</label>
                                <select name="audit_standard" class="form-select">
                                    <option value="">Select Standard</option>
                                    <option value="ISO_9001">ISO 9001</option>
                                    <option value="ISO_14001">ISO 14001</option>
                                    <option value="ISO_45001">ISO 45001</option>
                                    <option value="IATF_16949">IATF 16949</option>
                                    <option value="FDA_21CFR">FDA 21 CFR</option>
                                    <option value="GMP">GMP</option>
                                    <option value="INTERNAL">Internal Standard</option>
                                    <option value="CUSTOMER">Customer Requirement</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Scope</label>
                            <textarea name="scope" class="form-control" rows="3" placeholder="Define the boundaries and extent of the audit..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Objectives</label>
                            <textarea name="objectives" class="form-control" rows="2" placeholder="What are the audit objectives?"></textarea>
                        </div>
                    </div>

                    <!-- Schedule -->
                    <div class="form-card">
                        <h5 class="mb-3"><i class="fas fa-calendar me-2 text-primary"></i>Schedule</h5>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Scheduled Start Date</label>
                                <input type="date" name="scheduled_start_date" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Scheduled End Date</label>
                                <input type="date" name="scheduled_end_date" class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Site Location</label>
                                <input type="text" name="site_location" class="form-control" placeholder="Building, area, location...">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" name="department" class="form-control" placeholder="Department to audit...">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Process Area</label>
                            <input type="text" name="process_area" class="form-control" placeholder="Specific process area...">
                        </div>
                    </div>

                    <!-- Team -->
                    <div class="form-card">
                        <h5 class="mb-3"><i class="fas fa-users me-2 text-primary"></i>Audit Team</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Auditee (Person being audited)</label>
                            <input type="text" name="auditee_name" class="form-control" placeholder="Name of person/department...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Auditee Department</label>
                            <input type="text" name="auditee_department" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Additional Auditors</label>
                            <input type="text" name="auditor_names" class="form-control" placeholder="Names of additional audit team members...">
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <!-- Checklist Template -->
                    <div class="form-card">
                        <h5 class="mb-3"><i class="fas fa-tasks me-2 text-primary"></i>Checklist</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Checklist Template</label>
                            <select name="checklist_template_id" class="form-select">
                                <option value="">No Template</option>
                                {% if templates %}
                                    {% for template in templates %}
                                    <option value="{{ template.id }}">{{ template.template_name }}</option>
                                    {% endfor %}
                                {% endif %}
                            </select>
                            <div class="form-text">Select a template to pre-fill the audit checklist</div>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="form-card">
                        <h5 class="mb-3"><i class="fas fa-sticky-note me-2 text-primary"></i>Notes</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Additional Notes</label>
                            <textarea name="notes" class="form-control" rows="4" placeholder="Any additional information..."></textarea>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="form-card">
                        <h5 class="mb-3"><i class="fas fa-cog me-2 text-primary"></i>Actions</h5>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Create Audit Plan
                            </button>
                            <a href="{{ url_for('quality.audits_list') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i> Cancel
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
