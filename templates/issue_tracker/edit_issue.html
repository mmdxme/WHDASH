{% extends "base.html" %}

{% block content %}
<div class="space-y-6 pb-20 fade-in">
    <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
        <div>
            <p class="text-[10px] font-black uppercase tracking-[0.25em] text-cyan-300">Issue Tracker</p>
            <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-white">Edit Issue #{{ issue.row_id }}</h1>
            <p class="mt-1 text-sm text-slate-400">{{ issue.issue }}</p>
        </div>
        <div class="flex gap-3">
            <a href="{{ url_for('issue_tracker.issue_detail', issue_id=issue.id) }}" class="rounded-xl border border-white/10 bg-white/5 px-5 py-2 text-[10px] font-black uppercase tracking-widest text-slate-300 hover:bg-white/10">
                <i class="fa-solid fa-arrow-left mr-2"></i>Back
            </a>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-6 xl:grid-cols-3">
        <!-- Main Form -->
        <div class="xl:col-span-2">
            <div class="glass-panel rounded-2xl border border-white/5 p-6 space-y-5">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Issue Title *</label>
                    <input id="ei_title" type="text" value="{{ issue.issue }}"
                           class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white focus:border-cyan-500/50 focus:outline-none focus:ring-1 focus:ring-cyan-500/20">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Type</label>
                        <select id="ei_type" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white">
                            {% for t in all_types %}
                            <option value="{{ t }}" {% if issue.issue_type == t %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Priority</label>
                        <select id="ei_priority" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white">
                            {% for p in all_priorities %}
                            <option value="{{ p }}" {% if issue.priority == p %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Status</label>
                        <select id="ei_status" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white">
                            {% for s in all_statuses %}
                            <option value="{{ s }}" {% if issue.status == s %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Target Resolution Date</label>
                        <input id="ei_target_date" type="date" value="{{ issue.target_resolution_date or '' }}"
                               class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white focus:border-cyan-500/50 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Departments</label>
                        <input id="ei_departments" type="text" value="{{ issue.involved_departments_display }}"
                               class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyan-500/50 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Section / Team</label>
                        <input id="ei_section" type="text" value="{{ issue.responsible_section or '' }}"
                               class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyan-500/50 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Assignee</label>
                        <input id="ei_assignee" type="text" value="{{ issue.responsible_person or '' }}"
                               class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyan-500/50 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Reported By</label>
                        <input id="ei_reporter" type="text" value="{{ issue.reported_by or '' }}"
                               class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyan-500/50 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Impact</label>
                    <textarea id="ei_impact" rows="3" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white focus:border-cyan-500/50 focus:outline-none resize-none">{{ issue.impact or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Root Cause</label>
                    <textarea id="ei_root_cause" rows="3" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white focus:border-cyan-500/50 focus:outline-none resize-none">{{ issue.root_cause or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Action Plan</label>
                    <textarea id="ei_action_plan" rows="4" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white focus:border-cyan-500/50 focus:outline-none resize-none">{{ issue.action_plan or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Progress Note</label>
                    <textarea id="ei_progress" rows="3" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white focus:border-cyan-500/50 focus:outline-none resize-none">{{ issue.progress_note or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Resources Needed</label>
                    <input id="ei_resources" type="text" value="{{ issue.resources_needed or '' }}"
                           class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyan-500/50 focus:outline-none">
                </div>
                <div id="eiError" class="hidden rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300"></div>
                <div class="flex items-center justify-end gap-3 pt-2">
                    <a href="{{ url_for('issue_tracker.issue_detail', issue_id=issue.id) }}"
                       class="rounded-xl border border-white/10 bg-white/5 px-5 py-2 text-[10px] font-black uppercase tracking-widest text-slate-300 hover:bg-white/10">
                        Cancel
                    </a>
                    <button onclick="submitEdit()" id="eiSaveBtn" class="rounded-xl bg-cyan-600 px-6 py-2 text-[10px] font-black uppercase tracking-widest text-white hover:bg-cyan-500">
                        <i class="fa-solid fa-save mr-1"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar Info -->
        <div class="space-y-4">
            <div class="glass-panel rounded-2xl border border-white/5 p-5">
                <h3 class="text-sm font-bold text-white mb-4">Current State</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Status</span>
                        <span class="rounded-lg border px-2 py-0.5 text-[10px] font-black uppercase {{ issue.status_badge }}">{{ issue.status }}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Priority</span>
                        <span class="rounded-lg border px-2 py-0.5 text-[10px] font-black uppercase {{ issue.priority_badge }}">{{ issue.priority }}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Type</span>
                        <span class="rounded-lg border px-2 py-0.5 text-[10px] font-black uppercase {{ issue.type_badge }}">{{ issue.issue_type }}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Created</span>
                        <span class="text-xs text-slate-300">{{ issue.issue_date }}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Issue #</span>
                        <span class="text-xs font-bold text-white">#{{ issue.row_id }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const CSRF_TOKEN = "{{ csrf_token }}";

async function submitEdit() {
    const btn = document.getElementById('eiSaveBtn');
    const errDiv = document.getElementById('eiError');
    const title = document.getElementById('ei_title').value.trim();
    if (!title) { errDiv.textContent = 'Title is required.'; errDiv.classList.remove('hidden'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Saving...';
    errDiv.classList.add('hidden');

    try {
        const res = await fetch('{{ url_for("issue_tracker.edit_issue", issue_id=issue.id) }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
            body: JSON.stringify({
                csrf_token: CSRF_TOKEN,
                issue: title,
                issue_type: document.getElementById('ei_type').value,
                priority: document.getElementById('ei_priority').value,
                status: document.getElementById('ei_status').value,
                target_resolution_date: document.getElementById('ei_target_date').value,
                involved_departments: document.getElementById('ei_departments').value,
                responsible_section: document.getElementById('ei_section').value,
                responsible_person: document.getElementById('ei_assignee').value,
                reported_by: document.getElementById('ei_reporter').value,
                impact: document.getElementById('ei_impact').value,
                root_cause: document.getElementById('ei_root_cause').value,
                action_plan: document.getElementById('ei_action_plan').value,
                progress_note: document.getElementById('ei_progress').value,
                resources_needed: document.getElementById('ei_resources').value,
            })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '{{ url_for("issue_tracker.issue_detail", issue_id=issue.id) }}';
        } else {
            errDiv.textContent = data.message || 'Failed to save.';
            errDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-save mr-1"></i>Save Changes';
        }
    } catch(err) {
        errDiv.textContent = 'Network error. Please try again.';
        errDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-save mr-1"></i>Save Changes';
    }
}
</script>
{% endblock %}
