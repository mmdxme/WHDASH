{% extends "base.html" %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
{% endblock %}

{% block content %}
<div class="space-y-6 pb-20 fade-in">
    <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
        <div>
            <p class="text-[10px] font-black uppercase tracking-[0.25em] text-cyan-300">Issue Tracker</p>
            <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-white">Trend Analysis</h1>
            <p class="mt-2 text-sm text-slate-400">Monthly issue creation and resolution trends.</p>
        </div>
    </div>

    {% if trend_data %}
    <div class="glass-panel rounded-2xl border border-white/5 p-6">
        <h3 class="mb-4 text-lg font-bold text-white">Monthly Trends</h3>
        <canvas id="trendChart" height="300" class="mt-4"></canvas>
    </div>
    {% endif %}

    <div class="glass-panel rounded-2xl border border-white/5 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-white/10 text-left text-[10px] font-black uppercase tracking-widest text-slate-500">
                        <th class="px-4 py-3">Month</th>
                        <th class="px-4 py-3">Total Created</th>
                        <th class="px-4 py-3">Closed</th>
                        <th class="px-4 py-3">Still Open</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                    {% for month, data in trend_data %}
                    <tr class="hover:bg-white/[0.02] transition-colors">
                        <td class="px-4 py-3 text-white font-medium">{{ month }}</td>
                        <td class="px-4 py-3 text-slate-300">{{ data.total }}</td>
                        <td class="px-4 py-3 text-emerald-400">{{ data.closed }}</td>
                        <td class="px-4 py-3 text-sky-400">{{ data.open }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="px-4 py-12 text-center text-slate-500"><i class="fa-solid fa-chart-line text-4xl text-slate-600"></i><p class="mt-3">No trend data available.</p></td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

{% if trend_data %}
</script>
{% endblock %}

{% block extra_head %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const data = {{ trend_data | tojson | safe }};
    new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
            labels: data.map(d => d[0]),
            datasets: [
                { label: 'Total Created', data: data.map(d => d[1].total), borderColor: '#22d3ee', backgroundColor: 'rgba(34,211,238,0.1)', fill: true, tension: 0.4 },
                { label: 'Closed', data: data.map(d => d[1].closed), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4 },
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true } },
            plugins: { legend: { labels: { color: '#94a3b8' } } }
        }
    });
});
</script>
{% endif %}
{% endblock %}
