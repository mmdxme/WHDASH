{% extends "base.html" %}

{% block title %}{{ t('edit_income', 'Edit Income') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/income" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_income', 'Edit Income') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('income_type', 'Income Type') }}</label>
                            <select name="income_type" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="salary" {% if record.income_type == 'salary' %}selected{% endif %}>{{ t('salary', 'Salary') }}</option>
                                <option value="bonus" {% if record.income_type == 'bonus' %}selected{% endif %}>{{ t('bonus', 'Bonus') }}</option>
                                <option value="freelance" {% if record.income_type == 'freelance' %}selected{% endif %}>{{ t('freelance', 'Freelance') }}</option>
                                <option value="investment" {% if record.income_type == 'investment' %}selected{% endif %}>{{ t('investment', 'Investment') }}</option>
                                <option value="rental" {% if record.income_type == 'rental' %}selected{% endif %}>{{ t('rental', 'Rental') }}</option>
                                <option value="other" {% if record.income_type == 'other' %}selected{% endif %}>{{ t('other', 'Other') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('source_name', 'Source') }}</label>
                            <input type="text" name="source_name" value="{{ record.source_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                            <input type="number" name="amount" step="0.01" min="0" value="{{ record.amount }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD" {% if record.currency == 'USD' %}selected{% endif %}>USD</option>
                                <option value="EUR" {% if record.currency == 'EUR' %}selected{% endif %}>EUR</option>
                                <option value="GBP" {% if record.currency == 'GBP' %}selected{% endif %}>GBP</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('income_date', 'Date') }}</label>
                            <input type="date" name="income_date" value="{{ record.income_date }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('category', 'Category') }}</label>
                            <select name="category_id" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="0">{{ t('select_category', 'Select') }}</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == record.category_id %}selected{% endif %}>{{ cat.category_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                        <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="received" {% if record.status == 'received' %}selected{% endif %}>{{ t('received', 'Received') }}</option>
                            <option value="pending" {% if record.status == 'pending' %}selected{% endif %}>{{ t('pending', 'Pending') }}</option>
                            <option value="cancelled" {% if record.status == 'cancelled' %}selected{% endif %}>{{ t('cancelled', 'Cancelled') }}</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">{{ record.notes }}</textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/income" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
