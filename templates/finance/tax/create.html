<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="/finance/tax/codes" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <form method="POST">
            <div class="card">
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="code">Tax Code *</label>
                        <input type="text" id="code" name="code" required placeholder="e.g., VAT-STD">
                    </div>
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required placeholder="e.g., Standard VAT 5%">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="tax_type">Tax Type *</label>
                        <select id="tax_type" name="tax_type" required>
                            <option value="VAT">VAT</option>
                            <option value="Sales Tax">Sales Tax</option>
                            <option value="Service Tax">Service Tax</option>
                            <option value="Excise">Excise</option>
                            <option value="Customs">Customs</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rate">Rate % *</label>
                        <input type="number" step="0.01" id="rate" name="rate" required placeholder="5.00">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="account_id">Tax Account *</label>
                        <select id="account_id" name="account_id" required>
                            <option value="">Select Account</option>
                            {% for a in accounts %}
                            <option value="{{ a.id }}">{{ a.account_code }} - {{ a.account_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="is_active">Active</label>
                        <select id="is_active" name="is_active">
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-4 mt-6">
                <a href="/finance/tax/codes" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Tax Code</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
