{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - MMDx</title>
<meta charset="UTF-8">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        input:focus, select:focus { outline: none; border-color: #6366f1; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="/finance/tax/codes" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <form method="POST">
            <div class="card">
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="code">Tax Code</label>
                        <input type="text" id="code" name="code" value="{{ tax_code.code }}" readonly class="bg-gray-800 cursor-not-allowed">
                    </div>
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required value="{{ tax_code.name }}">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="name_ar">Arabic Name</label>
                        <input type="text" id="name_ar" name="name_ar" value="{{ tax_code.name_ar or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="tax_type">Tax Type *</label>
                        <select id="tax_type" name="tax_type" required>
                            <option value="VAT" {% if tax_code.tax_type == 'VAT' %}selected{% endif %}>VAT</option>
                            <option value="Sales Tax" {% if tax_code.tax_type == 'Sales Tax' %}selected{% endif %}>Sales Tax</option>
                            <option value="Service Tax" {% if tax_code.tax_type == 'Service Tax' %}selected{% endif %}>Service Tax</option>
                            <option value="Excise" {% if tax_code.tax_type == 'Excise' %}selected{% endif %}>Excise</option>
                            <option value="Customs" {% if tax_code.tax_type == 'Customs' %}selected{% endif %}>Customs</option>
                            <option value="Output" {% if tax_code.tax_type == 'Output' %}selected{% endif %}>Output</option>
                            <option value="Input" {% if tax_code.tax_type == 'Input' %}selected{% endif %}>Input</option>
                            <option value="ReverseCharge" {% if tax_code.tax_type == 'ReverseCharge' %}selected{% endif %}>Reverse Charge</option>
                            <option value="Other" {% if tax_code.tax_type == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="rate">Rate % *</label>
                        <input type="number" step="0.01" id="rate" name="rate" required value="{{ tax_code.rate }}">
                    </div>
                    <div class="form-group">
                        <label for="is_active">Active</label>
                        <select id="is_active" name="is_active">
                            <option value="1" {% if tax_code.is_active %}selected{% endif %}>Yes</option>
                            <option value="0" {% if not tax_code.is_active %}selected{% endif %}>No</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3">{{ tax_code.description or '' }}</textarea>
                </div>
            </div>
            <div class="flex justify-end gap-4 mt-6">
                <a href="/finance/tax/codes" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Tax Code</button>
            </div>
        </form>
    </div>
{% endblock %}
