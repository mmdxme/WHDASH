{% extends "base.html" %}

{% block title %}{{ t('edit_budget', 'Edit Budget') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/budgets" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_budget', 'Edit Budget') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-3xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('budget_name', 'Budget Name') }}</label>
                            <input type="text" name="budget_name" value="{{ budget.budget_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('budget_type', 'Budget Type') }}</label>
                            <select name="budget_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="monthly" {% if budget.budget_type == 'monthly' %}selected{% endif %}>{{ t('monthly', 'Monthly') }}</option>
                                <option value="weekly" {% if budget.budget_type == 'weekly' %}selected{% endif %}>{{ t('weekly', 'Weekly') }}</option>
                                <option value="yearly" {% if budget.budget_type == 'yearly' %}selected{% endif %}>{{ t('yearly', 'Yearly') }}</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('total_budget', 'Total Budget') }}</label>
                            <input type="number" name="total_budget" step="0.01" value="{{ budget.total_budget }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD" {% if budget.currency == 'USD' %}selected{% endif %}>USD</option>
                                <option value="EUR" {% if budget.currency == 'EUR' %}selected{% endif %}>EUR</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('period_start', 'Start Date') }}</label>
                            <input type="date" name="period_start_date" value="{{ budget.period_start_date }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('period_end', 'End Date') }}</label>
                            <input type="date" name="period_end_date" value="{{ budget.period_end_date }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                        <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="active" {% if budget.status == 'active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                            <option value="completed" {% if budget.status == 'completed' %}selected{% endif %}>{{ t('completed', 'Completed') }}</option>
                            <option value="cancelled" {% if budget.status == 'cancelled' %}selected{% endif %}>{{ t('cancelled', 'Cancelled') }}</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/budgets" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
