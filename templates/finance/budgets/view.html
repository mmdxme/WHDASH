{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - MMDx</title>
<meta charset="UTF-8">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="/finance/budgets" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="card"><div class="text-gray-400 text-sm">Budget Name</div><div class="text-xl font-bold">{{ budget.budget_name }}</div></div>
            <div class="card"><div class="text-gray-400 text-sm">Fiscal Year</div><div class="text-xl font-bold">{{ budget.fiscal_year_name }}</div></div>
            <div class="card"><div class="text-gray-400 text-sm">Status</div><div class="text-xl font-bold">{{ budget.status }}</div></div>
        </div>
    </div>
{% endblock %}
