{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/budgets" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('create_budget', 'Create Budget') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-3xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('budget_name', 'Budget Name') }}</label>
                            <input type="text" name="budget_name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="{{ t('enter_name', 'e.g., Monthly Household') }}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('budget_type', 'Budget Type') }}</label>
                            <select name="budget_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="monthly">{{ t('monthly', 'Monthly') }}</option>
                                <option value="weekly">{{ t('weekly', 'Weekly') }}</option>
                                <option value="yearly">{{ t('yearly', 'Yearly') }}</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('total_budget', 'Total Budget Amount') }}</label>
                            <input type="number" name="total_budget" step="0.01" min="0" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="0.00">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                                <option value="AED">AED</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('period_start', 'Period Start Date') }}</label>
                            <input type="date" name="period_start_date" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('period_end', 'Period End Date') }}</label>
                            <input type="date" name="period_end_date" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('warning_threshold', 'Warning Threshold (%)') }}</label>
                        <input type="number" name="warning_threshold" value="80" min="0" max="100" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('category_allocations', 'Category Allocations') }}</label>
                        <div class="space-y-3" id="category-allocations">
                            {% for cat in categories %}
                            <div class="flex items-center space-x-4">
                                <div class="flex-1">
                                    <span class="text-white">{{ cat.category_name }}</span>
                                    <input type="hidden" name="category_ids" value="{{ cat.id }}">
                                </div>
                                <input type="number" name="category_allocations" step="0.01" min="0" placeholder="0.00" class="w-32 px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white"></textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/budgets" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('create_budget', 'Create Budget') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
