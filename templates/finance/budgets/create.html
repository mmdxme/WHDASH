<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="/finance/budgets" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <form method="POST">
            <div class="card mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="budget_name">Budget Name *</label>
                        <input type="text" id="budget_name" name="budget_name" required placeholder="e.g., 2026 Operating Budget">
                    </div>
                    <div class="form-group">
                        <label for="fiscal_year_id">Fiscal Year *</label>
                        <select id="fiscal_year_id" name="fiscal_year_id" required>
                            <option value="">Select Year</option>
                            {% for y in fiscal_years %}
                            <option value="{{ y.id }}">{{ y.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cost_center_id">Cost Center</label>
                        <select id="cost_center_id" name="cost_center_id">
                            <option value="">Company-wide</option>
                            {% for cc in cost_centers %}
                            <option value="{{ cc.id }}">{{ cc.code }} - {{ cc.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-4">
                <a href="/finance/budgets" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Budget</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
