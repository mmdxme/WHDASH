<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
    </style>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('treasury.transfers_list') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card p-6" style="max-width: 800px;">
            <form method="post">
                <div class="form-group">
                    <label>Transfer Type</label>
                    <select name="request_type" required>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="internal_transfer">Internal Transfer</option>
                        <option value="inter_branch">Inter-Branch Transfer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Transfer Date</label>
                    <input type="date" name="transfer_date" value="{{ today }}" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>From Account Type</label>
                        <select name="from_account_type" id="from_account_type" required onchange="toggleFromAccounts()">
                            <option value="bank">Bank Account</option>
                            <option value="petty_cash">Petty Cash</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>To Account Type</label>
                        <select name="to_account_type" id="to_account_type" required onchange="toggleToAccounts()">
                            <option value="bank">Bank Account</option>
                            <option value="petty_cash">Petty Cash</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Source Account</label>
                        <select name="from_bank_account_id" id="from_bank_account_id">
                            {% for account in bank_accounts %}
                            <option value="{{ account.id }}">{{ account.bank_name }} - {{ account.account_name }}</option>
                            {% endfor %}
                        </select>
                        <select name="from_petty_cash_id" id="from_petty_cash_id" style="display:none;">
                            {% for pc in petty_cash %}
                            <option value="{{ pc.id }}">{{ pc.account_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Destination Account</label>
                        <select name="to_bank_account_id" id="to_bank_account_id">
                            {% for account in bank_accounts %}
                            <option value="{{ account.id }}">{{ account.bank_name }} - {{ account.account_name }}</option>
                            {% endfor %}
                        </select>
                        <select name="to_petty_cash_id" id="to_petty_cash_id" style="display:none;">
                            {% for pc in petty_cash %}
                            <option value="{{ pc.id }}">{{ pc.account_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" name="amount" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select name="currency">
                            <option value="AED">AED</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Reference</label>
                    <input type="text" name="reference" placeholder="Transfer reference number">
                </div>

                <div class="form-group">
                    <label>Reason</label>
                    <textarea name="reason" rows="3" placeholder="Reason for transfer"></textarea>
                </div>

                <div class="form-group">
                    <label>Urgency</label>
                    <select name="urgency">
                        <option value="normal">Normal</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Submit Request
                    </button>
                    <a href="{{ url_for('treasury.transfers_list') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleFromAccounts() {
            const type = document.getElementById('from_account_type').value;
            document.getElementById('from_bank_account_id').style.display = type === 'bank' ? 'block' : 'none';
            document.getElementById('from_petty_cash_id').style.display = type === 'petty_cash' ? 'block' : 'none';
        }

        function toggleToAccounts() {
            const type = document.getElementById('to_account_type').value;
            document.getElementById('to_bank_account_id').style.display = type === 'bank' ? 'block' : 'none';
            document.getElementById('to_petty_cash_id').style.display = type === 'petty_cash' ? 'block' : 'none';
        }
    </script>
    {% endblock %}
</body>
</html>
