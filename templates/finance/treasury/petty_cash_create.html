{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - WHDASH</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('treasury.petty_cash_list') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card p-6" style="max-width: 800px;">
            <form method="post">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Account Code</label>
                        <input type="text" name="account_code" placeholder="e.g., PC-001" required>
                    </div>
                    <div class="form-group">
                        <label>Account Name</label>
                        <input type="text" name="account_name" placeholder="e.g., Main Office Petty Cash" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Account Name (Arabic)</label>
                    <input type="text" name="account_name_ar" placeholder="Arabic name">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" name="location" placeholder="e.g., Main Office">
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select name="currency">
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="form-group">
                        <label>Float Amount</label>
                        <input type="number" name="float_amount" step="0.01" min="0" value="1000" required>
                    </div>
                    <div class="form-group">
                        <label>Minimum Balance</label>
                        <input type="number" name="minimum_balance" step="0.01" min="0" value="100">
                    </div>
                    <div class="form-group">
                        <label>Max Transaction</label>
                        <input type="number" name="maximum_transaction" step="0.01" min="0" value="500">
                    </div>
                </div>

                <div class="form-group">
                    <label>GL Account (Optional)</label>
                    <select name="gl_account_id">
                        <option value="">-- Select GL Account --</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}">{{ account.account_code }} - {{ account.account_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea name="notes" rows="3" class="w-full"></textarea>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="btn btn-primary" style="background: #6366f1; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white;">
                        <i class="fas fa-save"></i> Create Account
                    </button>
                    <a href="{{ url_for('treasury.petty_cash_list') }}" class="btn btn-outline" style="padding: 0.75rem 1.5rem; border-radius: 0.5rem;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
