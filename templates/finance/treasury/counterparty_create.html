{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - WHDASH</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass-card { background: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Add banking counterparty</p>
            </div>
            <a href="{{ url_for('treasury.counterparties') }}" class="text-gray-400 hover:text-white">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-card p-6 max-w-2xl">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Counterparty Name *</label>
                        <input type="text" name="counterparty_name" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Type</label>
                        <select name="counterparty_type" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="bank">Bank</option>
                            <option value="supplier">Supplier</option>
                            <option value="customer">Customer</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Bank Name</label>
                        <input type="text" name="bank_name" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Bank Branch</label>
                        <input type="text" name="bank_branch" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Account Number</label>
                        <input type="text" name="account_number" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">IBAN</label>
                        <input type="text" name="iban" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">SWIFT Code</label>
                        <input type="text" name="swift_code" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Routing Number</label>
                        <input type="text" name="routing_number" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Contact Name</label>
                        <input type="text" name="contact_name" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Contact Email</label>
                        <input type="email" name="contact_email" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Contact Phone</label>
                        <input type="text" name="contact_phone" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Risk Rating</label>
                        <select name="risk_rating" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="">N/A</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded font-semibold w-full">
                        <i class="fas fa-save mr-2"></i>Create Counterparty
                    </button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
