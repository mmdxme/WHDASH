{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - WHDASH</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('treasury.cash_flow_forecast') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card p-6" style="max-width: 800px;">
            <form method="post">
                <div class="form-group">
                    <label>Forecast Name</label>
                    <input type="text" name="forecast_name" placeholder="e.g., Q2 2026 Base Forecast" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Forecast Type</label>
                        <select name="forecast_type">
                            <option value="rolling">Rolling</option>
                            <option value="static">Static</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Scenario</label>
                        <select name="scenario">
                            <option value="base">Base</option>
                            <option value="optimistic">Optimistic</option>
                            <option value="conservative">Conservative</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" name="start_date" required>
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" name="end_date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Currency</label>
                    <select name="currency">
                        <option value="AED">AED</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="background: #6366f1; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white;">
                    <i class="fas fa-save"></i> Create Forecast
                </button>
            </form>
        </div>
    </div>
{% endblock %}
