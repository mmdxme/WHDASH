{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - WHDASH</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('treasury.petty_cash_view', account_id=account.id) }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card p-6" style="max-width: 800px;">
            <form method="post">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Account Code</label>
                        <input type="text" value="{{ account.account_code }}" disabled class="bg-gray-800">
                    </div>
                    <div class="form-group">
                        <label>Account Name</label>
                        <input type="text" name="account_name" value="{{ account.account_name }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Account Name (Arabic)</label>
                    <input type="text" name="account_name_ar" value="{{ account.account_name_ar or '' }}">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" name="location" value="{{ account.location or '' }}">
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select name="currency">
                            <option value="AED" {% if account.currency == 'AED' %}selected{% endif %}>AED</option>
                            <option value="USD" {% if account.currency == 'USD' %}selected{% endif %}>USD</option>
                            <option value="EUR" {% if account.currency == 'EUR' %}selected{% endif %}>EUR</option>
                            <option value="GBP" {% if account.currency == 'GBP' %}selected{% endif %}>GBP</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="form-group">
                        <label>Float Amount</label>
                        <input type="number" name="float_amount" step="0.01" value="{{ account.float_amount or 0 }}">
                    </div>
                    <div class="form-group">
                        <label>Minimum Balance</label>
                        <input type="number" name="minimum_balance" step="0.01" value="{{ account.minimum_balance or 0 }}">
                    </div>
                    <div class="form-group">
                        <label>Max Transaction</label>
                        <input type="number" name="maximum_transaction" step="0.01" value="{{ account.maximum_transaction or 0 }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <input type="checkbox" name="is_active" value="1" {% if account.is_active %}checked{% endif %}> Active
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea name="notes" rows="3">{{ account.notes or '' }}</textarea>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="btn btn-primary" style="background: #6366f1; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white;">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
