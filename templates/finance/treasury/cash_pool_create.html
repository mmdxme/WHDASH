<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass-card { background: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; }
    </style>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Create cash pool for concentration</p>
            </div>
            <a href="{{ url_for('treasury.cash_pools') }}" class="text-gray-400 hover:text-white">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-card p-6 max-w-2xl">
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-400 text-sm mb-2">Pool Name *</label>
                    <input type="text" name="pool_name" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Pool Type</label>
                        <select name="pool_type" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="physical">Physical Pooling</option>
                            <option value="notional">Notional Pooling</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Pooling Method</label>
                        <select name="pooling_method" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="zero_balance">Zero Balancing</option>
                            <option value="target_balance">Target Balance</option>
                            <option value="sweeping">Automatic Sweeping</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Master Account</label>
                        <select name="master_account_id" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="">Select Master Account</option>
                            {% for account in bank_accounts %}
                            <option value="{{ account.id }}">{{ account.bank_name }} - {{ account.account_number }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Currency</label>
                        <select name="currency" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="AED">AED</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 text-sm mb-2">Member Accounts</label>
                    <select name="member_accounts" multiple class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2 h-32">
                        {% for account in bank_accounts %}
                        <option value="{{ account.id }}">{{ account.bank_name }} - {{ account.account_number }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Hold Ctrl/Cmd to select multiple accounts</p>
                </div>

                <div>
                    <label class="block text-gray-400 text-sm mb-2">Notes</label>
                    <textarea name="notes" rows="3" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" class="bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded font-semibold w-full">
                        <i class="fas fa-save mr-2"></i>Create Cash Pool
                    </button>
                </div>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
