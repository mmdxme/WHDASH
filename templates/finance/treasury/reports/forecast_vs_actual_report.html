<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass-card { background: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; }
        .amount { font-family: 'Courier New', monospace; font-weight: 600; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <p class="text-gray-400">Generated: {{ generated_date }}</p>
        </div>

        <div class="glass-card p-12 text-center">
            <i class="fas fa-chart-bar text-gray-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-semibold text-white mb-2">Forecast vs Actual Report</h3>
            <p class="text-gray-400">This report compares projected cash flows against actual results.</p>
        </div>
    </div>
    {% endblock %}
</body>
</html>
