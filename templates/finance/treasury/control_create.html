<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('treasury.controls') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card p-6" style="max-width: 800px;">
            <form method="post">
                <div class="form-group">
                    <label>Control Name</label>
                    <input type="text" name="control_name" placeholder="e.g., High Value Transfer Limit" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Control Type</label>
                        <select name="control_type">
                            <option value="transfer_limit">Transfer Limit</option>
                            <option value="transaction_limit">Transaction Limit</option>
                            <option value="balance_threshold">Balance Threshold</option>
                            <option value="approval_required">Approval Required</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select name="control_category">
                            <option value="approval">Approval</option>
                            <option value="petty_cash">Petty Cash</option>
                            <option value="liquidity">Liquidity</option>
                            <option value="reconciliation">Reconciliation</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Threshold Value</label>
                        <input type="number" name="threshold_value" step="0.01" placeholder="e.g., 500000">
                    </div>
                    <div class="form-group">
                        <label>Operator</label>
                        <select name="threshold_operator">
                            <option value="greater_than">Greater Than</option>
                            <option value="less_than">Less Than</option>
                            <option value="greater_equal">Greater or Equal</option>
                            <option value="less_equal">Less or Equal</option>
                            <option value="equal">Equal</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Affected Operations</label>
                    <input type="text" name="affected_operations" placeholder="e.g., bank_transfer, petty_cash_withdrawal">
                </div>

                <div class="form-group">
                    <label>Severity</label>
                    <select name="severity">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="background: #6366f1; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white;">
                    <i class="fas fa-save"></i> Create Control
                </button>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
