<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
    </style>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('treasury.cash_boxes_list') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card p-6" style="max-width: 800px;">
            <form method="post">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Box Code</label>
                        <input type="text" name="box_code" placeholder="e.g., CB-001" required>
                    </div>
                    <div class="form-group">
                        <label>Box Name</label>
                        <input type="text" name="box_name" placeholder="e.g., Main Reception Cash Box" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Box Type</label>
                        <select name="box_type">
                            <option value="cash_box">Cash Box</option>
                            <option value="safe">Safe</option>
                            <option value="vault">Vault</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select name="currency">
                            <option value="AED">AED</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="location" placeholder="e.g., Main Reception Desk">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label>Responsible Person</label>
                        <input type="text" name="responsible_person_name" placeholder="Person in charge">
                    </div>
                    <div class="form-group">
                        <label>Opening Balance</label>
                        <input type="number" name="opening_balance" step="0.01" min="0" value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea name="notes" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="background: #6366f1; padding: 0.75rem 1.5rem; border-radius: 0.5rem; color: white;">
                    <i class="fas fa-save"></i> Create Cash Box
                </button>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
