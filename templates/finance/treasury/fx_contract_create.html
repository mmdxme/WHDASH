{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - WHDASH</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass-card { background: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; }
    </style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Create new FX contract</p>
            </div>
            <a href="{{ url_for('treasury.fx_contracts') }}" class="text-gray-400 hover:text-white">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <form method="POST" class="glass-card p-6 max-w-2xl">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Contract Type</label>
                        <select name="contract_type" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="spot">Spot</option>
                            <option value="forward">Forward</option>
                            <option value="swap">Swap</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Buy/Sell *</label>
                        <select name="buy_sell" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="buy">Buy</option>
                            <option value="sell">Sell</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Base Currency *</label>
                        <select name="base_currency" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AED">AED</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Quote Currency *</label>
                        <select name="quote_currency" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AED">AED</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Base Amount *</label>
                        <input type="number" step="0.01" name="base_amount" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Exchange Rate *</label>
                        <input type="number" step="0.0001" name="exchange_rate" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2" placeholder="0.0000">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Contract Date *</label>
                        <input type="date" name="contract_date" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Value Date *</label>
                        <input type="date" name="value_date" required class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Spot Rate</label>
                        <input type="number" step="0.0001" name="spot_rate" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-2">Forward Points</label>
                        <input type="number" step="0.0001" name="forward_points" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2" value="0">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 text-sm mb-2">Counterparty</label>
                    <input type="text" name="counterparty" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2">
                </div>

                <div>
                    <label class="block text-gray-400 text-sm mb-2">Notes</label>
                    <textarea name="notes" rows="3" class="w-full bg-gray-800 border border-gray-600 text-white rounded px-3 py-2"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" class="bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded font-semibold w-full">
                        <i class="fas fa-save mr-2"></i>Create FX Contract
                    </button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
