{% extends "base.html" %}

{% block title %}{{ t('edit_expense', 'Edit Expense') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/expenses" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_expense', 'Edit Expense') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('merchant', 'Merchant / Vendor') }}</label>
                            <input type="text" name="merchant_name" value="{{ record.merchant_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                            <input type="number" name="amount" step="0.01" min="0" value="{{ record.amount }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD" {% if record.currency == 'USD' %}selected{% endif %}>USD</option>
                                <option value="EUR" {% if record.currency == 'EUR' %}selected{% endif %}>EUR</option>
                                <option value="GBP" {% if record.currency == 'GBP' %}selected{% endif %}>GBP</option>
                                <option value="AED" {% if record.currency == 'AED' %}selected{% endif %}>AED</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('expense_date', 'Date') }}</label>
                            <input type="date" name="expense_date" value="{{ record.expense_date }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('category', 'Category') }}</label>
                            <select name="category_id" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="0">{{ t('select_category', 'Select Category') }}</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == record.category_id %}selected{% endif %}>{{ cat.category_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('account', 'Account') }}</label>
                            <select name="account_id" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="0">{{ t('select_account', 'Select Account') }}</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.id }}" {% if acc.id == record.account_id %}selected{% endif %}>{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('payment_method', 'Payment Method') }}</label>
                            <select name="payment_method" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="cash" {% if record.payment_method == 'cash' %}selected{% endif %}>{{ t('cash', 'Cash') }}</option>
                                <option value="card" {% if record.payment_method == 'card' %}selected{% endif %}>{{ t('card', 'Card') }}</option>
                                <option value="bank_transfer" {% if record.payment_method == 'bank_transfer' %}selected{% endif %}>{{ t('bank_transfer', 'Bank Transfer') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                            <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="approved" {% if record.status == 'approved' %}selected{% endif %}>{{ t('approved', 'Approved') }}</option>
                                <option value="pending" {% if record.status == 'pending' %}selected{% endif %}>{{ t('pending', 'Pending') }}</option>
                                <option value="rejected" {% if record.status == 'rejected' %}selected{% endif %}>{{ t('rejected', 'Rejected') }}</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">{{ record.notes }}</textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/expenses" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
