{% extends "base.html" %}

{% block title %}{{ t('add_expense', 'Add Expense') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/expenses" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('add_expense', 'Add Expense') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('merchant', 'Merchant / Vendor') }}</label>
                            <input type="text" name="merchant_name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="{{ t('enter_merchant', 'Enter merchant name') }}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                            <input type="number" name="amount" step="0.01" min="0" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="0.00">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                                <option value="AED">AED</option>
                                <option value="SAR">SAR</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('expense_date', 'Date') }}</label>
                            <input type="date" name="expense_date" required value="{{ today }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('category', 'Category') }}</label>
                            <select name="category_id" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="0">{{ t('select_category', 'Select Category') }}</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.category_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('account', 'Account') }}</label>
                            <select name="account_id" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="0">{{ t('select_account', 'Select Account') }}</option>
                                {% for acc in accounts %}
                                <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('payment_method', 'Payment Method') }}</label>
                            <select name="payment_method" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="cash">{{ t('cash', 'Cash') }}</option>
                                <option value="card">{{ t('card', 'Card') }}</option>
                                <option value="bank_transfer">{{ t('bank_transfer', 'Bank Transfer') }}</option>
                                <option value="digital">{{ t('digital', 'Digital Wallet') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                            <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="approved">{{ t('approved', 'Approved') }}</option>
                                <option value="pending">{{ t('pending', 'Pending') }}</option>
                                <option value="rejected">{{ t('rejected', 'Rejected') }}</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="{{ t('add_notes', 'Add any notes...') }}"></textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/expenses" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save', 'Save') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
