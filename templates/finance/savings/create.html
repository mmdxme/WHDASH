{% extends "base.html" %}

{% block title %}{{ t('add_savings_bucket', 'Add Savings Bucket') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/savings" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('add_savings_bucket', 'Add Savings Bucket') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('bucket_name', 'Bucket Name') }}</label>
                        <input type="text" name="bucket_name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('savings_type', 'Savings Type') }}</label>
                        <select name="savings_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="general">{{ t('general', 'General') }}</option>
                            <option value="emergency">{{ t('emergency_fund', 'Emergency Fund') }}</option>
                            <option value="goal">{{ t('goal_based', 'Goal-Based') }}</option>
                            <option value="automated">{{ t('automated', 'Automated') }}</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('current_amount', 'Current Amount') }}</label>
                            <input type="number" name="current_amount" step="0.01" value="0" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('target_amount', 'Target Amount') }}</label>
                            <input type="number" name="target_amount" step="0.01" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('priority', 'Priority') }}</label>
                            <select name="priority" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="1">{{ t('high', 'High') }}</option>
                                <option value="2">{{ t('medium', 'Medium') }}</option>
                                <option value="3">{{ t('low', 'Low') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/savings" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg"><i class="fa fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
