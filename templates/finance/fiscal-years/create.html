<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="/finance/fiscal-years" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <form method="POST">
            <div class="card">
                <div class="form-group">
                    <label for="name">Fiscal Year Name *</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., FY 2026">
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="start_date">Start Date *</label>
                        <input type="date" id="start_date" name="start_date" required>
                    </div>
                    <div class="form-group">
                        <label for="end_date">End Date *</label>
                        <input type="date" id="end_date" name="end_date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                        <option value="Locked">Locked</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-4 mt-6">
                <a href="/finance/fiscal-years" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Fiscal Year</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
