<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.875rem; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <a href="{{ url_for('finance.reconciliation_center') }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        
        <div class="card">
            <form method="POST">
                <div class="form-group">
                    <label for="reconciliation_type">Reconciliation Type</label>
                    <select id="reconciliation_type" name="reconciliation_type" required>
                        <option value="">Select type...</option>
                        <option value="Bank">Bank</option>
                        <option value="GL">General Ledger</option>
                        <option value="AR">Accounts Receivable</option>
                        <option value="AP">Accounts Payable</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="reference_date">Reference Date</label>
                    <input type="date" id="reference_date" name="reference_date" required value="{{ today }}">
                </div>
                
                <div class="form-group">
                    <label for="bank_account_id">Bank Account (for Bank reconciliation only)</label>
                    <select id="bank_account_id" name="bank_account_id">
                        <option value="">-- None --</option>
                        {% for bank in bank_accounts %}
                        <option value="{{ bank.id }}">{{ bank.bank_name }} - {{ bank.account_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="flex justify-end gap-3 mt-6">
                    <a href="{{ url_for('finance.reconciliation_center') }}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Reconciliation</button>
                </div>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
