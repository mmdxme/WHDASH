{% extends "base.html" %}

{% block title %}{{ t('edit_account', 'Edit Account') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/accounts" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_account', 'Edit Account') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('account_name', 'Account Name') }}</label>
                        <input type="text" name="account_name" value="{{ account.account_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('account_type', 'Account Type') }}</label>
                        <select name="account_type" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="cash" {% if account.account_type == 'cash' %}selected{% endif %}>{{ t('cash_wallet', 'Cash Wallet') }}</option>
                            <option value="bank" {% if account.account_type == 'bank' %}selected{% endif %}>{{ t('bank_account', 'Bank Account') }}</option>
                            <option value="card" {% if account.account_type == 'card' %}selected{% endif %}>{{ t('credit_debit_card', 'Credit/Debit Card') }}</option>
                            <option value="digital" {% if account.account_type == 'digital' %}selected{% endif %}>{{ t('digital_wallet', 'Digital Wallet') }}</option>
                            <option value="savings" {% if account.account_type == 'savings' %}selected{% endif %}>{{ t('savings_account', 'Savings Account') }}</option>
                            <option value="investment" {% if account.account_type == 'investment' %}selected{% endif %}>{{ t('investment_account', 'Investment Account') }}</option>
                            <option value="foreign" {% if account.account_type == 'foreign' %}selected{% endif %}>{{ t('foreign_currency', 'Foreign Currency Account') }}</option>
                            <option value="joint" {% if account.account_type == 'joint' %}selected{% endif %}>{{ t('joint_account', 'Joint Account') }}</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                        <select name="currency" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="USD" {% if account.currency == 'USD' %}selected{% endif %}>USD - US Dollar</option>
                            <option value="EUR" {% if account.currency == 'EUR' %}selected{% endif %}>EUR - Euro</option>
                            <option value="GBP" {% if account.currency == 'GBP' %}selected{% endif %}>GBP - British Pound</option>
                            <option value="AED" {% if account.currency == 'AED' %}selected{% endif %}>AED - UAE Dirham</option>
                            <option value="SAR" {% if account.currency == 'SAR' %}selected{% endif %}>SAR - Saudi Riyal</option>
                            <option value="INR" {% if account.currency == 'INR' %}selected{% endif %}>INR - Indian Rupee</option>
                            <option value="CNY" {% if account.currency == 'CNY' %}selected{% endif %}>CNY - Chinese Yuan</option>
                            <option value="JPY" {% if account.currency == 'JPY' %}selected{% endif %}>JPY - Japanese Yen</option>
                            <option value="RUB" {% if account.currency == 'RUB' %}selected{% endif %}>RUB - Russian Ruble</option>
                            <option value="BRL" {% if account.currency == 'BRL' %}selected{% endif %}>BRL - Brazilian Real</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('bank_provider', 'Bank / Provider') }}</label>
                        <input type="text" name="bank_provider" value="{{ account.bank_provider }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('branch_reference', 'Branch / Reference') }}</label>
                        <input type="text" name="branch_reference" value="{{ account.branch_reference }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">{{ account.notes }}</textarea>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" name="is_active" id="is_active" value="1" {% if account.is_active %}checked{% endif %} class="w-4 h-4 rounded bg-slate-700 border-slate-600 text-emerald-500 focus:ring-emerald-500">
                        <label for="is_active" class="ml-2 text-sm text-slate-300">{{ t('active', 'Active') }}</label>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/accounts" class="px-6 py-2 text-slate-400 hover:text-white transition-colors">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
