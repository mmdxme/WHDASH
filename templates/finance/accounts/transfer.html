{% extends "base.html" %}

{% block title %}{{ t('transfer_between_accounts', 'Transfer Between Accounts') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/accounts" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold text-white">{{ t('transfer_between_accounts', 'Transfer Between Accounts') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <!-- From Account -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('from_account', 'From Account') }}</label>
                        <select name="from_account_id" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">{{ t('select_account', 'Select account') }}</option>
                            {% for account in accounts %}
                            <option value="{{ account.id }}">{{ account.account_name }} ({{ account.currency }} {{ "{:,.2f}".format(account.current_balance) }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- To Account -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('to_account', 'To Account') }}</label>
                        <select name="to_account_id" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">{{ t('select_account', 'Select account') }}</option>
                            {% for account in accounts %}
                            <option value="{{ account.id }}">{{ account.account_name }} ({{ account.currency }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Amount -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                        <input type="number" name="amount" step="0.01" min="0.01" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.00">
                    </div>

                    <!-- Currency -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                        <select name="currency" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="SAR">SAR - Saudi Riyal</option>
                            <option value="INR">INR - Indian Rupee</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/accounts" class="px-6 py-2 text-slate-400 hover:text-white transition-colors">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors">
                        <i class="fa fa-exchange-alt mr-2"></i>{{ t('transfer', 'Transfer') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
