{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/accounts" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold text-white">{{ t('create_account', 'Create Account') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <!-- Account Name -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('account_name', 'Account Name') }}</label>
                        <input type="text" name="account_name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="{{ t('enter_account_name', 'Enter account name') }}">
                    </div>

                    <!-- Account Type -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('account_type', 'Account Type') }}</label>
                        <select name="account_type" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="cash">{{ t('cash_wallet', 'Cash Wallet') }}</option>
                            <option value="bank">{{ t('bank_account', 'Bank Account') }}</option>
                            <option value="card">{{ t('credit_debit_card', 'Credit/Debit Card') }}</option>
                            <option value="digital">{{ t('digital_wallet', 'Digital Wallet') }}</option>
                            <option value="savings">{{ t('savings_account', 'Savings Account') }}</option>
                            <option value="investment">{{ t('investment_account', 'Investment Account') }}</option>
                            <option value="foreign">{{ t('foreign_currency', 'Foreign Currency Account') }}</option>
                            <option value="joint">{{ t('joint_account', 'Joint Account') }}</option>
                        </select>
                    </div>

                    <!-- Currency -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                        <select name="currency" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="SAR">SAR - Saudi Riyal</option>
                            <option value="INR">INR - Indian Rupee</option>
                            <option value="CNY">CNY - Chinese Yuan</option>
                            <option value="JPY">JPY - Japanese Yen</option>
                            <option value="RUB">RUB - Russian Ruble</option>
                            <option value="BRL">BRL - Brazilian Real</option>
                        </select>
                    </div>

                    <!-- Opening Balance -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('opening_balance', 'Opening Balance') }}</label>
                        <input type="number" name="opening_balance" step="0.01" value="0" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <!-- Bank Provider -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('bank_provider', 'Bank / Provider') }} ({{ t('optional', 'Optional') }})</label>
                        <input type="text" name="bank_provider" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="{{ t('enter_bank_name', 'Enter bank name') }}">
                    </div>

                    <!-- Branch Reference -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('branch_reference', 'Branch / Reference') }} ({{ t('optional', 'Optional') }})</label>
                        <input type="text" name="branch_reference" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="{{ t('enter_branch', 'Enter branch or reference') }}">
                    </div>

                    <!-- Notes -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }} ({{ t('optional', 'Optional') }})</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="{{ t('add_notes', 'Add any notes...') }}"></textarea>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/accounts" class="px-6 py-2 text-slate-400 hover:text-white transition-colors">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors">
                        <i class="fa fa-save mr-2"></i>{{ t('create_account', 'Create Account') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
