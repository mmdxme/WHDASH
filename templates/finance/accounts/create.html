<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; ring: 2px #6366f1; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .form-group { margin-bottom: 1.5rem; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
        .checkbox-group input { width: auto; }
    </style>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Create a new account in the chart of accounts</p>
            </div>
            <a href="/finance/accounts" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        {% if flash_message %}
        <div class="bg-red-500/20 border border-red-500/50 rounded-lg p-4 mb-6 text-red-400">
            {{ flash_message }}
        </div>
        {% endif %}

        <form method="POST" class="card">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="form-group">
                    <label for="code">Account Code *</label>
                    <input type="text" id="code" name="code" required placeholder="e.g., 1100">
                </div>

                <div class="form-group">
                    <label for="account_type">Account Type *</label>
                    <select id="account_type" name="account_type" required>
                        <option value="">Select Type</option>
                        <option value="ASSET">Asset</option>
                        <option value="LIABILITY">Liability</option>
                        <option value="EQUITY">Equity</option>
                        <option value="REVENUE">Revenue</option>
                        <option value="COGS">Cost of Goods Sold</option>
                        <option value="EXPENSE">Expense</option>
                        <option value="OTHER_INCOME">Other Income</option>
                        <option value="OTHER_EXPENSE">Other Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Account Name (English) *</label>
                    <input type="text" id="name" name="name" required placeholder="e.g., Cash">
                </div>

                <div class="form-group">
                    <label for="name_ar">Account Name (Arabic)</label>
                    <input type="text" id="name_ar" name="name_ar" placeholder="اسم الحساب">
                </div>

                <div class="form-group md:col-span-2">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="2" placeholder="Optional description..."></textarea>
                </div>

                <div class="form-group">
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id">
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.code }} - {{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="parent_id">Parent Account</label>
                    <select id="parent_id" name="parent_id">
                        <option value="">None (Top Level)</option>
                        {% for acc in accounts %}
                        <option value="{{ acc.id }}">{{ acc.code }} - {{ acc.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="opening_balance">Opening Balance</label>
                    <input type="number" step="0.01" id="opening_balance" name="opening_balance" value="0" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="opening_balance_date">Opening Balance Date</label>
                    <input type="date" id="opening_balance_date" name="opening_balance_date">
                </div>
            </div>

            <div class="form-group mt-6">
                <label class="text-lg font-semibold text-white mb-4">Account Settings</label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_active" name="is_active" value="1" checked>
                        <label for="is_active" class="mb-0">Active</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_posting_allowed" name="is_posting_allowed" value="1" checked>
                        <label for="is_posting_allowed" class="mb-0">Allow Posting</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_control_account" name="is_control_account" value="1">
                        <label for="is_control_account" class="mb-0">Control Account</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_cost_center_allowed" name="is_cost_center_allowed" value="1">
                        <label for="is_cost_center_allowed" class="mb-0">Cost Center Allowed</label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-gray-700">
                <a href="/finance/accounts" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Account
                </button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
