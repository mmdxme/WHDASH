<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Record supplier payment</p>
            </div>
            <a href="/finance/ap/payments" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <form method="POST">
            <div class="card mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="supplier_id">Supplier *</label>
                        <select id="supplier_id" name="supplier_id" required><option value="">Select Supplier</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>{% endfor %}</select>
                    </div>
                    <div class="form-group">
                        <label for="payment_date">Payment Date *</label>
                        <input type="date" id="payment_date" name="payment_date" required value="">
                    </div>
                    <div class="form-group">
                        <label for="amount_paid">Amount Paid *</label>
                        <input type="number" step="0.01" id="amount_paid" name="amount_paid" required value="0">
                    </div>
                    <div class="form-group">
                        <label for="payment_method">Payment Method</label>
                        <select id="payment_method" name="payment_method"><option value="Bank Transfer">Bank Transfer</option><option value="Cash">Cash</option><option value="Check">Check</option></select>
                    </div>
                    <div class="form-group">
                        <label for="reference_number">Reference / Check #</label>
                        <input type="text" id="reference_number" name="reference_number">
                    </div>
                    <div class="form-group md:col-span-2">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-4">
                <a href="/finance/ap/payments" class="btn btn-outline">Cancel</a>
                <button type="submit" name="auto_post" value="1" class="btn btn-primary"><i class="fas fa-check"></i> Create and Post</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
