<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        input:focus, select:focus { outline: none; border-color: #6366f1; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Create a new supplier bill</p>
            </div>
            <a href="/finance/ap/bills" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>

        <form method="POST">
            <div class="card mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="form-group">
                        <label for="supplier_id">Supplier *</label>
                        <select id="supplier_id" name="supplier_id" required>
                            <option value="">Select Supplier</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bill_date">Bill Date *</label>
                        <input type="date" id="bill_date" name="bill_date" required value="">
                    </div>
                    <div class="form-group">
                        <label for="due_date">Due Date *</label>
                        <input type="date" id="due_date" name="due_date" required value="">
                    </div>
                    <div class="form-group">
                        <label for="currency">Currency</label>
                        <select id="currency" name="currency">
                            <option value="AED">AED</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tax_code_id">Tax Code</label>
                        <select id="tax_code_id" name="tax_code_id">
                            <option value="">No Tax</option>
                            {% for tc in tax_codes %}
                            <option value="{{ tc.id }}">{{ tc.code }} - {{ tc.name }} ({{ tc.rate }}%)</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="payment_terms">Payment Terms</label>
                        <select id="payment_terms" name="payment_terms">
                            <option value="Due on Receipt">Due on Receipt</option>
                            <option value="Net 15">Net 15</option>
                            <option value="Net 30" selected>Net 30</option>
                            <option value="Net 60">Net 60</option>
                        </select>
                    </div>
                    <div class="form-group md:col-span-3">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-4">
                <a href="/finance/ap/bills" class="btn btn-outline">Cancel</a>
                <button type="submit" name="auto_post" value="1" class="btn btn-primary"><i class="fas fa-check"></i> Create & Post</button>
                <button type="submit" class="btn btn-outline"><i class="fas fa-save"></i> Create Draft</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
