{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/automation" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('create_rule', 'Create Automation Rule') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('rule_name', 'Rule Name') }}</label>
                        <input type="text" name="rule_name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('rule_type', 'Rule Type') }}</label>
                        <select name="rule_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="auto_categorize">{{ t('auto_categorize', 'Auto-Categorize') }}</option>
                            <option value="alert">{{ t('alert', 'Alert') }}</option>
                            <option value="recurring">{{ t('recurring', 'Recurring Transaction') }}</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('condition_field', 'Field') }}</label>
                            <input type="text" name="condition_field" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="merchant_name">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('operator', 'Operator') }}</label>
                            <input type="text" name="condition_operator" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="contains">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('value', 'Value') }}</label>
                            <input type="text" name="condition_value" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="Starbucks">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('action_category', 'Action: Set Category') }}</label>
                        <select name="action_category_id" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="0">{{ t('select_category', 'Select Category') }}</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.category_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('priority', 'Priority') }}</label>
                        <input type="number" name="priority" value="5" min="1" max="10" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/automation" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg"><i class="fa fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
