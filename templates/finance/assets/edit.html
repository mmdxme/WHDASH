{% extends "base.html" %}

{% block title %}{{ t('edit_asset', 'Edit Asset') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/assets" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_asset', 'Edit Asset') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('asset_name', 'Asset Name') }}</label>
                        <input type="text" name="asset_name" value="{{ asset.asset_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('asset_type', 'Asset Type') }}</label>
                        <select name="asset_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="cash" {% if asset.asset_type == 'cash' %}selected{% endif %}>{{ t('cash', 'Cash') }}</option>
                            <option value="property" {% if asset.asset_type == 'property' %}selected{% endif %}>{{ t('property', 'Property') }}</option>
                            <option value="vehicle" {% if asset.asset_type == 'vehicle' %}selected{% endif %}>{{ t('vehicle', 'Vehicle') }}</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('purchase_value', 'Purchase Value') }}</label>
                            <input type="number" name="purchase_value" step="0.01" value="{{ asset.purchase_value }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('current_value', 'Current Value') }}</label>
                            <input type="number" name="current_value" step="0.01" value="{{ asset.current_value }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                        <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="owned" {% if asset.status == 'owned' %}selected{% endif %}>{{ t('owned', 'Owned') }}</option>
                            <option value="sold" {% if asset.status == 'sold' %}selected{% endif %}>{{ t('sold', 'Sold') }}</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/assets" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg"><i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
