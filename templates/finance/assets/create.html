<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.875rem; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; color: white; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .form-group { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
                <p class="text-gray-400 mt-1">Register a new fixed asset</p>
            </div>
            <a href="/finance/assets" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <form method="POST">
            <div class="card mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="asset_name">Asset Name *</label>
                        <input type="text" id="asset_name" name="asset_name" required placeholder="e.g., Dell Laptop XPS 15">
                    </div>
                    <div class="form-group">
                        <label for="category_id">Category *</label>
                        <select id="category_id" name="category_id" required>
                            <option value="">Select Category</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.code }} - {{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="acquisition_date">Acquisition Date *</label>
                        <input type="date" id="acquisition_date" name="acquisition_date" required>
                    </div>
                    <div class="form-group">
                        <label for="capitalization_date">Capitalization Date</label>
                        <input type="date" id="capitalization_date" name="capitalization_date">
                    </div>
                    <div class="form-group">
                        <label for="acquisition_cost">Acquisition Cost *</label>
                        <input type="number" step="0.01" id="acquisition_cost" name="acquisition_cost" required value="0">
                    </div>
                    <div class="form-group">
                        <label for="useful_life_years">Useful Life (Years)</label>
                        <input type="number" id="useful_life_years" name="useful_life_years" value="5">
                    </div>
                    <div class="form-group">
                        <label for="salvage_value">Salvage Value</label>
                        <input type="number" step="0.01" id="salvage_value" name="salvage_value" value="0">
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Dubai Office">
                    </div>
                    <div class="form-group">
                        <label for="custodian">Custodian</label>
                        <input type="text" id="custodian" name="custodian" placeholder="Person responsible">
                    </div>
                    <div class="form-group">
                        <label for="serial_number">Serial Number</label>
                        <input type="text" id="serial_number" name="serial_number">
                    </div>
                    <div class="form-group">
                        <label for="cost_center_id">Cost Center</label>
                        <select id="cost_center_id" name="cost_center_id">
                            <option value="">None</option>
                            {% for cc in cost_centers %}
                            <option value="{{ cc.id }}">{{ cc.code }} - {{ cc.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group md:col-span-2">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-4">
                <a href="/finance/assets" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Asset</button>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
