{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/subscriptions" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_subscription', 'Edit Subscription') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('provider', 'Provider') }}</label>
                        <input type="text" name="provider" value="{{ sub.provider }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                            <input type="number" name="amount" step="0.01" value="{{ sub.amount }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('renewal_date', 'Next Renewal') }}</label>
                            <input type="date" name="renewal_date" value="{{ sub.renewal_date }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                        <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                            <option value="active" {% if sub.status == 'active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                            <option value="cancelled" {% if sub.status == 'cancelled' %}selected{% endif %}>{{ t('cancelled', 'Cancelled') }}</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/subscriptions" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg"><i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
