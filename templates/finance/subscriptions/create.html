{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/subscriptions" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('add_subscription', 'Add Subscription') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('provider', 'Provider') }}</label>
                        <input type="text" name="provider" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="{{ t('enter_provider', 'e.g., Netflix') }}">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('service_type', 'Service Type') }}</label>
                            <select name="service_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="streaming">{{ t('streaming', 'Streaming') }}</option>
                                <option value="software">{{ t('software', 'Software') }}</option>
                                <option value="membership">{{ t('membership', 'Membership') }}</option>
                                <option value="insurance">{{ t('insurance', 'Insurance') }}</option>
                                <option value="utilities">{{ t('utilities', 'Utilities') }}</option>
                                <option value="other">{{ t('other', 'Other') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('amount', 'Amount') }}</label>
                            <input type="number" name="amount" step="0.01" min="0" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('billing_cycle', 'Billing Cycle') }}</label>
                            <select name="billing_cycle" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="monthly">{{ t('monthly', 'Monthly') }}</option>
                                <option value="yearly">{{ t('yearly', 'Yearly') }}</option>
                                <option value="weekly">{{ t('weekly', 'Weekly') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('renewal_date', 'Next Renewal Date') }}</label>
                            <input type="date" name="renewal_date" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" name="auto_renew" value="1" checked class="w-4 h-4 rounded bg-slate-700 border-slate-600 text-emerald-500">
                        <label class="ml-2 text-sm text-slate-300">{{ t('auto_renew', 'Auto-renew enabled') }}</label>
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/subscriptions" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg"><i class="fa fa-save mr-2"></i>{{ t('save', 'Save') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
