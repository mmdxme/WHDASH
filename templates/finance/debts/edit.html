{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/debts" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_debt', 'Edit Debt') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('lender', 'Lender') }}</label>
                        <input type="text" name="lender" value="{{ debt.lender }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('debt_type', 'Debt Type') }}</label>
                            <select name="debt_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="loan" {% if debt.debt_type == 'loan' %}selected{% endif %}>{{ t('loan', 'Loan') }}</option>
                                <option value="credit_card" {% if debt.debt_type == 'credit_card' %}selected{% endif %}>{{ t('credit_card', 'Credit Card') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('interest_rate', 'Interest Rate (%)') }}</label>
                            <input type="number" name="interest_rate" step="0.01" value="{{ debt.interest_rate }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('principal', 'Principal') }}</label>
                            <input type="number" name="principal" step="0.01" value="{{ debt.principal }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('remaining_balance', 'Balance') }}</label>
                            <input type="number" name="remaining_balance" step="0.01" value="{{ debt.remaining_balance }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('monthly_installment', 'Monthly') }}</label>
                            <input type="number" name="monthly_installment" step="0.01" value="{{ debt.monthly_installment }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                            <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="active" {% if debt.status == 'active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                                <option value="paid" {% if debt.status == 'paid' %}selected{% endif %}>{{ t('paid', 'Paid') }}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/debts" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
