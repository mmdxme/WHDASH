{% extends "base.html" %}

{% block extra_head %}
<title>{{ title }} - MMDx</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/static/css/tailwind.min.css" rel="stylesheet">
<link href="/static/css/fontawesome.min.css" rel="stylesheet">
<style>
        :root { --primary: #6366f1; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .form-input { width: 100%; padding: 0.625rem 0.875rem; background: #1e293b; border: 1px solid #475569; border-radius: 0.5rem; color: white; font-size: 0.875rem; }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .form-select { width: 100%; padding: 0.625rem 0.875rem; background: #1e293b; border: 1px solid #475569; border-radius: 0.5rem; color: white; font-size: 0.875rem; }
        .form-select:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 0.625rem 1.25rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    </style>
{% endblock %}

{% block content %}
<div class="mb-8">
        <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
        <p class="text-gray-400 mt-1">Update bank account information</p>
    </div>

    <div class="card" style="max-width: 800px;">
        <form method="POST">
            <div class="grid grid-cols-2 gap-6">
                <div class="form-group">
                    <label class="form-label">Bank Name *</label>
                    <input type="text" name="bank_name" class="form-input" value="{{ bank_account.bank_name }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Account Name *</label>
                    <input type="text" name="account_name" class="form-input" value="{{ bank_account.account_name }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Account Number</label>
                    <input type="text" name="account_number" class="form-input" value="{{ bank_account.account_number or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Account Type</label>
                    <select name="account_type" class="form-select">
                        <option value="checking" {% if bank_account.account_type == 'checking' %}selected{% endif %}>Checking</option>
                        <option value="savings" {% if bank_account.account_type == 'savings' %}selected{% endif %}>Savings</option>
                        <option value="petty_cash" {% if bank_account.account_type == 'petty_cash' %}selected{% endif %}>Petty Cash</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Currency</label>
                    <select name="currency" class="form-select">
                        <option value="AED" {% if bank_account.currency == 'AED' %}selected{% endif %}>AED - UAE Dirham</option>
                        <option value="USD" {% if bank_account.currency == 'USD' %}selected{% endif %}>USD - US Dollar</option>
                        <option value="EUR" {% if bank_account.currency == 'EUR' %}selected{% endif %}>EUR - Euro</option>
                        <option value="GBP" {% if bank_account.currency == 'GBP' %}selected{% endif %}>GBP - British Pound</option>
                        <option value="SAR" {% if bank_account.currency == 'SAR' %}selected{% endif %}>SAR - Saudi Riyal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">IBAN</label>
                    <input type="text" name="iban" class="form-input" value="{{ bank_account.iban or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">SWIFT/BIC Code</label>
                    <input type="text" name="swift_code" class="form-input" value="{{ bank_account.swift_code or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Branch</label>
                    <input type="text" name="branch" class="form-input" value="{{ bank_account.branch or '' }}">
                </div>
                <div class="form-group col-span-2">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-input" value="{{ bank_account.address or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">GL Account (Cash Account)</label>
                    <select name="gl_account_id" class="form-select">
                        <option value="">-- Select GL Account --</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" {% if bank_account.gl_account_id == account.id %}selected{% endif %}>{{ account.code }} - {{ account.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Bank Statement Format</label>
                    <select name="bank_statement_format" class="form-select">
                        <option value="">-- None --</option>
                        <option value="MT940" {% if bank_account.bank_statement_format == 'MT940' %}selected{% endif %}>MT940</option>
                        <option value="STA" {% if bank_account.bank_statement_format == 'STA' %}selected{% endif %}>STA</option>
                        <option value="BAI2" {% if bank_account.bank_statement_format == 'BAI2' %}selected{% endif %}>BAI2</option>
                        <option value="CSV" {% if bank_account.bank_statement_format == 'CSV' %}selected{% endif %}>CSV</option>
                        <option value="PDF" {% if bank_account.bank_statement_format == 'PDF' %}selected{% endif %}>PDF</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_active" value="1" {% if bank_account.is_active %}checked{% endif %}>
                        <span>Active</span>
                    </label>
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="/finance/bank-accounts/{{ bank_account.id }}" class="btn btn-outline">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
