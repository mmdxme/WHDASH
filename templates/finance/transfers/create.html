<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - MMDx</title>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        body { background: #0f172a; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; border: 1px solid #334155; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .form-input { width: 100%; padding: 0.625rem 0.875rem; background: #1e293b; border: 1px solid #475569; border-radius: 0.5rem; color: white; font-size: 0.875rem; }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .form-select { width: 100%; padding: 0.625rem 0.875rem; background: #1e293b; border: 1px solid #475569; border-radius: 0.5rem; color: white; font-size: 0.875rem; }
        .form-select:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 0.625rem 1.25rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .transfer-icon { font-size: 3rem; color: var(--primary); }
    </style>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
        <p class="text-gray-400 mt-1">Transfer funds between bank accounts</p>
    </div>

    <div class="card" style="max-width: 700px;">
        <form method="POST">
            <div class="grid grid-cols-2 gap-6 mb-8">
                <div class="form-group">
                    <label class="form-label">From Bank Account *</label>
                    <select name="from_bank_account_id" class="form-select" required>
                        <option value="">-- Select Source Account --</option>
                        {% for bank in bank_accounts %}
                        <option value="{{ bank.id }}">{{ bank.bank_name }} - {{ bank.account_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">To Bank Account *</label>
                    <select name="to_bank_account_id" class="form-select" required>
                        <option value="">-- Select Destination Account --</option>
                        {% for bank in bank_accounts %}
                        <option value="{{ bank.id }}">{{ bank.bank_name }} - {{ bank.account_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="flex justify-center my-6">
                <i class="fas fa-arrow-down transfer-icon"></i>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div class="form-group">
                    <label class="form-label">Transfer Date *</label>
                    <input type="date" name="transfer_date" class="form-input" value="{{ today }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Amount *</label>
                    <input type="number" name="amount" class="form-input" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Currency</label>
                    <select name="currency" class="form-select">
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="SAR">SAR - Saudi Riyal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Reference</label>
                    <input type="text" name="reference" class="form-input" placeholder="Cheque #, Transfer ref...">
                </div>
                <div class="form-group col-span-2">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-input" rows="3" placeholder="Internal notes about this transfer..."></textarea>
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Create Transfer
                </button>
                <a href="/finance/transfers" class="btn btn-outline">
                    Cancel
                </a>
            </div>
        </form>
    </div>
    {% endblock %}
</body>
</html>
