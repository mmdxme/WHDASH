{% extends "base.html" %}

{% block title %}{{ t('edit_investment', 'Edit Investment') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/investments" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_investment', 'Edit Investment') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('asset_name', 'Asset Name') }}</label>
                        <input type="text" name="asset_name" value="{{ investment.asset_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('asset_class', 'Asset Class') }}</label>
                            <select name="asset_class" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="stock" {% if investment.asset_class == 'stock' %}selected{% endif %}>{{ t('stock', 'Stock') }}</option>
                                <option value="bond" {% if investment.asset_class == 'bond' %}selected{% endif %}>{{ t('bond', 'Bond') }}</option>
                                <option value="fund" {% if investment.asset_class == 'fund' %}selected{% endif %}>{{ t('fund', 'Mutual Fund') }}</option>
                                <option value="etf" {% if investment.asset_class == 'etf' %}selected{% endif %}>{{ t('etf', 'ETF') }}</option>
                                <option value="crypto" {% if investment.asset_class == 'crypto' %}selected{% endif %}>{{ t('crypto', 'Cryptocurrency') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('quantity', 'Quantity') }}</label>
                            <input type="number" name="quantity" step="0.0001" value="{{ investment.quantity }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('purchase_price', 'Purchase Price') }}</label>
                            <input type="number" name="purchase_price" step="0.01" value="{{ investment.purchase_price }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('current_price', 'Current Price') }}</label>
                            <input type="number" name="current_price" step="0.01" value="{{ investment.current_price }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('acquisition_date', 'Acquisition Date') }}</label>
                            <input type="date" name="acquisition_date" value="{{ investment.acquisition_date }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                            <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="held" {% if investment.status == 'held' %}selected{% endif %}>{{ t('held', 'Held') }}</option>
                                <option value="sold" {% if investment.status == 'sold' %}selected{% endif %}>{{ t('sold', 'Sold') }}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/investments" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
