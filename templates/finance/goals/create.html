{% extends "base.html" %}

{% block title %}{{ t('create_goal', 'Create Financial Goal') }} - {{ platform_name }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/goals" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('create_goal', 'Create Financial Goal') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('goal_name', 'Goal Name') }}</label>
                        <input type="text" name="goal_name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white" placeholder="{{ t('enter_goal_name', 'e.g., Emergency Fund') }}">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('goal_type', 'Goal Type') }}</label>
                            <select name="goal_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="short_term">{{ t('short_term', 'Short Term') }}</option>
                                <option value="medium_term">{{ t('medium_term', 'Medium Term') }}</option>
                                <option value="long_term">{{ t('long_term', 'Long Term') }}</option>
                                <option value="emergency">{{ t('emergency_fund', 'Emergency Fund') }}</option>
                                <option value="retirement">{{ t('retirement', 'Retirement') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('target_amount', 'Target Amount') }}</label>
                            <input type="number" name="target_amount" step="0.01" min="0" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('current_progress', 'Current Progress') }}</label>
                            <input type="number" name="current_progress" step="0.01" value="0" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('currency', 'Currency') }}</label>
                            <select name="currency" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('target_date', 'Target Date') }}</label>
                            <input type="date" name="target_date" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('priority', 'Priority') }}</label>
                            <select name="priority" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="1">{{ t('high', 'High') }}</option>
                                <option value="2" selected>{{ t('medium', 'Medium') }}</option>
                                <option value="3">{{ t('low', 'Low') }}</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white"></textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/goals" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('create_goal', 'Create Goal') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
