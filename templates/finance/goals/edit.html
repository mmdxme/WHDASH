{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="bg-slate-800/80 backdrop-blur-lg border-b border-slate-700">
        <div class="px-6 py-4">
            <div class="flex items-center space-x-4">
                <a href="/finance/goals" class="text-slate-400 hover:text-white"><i class="fa fa-arrow-left"></i></a>
                <h1 class="text-xl font-bold text-white">{{ t('edit_goal', 'Edit Goal') }}</h1>
            </div>
        </div>
    </div>

    <div class="p-6">
        <div class="max-w-2xl mx-auto">
            <form method="POST" class="bg-slate-800/50 backdrop-blur rounded-xl border border-slate-700 p-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('goal_name', 'Goal Name') }}</label>
                        <input type="text" name="goal_name" value="{{ goal.goal_name }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('goal_type', 'Goal Type') }}</label>
                            <select name="goal_type" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="short_term" {% if goal.goal_type == 'short_term' %}selected{% endif %}>{{ t('short_term', 'Short Term') }}</option>
                                <option value="medium_term" {% if goal.goal_type == 'medium_term' %}selected{% endif %}>{{ t('medium_term', 'Medium Term') }}</option>
                                <option value="long_term" {% if goal.goal_type == 'long_term' %}selected{% endif %}>{{ t('long_term', 'Long Term') }}</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('target_amount', 'Target Amount') }}</label>
                            <input type="number" name="target_amount" step="0.01" value="{{ goal.target_amount }}" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('current_progress', 'Current Progress') }}</label>
                            <input type="number" name="current_progress" step="0.01" value="{{ goal.current_progress }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                            <select name="status" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="draft" {% if goal.status == 'draft' %}selected{% endif %}>{{ t('draft', 'Draft') }}</option>
                                <option value="active" {% if goal.status == 'active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                                <option value="achieved" {% if goal.status == 'achieved' %}selected{% endif %}>{{ t('achieved', 'Achieved') }}</option>
                                <option value="cancelled" {% if goal.status == 'cancelled' %}selected{% endif %}>{{ t('cancelled', 'Cancelled') }}</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('target_date', 'Target Date') }}</label>
                            <input type="date" name="target_date" value="{{ goal.target_date }}" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('priority', 'Priority') }}</label>
                            <select name="priority" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">
                                <option value="1" {% if goal.priority == 1 %}selected{% endif %}>{{ t('high', 'High') }}</option>
                                <option value="2" {% if goal.priority == 2 %}selected{% endif %}>{{ t('medium', 'Medium') }}</option>
                                <option value="3" {% if goal.priority == 3 %}selected{% endif %}>{{ t('low', 'Low') }}</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white">{{ goal.notes }}</textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-4 mt-8 pt-6 border-t border-slate-700">
                    <a href="/finance/goals" class="px-6 py-2 text-slate-400 hover:text-white">{{ t('cancel', 'Cancel') }}</a>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg">
                        <i class="fa fa-save mr-2"></i>{{ t('save_changes', 'Save Changes') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
