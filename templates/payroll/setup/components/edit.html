<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --primary-dark: #4338CA; --success: #059669; --warning: #D97706; --danger: #DC2626; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB; --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-700); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
        .btn-secondary:hover { background: var(--gray-200); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #B91C1C; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .component-code { background: var(--gray-100); padding: 0.5rem 1rem; border-radius: var(--radius); font-family: monospace; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-edit"></i> {{ title }}</h1>
    </div>

    <div class="container">
        <a href="{{ url_for('payroll.setup_components') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Components
        </a>

        <div class="card">
            <p style="margin-bottom: 1.5rem;">
                <strong>Component Code:</strong> <span class="component-code">{{ component.code }}</span>
            </p>

            <form method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name (English) *</label>
                        <input type="text" id="name" name="name" required value="{{ component.name }}">
                    </div>
                    <div class="form-group">
                        <label for="name_ar">Name (Arabic)</label>
                        <input type="text" id="name_ar" name="name_ar" value="{{ component.name_ar or '' }}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="2">{{ component.description or '' }}</textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="calculation_type">Calculation Type</label>
                        <select id="calculation_type" name="calculation_type">
                            <option value="Fixed" {% if component.calculation_type == 'Fixed' %}selected{% endif %}>Fixed Amount</option>
                            <option value="Percentage" {% if component.calculation_type == 'Percentage' %}selected{% endif %}>Percentage</option>
                            <option value="Hourly" {% if component.calculation_type == 'Hourly' %}selected{% endif %}>Hourly Rate</option>
                            <option value="calculated" {% if component.calculation_type == 'calculated' %}selected{% endif %}>Calculated</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">Default Amount</label>
                        <input type="number" id="amount" name="amount" step="0.01" value="{{ component.amount or 0 }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="percentage">Percentage (%)</label>
                        <input type="number" id="percentage" name="percentage" step="0.01" value="{{ component.percentage or 0 }}">
                    </div>
                    <div class="form-group">
                        <label for="percentage_of">Percentage Of</label>
                        <input type="text" id="percentage_of" name="percentage_of" value="{{ component.percentage_of or '' }}">
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_taxable" name="is_taxable" value="1" {% if component.is_taxable %}checked{% endif %}>
                        <label for="is_taxable" style="margin-bottom: 0;">Is Taxable</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_default" name="is_default" value="1" {% if component.is_default %}checked{% endif %}>
                        <label for="is_default" style="margin-bottom: 0;">Is Default</label>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Component
                    </button>
                    <a href="{{ url_for('payroll.setup_components') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
