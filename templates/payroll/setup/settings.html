<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB; --gray-600: #4B5563; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, #4338CA 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.5rem; overflow: hidden; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-200); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .card-header i { color: var(--primary); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-600); }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem; }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: white; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-cog"></i> {{ title }}</h1>
        <p>Configure payroll system settings</p>
    </div>
    <div class="container">
        <a href="{{ url_for('payroll.setup_menu') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Setup</a>

        <div class="card">
            <div class="card-header"><i class="fas fa-cog"></i> Payroll Settings</div>
            <form method="post" style="padding: 1.5rem;">
                <div class="form-row">
                    <div class="form-group">
                        <label for="currency">Currency</label>
                        <select id="currency" name="currency">
                            <option value="AED" {% if settings.currency=='AED' %}selected{% endif %}>AED - UAE Dirham</option>
                            <option value="USD" {% if settings.currency=='USD' %}selected{% endif %}>USD - US Dollar</option>
                            <option value="EUR" {% if settings.currency=='EUR' %}selected{% endif %}>EUR - Euro</option>
                            <option value="GBP" {% if settings.currency=='GBP' %}selected{% endif %}>GBP - British Pound</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="country_code">Country Code</label>
                        <input type="text" id="country_code" name="country_code" value="{{ settings.country_code or 'AE' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="min_wage">Minimum Wage</label>
                        <input type="number" id="min_wage" name="min_wage" value="{{ settings.min_wage or 0 }}">
                    </div>
                    <div class="form-group">
                        <label for="ot_multiplier">Overtime Multiplier</label>
                        <input type="number" step="0.1" id="ot_multiplier" name="ot_multiplier" value="{{ settings.ot_multiplier or 1.5 }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pay_slip_format">Payslip Format</label>
                        <select id="pay_slip_format" name="pay_slip_format">
                            <option value="standard" {% if settings.pay_slip_format=='standard' %}selected{% endif %}>Standard</option>
                            <option value="detailed" {% if settings.pay_slip_format=='detailed' %}selected{% endif %}>Detailed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="auto_post">Auto-Post to Finance</label>
                        <select id="auto_post" name="auto_post">
                            <option value="1" {% if settings.auto_post %}selected{% endif %}>Yes</option>
                            <option value="0" {% if not settings.auto_post %}selected{% endif %}>No</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Settings</button>
            </form>
        </div>
    </div>
</body>
</html>
