<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-300: #D1D5DB; --gray-600: #4B5563; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, #4338CA 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-600); }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--gray-100); color: var(--gray-600); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-wallet"></i> {{ title }}</h1>
        <p>Create a new salary advance for an employee</p>
    </div>
    <div class="container">
        <a href="{{ url_for('payroll.advances_list') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Advances</a>
        <div class="card">
            <form method="post">
                <div class="form-group">
                    <label for="employee_id">Employee *</label>
                    <select id="employee_id" name="employee_id" required>
                        <option value="">Select Employee</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.employee_code }} - {{ emp.employee_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Advance Amount (AED) *</label>
                    <input type="number" id="amount" name="amount" step="0.01" required placeholder="5000">
                </div>
                <div class="form-group">
                    <label for="recovery_months">Recovery Period (Months)</label>
                    <input type="number" id="recovery_months" name="recovery_months" value="3" min="1" max="12">
                </div>
                <div class="form-group">
                    <label for="reason">Reason</label>
                    <input type="text" id="reason" name="reason" placeholder="Emergency expense">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Advance</button>
                    <a href="{{ url_for('payroll.advances_list') }}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
