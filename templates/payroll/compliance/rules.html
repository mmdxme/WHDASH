<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --success: #059669; --warning: #D97706; --danger: #DC2626; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-600: #4B5563; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, #4338CA 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.5rem; overflow: hidden; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-200); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .card-header i { color: var(--primary); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.875rem 1.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--gray-600); border-bottom: 2px solid var(--gray-200); background: var(--gray-50); }
        td { padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-100); font-size: 0.9rem; }
        .severity-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .severity-critical { background: #FEE2E2; color: var(--danger); }
        .severity-high { background: #FEF3C7; color: var(--warning); }
        .severity-medium { background: #DBEAFE; color: var(--primary); }
        .severity-low { background: #ECFDF5; color: var(--success); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-gavel"></i> {{ title }}</h1>
        <p>Configure and manage compliance validation rules</p>
    </div>
    <div class="container">
        <a href="{{ url_for('payroll.payroll_dashboard') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <div class="card">
            <div class="card-header"><i class="fas fa-list"></i> Compliance Rules</div>
            <table>
                <thead>
                    <tr>
                        <th>Rule Code</th>
                        <th>Rule Name</th>
                        <th>Type</th>
                        <th>Severity</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    {% for rule in rules %}
                    <tr>
                        <td><code>{{ rule.rule_code }}</code></td>
                        <td><strong>{{ rule.rule_name }}</strong></td>
                        <td>{{ rule.rule_type }}</td>
                        <td><span class="severity-badge severity-{{ rule.severity|lower }}">{{ rule.severity }}</span></td>
                        <td>{{ rule.description }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
