<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --primary-dark: #4338CA; --success: #059669; --warning: #D97706; --danger: #DC2626; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB; --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-700); }
        .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
        .btn-secondary:hover { background: var(--gray-200); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-play"></i> {{ title }}</h1>
        <p>{{ t('start_payroll_run_desc', 'Start a new payroll run for a specific period') }}</p>
    </div>

    <div class="container">
        <a href="{{ url_for('payroll.processing_list') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> {{ t('back_to_processing', 'Back to Processing') }}
        </a>

        <div class="card">
            <form method="post">
                <div class="form-group">
                    <label for="period_id">{{ t('select_payroll_period', 'Select Payroll Period') }}</label>
                    <select id="period_id" name="period_id" required>
                        <option value="">-- {{ t('select_period', 'Select Period') }} --</option>
                        {% for period in open_periods %}
                        <option value="{{ period.id }}">{{ period.name }} ({{ period.year }}) - {{ period.status }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="run_type">{{ t('run_type', 'Run Type') }} *</label>
                    <select id="run_type" name="run_type" required>
                        <option value="Regular">{{ t('regular', 'Regular') }}</option>
                        <option value="Bonus">{{ t('bonus_run', 'Bonus Run') }}</option>
                        <option value="Correction">{{ t('correction_run', 'Correction Run') }}</option>
                        <option value="Retro">{{ t('retro_run', 'Retro Run') }}</option>
                        <option value="Final">{{ t('final_settlement', 'Final Settlement') }}</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-play"></i> {{ t('start_run', 'Start Run') }}
                    </button>
                    <a href="{{ url_for('payroll.processing_list') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> {{ t('cancel', 'Cancel') }}
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
