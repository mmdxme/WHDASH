<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --primary-dark: #4338CA; --success: #059669; --warning: #D97706; --danger: #DC2626; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB; --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--gray-700); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 0.9rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
        .btn-secondary:hover { background: var(--gray-200); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-calendar-plus"></i> {{ title }}</h1>
        <p>Create a new payroll period for processing</p>
    </div>

    <div class="container">
        <a href="{{ url_for('payroll.periods_list') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Periods
        </a>

        <div class="card">
            <form method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="month">Month *</label>
                        <select id="month" name="month" required>
                            <option value="">Select Month</option>
                            {% for i in range(1, 13) %}
                            <option value="{{ i }}" {% if i == current_month %}selected{% endif %}>{{ ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][i-1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="year">Year *</label>
                        <select id="year" name="year" required>
                            <option value="">Select Year</option>
                            {% for y in range(current_year - 1, current_year + 2) %}
                            <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="name">Period Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g., January 2026">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cutoff_day">Cutoff Day</label>
                        <input type="number" id="cutoff_day" name="cutoff_day" value="25" min="1" max="31">
                    </div>
                    <div class="form-group">
                        <label for="payment_day">Payment Day</label>
                        <input type="number" id="payment_day" name="payment_day" value="28" min="1" max="31">
                    </div>
                </div>

                <div class="form-group">
                    <label for="calendar_id">Payroll Calendar</label>
                    <select id="calendar_id" name="calendar_id">
                        <option value="">Select Calendar (Optional)</option>
                        {% for cal in calendars %}
                        <option value="{{ cal.id }}">{{ cal.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fiscal_year">Fiscal Year</label>
                        <input type="text" id="fiscal_year" name="fiscal_year" value="{{ current_year }}">
                    </div>
                    <div class="form-group">
                        <label for="quarter">Quarter</label>
                        <select id="quarter" name="quarter">
                            <option value="Q1">Q1</option>
                            <option value="Q2">Q2</option>
                            <option value="Q3">Q3</option>
                            <option value="Q4">Q4</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Create Period
                    </button>
                    <a href="{{ url_for('payroll.periods_list') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
