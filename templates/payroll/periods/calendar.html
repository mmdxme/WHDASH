<!DOCTYPE html>
<html lang="{{ session.get('language', 'en') }}" dir="{{ 'rtl' if session.get('direction') == 'rtl' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - WHDASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4F46E5; --success: #059669; --warning: #D97706; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-600: #4B5563; --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); --radius: 0.5rem; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); }
        .page-header { background: linear-gradient(135deg, var(--primary) 0%, #4338CA 100%); color: white; padding: 2rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.5rem; overflow: hidden; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-200); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .card-header i { color: var(--primary); }
        .calendar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.5rem; padding: 1.5rem; }
        .month-box { background: var(--gray-50); padding: 1rem; border-radius: var(--radius); text-align: center; }
        .month-box .name { font-weight: 600; font-size: 0.9rem; }
        .month-box .status { font-size: 0.75rem; margin-top: 0.5rem; padding: 0.25rem 0.5rem; border-radius: 9999px; display: inline-block; }
        .status-open { background: #ECFDF5; color: var(--success); }
        .status-processing { background: #DBEAFE; color: var(--primary); }
        .status-locked { background: var(--gray-200); color: var(--gray-600); }
        .status-closed { background: #FEE2E2; color: #991B1B; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; font-weight: 500; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-calendar-alt"></i> {{ title }}</h1>
        <p>Payroll calendar overview for {{ year }}</p>
    </div>
    <div class="container">
        <a href="{{ url_for('payroll.payroll_dashboard') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <div class="card">
            <div class="card-header"><i class="fas fa-calendar"></i> {{ year }} Calendar</div>
            <div class="calendar">
                {% for p in periods %}
                <div class="month-box">
                    <div class="name">{{ p.name }}</div>
                    <div style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--gray-600);">
                        {{ p.start_date[:10] if p.start_date else 'N/A' }} - {{ p.end_date[:10] if p.end_date else 'N/A' }}
                    </div>
                    <div style="margin-top: 0.5rem;">
                        <span class="status status-{{ p.status|lower }}">{{ p.status }}</span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
