<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    {% include 'base.html' %}

    {% block content %}
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="{{ url_for('spc.equipment_list') }}">Equipment Registry</a></li>
                        <li class="breadcrumb-item active">Register</li>
                    </ol>
                </nav>
                <h1 class="h3 mb-1"><i class="fas fa-plus me-2 text-warning"></i>{{ page_title }}</h1>
                <p class="text-muted mb-0">Register new measurement equipment</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Equipment Code <span class="text-danger">*</span></label>
                            <input type="text" name="equipment_code" class="form-control" placeholder="e.g., GAGE-001" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Equipment Name <span class="text-danger">*</span></label>
                            <input type="text" name="equipment_name" class="form-control" placeholder="e.g., Digital Caliper 150mm" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Equipment Type <span class="text-danger">*</span></label>
                            <select name="equipment_type" class="form-select" required>
                                <option value="">Select Type</option>
                                <option value="CALIPER">Caliper</option>
                                <option value="MICROMETER">Micrometer</option>
                                <option value="INDICATOR">Indicator</option>
                                <option value="GAUGE">Gauge</option>
                                <option value="SCALE">Scale/Balance</option>
                                <option value="THERMOMETER">Thermometer</option>
                                <option value="PRESSURE">Pressure Gauge</option>
                                <option value="ELECTRICAL">Electrical Meter</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" placeholder="e.g., QC Lab - Shelf 3">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Manufacturer</label>
                            <input type="text" name="manufacturer" class="form-control" placeholder="e.g., Mitutoyo">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Model Number</label>
                            <input type="text" name="model_number" class="form-control" placeholder="e.g., 500-196-30">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Serial Number</label>
                            <input type="text" name="serial_number" class="form-control" placeholder="e.g., 12345678">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Measurement Range (Min)</label>
                            <input type="number" step="any" name="measurement_range_min" class="form-control" placeholder="e.g., 0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Measurement Range (Max)</label>
                            <input type="number" step="any" name="measurement_range_max" class="form-control" placeholder="e.g., 150">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Resolution</label>
                            <input type="number" step="any" name="resolution" class="form-control" placeholder="e.g., 0.01">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Accuracy</label>
                            <input type="number" step="any" name="accuracy" class="form-control" placeholder="e.g., 0.02">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Calibration Interval (days)</label>
                            <input type="number" name="calibration_interval_days" class="form-control" value="90">
                            <small class="text-muted">How often this equipment needs calibration</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('spc.equipment_list') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-save me-1"></i> Register Equipment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}
</body>
</html>
