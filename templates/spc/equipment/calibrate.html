<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - MMDx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    {% include 'base.html' %}

    {% block content %}
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="{{ url_for('spc.equipment_list') }}">Equipment</a></li>
                        <li class="breadcrumb-item"><a href="{{ url_for('spc.equipment_view', equipment_id=equipment_id) }}">{{ equipment_id }}</a></li>
                        <li class="breadcrumb-item active">Calibrate</li>
                    </ol>
                </nav>
                <h1 class="h3 mb-1"><i class="fas fa-calendar-check me-2 text-success"></i>{{ page_title }}</h1>
                <p class="text-muted mb-0">Record calibration measurement</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Calibration Date <span class="text-danger">*</span></label>
                            <input type="date" name="calibration_date" class="form-control" value="{{ now().strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Result</label>
                            <select name="result" class="form-select">
                                <option value="PASSED">Passed</option>
                                <option value="FAILED">Failed</option>
                                <option value="ADJUSTED">Adjusted</option>
                            </select>
                        </div>
                    </div>

                    <hr>
                    <h5>As-Found Measurement</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">As Found Min (Reference - )</label>
                            <input type="number" step="any" name="as_found_min" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">As Found Max (Reference + )</label>
                            <input type="number" step="any" name="as_found_max" class="form-control" required>
                        </div>
                    </div>

                    <hr>
                    <h5>As-Left Measurement (After Adjustment)</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">As Left Min</label>
                            <input type="number" step="any" name="as_left_min" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">As Left Max</label>
                            <input type="number" step="any" name="as_left_max" class="form-control">
                        </div>
                    </div>

                    <hr>
                    <h5>Calibration Details</h5>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Tolerance</label>
                            <input type="number" step="any" name="tolerance" class="form-control" placeholder="e.g., 0.02">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Measurement Uncertainty</label>
                            <input type="number" step="any" name="measurement_uncertainty" class="form-control" placeholder="e.g., 0.01">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Certificate Number</label>
                            <input type="text" name="certificate_number" class="form-control">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Temperature (°C)</label>
                            <input type="number" step="any" name="temperature" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Humidity (%)</label>
                            <input type="number" step="any" name="humidity" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Standards Used</label>
                            <input type="text" name="standards_used" class="form-control" placeholder="e.g., NIST Reference">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('spc.equipment_view', equipment_id=equipment_id) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-1"></i> Record Calibration
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}
</body>
</html>
