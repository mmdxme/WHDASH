{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Sales Reports & Analytics</h1>
        <p class="text-gray-500">View and export sales reports</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <a href="{{ url_for('sales_reports_summary') }}" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900 rounded-lg flex items-center justify-center">
                    <i class="fas fa-chart-line text-blue-600 text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-800 dark:text-white">Sales Summary</h3>
                    <p class="text-sm text-gray-500">Daily, monthly, yearly overview</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('sales_reports_by_item') }}" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-green-100 dark:bg-green-900 rounded-lg flex items-center justify-center">
                    <i class="fas fa-boxes text-green-600 text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-800 dark:text-white">Sales by Item</h3>
                    <p class="text-sm text-gray-500">Top selling parts and brands</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('sales_reports_inquiry_conversion') }}" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-purple-100 dark:bg-purple-900 rounded-lg flex items-center justify-center">
                    <i class="fas fa-filter text-purple-600 text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-800 dark:text-white">Inquiry Conversion</h3>
                    <p class="text-sm text-gray-500">Conversion rates and sources</p>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
