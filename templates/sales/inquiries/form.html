{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">{{ 'Edit Inquiry' if form_action == 'edit' else 'New Inquiry' }}</h1>
    </div>

    <form method="post" class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Customer Name</label>
                    <input type="text" name="customer_name" value="{{ inquiry.customer_name or '' }}" required
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Inquiry Source</label>
                    <select name="inquiry_source" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        {% for s in sources %}
                        <option value="{{ s }}" {{ 'selected' if inquiry.inquiry_source == s else '' }}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Priority</label>
                    <select name="priority" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="Low" {{ 'selected' if inquiry.priority == 'Low' else '' }}>Low</option>
                        <option value="Medium" {{ 'selected' if inquiry.priority == 'Medium' else '' }}>Medium</option>
                        <option value="High" {{ 'selected' if inquiry.priority == 'High' else '' }}>High</option>
                        <option value="Critical" {{ 'selected' if inquiry.priority == 'Critical' else '' }}>Critical</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Market</label>
                    <select name="market" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="Local" {{ 'selected' if inquiry.market == 'Local' else '' }}>Local</option>
                        <option value="Export" {{ 'selected' if inquiry.market == 'Export' else '' }}>Export</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Customer Type</label>
                    <select name="customer_type" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="Retail" {{ 'selected' if inquiry.customer_type == 'Retail' else '' }}>Retail</option>
                        <option value="Wholesale" {{ 'selected' if inquiry.customer_type == 'Wholesale' else '' }}>Wholesale</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Salesperson</label>
                    <select name="assigned_salesperson_id" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        {% for s in salespersons %}
                        <option value="{{ s.id }}" {{ 'selected' if inquiry.assigned_salesperson_id == s.id else '' }}>{{ s.username }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Country</label>
                    <input type="text" name="country" value="{{ inquiry.country or '' }}" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">City</label>
                    <input type="text" name="city" value="{{ inquiry.city or '' }}" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
            </div>

            {% if form_action == 'edit' %}
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                <select name="status" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    {% for s in statuses %}
                    <option value="{{ s }}" {{ 'selected' if inquiry.status == s else '' }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
                <textarea name="notes" rows="3" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">{{ inquiry.notes or '' }}</textarea>
            </div>
        </div>

        <div class="px-6 py-4 bg-gray-50 dark:bg-gray-700 rounded-b-lg flex justify-end gap-3">
            <a href="{{ url_for('sales_inquiries') }}" class="px-4 py-2 bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i> {{ 'Update' if form_action == 'edit' else 'Create' }} Inquiry
            </button>
        </div>
    </form>
</div>
{% endblock %}
