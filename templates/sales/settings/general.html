{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">General Sales Settings</h1>
    </div>

    <form method="post" class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Default Currency</label>
                    <select name="default_currency" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="AED" {{ 'selected' if settings.default_currency == 'AED' else '' }}>AED - UAE Dirham</option>
                        <option value="USD" {{ 'selected' if settings.default_currency == 'USD' else '' }}>USD - US Dollar</option>
                        <option value="EUR" {{ 'selected' if settings.default_currency == 'EUR' else '' }}>EUR - Euro</option>
                        <option value="GBP" {{ 'selected' if settings.default_currency == 'GBP' else '' }}>GBP - British Pound</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tax Percent</label>
                    <input type="number" step="0.01" name="tax_percent" value="{{ settings.tax_percent or '5' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Max Discount Percent</label>
                    <input type="number" step="0.01" name="max_discount_percent" value="{{ settings.max_discount_percent or '20' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Min Margin Percent</label>
                    <input type="number" step="0.01" name="min_margin_percent" value="{{ settings.min_margin_percent or '10' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quotation Validity (Days)</label>
                    <input type="number" name="quotation_validity_days" value="{{ settings.quotation_validity_days or '30' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Reservation Validity (Days)</label>
                    <input type="number" name="reservation_validity_days" value="{{ settings.reservation_validity_days or '7' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Credit Check Threshold (%)</label>
                    <input type="number" name="credit_check_threshold" value="{{ settings.credit_check_threshold or '80' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Require Approval Above Amount</label>
                    <input type="number" step="0.01" name="require_approval_above_amount" value="{{ settings.require_approval_above_amount or '50000' }}"
                           class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
            </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 dark:bg-gray-700 rounded-b-lg flex justify-end gap-3">
            <a href="{{ url_for('sales_settings') }}" class="px-4 py-2 bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i> Save Settings
            </button>
        </div>
    </form>
</div>
{% endblock %}
