{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Sales Settings</h1>
        <p class="text-gray-500">Configure sales module settings</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <a href="{{ url_for('sales_settings_general') }}" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 hover:shadow-lg transition">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900 rounded-lg flex items-center justify-center">
                    <i class="fas fa-cog text-blue-600 text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-800 dark:text-white">General Settings</h3>
                    <p class="text-sm text-gray-500">Currency, tax, discounts, validity</p>
                </div>
            </div>
        </a>

        <a href="#" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 hover:shadow-lg transition opacity-50 cursor-not-allowed">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-green-100 dark:bg-green-900 rounded-lg flex items-center justify-center">
                    <i class="fas fa-file-invoice text-green-600 text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-800 dark:text-white">Numbering</h3>
                    <p class="text-sm text-gray-500">Document number formats</p>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
