{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">{{ contract.contract_number }}</h1>
            <span class="px-2 py-1 text-xs rounded-full {{ 'bg-green-100 text-green-800' if contract.status == 'Active' else 'bg-gray-100 text-gray-800' }}">
                {{ contract.status }}
            </span>
        </div>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <div class="grid grid-cols-2 gap-4">
            <div><label class="text-sm text-gray-500">Customer</label><p class="font-medium">{{ contract.customer_name }}</p></div>
            <div><label class="text-sm text-gray-500">Type</label><p class="font-medium">{{ contract.contract_type }}</p></div>
            <div><label class="text-sm text-gray-500">Start Date</label><p class="font-medium">{{ contract.start_date }}</p></div>
            <div><label class="text-sm text-gray-500">End Date</label><p class="font-medium">{{ contract.end_date }}</p></div>
        </div>
    </div>
</div>
{% endblock %}
