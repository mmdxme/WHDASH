{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">{{ 'Edit Order' if form_action == 'edit' else 'New Sales Order' }}</h1>
    </div>

    <form method="post" class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Order Date</label>
                    <input type="date" name="order_date" value="{{ order.order_date or '' }}" required class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Customer</label>
                    <select name="customer_id" id="customerSelect" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="">-- Select Customer --</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}" {{ 'selected' if order.customer_id == c.id else '' }}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Market</label>
                    <select name="market" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="Local" {{ 'selected' if order.market == 'Local' else '' }}>Local</option>
                        <option value="Export" {{ 'selected' if order.market == 'Export' else '' }}>Export</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Payment Terms</label>
                    <input type="text" name="payment_terms" value="{{ order.payment_terms or '' }}" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Delivery Terms</label>
                    <input type="text" name="delivery_terms" value="{{ order.delivery_terms or '' }}" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Currency</label>
                    <select name="currency" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="AED" {{ 'selected' if order.currency == 'AED' else '' }}>AED</option>
                        <option value="USD" {{ 'selected' if order.currency == 'USD' else '' }}>USD</option>
                        <option value="EUR" {{ 'selected' if order.currency == 'EUR' else '' }}>EUR</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Priority</label>
                    <select name="priority" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                        <option value="Low" {{ 'selected' if order.priority == 'Low' else '' }}>Low</option>
                        <option value="Medium" {{ 'selected' if order.priority == 'Medium' else '' }}>Medium</option>
                        <option value="High" {{ 'selected' if order.priority == 'High' else '' }}>High</option>
                        <option value="Critical" {{ 'selected' if order.priority == 'Critical' else '' }}>Critical</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Delivery Address</label>
                <textarea name="delivery_address" rows="2" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">{{ order.delivery_address or '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
                <textarea name="notes" rows="3" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">{{ order.notes or '' }}</textarea>
            </div>
        </div>

        <div class="px-6 py-4 bg-gray-50 dark:bg-gray-700 rounded-b-lg flex justify-end gap-3">
            <a href="{{ url_for('sales_orders') }}" class="px-4 py-2 bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i> {{ 'Update' if form_action == 'edit' else 'Create' }} Order
            </button>
        </div>
    </form>
</div>
{% endblock %}
