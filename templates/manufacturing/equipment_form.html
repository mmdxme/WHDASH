{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-tools me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('add_equipment', 'Add Equipment') }}
        </h1>
        <a href="{{ url_for('manufacturing.equipment_list') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-cogs me-2"></i>{{ t('equipment_details', 'Equipment Details') }}
                    </h6>
                </div>
                <div class="card-body">
                    <form method="POST" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="code" class="form-label">{{ t('code', 'Code') }} <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="code" name="code" required maxlength="20">
                            </div>

                            <div class="col-md-6">
                                <label for="name" class="form-label">{{ t('name', 'Name') }} <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required maxlength="100">
                            </div>

                            <div class="col-md-6">
                                <label for="work_center_id" class="form-label">{{ t('work_center', 'Work Center') }}</label>
                                <select class="form-select" id="work_center_id" name="work_center_id">
                                    <option value="">{{ t('select_center', 'Select Work Center') }}</option>
                                    {% for center in work_centers %}
                                    <option value="{{ center.id }}">{{ center.code }} - {{ center.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="equipment_type" class="form-label">{{ t('type', 'Type') }}</label>
                                <select class="form-select" id="equipment_type" name="equipment_type">
                                    <option value="">{{ t('select_type', 'Select Type') }}</option>
                                    <option value="MACHINE">{{ t('machine', 'Machine') }}</option>
                                    <option value="ROBOT">{{ t('robot', 'Robot') }}</option>
                                    <option value="CONVEYOR">{{ t('conveyor', 'Conveyor') }}</option>
                                    <option value="TEST_EQUIPMENT">{{ t('test_equip', 'Test Equipment') }}</option>
                                    <option value="OTHER">{{ t('other', 'Other') }}</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="serial_number" class="form-label">{{ t('serial_number', 'Serial Number') }}</label>
                                <input type="text" class="form-control" id="serial_number" name="serial_number">
                            </div>

                            <div class="col-md-6">
                                <label for="install_date" class="form-label">{{ t('install_date', 'Install Date') }}</label>
                                <input type="date" class="form-control" id="install_date" name="install_date">
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">{{ t('status', 'Status') }}</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="ACTIVE">{{ t('active', 'Active') }}</option>
                                    <option value="MAINTENANCE">{{ t('maintenance', 'Maintenance') }}</option>
                                    <option value="INACTIVE">{{ t('inactive', 'Inactive') }}</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="notes" class="form-label">{{ t('notes', 'Notes') }}</label>
                                <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('manufacturing.equipment_list') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i> {{ t('cancel', 'Cancel') }}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> {{ t('save_equipment', 'Save Equipment') }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
