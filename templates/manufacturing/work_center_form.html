{% extends "base.html" %}

{% block title %}Create Work Center - WHDASH{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h1 class="mt-4 mb-4">
                <i class="fas fa-plus"></i> Create Work Center
            </h1>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <a href="{{ url_for('manufacturing.work_centers') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Work Centers
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h5>New Work Center</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="form-group">
                            <label for="code">Code</label>
                            <input type="text" class="form-control" id="code" name="code" required>
                        </div>

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" class="form-control" id="location" name="location">
                        </div>

                        <div class="form-group">
                            <label for="capacity_hours">Capacity (hours/day)</label>
                            <input type="number" class="form-control" id="capacity_hours" name="capacity_hours" value="8" step="0.5">
                        </div>

                        <div class="form-group">
                            <label for="efficiency">Efficiency (%)</label>
                            <input type="number" class="form-control" id="efficiency" name="efficiency" value="100" min="0" max="150">
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Create Work Center
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
