{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h1 class="mt-4 mb-4">
                <i class="fas fa-plus"></i> Create Production Order
            </h1>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <a href="{{ url_for('manufacturing.orders') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Orders
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h5>New Production Order</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="form-group">
                            <label for="product_id">Product ID</label>
                            <input type="number" class="form-control" id="product_id" name="product_id" required>
                        </div>

                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" step="0.01" required>
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="DRAFT">Draft</option>
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="IN_PROGRESS">In Progress</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select class="form-control" id="priority" name="priority">
                                <option value="NORMAL">Normal</option>
                                <option value="HIGH">High</option>
                                <option value="URGENT">Urgent</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="work_center_id">Work Center ID</label>
                            <input type="number" class="form-control" id="work_center_id" name="work_center_id">
                        </div>

                        <div class="form-group">
                            <label for="scheduled_start">Scheduled Start</label>
                            <input type="datetime-local" class="form-control" id="scheduled_start" name="scheduled_start">
                        </div>

                        <div class="form-group">
                            <label for="scheduled_end">Scheduled End</label>
                            <input type="datetime-local" class="form-control" id="scheduled_end" name="scheduled_end">
                        </div>

                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Create Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
