{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in pb-20">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('ci_segments') }}" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h2 class="text-3xl font-extrabold text-white tracking-tight">Create Segment</h2>
                <p class="text-slate-500 font-medium mt-1 text-xs uppercase tracking-widest">Define a new customer segment</p>
            </div>
        </div>
    </div>

    <div class="glass-panel rounded-3xl p-6 shadow-2xl border border-white/5 max-w-2xl">
        <form method="post" class="space-y-5">
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Segment Name *</label>
                <input type="text" name="segment_name" required placeholder="e.g. High-Value Exporters" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Segment Code *</label>
                <input type="text" name="segment_code" required placeholder="e.g. high_export" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                <p class="text-[10px] text-slate-600 mt-1">Unique code, lowercase with underscores</p>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Type</label>
                <select name="segment_type" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                    <option value="behavioral">Behavioral</option>
                    <option value="demographic">Demographic</option>
                    <option value="geographic">Geographic</option>
                    <option value="value_based">Value-Based</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Description</label>
                <textarea name="description" rows="3" placeholder="Describe this segment's characteristics..." class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500"></textarea>
            </div>
            <div>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_dynamic" class="w-4 h-4 rounded accent-brand-500">
                    <div>
                        <span class="text-sm text-white font-bold">Dynamic Segment</span>
                        <p class="text-[10px] text-slate-500">Automatically update membership based on rules</p>
                    </div>
                </label>
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="px-6 py-3 bg-brand-500/20 hover:bg-brand-500/30 text-brand-400 border border-brand-500/30 rounded-xl text-sm font-bold transition-all">
                    <i class="fa-solid fa-plus mr-2"></i> Create Segment
                </button>
                <a href="{{ url_for('ci_segments') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 text-slate-400 border border-white/10 rounded-xl text-sm font-bold transition-all">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
