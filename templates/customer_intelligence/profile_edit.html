{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in pb-20">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('ci_profiles') }}" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h2 class="text-3xl font-extrabold text-white tracking-tight">{{ 'Edit Customer' if customer else 'Create Customer' }}</h2>
                <p class="text-slate-500 font-medium mt-1 text-xs uppercase tracking-widest">Customer Intelligence Profile</p>
            </div>
        </div>
    </div>

    <div class="glass-panel rounded-3xl p-6 shadow-2xl border border-white/5 max-w-3xl">
        <form method="post" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Customer Name *</label>
                    <input type="text" name="name" required value="{{ customer.name if customer else '' }}" placeholder="Full name or company" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Phone</label>
                    <input type="text" name="phone" value="{{ customer.phone if customer else '' }}" placeholder="+971 50 123 4567" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Email</label>
                    <input type="email" name="email" value="{{ customer.email if customer else '' }}" placeholder="customer@example.com" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">City</label>
                    <input type="text" name="city" value="{{ customer.city if customer else '' }}" placeholder="Dubai" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Country</label>
                    <input type="text" name="country" value="{{ customer.country if customer else '' }}" placeholder="UAE" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Location / Type</label>
                    <select name="location" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                        <option value="retail" {% if customer and customer.location == 'retail' %}selected{% endif %}>Retail</option>
                        <option value="wholesale" {% if customer and customer.location == 'wholesale' %}selected{% endif %}>Wholesale</option>
                        <option value="export" {% if customer and customer.location == 'export' %}selected{% endif %}>Export</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Salesperson</label>
                    <input type="text" name="salesperson_name" value="{{ customer.salesperson_name if customer else '' }}" placeholder="Salesperson name" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Credit Limit</label>
                    <input type="number" step="0.01" name="credit_limit" value="{{ customer.credit_limit if customer else '0' }}" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-2">Payment Method</label>
                    <select name="payment_method" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                        <option value="Net 30" {% if customer and customer.payment_method == 'Net 30' %}selected{% endif %}>Net 30</option>
                        <option value="Net 60" {% if customer and customer.payment_method == 'Net 60' %}selected{% endif %}>Net 60</option>
                        <option value="Cash" {% if customer and customer.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
                        <option value="Prepaid" {% if customer and customer.payment_method == 'Prepaid' %}selected{% endif %}>Prepaid</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 pt-7">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="active" value="1" {% if not customer or customer.active %}checked{% endif %} class="w-4 h-4 rounded accent-brand-500">
                        <span class="text-sm text-white font-bold">Active Customer</span>
                    </label>
                </div>
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="px-6 py-3 bg-brand-500/20 hover:bg-brand-500/30 text-brand-400 border border-brand-500/30 rounded-xl text-sm font-bold transition-all">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> {{ 'Save Changes' if customer else 'Create Customer' }}
                </button>
                <a href="{{ url_for('ci_profiles') }}" class="px-6 py-3 bg-white/5 hover:bg-white/10 text-slate-400 border border-white/10 rounded-xl text-sm font-bold transition-all">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
