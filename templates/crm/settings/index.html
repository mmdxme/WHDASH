{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">CRM Settings</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-1">Configure your CRM module settings</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <a href="{{ url_for('crm_settings_sources') }}"
           class="bg-white dark:bg-gray-800 rounded-lg shadow hover:shadow-lg transition p-6">
            <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900 rounded-lg flex items-center justify-center mb-4">
                <i class="fas fa-funnel text-blue-600 text-xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">Lead Sources</h3>
            <p class="text-sm text-gray-500">Manage lead source options</p>
        </a>

        <a href="{{ url_for('crm_settings_stages') }}"
           class="bg-white dark:bg-gray-800 rounded-lg shadow hover:shadow-lg transition p-6">
            <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-900 rounded-lg flex items-center justify-center mb-4">
                <i class="fas fa-layer-group text-indigo-600 text-xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">Opportunity Stages</h3>
            <p class="text-sm text-gray-500">Configure pipeline stages</p>
        </a>

        <a href="{{ url_for('crm_settings_sources') }}"
           class="bg-white dark:bg-gray-800 rounded-lg shadow hover:shadow-lg transition p-6">
            <div class="w-12 h-12 bg-green-100 dark:bg-green-900 rounded-lg flex items-center justify-center mb-4">
                <i class="fas fa-tag text-green-600 text-xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">Lead Scoring</h3>
            <p class="text-sm text-gray-500">Configure scoring criteria</p>
        </a>
    </div>
</div>
{% endblock %}
