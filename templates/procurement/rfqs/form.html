{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 1100px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>{{ 'New RFQ' if is_new else 'Edit RFQ' }}</h2>
        <a href="{{ url_for('procurement_rfqs') }}" class="proc-btn proc-btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">RFQ Details</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-3">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Date</label>
                        <input type="date" name="rfq_date" class="proc-filter-input" required value="{{ rfq.rfq_date[:10] if rfq else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Response Due Date</label>
                        <input type="date" name="response_due_date" class="proc-filter-input" value="{{ rfq.response_due_date[:10] if rfq else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Requested Delivery</label>
                        <input type="date" name="requested_delivery_date" class="proc-filter-input" value="{{ rfq.requested_delivery_date[:10] if rfq else '' }}">
                    </div>
                </div>
                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Currency</label>
                        <select name="currency" class="proc-filter-select">
                            <option value="AED" {% if (not rfq) or (rfq.currency == 'AED') %}selected{% endif %}>AED</option>
                            <option value="USD" {% if rfq and rfq.currency == 'USD' %}selected{% endif %}>USD</option>
                            <option value="EUR" {% if rfq and rfq.currency == 'EUR' %}selected{% endif %}>EUR</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Incoterm</label>
                        <input type="text" name="incoterm" class="proc-filter-input" value="{{ rfq.incoterm if rfq else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Payment Terms</label>
                        <input type="text" name="payment_terms" class="proc-filter-input" value="{{ rfq.payment_terms if rfq else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Urgency</label>
                        <select name="urgency" class="proc-filter-select">
                            <option value="NORMAL" {% if (not rfq) or (rfq.urgency == 'NORMAL') %}selected{% endif %}>Normal</option>
                            <option value="URGENT" {% if rfq and rfq.urgency == 'URGENT' %}selected{% endif %}>Urgent</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Delivery Address</label>
                        <input type="text" name="delivery_address" class="proc-filter-input" value="{{ rfq.delivery_address if rfq else '' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Suppliers</h3>
            </div>
            <div class="proc-card-body">
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                    {% for s in suppliers %}
                    <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="supplier_ids" value="{{ s.id }}" {% if prefill and prefill.supplier_id == s.id %}checked{% endif %}>
                        {{ s.name }} ({{ s.country or 'N/A' }})
                    </label>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Line Items</h3>
                <button type="button" class="proc-btn proc-btn-sm proc-btn-primary" onclick="addLine()"><i class="fa fa-plus"></i> Add Line</button>
            </div>
            <table class="proc-table">
                <thead>
                    <tr>
                        <th>Item Code</th>
                        <th>Item Name</th>
                        <th>Brand</th>
                        <th>Part Number</th>
                        <th>Qty</th>
                        <th>Target Price</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="linesBody">
                    <tr>
                        <td><input type="text" name="item_code" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="item_name" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="brand" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="part_number" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" name="requested_qty" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="target_price" class="proc-filter-input" style="width: 100%;"></td>
                        <td><button type="button" class="proc-btn proc-btn-sm proc-btn-danger" onclick="removeLine(this)"><i class="fa fa-trash"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <a href="{{ url_for('procurement_rfqs') }}" class="proc-btn proc-btn-secondary">Cancel</a>
            <button type="submit" class="proc-btn proc-btn-primary"><i class="fa fa-save"></i> Create RFQ</button>
        </div>
    </form>
</div>

<script>
function addLine() {
    const tbody = document.getElementById('linesBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="text" name="item_code" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="item_name" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="brand" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="part_number" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" name="requested_qty" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="target_price" class="proc-filter-input" style="width: 100%;"></td>
        <td><button type="button" class="proc-btn proc-btn-sm proc-btn-danger" onclick="removeLine(this)"><i class="fa fa-trash"></i></button></td>`;
    tbody.appendChild(tr);
}
function removeLine(btn) { btn.closest('tr').remove(); }
</script>
{% endblock %}
