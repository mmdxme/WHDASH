{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 1100px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>{{ 'New Purchase Order' if is_new else 'Edit Purchase Order' }}</h2>
        <a href="{{ url_for('procurement_orders') }}" class="proc-btn proc-btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">PO Details</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-3">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">PO Date</label>
                        <input type="date" name="po_date" class="proc-filter-input" required value="{{ order.po_date[:10] if order else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">PO Type</label>
                        <select name="po_type" class="proc-filter-select">
                            <option value="STANDARD" {% if (not order) or (order.po_type == 'STANDARD') %}selected{% endif %}>Standard</option>
                            <option value="EMERGENCY" {% if order and order.po_type == 'EMERGENCY' %}selected{% endif %}>Emergency</option>
                            <option value="IMPORT" {% if order and order.po_type == 'IMPORT' %}selected{% endif %}>Import</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Expected Delivery</label>
                        <input type="date" name="expected_delivery_date" class="proc-filter-input" value="{{ order.expected_delivery_date[:10] if order else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier *</label>
                        <select name="supplier_id" class="proc-filter-select" required>
                            <option value="">-- Select --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}" {% if order and order.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier Name</label>
                        <input type="text" name="supplier_name" class="proc-filter-input" value="{{ order.supplier_name if order else '' }}">
                    </div>
                </div>
                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Currency</label>
                        <select name="currency" class="proc-filter-select">
                            <option value="AED" {% if (not order) or (order.currency == 'AED') %}selected{% endif %}>AED</option>
                            <option value="USD" {% if order and order.currency == 'USD' %}selected{% endif %}>USD</option>
                            <option value="EUR" {% if order and order.currency == 'EUR' %}selected{% endif %}>EUR</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Payment Terms</label>
                        <input type="text" name="payment_terms" class="proc-filter-input" value="{{ order.payment_terms if order else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Incoterm</label>
                        <input type="text" name="incoterm" class="proc-filter-input" value="{{ order.incoterm if order else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Company</label>
                        <select name="company_id" class="proc-filter-select">
                            <option value="">-- Select --</option>
                            {% for c in companies %}
                            <option value="{{ c.id }}" {% if order and order.company_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Warehouse</label>
                        <select name="warehouse_id" class="proc-filter-select">
                            <option value="">-- Select --</option>
                            {% for w in warehouses %}
                            <option value="{{ w.id }}" {% if order and order.warehouse_id == w.id %}selected{% endif %}>{{ w.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Line Items</h3>
                <button type="button" class="proc-btn proc-btn-sm proc-btn-primary" onclick="addLine()"><i class="fa fa-plus"></i> Add Line</button>
            </div>
            <table class="proc-table">
                <thead>
                    <tr><th>Item Code</th><th>Item Name</th><th>Brand</th><th>Part Number</th><th>Qty</th><th>Unit Price</th><th>Discount %</th><th>Line Total</th><th></th></tr>
                </thead>
                <tbody id="linesBody">
                    <tr>
                        <td><input type="text" name="item_code" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="item_name" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="brand" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="part_number" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" name="ordered_qty" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="unit_price" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="discount_percent" class="proc-filter-input" value="0" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="line_total" class="proc-filter-input" style="width: 100%;" readonly></td>
                        <td><button type="button" class="proc-btn proc-btn-sm proc-btn-danger" onclick="removeLine(this)"><i class="fa fa-trash"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <a href="{{ url_for('procurement_orders') }}" class="proc-btn proc-btn-secondary">Cancel</a>
            <button type="submit" class="proc-btn proc-btn-primary"><i class="fa fa-save"></i> Create PO</button>
        </div>
    </form>
</div>

<script>
function addLine() {
    const tbody = document.getElementById('linesBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="text" name="item_code" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="item_name" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="brand" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="part_number" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" name="ordered_qty" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="unit_price" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="discount_percent" class="proc-filter-input" value="0" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="line_total" class="proc-filter-input" style="width: 100%;" readonly></td>
        <td><button type="button" class="proc-btn proc-btn-sm proc-btn-danger" onclick="removeLine(this)"><i class="fa fa-trash"></i></button></td>`;
    tbody.appendChild(tr);
}
function removeLine(btn) { btn.closest('tr').remove(); }
</script>
{% endblock %}
