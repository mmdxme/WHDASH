{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 900px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem;">Procurement Settings</h2>

    <form method="POST" action="{{ url_for('procurement_settings_save') }}">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">Numbering</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Requisition Prefix</label>
                        <input type="text" name="setting_proc_requisition_prefix" class="proc-filter-input" value="{{ settings.NUMBERING[0].setting_value if settings.NUMBERING else 'PR' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">RFQ Prefix</label>
                        <input type="text" name="setting_proc_rfq_prefix" class="proc-filter-input" value="{{ settings.NUMBERING[1].setting_value if settings.NUMBERING else 'RFQ' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Quotation Prefix</label>
                        <input type="text" name="setting_proc_quotation_prefix" class="proc-filter-input" value="{{ settings.NUMBERING[2].setting_value if settings.NUMBERING else 'QT' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">PO Prefix</label>
                        <input type="text" name="setting_proc_po_prefix" class="proc-filter-input" value="{{ settings.NUMBERING[3].setting_value if settings.NUMBERING else 'PO' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">General</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Default Currency</label>
                        <select name="setting_default_currency" class="proc-filter-select">
                            <option value="AED">AED</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Default Incoterm</label>
                        <input type="text" name="setting_default_incoterm" class="proc-filter-input" value="{{ settings.GENERAL[0].setting_value if settings.GENERAL else 'DDP' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">Approvals</h3></div>
            <div class="proc-card-body">
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="setting_emergency_purchase_requires_approval" value="1" checked>
                        Emergency purchases require approval
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="setting_po_below_moq_requires_approval" value="1" checked>
                        PO below MOQ requires approval
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="setting_single_source_requires_justification" value="1" checked>
                        Single source requires justification
                    </label>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">SLAs</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-3">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">RFQ Response SLA (days)</label>
                        <input type="number" name="setting_supplier_response_sla_days" class="proc-filter-input" value="{{ settings.SLA[0].setting_value if settings.SLA else '7' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Requisition Approval SLA (hours)</label>
                        <input type="number" name="setting_requisition_approval_sla_hours" class="proc-filter-input" value="{{ settings.SLA[1].setting_value if settings.SLA else '24' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Claim Resolution SLA (days)</label>
                        <input type="number" name="setting_claim_resolution_sla_days" class="proc-filter-input" value="{{ settings.SLA[2].setting_value if settings.SLA else '14' }}">
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <button type="submit" class="proc-btn proc-btn-primary">
                <i class="fa fa-save"></i> Save Settings
            </button>
        </div>
    </form>
</div>
{% endblock %}
