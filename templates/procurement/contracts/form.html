{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 900px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>{{ 'New Contract' if is_new else 'Edit Contract' }}</h2>
        <a href="{{ url_for('procurement_contracts') }}" class="proc-btn proc-btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">Contract Details</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier *</label>
                        <select name="supplier_id" class="proc-filter-select" required>
                            <option value="">-- Select --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Contract Name</label>
                        <input type="text" name="contract_name" class="proc-filter-input" value="{{ contract.contract_name if contract else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Type</label>
                        <select name="contract_type" class="proc-filter-select">
                            <option value="STANDARD" {% if (not contract) or (contract.contract_type == 'STANDARD') %}selected{% endif %}>Standard</option>
                            <option value="ANNUAL" {% if contract and contract.contract_type == 'ANNUAL' %}selected{% endif %}>Annual</option>
                            <option value="RATE_CARD" {% if contract and contract.contract_type == 'RATE_CARD' %}selected{% endif %}>Rate Card</option>
                            <option value="REBATE" {% if contract and contract.contract_type == 'REBATE' %}selected{% endif %}>Rebate Agreement</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Total Value</label>
                        <input type="number" step="0.01" name="total_value" class="proc-filter-input" value="{{ contract.total_value if contract else 0 }}">
                    </div>
                </div>
                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Start Date</label>
                        <input type="date" name="start_date" class="proc-filter-input" value="{{ contract.start_date[:10] if contract and contract.start_date else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">End Date</label>
                        <input type="date" name="end_date" class="proc-filter-input" value="{{ contract.end_date[:10] if contract and contract.end_date else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Currency</label>
                        <select name="currency" class="proc-filter-select">
                            <option value="AED" {% if (not contract) or (contract.currency == 'AED') %}selected{% endif %}>AED</option>
                            <option value="USD" {% if contract and contract.currency == 'USD' %}selected{% endif %}>USD</option>
                        </select>
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Payment Terms</label>
                        <input type="text" name="payment_terms" class="proc-filter-input" value="{{ contract.payment_terms if contract else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Incoterm</label>
                        <input type="text" name="incoterm" class="proc-filter-input" value="{{ contract.incoterm if contract else '' }}">
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Special Conditions</label>
                        <textarea name="special_conditions" class="proc-filter-input" rows="3">{{ contract.special_conditions if contract else '' }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <a href="{{ url_for('procurement_contracts') }}" class="proc-btn proc-btn-secondary">Cancel</a>
            <button type="submit" class="proc-btn proc-btn-primary"><i class="fa fa-save"></i> Create Contract</button>
        </div>
    </form>
</div>
{% endblock %}
