{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 900px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0; color: var(--proc-dark);">
            {{ 'New Supplier' if is_new else 'Edit Supplier' }}
        </h2>
        <a href="{{ url_for('procurement_suppliers') }}" class="proc-btn proc-btn-secondary">
            <i class="fa fa-arrow-left"></i> Back
        </a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Basic Information</h3>
            </div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier Code *</label>
                        <input type="text" name="code" class="proc-filter-input" required
                               value="{{ supplier.code if supplier else '' }}"
                               placeholder="e.g., SUP-001">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier Name *</label>
                        <input type="text" name="name" class="proc-filter-input" required
                               value="{{ supplier.name if supplier else '' }}">
                    </div>
                </div>

                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Trade Name</label>
                        <input type="text" name="trade_name" class="proc-filter-input"
                               value="{{ supplier.trade_name if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier Type</label>
                        <select name="supplier_type" class="proc-filter-select">
                            <option value="LOCAL" {% if supplier and supplier.supplier_type == 'LOCAL' %}selected{% endif %}>Local</option>
                            <option value="INTERNATIONAL" {% if supplier and supplier.supplier_type == 'INTERNATIONAL' %}selected{% endif %}>International</option>
                            <option value="STRATEGIC" {% if supplier and supplier.supplier_type == 'STRATEGIC' %}selected{% endif %}>Strategic</option>
                            <option value="EMERGENCY" {% if supplier and supplier.supplier_type == 'EMERGENCY' %}selected{% endif %}>Emergency</option>
                        </select>
                    </div>
                </div>

                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Status</label>
                        <select name="status" class="proc-filter-select">
                            <option value="Active" {% if (not supplier) or (supplier.status == 'Active') %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if supplier and supplier.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Category</label>
                        <input type="text" name="category" class="proc-filter-input"
                               value="{{ supplier.category if supplier else '' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Contact Information</h3>
            </div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Contact Person</label>
                        <input type="text" name="contact_person" class="proc-filter-input"
                               value="{{ supplier.contact_person if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Email</label>
                        <input type="email" name="email" class="proc-filter-input"
                               value="{{ supplier.email if supplier else '' }}">
                    </div>
                </div>

                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Phone</label>
                        <input type="text" name="phone" class="proc-filter-input"
                               value="{{ supplier.phone if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">WhatsApp</label>
                        <input type="text" name="whatsapp" class="proc-filter-input"
                               value="{{ supplier.whatsapp if supplier else '' }}">
                    </div>
                </div>

                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Address</label>
                        <textarea name="address" class="proc-filter-input" rows="2">{{ supplier.address if supplier else '' }}</textarea>
                    </div>
                </div>

                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">City</label>
                        <input type="text" name="city" class="proc-filter-input"
                               value="{{ supplier.city if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Country</label>
                        <input type="text" name="country" class="proc-filter-input"
                               value="{{ supplier.country if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Region</label>
                        <input type="text" name="region" class="proc-filter-input"
                               value="{{ supplier.region if supplier else '' }}">
                    </div>
                </div>

                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Website</label>
                        <input type="url" name="website" class="proc-filter-input"
                               value="{{ supplier.website if supplier else '' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Commercial Terms</h3>
            </div>
            <div class="proc-card-body">
                <div class="proc-grid-3">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Currency</label>
                        <select name="currency" class="proc-filter-select">
                            <option value="AED" {% if (not supplier) or (supplier.currency == 'AED') %}selected{% endif %}>AED</option>
                            <option value="USD" {% if supplier and supplier.currency == 'USD' %}selected{% endif %}>USD</option>
                            <option value="EUR" {% if supplier and supplier.currency == 'EUR' %}selected{% endif %}>EUR</option>
                            <option value="GBP" {% if supplier and supplier.currency == 'GBP' %}selected{% endif %}>GBP</option>
                            <option value="SAR" {% if supplier and supplier.currency == 'SAR' %}selected{% endif %}>SAR</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Payment Terms</label>
                        <input type="text" name="payment_terms" class="proc-filter-input"
                               value="{{ supplier.payment_terms if supplier else 'Net 30' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Lead Time (Days)</label>
                        <input type="number" name="lead_time_standard" class="proc-filter-input"
                               value="{{ supplier.lead_time_standard if supplier else '' }}">
                    </div>
                </div>

                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">MOQ</label>
                        <input type="number" name="moq" class="proc-filter-input" step="0.01"
                               value="{{ supplier.moq if supplier else 1 }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Order Multiple</label>
                        <input type="number" name="order_multiple" class="proc-filter-input" step="0.01"
                               value="{{ supplier.order_multiple if supplier else 1 }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Risk Level</label>
                        <select name="risk_level" class="proc-filter-select">
                            <option value="LOW" {% if (not supplier) or (supplier.risk_level == 'LOW') %}selected{% endif %}>Low</option>
                            <option value="MEDIUM" {% if supplier and supplier.risk_level == 'MEDIUM' %}selected{% endif %}>Medium</option>
                            <option value="HIGH" {% if supplier and supplier.risk_level == 'HIGH' %}selected{% endif %}>High</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Preferences & Flags</h3>
            </div>
            <div class="proc-card-body">
                <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="is_preferred" value="1"
                               {% if supplier and supplier.is_preferred %}checked{% endif %}>
                        Preferred Supplier
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="is_strategic" value="1"
                               {% if supplier and supplier.is_strategic %}checked{% endif %}>
                        Strategic Supplier
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="is_emergency" value="1"
                               {% if supplier and supplier.is_emergency %}checked{% endif %}>
                        Emergency Supplier
                    </label>
                    {% if not is_new %}
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="is_blacklisted" value="1"
                               {% if supplier and supplier.is_blacklisted %}checked{% endif %}>
                        Blacklisted
                    </label>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Banking & Tax</h3>
            </div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Tax Number</label>
                        <input type="text" name="tax_number" class="proc-filter-input"
                               value="{{ supplier.tax_number if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">VAT Number</label>
                        <input type="text" name="vat_number" class="proc-filter-input"
                               value="{{ supplier.vat_number if supplier else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Bank Name</label>
                        <input type="text" name="bank_name" class="proc-filter-input"
                               value="{{ supplier.bank_name if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Bank Account</label>
                        <input type="text" name="bank_account" class="proc-filter-input"
                               value="{{ supplier.bank_account if supplier else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">SWIFT Code</label>
                        <input type="text" name="swift_code" class="proc-filter-input"
                               value="{{ supplier.swift_code if supplier else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">IBAN</label>
                        <input type="text" name="iban" class="proc-filter-input"
                               value="{{ supplier.iban if supplier else '' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Additional Information</h3>
            </div>
            <div class="proc-card-body">
                <div class="proc-filter-group">
                    <label class="proc-filter-label">Related Brands</label>
                    <input type="text" name="related_brands" class="proc-filter-input"
                           value="{{ supplier.related_brands if supplier else '' }}"
                           placeholder="Comma-separated brands">
                </div>
                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Related Item Groups</label>
                        <input type="text" name="related_item_groups" class="proc-filter-input"
                               value="{{ supplier.related_item_groups if supplier else '' }}"
                               placeholder="Comma-separated groups">
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Notes</label>
                        <textarea name="notes" class="proc-filter-input" rows="3">{{ supplier.notes if supplier else '' }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <a href="{{ url_for('procurement_suppliers') }}" class="proc-btn proc-btn-secondary">
                Cancel
            </a>
            <button type="submit" class="proc-btn proc-btn-primary">
                <i class="fa fa-save"></i>
                {{ 'Create Supplier' if is_new else 'Update Supplier' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
