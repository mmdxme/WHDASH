{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>{{ 'New Claim' if is_new else 'Edit Claim' }}</h2>
        <a href="{{ url_for('procurement_claims') }}" class="proc-btn proc-btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">Claim Details</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier *</label>
                        <select name="supplier_id" class="proc-filter-select" required>
                            <option value="">-- Select --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Claim Date</label>
                        <input type="date" name="claim_date" class="proc-filter-input" value="{{ claim.claim_date[:10] if claim else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Claim Type</label>
                        <select name="claim_type" class="proc-filter-select">
                            <option value="QUALITY">Quality Issue</option>
                            <option value="QUANTITY">Quantity Issue</option>
                            <option value="DAMAGE">Damage</option>
                            <option value="WRONG_ITEM">Wrong Item</option>
                            <option value="DELAY">Late Delivery</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Issue Type</label>
                        <input type="text" name="issue_type" class="proc-filter-input" value="{{ claim.issue_type if claim else '' }}">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Affected Qty</label>
                        <input type="number" name="affected_qty" class="proc-filter-input" value="{{ claim.affected_qty if claim else 0 }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Unit Cost</label>
                        <input type="number" step="0.01" name="unit_cost" class="proc-filter-input" value="{{ claim.unit_cost if claim else 0 }}">
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Issue Description</label>
                        <textarea name="issue_description" class="proc-filter-input" rows="3">{{ claim.issue_description if claim else '' }}</textarea>
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Requested Resolution</label>
                        <select name="requested_resolution" class="proc-filter-select">
                            <option value="CREDIT">Credit Note</option>
                            <option value="REPLACEMENT">Replacement</option>
                            <option value="REFUND">Refund</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <a href="{{ url_for('procurement_claims') }}" class="proc-btn proc-btn-secondary">Cancel</a>
            <button type="submit" class="proc-btn proc-btn-primary"><i class="fa fa-save"></i> Create Claim</button>
        </div>
    </form>
</div>
{% endblock %}
