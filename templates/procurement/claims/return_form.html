{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>New Return</h2>
        <a href="{{ url_for('procurement_claims') }}" class="proc-btn proc-btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">Return Details</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier *</label>
                        <select name="supplier_id" class="proc-filter-select" required>
                            <option value="">-- Select --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Return Date</label>
                        <input type="date" name="return_date" class="proc-filter-input" value="">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Item Name</label>
                        <input type="text" name="item_name" class="proc-filter-input">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Part Number</label>
                        <input type="text" name="part_number" class="proc-filter-input">
                    </div>
                </div>
                <div class="proc-grid-2" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Return Qty</label>
                        <input type="number" name="return_qty" class="proc-filter-input" value="0">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Return Type</label>
                        <select name="return_type" class="proc-filter-select">
                            <option value="RETURN">Return</option>
                            <option value="REPLACEMENT">Replacement</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Return Reason</label>
                        <textarea name="return_reason" class="proc-filter-input" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
            <a href="{{ url_for('procurement_claims') }}" class="proc-btn proc-btn-secondary">Cancel</a>
            <button type="submit" class="proc-btn proc-btn-primary"><i class="fa fa-save"></i> Create Return</button>
        </div>
    </form>
</div>
{% endblock %}
