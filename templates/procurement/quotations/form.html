{% extends "procurement/base.html" %}

{% block proc_content %}
<div style="max-width: 1100px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>{{ 'New Quotation' if is_new else 'Edit Quotation' }}</h2>
        <a href="{{ url_for('procurement_quotations') }}" class="proc-btn proc-btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST">
        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header"><h3 class="proc-card-title">Quotation Details</h3></div>
            <div class="proc-card-body">
                <div class="proc-grid-2">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier *</label>
                        <select name="supplier_id" class="proc-filter-select" required>
                            <option value="">-- Select --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Supplier Name</label>
                        <input type="text" name="supplier_name" class="proc-filter-input" value="{{ quotation.supplier_name if quotation else '' }}">
                    </div>
                </div>
                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Quote Date</label>
                        <input type="date" name="quotation_date" class="proc-filter-input" value="{{ quotation.quotation_date[:10] if quotation else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Valid Until</label>
                        <input type="date" name="validity_date" class="proc-filter-input" value="{{ quotation.validity_date[:10] if quotation else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Lead Time (Days)</label>
                        <input type="number" name="lead_time_days" class="proc-filter-input" value="{{ quotation.lead_time_days if quotation else '' }}">
                    </div>
                </div>
                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Currency</label>
                        <select name="currency" class="proc-filter-select">
                            <option value="AED" {% if (not quotation) or (quotation.currency == 'AED') %}selected{% endif %}>AED</option>
                            <option value="USD" {% if quotation and quotation.currency == 'USD' %}selected{% endif %}>USD</option>
                            <option value="EUR" {% if quotation and quotation.currency == 'EUR' %}selected{% endif %}>EUR</option>
                        </select>
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Incoterm</label>
                        <input type="text" name="incoterm" class="proc-filter-input" value="{{ quotation.incoterm if quotation else '' }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Payment Terms</label>
                        <input type="text" name="payment_terms" class="proc-filter-input" value="{{ quotation.payment_terms if quotation else '' }}">
                    </div>
                </div>
                <div class="proc-grid-3" style="margin-top: 1rem;">
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">MOQ</label>
                        <input type="number" name="moq" class="proc-filter-input" value="{{ quotation.moq if quotation else 1 }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Order Multiple</label>
                        <input type="number" name="order_multiple" class="proc-filter-input" value="{{ quotation.order_multiple if quotation else 1 }}">
                    </div>
                    <div class="proc-filter-group">
                        <label class="proc-filter-label">Freight Cost</label>
                        <input type="number" step="0.01" name="freight_cost" class="proc-filter-input" value="{{ quotation.freight_cost if quotation else 0 }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="proc-card" style="margin-bottom: 1rem;">
            <div class="proc-card-header">
                <h3 class="proc-card-title">Line Items</h3>
                <button type="button" class="proc-btn proc-btn-sm proc-btn-primary" onclick="addLine()"><i class="fa fa-plus"></i> Add Line</button>
            </div>
            <table class="proc-table">
                <thead>
                    <tr><th>Item Code</th><th>Item Name</th><th>Brand</th><th>Part Number</th><th>Qty</th><th>Unit Price</th><th>Discount %</th><th>Final Price</th><th></th></tr>
                </thead>
                <tbody id="linesBody">
                    <tr>
                        <td><input type="text" name="item_code" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="item_name" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="brand" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="text" name="part_number" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" name="quoted_qty" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="unit_price" class="proc-filter-input" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="discount_percent" class="proc-filter-input" value="0" style="width: 100%;"></td>
                        <td><input type="number" step="0.01" name="final_unit_price" class="proc-filter-input" style="width: 100%;"></td>
                        <td><button type="button" class="proc-btn proc-btn-sm proc-btn-danger" onclick="removeLine(this)"><i class="fa fa-trash"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <a href="{{ url_for('procurement_quotations') }}" class="proc-btn proc-btn-secondary">Cancel</a>
            <button type="submit" class="proc-btn proc-btn-primary"><i class="fa fa-save"></i> Create Quotation</button>
        </div>
    </form>
</div>

<script>
function addLine() {
    const tbody = document.getElementById('linesBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="text" name="item_code" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="item_name" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="brand" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="text" name="part_number" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" name="quoted_qty" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="unit_price" class="proc-filter-input" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="discount_percent" class="proc-filter-input" value="0" style="width: 100%;"></td>
        <td><input type="number" step="0.01" name="final_unit_price" class="proc-filter-input" style="width: 100%;"></td>
        <td><button type="button" class="proc-btn proc-btn-sm proc-btn-danger" onclick="removeLine(this)"><i class="fa fa-trash"></i></button></td>`;
    tbody.appendChild(tr);
}
function removeLine(btn) { btn.closest('tr').remove(); }
</script>
{% endblock %}
