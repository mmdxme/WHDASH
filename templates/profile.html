{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto mt-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">My Profile</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Avatar Section -->
        <div class="col-span-1 bg-white dark:bg-slate-800 shadow-sm border border-gray-200 dark:border-slate-700 rounded-xl p-6 text-center">
            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">Profile Picture</h3>
            
            <div class="relative w-32 h-32 mx-auto mb-4">
                <img src="{{ url_for('static', filename='uploads/avatars/' + user.profile_pic) }}" alt="Avatar" class="w-full h-full rounded-full object-cover border-4 border-gray-100 dark:border-slate-700">
            </div>
            
            <form action="{{ url_for('profile') }}" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="update_avatar">
                <label class="block mb-2 text-sm text-gray-500 dark:text-gray-400">
                    <input type="file" name="avatar" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 dark:file:bg-slate-700 dark:file:text-white" accept="image/png, image/jpeg, image/gif" required>
                </label>
                <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none transition">
                    Upload New Picture
                </button>
            </form>
        </div>

        <!-- Details Section -->
        <div class="col-span-1 md:col-span-2 space-y-6">
            
            <!-- Basic Info Form -->
            <div class="bg-white dark:bg-slate-800 shadow-sm border border-gray-200 dark:border-slate-700 rounded-xl p-6">
                <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">Account Details</h3>
                
                <form action="{{ url_for('profile') }}" method="POST" class="space-y-4">
                    <input type="hidden" name="action" value="update_profile">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
                        <input type="text" name="username" value="{{ user.username }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email Address</label>
                        <input type="email" name="email" value="{{ user.email }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Role</label>
                        <input type="text" disabled value="{{ session.get('role_name') }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm bg-gray-100 dark:bg-slate-900 text-gray-500 sm:text-sm cursor-not-allowed">
                        <p class="text-xs text-gray-400 mt-1">Contact your administrator to change roles.</p>
                    </div>
                    
                    <div class="flex justify-end pt-2">
                        <button type="submit" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none transition">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>

            <!-- Password Change Form -->
            <div class="bg-white dark:bg-slate-800 shadow-sm border border-gray-200 dark:border-slate-700 rounded-xl p-6">
                <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">Change Password</h3>
                
                <form action="{{ url_for('profile') }}" method="POST" class="space-y-4">
                    <input type="hidden" name="action" value="update_password">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Current Password</label>
                        <input type="password" name="current_password" class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">New Password</label>
                        <input type="password" name="new_password" class="mt-1 block w-full px-3 py-2 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm" required>
                    </div>
                    
                    <div class="flex justify-end pt-2">
                        <button type="submit" class="py-2 px-4 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-700 hover:bg-gray-50 dark:hover:bg-slate-600 focus:outline-none transition">
                            Update Password
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
