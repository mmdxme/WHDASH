<!-- Workflow Header -->
<header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6">
    <!-- Left: Breadcrumb -->
    <div class="flex items-center gap-4">
        <nav class="flex items-center text-sm">
            <a href="{{ url_for('workflow_dashboard') }}" class="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                <i class="fas fa-project-diagram mr-1"></i> Workflow
            </a>
            <span class="text-slate-400 mx-2">/</span>
            <span class="text-slate-700 dark:text-slate-200 font-medium">{{ page_title }}</span>
        </nav>
    </div>
    
    <!-- Right: Actions -->
    <div class="flex items-center gap-4">
        <!-- Quick Search -->
        <div class="relative">
            <input type="text" id="quickSearch" placeholder="Search workflows..." 
                   class="w-64 pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-700 border-0 rounded-lg text-sm text-slate-600 dark:text-slate-300 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        </div>
        
        <!-- Notifications -->
        <button id="notificationBtn" class="relative p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
            <i class="fas fa-bell text-lg"></i>
            {% if notifications|length > 0 %}
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
            {% endif %}
        </button>
        
        <!-- User Dropdown -->
        <div class="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-700">
            <div class="text-right">
                <p class="text-sm font-medium text-slate-800 dark:text-white">{{ username }}</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">Workflow User</p>
            </div>
            <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-blue-700 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-white text-sm"></i>
            </div>
        </div>
    </div>
</header>

<!-- Notifications Dropdown -->
<div id="notificationDropdown" class="hidden absolute right-6 top-16 w-80 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 z-50">
    <div class="p-4 border-b border-slate-200 dark:border-slate-700">
        <h3 class="font-semibold text-slate-800 dark:text-white">Notifications</h3>
    </div>
    <div class="max-h-64 overflow-y-auto">
        {% if notifications %}
            {% for notif in notifications %}
            <div class="p-3 border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700">
                <p class="text-sm text-slate-700 dark:text-slate-300">{{ notif.message }}</p>
                <span class="text-xs text-slate-500">{{ notif.created_at }}</span>
            </div>
            {% endfor %}
        {% else %}
            <div class="p-4 text-center text-slate-500">
                <i class="fas fa-bell-slash text-2xl mb-2"></i>
                <p class="text-sm">No notifications</p>
            </div>
        {% endif %}
    </div>
    <div class="p-3 border-t border-slate-200 dark:border-slate-700">
        <a href="{{ url_for('workflow_notifications') }}" class="text-sm text-blue-600 hover:text-blue-700">View all notifications</a>
    </div>
</div>

<script>
document.getElementById('notificationBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('notificationDropdown').classList.toggle('hidden');
});
document.addEventListener('click', function(e) {
    if (!e.target.closest('#notificationBtn') && !e.target.closest('#notificationDropdown')) {
        document.getElementById('notificationDropdown').classList.add('hidden');
    }
});
</script>
