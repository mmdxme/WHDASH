{% extends "bi_advanced/base.html" %}

{% block content %}
<aside class="bi-sidebar">
    <div class="bi-sidebar-header">
        <h2><i class="fas fa-analytics"></i> Advanced BI</h2>
    </div>
    <div class="bi-nav-section">
        <div class="bi-nav-section-title">Scheduling</div>
        <a href="{{ url_for('bi_schedules') }}" class="bi-nav-item"><i class="fas fa-clock"></i> Schedules</a>
    </div>
</aside>

<main class="bi-main">
    <div class="bi-breadcrumb">
        <a href="{{ url_for('index') }}">Home</a>
        <i class="fas fa-chevron-right"></i>
        <a href="{{ url_for('bi_advanced_dashboard') }}">BI</a>
        <i class="fas fa-chevron-right"></i>
        <a href="{{ url_for('bi_schedules') }}">Schedules</a>
        <i class="fas fa-chevron-right"></i>
        <span>Create Schedule</span>
    </div>
    
    <div class="bi-header">
        <h1>{{ page_title }}</h1>
    </div>
    
    <div class="bi-card">
        <div class="bi-card-header">
            <span class="bi-card-title">Schedule Configuration</span>
        </div>
        
        <div style="max-width: 600px;">
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Schedule Name *</label>
                <input type="text" id="schedule_name" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;" placeholder="e.g., Monthly Sales Report">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Report *</label>
                <select id="report_id" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="">Select a report...</option>
                    {% for report in reports %}
                    <option value="{{ report.id }}">{{ report.report_name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Frequency *</label>
                    <select id="frequency" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        <option value="once">Once</option>
                        <option value="daily">Daily</option>
                        <option value="weekly" selected>Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="quarterly">Quarterly</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Run Time *</label>
                    <input type="time" id="run_time" value="09:00" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                </div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Output Format</label>
                <select id="output_format" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="excel">Excel (.xlsx)</option>
                    <option value="csv">CSV (.csv)</option>
                    <option value="pdf">PDF (.pdf)</option>
                </select>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Recipient Emails (one per line)</label>
                <textarea id="recipient_emails" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; min-height: 80px;" placeholder="email@example.com"></textarea>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px;">Email Subject (optional)</label>
                <input type="text" id="email_subject" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;" placeholder="Report: {{ report_name }} - {{ date }}">
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <a href="{{ url_for('bi_schedules') }}" class="bi-btn bi-btn-secondary">Cancel</a>
                <button class="bi-btn bi-btn-primary" onclick="createSchedule()">
                    <i class="fas fa-save"></i> Create Schedule
                </button>
            </div>
        </div>
    </div>
</main>

<script>
async function createSchedule() {
    const scheduleName = document.getElementById('schedule_name').value.trim();
    const reportId = document.getElementById('report_id').value;
    
    if (!scheduleName) {
        alert('Please enter a schedule name');
        return;
    }
    if (!reportId) {
        alert('Please select a report');
        return;
    }
    
    const emails = document.getElementById('recipient_emails').value
        .split('\n')
        .map(e => e.trim())
        .filter(e => e);
    
    const response = await fetch('/bi/schedules/api/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            schedule_name: scheduleName,
            report_id: parseInt(reportId),
            frequency: document.getElementById('frequency').value,
            run_time: document.getElementById('run_time').value,
            output_formats: [document.getElementById('output_format').value],
            recipient_emails: emails,
            email_subject: document.getElementById('email_subject').value
        })
    });
    
    const result = await response.json();
    
    if (result.success) {
        window.location.href = "{{ url_for('bi_schedules') }}";
    } else {
        alert('Error creating schedule: ' + (result.error || 'Unknown error'));
    }
}
</script>
{% endblock %}
