{% extends "bi_advanced/base.html" %}

{% block content %}
<aside class="bi-sidebar">
    <div class="bi-sidebar-header">
        <h2><i class="fas fa-analytics"></i> Advanced BI</h2>
    </div>
    <div class="bi-nav-section">
        <div class="bi-nav-section-title">Analytics</div>
        <a href="{{ url_for('bi_drilldown', domain='sales') }}" class="bi-nav-item"><i class="fas fa-chart-line"></i> Sales</a>
        <a href="{{ url_for('bi_drilldown', domain='inventory') }}" class="bi-nav-item"><i class="fas fa-boxes"></i> Inventory</a>
    </div>
</aside>

<main class="bi-main">
    <div class="bi-breadcrumb">
        <a href="{{ url_for('index') }}">Home</a>
        <i class="fas fa-chevron-right"></i>
        <a href="{{ url_for('bi_advanced_dashboard') }}">BI</a>
        <i class="fas fa-chevron-right"></i>
        <span>{{ page_title }}</span>
    </div>
    
    <div class="bi-header">
        <h1>{{ page_title }}</h1>
    </div>
    
    <div class="bi-card">
        <div class="bi-empty-state">
            <i class="fas fa-chart-line"></i>
            <h3>{{ domain|title }} Analytics</h3>
            <p>Detailed {{ domain }} analytics with drill-down capabilities.</p>
        </div>
    </div>
</main>
{% endblock %}
