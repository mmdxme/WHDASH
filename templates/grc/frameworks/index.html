{% extends "grc/base_grc.html" %}

{% block grc_content %}
<div class="mb-6 flex justify-between items-center">
    <div>
        <h2 class="text-xl font-semibold text-gray-800">Templates & Frameworks</h2>
        <p class="text-sm text-gray-500">Compliance framework templates</p>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for fw in frameworks %}
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between mb-4">
            <span class="px-3 py-1 text-xs font-semibold rounded bg-blue-100 text-blue-700">{{ fw.framework_type }}</span>
            <span class="text-sm text-gray-500">v{{ fw.version }}</span>
        </div>
        <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ fw.template_name }}</h3>
        <p class="text-sm text-gray-600 mb-4">{{ fw.description }}</p>
        <button class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Use Template</button>
    </div>
    {% else %}
    <div class="col-span-3 text-center text-gray-500 py-6">No framework templates found</div>
    {% endfor %}
</div>
{% endblock %}
