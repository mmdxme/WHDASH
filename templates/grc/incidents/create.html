{% extends "grc/base_grc.html" %}

{% block grc_content %}
<div class="mb-6">
    <h2 class="text-xl font-semibold text-gray-800">Report New Incident</h2>
</div>

<form method="POST" class="bg-white rounded-lg shadow p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Title</label>
            <input type="text" name="title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            <textarea name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
            <select name="category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                <option value="">Select Category</option>
                <option value="suspicious_access">Suspicious Access</option>
                <option value="policy_breach">Policy Breach</option>
                <option value="sod_breach">SoD Breach</option>
                <option value="approval_bypass">Approval Bypass</option>
                <option value="failed_control">Failed Control</option>
                <option value="data_export_abuse">Data Export Abuse</option>
                <option value="warehouse_governance">Warehouse Governance Issue</option>
                <option value="supplier_compliance">Supplier Compliance</option>
                <option value="customs_noncompliance">Customs Non-compliance</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Severity</label>
            <select name="severity" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Incident DateTime</label>
            <input type="datetime-local" name="incident_datetime" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Affected Module</label>
            <input type="text" name="affected_module" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Source</label>
            <input type="text" name="source" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
        <a href="{{ url_for('grc_incidents_list') }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Cancel</a>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">Report Incident</button>
    </div>
</form>
{% endblock %}
