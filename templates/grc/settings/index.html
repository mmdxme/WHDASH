{% extends "grc/base_grc.html" %}

{% block grc_content %}
<div class="mb-6">
    <h2 class="text-xl font-semibold text-gray-800">GRC Settings</h2>
    <p class="text-sm text-gray-500">Configure GRC module settings</p>
</div>

<div class="bg-white rounded-lg shadow p-6">
    <form>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Default Risk Scoring Model</label>
                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option>Impact x Likelihood (5x5)</option>
                    <option>Impact x Likelihood (4x4)</option>
                    <option>Custom</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">High Risk Threshold</label>
                <input type="number" value="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Default Review Cycle</label>
                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option>Quarterly</option>
                    <option>Semi-Annual</option>
                    <option>Annual</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Evidence Expiry Reminder (days)</label>
                <input type="number" value="30" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">SoD Scan Frequency</label>
                <select class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option>Daily</option>
                    <option>Weekly</option>
                    <option>Monthly</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Flow Alert Channel</label>
                <input type="text" value="grc-alerts" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <div class="mt-6 flex justify-end">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Settings</button>
        </div>
    </form>
</div>
{% endblock %}
