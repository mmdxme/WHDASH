{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.stops_view', id=stop.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">Report failure for {{ stop.stop_name }}</p>
        </div>
    </div>

    <div class="glass-panel rounded-2xl p-6">
        <div class="flex items-center gap-4 mb-6 p-4 bg-red-500/10 rounded-xl border border-red-500/20">
            <div class="w-12 h-12 rounded-xl bg-red-500/20 flex items-center justify-center">
                <i class="fa-solid fa-triangle-exclamation text-red-400 text-xl"></i>
            </div>
            <div>
                <h3 class="text-white font-bold">{{ stop.stop_name }}</h3>
                <p class="text-slate-400 text-sm">{{ stop.address or 'No address' }}</p>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Failure Reason *</label>
                <select name="failure_reason" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm mb-3">
                    <option value="">-- Select Reason --</option>
                    <option value="Customer unavailable">Customer unavailable</option>
                    <option value="Wrong address">Wrong address</option>
                    <option value="Access denied">Access denied</option>
                    <option value="Refused delivery">Refused delivery</option>
                    <option value="Damaged goods">Damaged goods</option>
                    <option value="Quantity mismatch">Quantity mismatch</option>
                    <option value="Weather conditions">Weather conditions</option>
                    <option value="Vehicle breakdown">Vehicle breakdown</option>
                    <option value="Traffic/Road closure">Traffic/Road closure</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" name="failure_reason_custom" placeholder="Or enter custom reason..."
                       class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Additional Notes</label>
                <textarea name="notes" rows="4" placeholder="Provide additional details..."
                          class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
            </div>

            <div class="flex items-center justify-end gap-4">
                <a href="{{ url_for('logistics.stops_view', id=stop.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-medium transition-all flex items-center gap-2">
                    <i class="fa-solid fa-times"></i> Mark as Failed
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
