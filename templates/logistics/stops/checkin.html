{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.stops_view', id=stop.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">Check in at {{ stop.stop_name }}</p>
        </div>
    </div>

    <div class="glass-panel rounded-2xl p-6">
        <div class="flex items-center gap-4 mb-6 p-4 bg-white/5 rounded-xl">
            <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center">
                <i class="fa-solid fa-map-pin text-blue-400 text-xl"></i>
            </div>
            <div>
                <h3 class="text-white font-bold">{{ stop.stop_name }}</h3>
                <p class="text-slate-400 text-sm">{{ stop.address or 'No address' }}</p>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Notes (Optional)</label>
                <textarea name="notes" rows="4" placeholder="Add any notes about your arrival..."
                          class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
            </div>

            <div class="flex items-center justify-end gap-4">
                <a href="{{ url_for('logistics.stops_view', id=stop.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium transition-all flex items-center gap-2">
                    <i class="fa-solid fa-sign-in-alt"></i> Check In
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
