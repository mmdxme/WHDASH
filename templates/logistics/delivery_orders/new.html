{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.delivery_orders_list') }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
        <div><h1 class="text-2xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 text-sm mt-1">Create a new delivery order</p></div>
    </div>
    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Delivery Order Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Shipment</label>
                    <select name="shipment_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Shipment</option>
                        {% for s in shipments %}<option value="{{ s.id }}">{{ s.shipment_code }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status</label>
                    <select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="pending">Pending</option><option value="assigned">Assigned</option>
                        <option value="in_transit">In Transit</option><option value="delivered">Delivered</option>
                        <option value="failed">Failed</option><option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Customer</label>
                    <select name="customer_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Customer</option>
                        {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Driver</label>
                    <select name="driver_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Driver</option>
                        {% for d in drivers %}<option value="{{ d.id }}">{{ d.full_name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle</label>
                    <select name="vehicle_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Vehicle</option>
                        {% for v in vehicles %}<option value="{{ v.id }}">{{ v.plate_number }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Scheduled Date</label>
                    <input type="datetime-local" name="scheduled_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Delivery Address</label>
                    <textarea name="delivery_address" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.delivery_orders_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all"><i class="fa-solid fa-save mr-2"></i>Create Delivery Order</button>
        </div>
    </form>
</div>
{% endblock %}
