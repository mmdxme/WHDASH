{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.loads_list') }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 mt-1">Create a new load for shipment consolidation</p>
        </div>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Trip</label>
                <select name="trip_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                    <option value="">Select Trip (optional)</option>
                    {% for t in trips %}
                    <option value="{{ t.id }}">{{ t.trip_code }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle</label>
                <select name="vehicle_id" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                    <option value="">Select Vehicle (optional)</option>
                    {% for v in vehicles %}
                    <option value="{{ v.id }}">{{ v.plate_number }} (Capacity: {{ v.capacity }}t)</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Status</label>
                <select name="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                    <option value="planning">Planning</option>
                    <option value="ready">Ready</option>
                    <option value="dispatched">Dispatched</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Priority</label>
                <select name="priority" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                    <option value="standard">Standard</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Weight (kg)</label>
                <input type="number" name="weight_kg" step="0.01" min="0" placeholder="0.00" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Volume (m³)</label>
                <input type="number" name="volume_m3" step="0.01" min="0" placeholder="0.00" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-300 mb-2">Consolidation Group</label>
                <input type="text" name="consolidation_group" placeholder="Enter group name for consolidation" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-300 mb-2">Notes</label>
                <textarea name="notes" rows="3" placeholder="Additional notes..." class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4 pt-4 border-t border-white/10">
            <a href="{{ url_for('logistics.loads_list') }}" class="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all">
                <i class="fa-solid fa-save mr-2"></i>Create Load
            </button>
        </div>
    </form>
</div>
{% endblock %}
