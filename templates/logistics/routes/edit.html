{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.routes_view', id=route.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">Edit route configuration</p>
        </div>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Route Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route Name *</label>
                    <input type="text" name="route_name" value="{{ route.route_name }}" required
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route Type</label>
                    <select name="route_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="delivery" {% if route.route_type == 'delivery' %}selected{% endif %}>Delivery</option>
                        <option value="pickup" {% if route.route_type == 'pickup' %}selected{% endif %}>Pickup</option>
                        <option value="transfer" {% if route.route_type == 'transfer' %}selected{% endif %}>Transfer</option>
                        <option value="return" {% if route.route_type == 'return' %}selected{% endif %}>Return</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Service Zone</label>
                    <input type="text" name="service_zone" value="{{ route.service_zone or '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle Type Compatible</label>
                    <input type="text" name="vehicle_type_compatible" value="{{ route.vehicle_type_compatible or '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Distance (km)</label>
                    <input type="number" step="0.1" name="distance_km" value="{{ route.distance_km or 0 }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Estimated Time (minutes)</label>
                    <input type="number" name="estimated_time_minutes" value="{{ route.estimated_time_minutes or 0 }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Cost per km</label>
                    <input type="number" step="0.01" name="cost_per_km" value="{{ route.cost_per_km or 0 }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" name="is_active" id="isActive" value="1" {% if route.is_active %}checked{% endif %}
                           class="w-5 h-5 rounded bg-white/5 border-white/10 text-brand-500 focus:ring-brand-500">
                    <label for="isActive" class="text-slate-300 text-sm">Active Route</label>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                    <textarea name="description" rows="3"
                              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">{{ route.description or '' }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Restriction Notes</label>
                    <textarea name="restriction_notes" rows="2"
                              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">{{ route.restriction_notes or '' }}</textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.routes_view', id=route.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all flex items-center gap-2">
                <i class="fa-solid fa-save"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
