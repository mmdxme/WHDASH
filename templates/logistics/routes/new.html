{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.routes_list') }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
        <div><h1 class="text-2xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 text-sm mt-1">Create a new route</p></div>
    </div>
    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Route Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route Name *</label>
                    <input type="text" name="route_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route Type</label>
                    <select name="route_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="delivery">Delivery</option><option value="pickup">Pickup</option>
                        <option value="both">Both</option><option value="transfer">Transfer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Origin</label>
                    <input type="text" name="origin" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Destination</label>
                    <input type="text" name="destination" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Estimated Hours</label>
                    <input type="number" step="0.1" name="estimated_hours" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Distance (km)</label>
                    <input type="number" step="0.1" name="distance_km" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Waypoints (one per line)</label>
                    <textarea name="waypoints" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.routes_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all"><i class="fa-solid fa-save mr-2"></i>Create Route</button>
        </div>
    </form>
</div>
{% endblock %}
