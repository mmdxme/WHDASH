{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.trips_view', id=trip.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">Edit trip details and configuration</p>
        </div>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                <i class="fa-solid fa-truck text-brand-400"></i> Trip Details
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Trip Name</label>
                    <input type="text" name="trip_name" value="{{ trip.trip_name or '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Priority</label>
                    <select name="priority" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="Normal" {% if trip.priority == 'Normal' %}selected{% endif %}>Normal</option>
                        <option value="High" {% if trip.priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Urgent" {% if trip.priority == 'Urgent' %}selected{% endif %}>Urgent</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route</label>
                    <select name="route_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">-- No Route --</option>
                        {% for r in routes %}
                        <option value="{{ r.id }}" {% if trip.route_id == r.id %}selected{% endif %}>{{ r.route_code }} - {{ r.route_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Origin Location</label>
                    <input type="text" name="origin_location" value="{{ trip.origin_location or '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Destination Location</label>
                    <input type="text" name="destination_location" value="{{ trip.destination_location or '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Planned Departure</label>
                    <input type="datetime-local" name="planned_departure"
                           value="{{ trip.planned_departure.strftime('%Y-%m-%dT%H:%M') if trip.planned_departure else '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Planned Arrival</label>
                    <input type="datetime-local" name="planned_arrival"
                           value="{{ trip.planned_arrival.strftime('%Y-%m-%dT%H:%M') if trip.planned_arrival else '' }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Distance (km)</label>
                    <input type="number" step="0.1" name="distance_km" value="{{ trip.distance_km or 0 }}"
                           class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                <i class="fa-solid fa-user-tie text-brand-400"></i> Driver & Vehicle
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Driver</label>
                    <select name="driver_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">-- Select Driver --</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}" {% if trip.driver_id == d.id %}selected{% endif %}>{{ d.full_name }}{% if d.mobile %} ({{ d.mobile }}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle</label>
                    <select name="vehicle_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">-- Select Vehicle --</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}" {% if trip.vehicle_id == v.id %}selected{% endif %}>{{ v.plate_number }} - {{ v.vehicle_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Helper (Optional)</label>
                    <select name="helper_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">-- No Helper --</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}" {% if trip.helper_id == d.id %}selected{% endif %}>{{ d.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                <i class="fa-solid fa-clipboard text-brand-400"></i> Notes
            </h2>
            <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">{{ trip.notes or '' }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.trips_view', id=trip.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all flex items-center gap-2">
                <i class="fa-solid fa-save"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
