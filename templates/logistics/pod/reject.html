{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.pod_view', id=pod.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">Reject POD</h1>
            <p class="text-slate-400 text-sm mt-1">{{ pod.shipment_code }}</p>
        </div>
    </div>

    <div class="glass-panel rounded-2xl p-6">
        <div class="bg-red-500/10 border border-red-500/20 rounded-xl p-4 mb-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-ban text-2xl text-red-400"></i>
                <div>
                    <h3 class="text-red-400 font-bold">Reject POD</h3>
                    <p class="text-red-300/80 text-sm">This will mark the POD as rejected. Provide a reason below.</p>
                </div>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Rejection Reason *</label>
                <textarea name="reason" rows="4" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="Explain why this POD is being rejected..."></textarea>
            </div>

            <div class="flex items-center justify-end gap-4">
                <a href="{{ url_for('logistics.pod_view', id=pod.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-medium transition-all">
                    <i class="fa-solid fa-ban mr-2"></i>Reject POD
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
