{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.pod_view', id=pod.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">Mark as Partial Delivery</h1>
            <p class="text-slate-400 text-sm mt-1">{{ pod.shipment_code }}</p>
        </div>
    </div>

    <div class="glass-panel rounded-2xl p-6">
        <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 mb-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-exclamation-triangle text-2xl text-amber-400"></i>
                <div>
                    <h3 class="text-amber-400 font-bold">Partial Delivery Warning</h3>
                    <p class="text-amber-300/80 text-sm">This will mark the delivery as partially completed and update the shipment status.</p>
                </div>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Reason for Partial Delivery</label>
                <textarea name="notes" rows="4" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="Describe what was partially delivered and why..."></textarea>
            </div>

            <div class="flex items-center justify-end gap-4">
                <a href="{{ url_for('logistics.pod_view', id=pod.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-sm font-medium transition-all">
                    <i class="fa-solid fa-exclamation mr-2"></i>Mark as Partial
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
