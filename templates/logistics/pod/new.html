{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.shipments_view', id=shipment.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
        <div><h1 class="text-2xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 text-sm mt-1">Record proof of delivery for shipment {{ shipment.shipment_code }}</p></div>
    </div>
    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Delivery Confirmation</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Receiver Name *</label><input type="text" name="receiver_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Receiver Phone</label><input type="text" name="receiver_phone" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Latitude</label><input type="text" name="latitude" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="e.g. 25.2048"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Longitude</label><input type="text" name="longitude" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="e.g. 55.2708"></div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Delivery Status</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="delivery_status" value="completed" checked class="w-4 h-4 text-emerald-500"> <span class="text-emerald-400">Completed</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="delivery_status" value="partial" class="w-4 h-4 text-amber-500"> <span class="text-amber-400">Partial</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="delivery_status" value="failed" class="w-4 h-4 text-red-500"> <span class="text-red-400">Failed</span></label>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="shortage_confirmed" value="1" class="w-4 h-4 text-amber-500 rounded"> <span class="text-amber-400 text-sm">Shortage confirmed</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="damage_confirmed" value="1" class="w-4 h-4 text-red-500 rounded"> <span class="text-red-400 text-sm">Damage confirmed</span></label>
                </div>
                <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-300 mb-2">Notes</label><textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="Any delivery notes..."></textarea></div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.shipments_view', id=shipment.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-medium transition-all"><i class="fa-solid fa-check mr-2"></i>Confirm Delivery</button>
        </div>
    </form>
</div>
{% endblock %}
