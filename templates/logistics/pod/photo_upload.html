{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.pod_view', id=pod.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">Upload Photo</h1>
            <p class="text-slate-400 text-sm mt-1">{{ pod.shipment_code }}</p>
        </div>
    </div>

    <div class="glass-panel rounded-2xl p-6">
        <h2 class="text-lg font-bold text-white mb-5">Add Delivery Photo</h2>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Photo Path/URL</label>
                <input type="text" name="photo_path" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="/uploads/pod/photo_001.jpg">
                <p class="text-slate-500 text-xs mt-2">Enter the file path or URL of the delivery photo</p>
            </div>

            <div class="flex items-center justify-end gap-4">
                <a href="{{ url_for('logistics.pod_view', id=pod.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all">
                    <i class="fa-solid fa-upload mr-2"></i>Upload Photo
                </button>
            </div>
        </form>
    </div>

    {% if pod.photo_paths %}
    <div class="glass-panel rounded-2xl p-6">
        <h2 class="text-lg font-bold text-white mb-5">Existing Photos</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {% for photo in pod.photo_paths.split(',') %}
            <div class="bg-white/10 rounded-xl p-2">
                <img src="{{ photo }}" alt="Delivery photo" class="w-full h-32 object-cover rounded-lg">
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
