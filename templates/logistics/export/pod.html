{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div><h1 class="text-3xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 mt-1">Export POD Records</p></div>
    </div>

    <div class="glass-panel rounded-2xl p-6">
        <h2 class="text-lg font-bold text-white mb-5">POD Export Options</h2>
        <form method="GET" action="{{ url_for('logistics.export_pod') }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Date From</label>
                    <input type="date" name="date_from" value="{{ date_from }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Date To</label>
                    <input type="date" name="date_to" value="{{ date_to }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm text-slate-400 mb-2">Format</label>
                <select name="format" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                    <option value="csv">CSV</option>
                    <option value="excel">Excel</option>
                    <option value="json">JSON</option>
                </select>
            </div>
            <div class="mt-6">
                <button type="submit" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-medium transition-all">
                    <i class="fa-solid fa-download mr-2"></i>Download POD Records
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
