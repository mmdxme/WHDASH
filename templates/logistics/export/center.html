{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div><h1 class="text-3xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 mt-1">Export data with customizable columns</p></div>
    </div>

    <!-- Export Type Selection -->
    <div class="glass-panel rounded-2xl p-6">
        <h2 class="text-lg font-bold text-white mb-5">Select Export Type</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
            <a href="{{ url_for('logistics.export_trips') }}?type=trips&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-route text-2xl text-blue-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Trips</p>
            </a>
            <a href="{{ url_for('logistics.export_dispatches') }}?type=dispatches&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-truck text-2xl text-cyan-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Dispatches</p>
            </a>
            <a href="{{ url_for('logistics.export_routes') }}?type=routes&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-map text-2xl text-purple-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Routes</p>
            </a>
            <a href="{{ url_for('logistics.export_vehicle_performance') }}?type=vehicle&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-truck-moving text-2xl text-amber-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Vehicle Performance</p>
            </a>
            <a href="{{ url_for('logistics.export_driver_performance') }}?type=driver&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-id-card text-2xl text-green-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Driver Performance</p>
            </a>
            <a href="{{ url_for('logistics.export_costs') }}?type=costs&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-coins text-2xl text-emerald-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Costs</p>
            </a>
            <a href="{{ url_for('logistics.export_pod') }}?type=pod&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-file-signature text-2xl text-teal-400 mb-2"></i>
                <p class="text-sm font-medium text-white">POD Records</p>
            </a>
            <a href="{{ url_for('logistics.export_exceptions') }}?type=exceptions&date_from={{ date_from }}&date_to={{ date_to }}" class="glass-panel rounded-xl p-4 hover:bg-white/5 transition-all text-center">
                <i class="fa-solid fa-exclamation-circle text-2xl text-red-400 mb-2"></i>
                <p class="text-sm font-medium text-white">Exceptions</p>
            </a>
        </div>
    </div>

    <!-- Column Selection Form -->
    <div class="glass-panel rounded-2xl p-6">
        <h2 class="text-lg font-bold text-white mb-5">Configure Export</h2>
        <form id="exportForm" method="GET" action="{{ url_for('logistics.export_trips') }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Date From</label>
                    <input type="date" name="date_from" value="{{ date_from }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Date To</label>
                    <input type="date" name="date_to" value="{{ date_to }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
            </div>

            <!-- Trips Columns -->
            <div id="tripsColumns" class="mt-6 column-selector">
                <label class="block text-sm text-slate-400 mb-3">Select Columns (Trips)</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="trip_code" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Trip Code
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="trip_name" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Trip Name
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="status" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Status
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="priority" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Priority
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="driver_name" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Driver
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="vehicle" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Vehicle
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="origin" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Origin
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="destination" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Destination
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="distance_km" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Distance (KM)
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="estimated_cost" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Est. Cost
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="actual_cost" checked class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Actual Cost
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="planned_departure" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Planned Departure
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="actual_departure" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Actual Departure
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="completed_stops" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Completed Stops
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="failed_stops" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Failed Stops
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="fuel_cost" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Fuel Cost
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="tolls_cost" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Tolls Cost
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="checkbox" name="columns" value="notes" class="w-4 h-4 rounded bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Notes
                    </label>
                </div>
            </div>

            <!-- Format Selection -->
            <div class="mt-6">
                <label class="block text-sm text-slate-400 mb-3">Export Format</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="radio" name="format" value="csv" checked class="w-4 h-4 bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> CSV
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="radio" name="format" value="excel" class="w-4 h-4 bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> Excel
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        <input type="radio" name="format" value="json" class="w-4 h-4 bg-white/10 border-white/20 text-brand-500 focus:ring-brand-500"> JSON
                    </label>
                </div>
            </div>

            <!-- Sort Order -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Sort By</label>
                    <select name="sort_by" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                        <option value="created_at">Date Created</option>
                        <option value="trip_code">Trip Code</option>
                        <option value="status">Status</option>
                        <option value="actual_cost">Cost</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Sort Order</label>
                    <select name="sort_order" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                        <option value="DESC">Descending</option>
                        <option value="ASC">Ascending</option>
                    </select>
                </div>
            </div>

            <!-- Export Buttons -->
            <div class="mt-6 flex gap-3">
                <button type="button" onclick="selectAll()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 text-white rounded-xl text-sm font-medium transition-all">
                    Select All
                </button>
                <button type="button" onclick="deselectAll()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 text-white rounded-xl text-sm font-medium transition-all">
                    Deselect All
                </button>
                <button type="submit" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-medium transition-all">
                    <i class="fa-solid fa-download mr-2"></i>Export
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function selectAll() {
    document.querySelectorAll('input[name="columns"]').forEach(cb => cb.checked = true);
}

function deselectAll() {
    document.querySelectorAll('input[name="columns"]').forEach(cb => cb.checked = false);
}
</script>
{% endblock %}
