{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.drivers_list') }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
        <div><h1 class="text-2xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 text-sm mt-1">Add a new driver to your fleet</p></div>
    </div>
    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Driver Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Full Name *</label><input type="text" name="full_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Mobile</label><input type="text" name="mobile" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Emergency Contact</label><input type="text" name="emergency_contact" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Nationality</label><input type="text" name="nationality" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">License Number</label><input type="text" name="license_number" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">License Class</label><input type="text" name="license_class" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">License Expiry</label><input type="date" name="license_expiry" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Employee Type</label><select name="employee_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"><option value="internal">Internal</option><option value="contractor">Contractor</option></select></div>
            </div>
        </div>
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">HR Employee Link (Optional)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Linked HR Employee</label>
                <select name="employee_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                    <option value="">-- Not Linked --</option>
                    {% for e in employees %}<option value="{{ e.id }}">{{ e.first_name }} {{ e.last_name }} ({{ e.employee_code }})</option>{% endfor %}
                </select>
                </div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Assigned Vehicle</label>
                <select name="assigned_vehicle_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                    <option value="">-- Not Assigned --</option>
                    {% for v in vehicles %}<option value="{{ v.id }}">{{ v.plate_number }}</option>{% endfor %}
                </select>
                </div>
            </div>
        </div>
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Notes</h2>
            <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="Additional notes..."></textarea>
        </div>
        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.drivers_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all"><i class="fa-solid fa-save mr-2"></i>Save Driver</button>
        </div>
    </form>
</div>
{% endblock %}
