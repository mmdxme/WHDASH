{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.carriers_list') }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
        <div><h1 class="text-2xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 text-sm mt-1">Add a new carrier/transporter</p></div>
    </div>
    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Carrier Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Carrier Name *</label><input type="text" name="carrier_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Contact Person</label><input type="text" name="contact_person" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Phone</label><input type="text" name="phone" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Email</label><input type="email" name="email" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-300 mb-2">Address</label><textarea name="address" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Service Areas</label><input type="text" name="service_areas" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="e.g. Dubai, Abu Dhabi"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Vehicle Types</label><input type="text" name="vehicle_types" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="e.g. Truck, Van"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Credit Terms</label><input type="text" name="credit_terms" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></div>
                <div><label class="block text-sm font-medium text-slate-300 mb-2">Status</label><select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                <div class="md:col-span-2"><label class="block text-sm font-medium text-slate-300 mb-2">Notes</label><textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm"></textarea></div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.carriers_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all"><i class="fa-solid fa-save mr-2"></i>Save Carrier</button>
        </div>
    </form>
</div>
{% endblock %}
