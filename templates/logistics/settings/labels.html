{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">Label/Terminology Settings</h1>
            <p class="text-slate-400 mt-1">Customize labels and terminology for TMS</p>
        </div>
        <a href="{{ url_for('logistics.settings_menu') }}" class="px-4 py-2 bg-white/10 rounded-xl text-white hover:bg-white/20 transition">
            ← Back
        </a>
    </div>

    <form method="POST" action="{{ url_for('logistics.settings_save') }}" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">Trip Labels</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Trip Label (Singular)</label>
                    <input type="text" name="setting_label_trip_singular" value="{{ label_settings.get('label_trip_singular', {}).get('setting_value', 'Trip') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Trip Label (Plural)</label>
                    <input type="text" name="setting_label_trip_plural" value="{{ label_settings.get('label_trip_plural', {}).get('setting_value', 'Trips') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route Label (Singular)</label>
                    <input type="text" name="setting_label_route_singular" value="{{ label_settings.get('label_route_singular', {}).get('setting_value', 'Route') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route Label (Plural)</label>
                    <input type="text" name="setting_label_route_plural" value="{{ label_settings.get('label_route_plural', {}).get('setting_value', 'Routes') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">Status Labels</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status: Dispatched</label>
                    <input type="text" name="setting_label_status_dispatched" value="{{ label_settings.get('label_status_dispatched', {}).get('setting_value', 'Dispatched') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status: In Transit</label>
                    <input type="text" name="setting_label_status_in_transit" value="{{ label_settings.get('label_status_in_transit', {}).get('setting_value', 'In Transit') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status: Delivered</label>
                    <input type="text" name="setting_label_status_delivered" value="{{ label_settings.get('label_status_delivered', {}).get('setting_value', 'Delivered') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status: Failed</label>
                    <input type="text" name="setting_label_status_failed" value="{{ label_settings.get('label_status_failed', {}).get('setting_value', 'Failed Delivery') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">Document Labels</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">POD Display Name</label>
                    <input type="text" name="setting_label_pod" value="{{ label_settings.get('label_pod', {}).get('setting_value', 'Proof of Delivery') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Driver Label</label>
                    <input type="text" name="setting_label_driver" value="{{ label_settings.get('label_driver', {}).get('setting_value', 'Driver') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle Label</label>
                    <input type="text" name="setting_label_vehicle" value="{{ label_settings.get('label_vehicle', {}).get('setting_value', 'Vehicle') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Stop Label</label>
                    <input type="text" name="setting_label_stop" value="{{ label_settings.get('label_stop', {}).get('setting_value', 'Stop') }}" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand-500 focus:outline-none">
                </div>
            </div>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl font-medium transition">
                Save Settings
            </button>
        </div>
    </form>
</div>
{% endblock %}
