{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div><h1 class="text-3xl font-bold text-white">{{ title }}</h1><p class="text-slate-400 mt-1">Configure logistics module</p></div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for category, items in settings_by_cat.items() %}
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">{{ category }}</h2>
            <div class="space-y-3">
                {% for item in items %}
                <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl">
                    <span class="text-slate-300">{{ item.setting_key }}</span>
                    <span class="text-brand-400 font-medium text-sm">{{ item.setting_value }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
