{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.shipments_list') }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">Create a new logistics shipment</p>
        </div>
    </div>

    <form method="POST" class="space-y-6">
        <!-- Basic Information -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-3">
                <i class="fa-solid fa-info-circle text-brand-400"></i>
                Basic Information
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Shipment Type *</label>
                    <select name="shipment_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                        {% for t in types %}
                        <option value="{{ t }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status</label>
                    <select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                        {% for s in statuses %}
                        <option value="{{ s }}">{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Priority</label>
                    <select name="priority" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                        {% for p in priorities %}
                        <option value="{{ p }}">{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Transport Mode</label>
                    <select name="transport_mode" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Mode</option>
                        {% for tm in transport_modes %}
                        <option value="{{ tm }}">{{ tm }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Warehouse & Customer -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-3">
                <i class="fa-solid fa-building text-brand-400"></i>
                Warehouse & Customer
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Warehouse</label>
                    <select name="warehouse_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                        <option value="">Select Warehouse</option>
                        {% for w in warehouses %}
                        <option value="{{ w.id }}">{{ w.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Customer</label>
                    <select name="customer_id" id="customerSelect" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Customer</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Addresses -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-3">
                <i class="fa-solid fa-map-marker-alt text-brand-400"></i>
                Addresses & Contact
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Consignee Name</label>
                    <input type="text" name="consignee_name" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50" placeholder="Contact person name">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Consignee Phone</label>
                    <input type="text" name="consignee_phone" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50" placeholder="+971 50 123 4567">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Delivery Address</label>
                    <textarea name="delivery_address" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50" placeholder="Full delivery address"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Pickup Address</label>
                    <textarea name="pickup_address" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50" placeholder="Pickup location address"></textarea>
                </div>
            </div>
        </div>

        <!-- Dates & Assignment -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-3">
                <i class="fa-solid fa-calendar text-brand-400"></i>
                Dates & Assignment
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Requested Date</label>
                    <input type="date" name="requested_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Planned Date</label>
                    <input type="date" name="planned_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Estimated Delivery</label>
                    <input type="date" name="estimated_delivery" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">SLA Target</label>
                    <input type="date" name="sla_target" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Driver</label>
                    <select name="driver_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Driver</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}">{{ d.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle</label>
                    <select name="vehicle_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Vehicle</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}">{{ v.plate_number }} - {{ v.vehicle_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Carrier</label>
                    <select name="carrier_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Carrier</option>
                        {% for c in carriers %}
                        <option value="{{ c.id }}">{{ c.carrier_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Route</label>
                    <select name="route_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Route</option>
                        {% for r in routes %}
                        <option value="{{ r.id }}">{{ r.route_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Notes -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5 flex items-center gap-3">
                <i class="fa-solid fa-sticky-note text-brand-400"></i>
                Additional Information
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Shipment Reference</label>
                    <input type="text" name="shipment_reference" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="External reference number">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Billing Party</label>
                    <input type="text" name="billing_party" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="Who pays for transport">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm" placeholder="Special handling instructions, delivery notes..."></textarea>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.shipments_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all">
                <i class="fa-solid fa-save mr-2"></i>Create Shipment
            </button>
        </div>
    </form>
</div>
{% endblock %}
