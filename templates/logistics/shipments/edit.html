{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('logistics.shipments_view', id=shipment.id) }}" class="p-2 hover:bg-white/10 rounded-xl text-slate-400 hover:text-white transition-all">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">Edit shipment details</p>
        </div>
    </div>

    <form method="POST" class="space-y-6">
        <!-- Basic Information -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Basic Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Shipment Type</label>
                    <select name="shipment_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        {% for t in types %}<option value="{{ t }}" {% if shipment.shipment_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status</label>
                    <select name="status" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        {% for s in statuses %}<option value="{{ s }}" {% if shipment.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Priority</label>
                    <select name="priority" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        {% for p in priorities %}<option value="{{ p }}" {% if shipment.priority == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Transport Mode</label>
                    <select name="transport_mode" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select</option>
                        {% for tm in transport_modes %}<option value="{{ tm }}" {% if shipment.transport_mode == tm %}selected{% endif %}>{{ tm }}</option>{% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Warehouse & Customer -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Warehouse & Customer</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Warehouse</label>
                    <select name="warehouse_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select</option>
                        {% for w in warehouses %}<option value="{{ w.id }}" {% if shipment.warehouse_id == w.id %}selected{% endif %}>{{ w.name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Customer</label>
                    <select name="customer_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select</option>
                        {% for c in customers %}<option value="{{ c.id }}" {% if shipment.customer_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Addresses -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Addresses & Contact</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Consignee Name</label>
                    <input type="text" name="consignee_name" value="{{ shipment.consignee_name or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Consignee Phone</label>
                    <input type="text" name="consignee_phone" value="{{ shipment.consignee_phone or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Delivery Address</label>
                    <textarea name="delivery_address" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">{{ shipment.delivery_address or '' }}</textarea>
                </div>
            </div>
        </div>

        <!-- Assignment -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Driver & Vehicle Assignment</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Driver</label>
                    <select name="driver_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Driver</option>
                        {% for d in drivers %}<option value="{{ d.id }}" {% if shipment.driver_id == d.id %}selected{% endif %}>{{ d.full_name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Vehicle</label>
                    <select name="vehicle_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Vehicle</option>
                        {% for v in vehicles %}<option value="{{ v.id }}" {% if shipment.vehicle_id == v.id %}selected{% endif %}>{{ v.plate_number }} - {{ v.vehicle_type }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Carrier</label>
                    <select name="carrier_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                        <option value="">Select Carrier</option>
                        {% for c in carriers %}<option value="{{ c.id }}" {% if shipment.carrier_id == c.id %}selected{% endif %}>{{ c.carrier_name }}</option>{% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Notes -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-5">Additional Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Shipment Reference</label>
                    <input type="text" name="shipment_reference" value="{{ shipment.shipment_reference or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Billing Party</label>
                    <input type="text" name="billing_party" value="{{ shipment.billing_party or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Notes</label>
                    <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">{{ shipment.notes or '' }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Status Change Reason</label>
                    <input type="text" name="status_change_reason" placeholder="Reason for status change (if applicable)" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white text-sm">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('logistics.shipments_view', id=shipment.id) }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-medium transition-all">
                <i class="fa-solid fa-save mr-2"></i>Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
