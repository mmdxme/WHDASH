{% extends "profile/base.html" %}

{% set page_title = 'Preferences' %}
{% set page_description = 'Customize your workspace preferences including language, timezone, and display options.' %}

{% block profile_content %}
<form method="POST" class="space-y-6">
    <!-- General Preferences -->
    <div class="glass-panel rounded-2xl border border-white/5 p-6">
        <h3 class="text-lg font-bold text-white mb-6">General Preferences</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Default Landing Page</label>
                <select name="default_landing" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="dashboard" {% if preferences and preferences.default_landing == 'dashboard' %}selected{% endif %}>Dashboard</option>
                    <option value="tasks" {% if preferences and preferences.default_landing == 'tasks' %}selected{% endif %}>Tasks</option>
                    <option value="customers" {% if preferences and preferences.default_landing == 'customers' %}selected{% endif %}>Customers</option>
                    <option value="reports" {% if preferences and preferences.default_landing == 'reports' %}selected{% endif %}>Reports</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Default Language</label>
                <select name="default_language" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="en" {% if preferences and preferences.default_language == 'en' %}selected{% endif %}>English</option>
                    <option value="ar" {% if preferences and preferences.default_language == 'ar' %}selected{% endif %}>العربية (Arabic)</option>
                    <option value="fa" {% if preferences and preferences.default_language == 'fa' %}selected{% endif %}>فارسی (Persian)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Timezone</label>
                <select name="default_timezone" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="UTC" {% if preferences and preferences.default_timezone == 'UTC' %}selected{% endif %}>UTC</option>
                    <option value="Asia/Dubai" {% if preferences and preferences.default_timezone == 'Asia/Dubai' %}selected{% endif %}>Asia/Dubai (GMT+4)</option>
                    <option value="Asia/Riyadh" {% if preferences and preferences.default_timezone == 'Asia/Riyadh' %}selected{% endif %}>Asia/Riyadh (GMT+3)</option>
                    <option value="Asia/Tehran" {% if preferences and preferences.default_timezone == 'Asia/Tehran' %}selected{% endif %}>Asia/Tehran (GMT+3:30)</option>
                    <option value="Europe/London" {% if preferences and preferences.default_timezone == 'Europe/London' %}selected{% endif %}>Europe/London (GMT)</option>
                    <option value="America/New_York" {% if preferences and preferences.default_timezone == 'America/New_York' %}selected{% endif %}>America/New_York (EST)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Date Format</label>
                <select name="date_format" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="DD/MM/YYYY" {% if preferences and preferences.date_format == 'DD/MM/YYYY' %}selected{% endif %}>DD/MM/YYYY (31/12/2024)</option>
                    <option value="MM/DD/YYYY" {% if preferences and preferences.date_format == 'MM/DD/YYYY' %}selected{% endif %}>MM/DD/YYYY (12/31/2024)</option>
                    <option value="YYYY-MM-DD" {% if preferences and preferences.date_format == 'YYYY-MM-DD' %}selected{% endif %}>YYYY-MM-DD (2024-12-31)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Time Format</label>
                <select name="time_format" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="24h" {% if preferences and preferences.time_format == '24h' %}selected{% endif %}>24-hour (14:30)</option>
                    <option value="12h" {% if preferences and preferences.time_format == '12h' %}selected{% endif %}>12-hour (2:30 PM)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Number Format</label>
                <select name="number_format" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="1,234.56" {% if preferences and preferences.number_format == '1,234.56' %}selected{% endif %}>1,234.56</option>
                    <option value="1.234,56" {% if preferences and preferences.number_format == '1.234,56' %}selected{% endif %}>1.234,56</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Currency Display</label>
                <select name="currency_display" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="symbol" {% if preferences and preferences.currency_display == 'symbol' %}selected{% endif %}>Symbol (AED 1,234)</option>
                    <option value="code" {% if preferences and preferences.currency_display == 'code' %}selected{% endif %}>Code (1,234 AED)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Display Preferences -->
    <div class="glass-panel rounded-2xl border border-white/5 p-6">
        <h3 class="text-lg font-bold text-white mb-6">Display Preferences</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Default View Mode</label>
                <select name="default_view_mode" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="list" {% if preferences and preferences.default_view_mode == 'list' %}selected{% endif %}>List View</option>
                    <option value="grid" {% if preferences and preferences.default_view_mode == 'grid' %}selected{% endif %}>Grid View</option>
                    <option value="kanban" {% if preferences and preferences.default_view_mode == 'kanban' %}selected{% endif %}>Kanban View</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Sidebar Default</label>
                <select name="sidebar_default" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="expanded" {% if preferences and preferences.sidebar_default == 'expanded' %}selected{% endif %}>Expanded</option>
                    <option value="compact" {% if preferences and preferences.sidebar_default == 'compact' %}selected{% endif %}>Compact</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Compact Mode</label>
                <select name="compact_mode" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="0" {% if not preferences or preferences.compact_mode == '0' %}selected{% endif %}>No</option>
                    <option value="1" {% if preferences and preferences.compact_mode == '1' %}selected{% endif %}>Yes</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Show Welcome Tour</label>
                <select name="show_welcome" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-slate-900/50 text-white focus:outline-none focus:border-brand-500 transition">
                    <option value="1" {% if not preferences or preferences.show_welcome == '1' %}selected{% endif %}>Yes</option>
                    <option value="0" {% if preferences and preferences.show_welcome == '0' %}selected{% endif %}>No</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Submit -->
    <div class="flex justify-end">
        <button type="submit" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold transition">
            <i class="fas fa-save mr-2"></i>Save Preferences
        </button>
    </div>
</form>
{% endblock %}
