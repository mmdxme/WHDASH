{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-play fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_run_now', 'Run Job Now') }}
        </h1>
        <a href="{{ url_for('btp_jobs') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ t('btp_run_now', 'Run Job Now') }}</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('btp_job_run_now') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_job_name', 'Job Name') }} *</label>
                        <input type="text" name="name" class="form-control" required
                               placeholder="{{ t('enter_job_name', 'e.g., Manual SAP Sync') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_job_type', 'Job Type') }}</label>
                        <select name="job_type" class="form-select">
                            <option value="manual">{{ t('manual', 'Manual') }}</option>
                            <option value="sync">{{ t('sync', 'Sync') }}</option>
                            <option value="import">{{ t('import', 'Import') }}</option>
                            <option value="export">{{ t('export', 'Export') }}</option>
                            <option value="ai">{{ t('ai', 'AI') }}</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('btp_jobs') }}" class="btn btn-outline-secondary">{{ t('cancel', 'Cancel') }}</a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-play me-1"></i> {{ t('btp_run_now', 'Run Now') }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
