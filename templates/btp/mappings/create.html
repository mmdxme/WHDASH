{% extends "base.html" %}

{% block title %}{{ t('btp_create_mapping', 'Create Mapping') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-exchange-alt fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_create_mapping', 'Create Data Mapping') }}
        </h1>
        <a href="{{ url_for('btp_mappings') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ t('btp_data_mappings', 'Mapping Details') }}</h6>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_name', 'Mapping Name') }} *</label>
                        <input type="text" name="name" class="form-control" required placeholder="{{ t('enter_name', 'Enter mapping name') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_connector_code', 'Mapping Code') }} *</label>
                        <input type="text" name="code" class="form-control" required placeholder="{{ t('enter_code', 'e.g., MAP_SAP_WMS_001') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_source_entity', 'Source Type') }}</label>
                        <input type="text" name="source_type" class="form-control" placeholder="{{ t('enter_source', 'e.g., SAP.SALES_ORDER') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_target_entity', 'Target Type') }}</label>
                        <input type="text" name="target_type" class="form-control" placeholder="{{ t('enter_target', 'e.g., WMS.PURCHASE_ORDER') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_owner', 'Owner') }}</label>
                        <input type="text" name="owner" class="form-control" placeholder="{{ t('enter_owner', 'Owner name') }}">
                    </div>

                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('btp_mappings') }}" class="btn btn-outline-secondary">{{ t('cancel', 'Cancel') }}</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> {{ t('save', 'Save Mapping') }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
