{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-cog fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_platform_settings', 'Platform Settings') }}
        </h1>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            {% if settings %}
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Setting Key</th>
                            <th>Value</th>
                            <th>Category</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for key, value in settings.items() %}
                        <tr>
                            <td><code>{{ key }}</code></td>
                            <td>{{ value }}</td>
                            <td><small class="text-muted">General</small></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <p class="text-muted text-center">No settings configured</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
