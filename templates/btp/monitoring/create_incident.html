{% extends "base.html" %}

{% block title %}{{ t('btp_create_incident', 'Create Incident') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-exclamation-triangle fa-fw me-2" style="color: var(--danger-color, #e74a3b);"></i>
            {{ t('btp_create_incident', 'Create Incident') }}
        </h1>
        <a href="{{ url_for('btp_monitoring_incidents') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ t('btp_incident_title', 'Incident Details') }}</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('btp_incident_create') }}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">{{ t('btp_incident_title', 'Title') }} *</label>
                        <input type="text" name="title" class="form-control" required
                               placeholder="{{ t('enter_title', 'e.g., SAP Connector Timeout') }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">{{ t('btp_description', 'Description') }}</label>
                        <textarea name="description" class="form-control" rows="3"
                                  placeholder="{{ t('enter_description', 'Describe the incident...') }}"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_incident_severity', 'Severity') }}</label>
                        <select name="severity" class="form-select">
                            <option value="critical">{{ t('btp_critical', 'Critical') }}</option>
                            <option value="high">{{ t('btp_high', 'High') }}</option>
                            <option value="medium" selected>{{ t('btp_medium', 'Medium') }}</option>
                            <option value="low">{{ t('btp_low', 'Low') }}</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_incident_category', 'Category') }}</label>
                        <select name="category" class="form-select">
                            <option value="integration">{{ t('integration', 'Integration') }}</option>
                            <option value="api">{{ t('api', 'API') }}</option>
                            <option value="ai">{{ t('ai', 'AI') }}</option>
                            <option value="security">{{ t('security', 'Security') }}</option>
                            <option value="platform">{{ t('platform', 'Platform') }}</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('btp_monitoring_incidents') }}" class="btn btn-outline-secondary">{{ t('cancel', 'Cancel') }}</a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-exclamation me-1"></i> {{ t('create_incident', 'Create Incident') }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
