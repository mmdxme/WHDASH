{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-heartbeat fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_service_health', 'Service Health') }}
        </h1>
    </div>

    <!-- Health Cards -->
    <div class="row">
        {% for health in health_data %}
        <div class="col-lg-3 col-md-6 mb-4">
            <div class="card border-left-{{ 'success' if health.unhealthy == 0 else 'danger' }} shadow h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs font-weight-bold text-uppercase mb-1">{{ health.service }}</div>
                            <div class="h5 mb-0 font-weight-bold">
                                {{ health.total - health.unhealthy }}/{{ health.total }}
                            </div>
                            <div class="small text-muted">Healthy</div>
                        </div>
                        <div class="col-auto">
                            <i class="fas fa-{{ 'check-circle text-success' if health.unhealthy == 0 else 'exclamation-triangle text-danger' }} fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
