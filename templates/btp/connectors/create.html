{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plug fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_create_connector', 'Create Connector') }}
        </h1>
        <a href="{{ url_for('btp_connectors') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ t('btp_connector_name', 'Connector Details') }}</h6>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <!-- Basic Info -->
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_connector_name', 'Connector Name') }} *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ connector.name if connector else '' }}"
                               placeholder="{{ t('enter_name', 'Enter connector name') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_connector_code', 'Connector Code') }} *</label>
                        <input type="text" name="code" class="form-control" required
                               value="{{ connector.code if connector else '' }}"
                               placeholder="{{ t('enter_code', 'e.g., ERP_SAP_001') }}">
                    </div>

                    <!-- Category & Direction -->
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_category', 'Category') }} *</label>
                        <select name="category" class="form-select" required>
                            <option value="">{{ t('select_category', 'Select Category') }}</option>
                            <option value="ERP" {{ 'selected' if connector and connector.category == 'ERP' else '' }}>ERP</option>
                            <option value="CRM" {{ 'selected' if connector and connector.category == 'CRM' else '' }}>CRM</option>
                            <option value="WMS" {{ 'selected' if connector and connector.category == 'WMS' else '' }}>WMS</option>
                            <option value="Finance" {{ 'selected' if connector and connector.category == 'Finance' else '' }}>Finance</option>
                            <option value="HR" {{ 'selected' if connector and connector.category == 'HR' else '' }}>HR</option>
                            <option value="E-commerce" {{ 'selected' if connector and connector.category == 'E-commerce' else '' }}>E-commerce</option>
                            <option value="Marketing" {{ 'selected' if connector and connector.category == 'Marketing' else '' }}>Marketing</option>
                            <option value="Logistics" {{ 'selected' if connector and connector.category == 'Logistics' else '' }}>Logistics</option>
                            <option value="Email" {{ 'selected' if connector and connector.category == 'Email' else '' }}>Email</option>
                            <option value="SMS" {{ 'selected' if connector and connector.category == 'SMS' else '' }}>SMS/WhatsApp</option>
                            <option value="File" {{ 'selected' if connector and connector.category == 'File' else '' }}>File/CSV</option>
                            <option value="REST" {{ 'selected' if connector and connector.category == 'REST' else '' }}>REST API</option>
                            <option value="AI" {{ 'selected' if connector and connector.category == 'AI' else '' }}>AI/ML</option>
                            <option value="Other" {{ 'selected' if connector and connector.category == 'Other' else '' }}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_direction', 'Direction') }}</label>
                        <select name="direction" class="form-select">
                            <option value="bidirectional" {{ 'selected' if connector and connector.direction == 'bidirectional' else '' }}>{{ t('bidirectional', 'Bidirectional') }}</option>
                            <option value="inbound" {{ 'selected' if connector and connector.direction == 'inbound' else '' }}>{{ t('inbound', 'Inbound') }}</option>
                            <option value="outbound" {{ 'selected' if connector and connector.direction == 'outbound' else '' }}>{{ t('outbound', 'Outbound') }}</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ t('environment', 'Environment') }}</label>
                        <select name="environment" class="form-select">
                            <option value="production" {{ 'selected' if connector and connector.environment == 'production' else '' }}>{{ t('production', 'Production') }}</option>
                            <option value="staging" {{ 'selected' if connector and connector.environment == 'staging' else '' }}>{{ t('staging', 'Staging') }}</option>
                            <option value="testing" {{ 'selected' if connector and connector.environment == 'testing' else '' }}>{{ t('testing', 'Testing') }}</option>
                            <option value="development" {{ 'selected' if connector and connector.environment == 'development' else '' }}>{{ t('development', 'Development') }}</option>
                        </select>
                    </div>

                    <!-- System Info -->
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_source_system', 'Source System') }}</label>
                        <input type="text" name="source_system" class="form-control"
                               value="{{ connector.source_system if connector else '' }}"
                               placeholder="{{ t('enter_source', 'e.g., SAP ECC') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_target_system', 'Target System') }}</label>
                        <input type="text" name="target_system" class="form-control"
                               value="{{ connector.target_system if connector else '' }}"
                               placeholder="{{ t('enter_target', 'e.g., Warehouse DB') }}">
                    </div>

                    <!-- Connection Info -->
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_auth_type', 'Auth Type') }}</label>
                        <select name="auth_type" class="form-select">
                            <option value="">{{ t('select_auth', 'Select Auth Type') }}</option>
                            <option value="none" {{ 'selected' if connector and connector.auth_type == 'none' else '' }}>None</option>
                            <option value="api_key" {{ 'selected' if connector and connector.auth_type == 'api_key' else '' }}>API Key</option>
                            <option value="basic" {{ 'selected' if connector and connector.auth_type == 'basic' else '' }}>Basic Auth</option>
                            <option value="bearer" {{ 'selected' if connector and connector.auth_type == 'bearer' else '' }}>Bearer Token</option>
                            <option value="oauth2" {{ 'selected' if connector and connector.auth_type == 'oauth2' else '' }}>OAuth 2.0</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_base_url', 'Base URL') }}</label>
                        <input type="url" name="base_url" class="form-control"
                               value="{{ connector.base_url if connector else '' }}"
                               placeholder="https://api.example.com">
                    </div>

                    <!-- File Format -->
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_file_format', 'File Format') }}</label>
                        <select name="file_format" class="form-select">
                            <option value="">{{ t('not_applicable', 'N/A') }}</option>
                            <option value="JSON" {{ 'selected' if connector and connector.file_format == 'JSON' else '' }}>JSON</option>
                            <option value="XML" {{ 'selected' if connector and connector.file_format == 'XML' else '' }}>XML</option>
                            <option value="CSV" {{ 'selected' if connector and connector.file_format == 'CSV' else '' }}>CSV</option>
                            <option value="XLSX" {{ 'selected' if connector and connector.file_format == 'XLSX' else '' }}>XLSX</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_timeout', 'Timeout (seconds)') }}</label>
                        <input type="number" name="timeout" class="form-control" min="5" max="300"
                               value="{{ connector.timeout if connector else 30 }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_owner', 'Owner') }}</label>
                        <input type="text" name="owner" class="form-control"
                               value="{{ connector.owner if connector else '' }}"
                               placeholder="{{ t('enter_owner', 'Owner name') }}">
                    </div>

                    <!-- Team -->
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_team', 'Team') }}</label>
                        <input type="text" name="team" class="form-control"
                               value="{{ connector.team if connector else '' }}"
                               placeholder="{{ t('enter_team', 'Team name') }}">
                    </div>

                    <!-- Notes -->
                    <div class="col-12">
                        <label class="form-label">{{ t('btp_notes', 'Notes') }}</label>
                        <textarea name="notes" class="form-control" rows="3"
                                  placeholder="{{ t('enter_notes', 'Additional notes or description') }}">{{ connector.notes if connector else '' }}</textarea>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('btp_connectors') }}" class="btn btn-outline-secondary">
                                {{ t('cancel', 'Cancel') }}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> {{ t('save', 'Save Connector') }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
