{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-user-cog fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_create_api_client', 'Create API Client') }}
        </h1>
        <a href="{{ url_for('btp_api_clients') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ t('btp_api_clients', 'Client Details') }}</h6>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_client_name', 'Client Name') }} *</label>
                        <input type="text" name="client_name" class="form-control" required
                               placeholder="{{ t('enter_name', 'e.g., Mobile App iOS') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_client_code', 'Client Code') }} *</label>
                        <input type="text" name="client_code" class="form-control" required
                               placeholder="{{ t('enter_code', 'e.g., CLIENT_IOS_001') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_api_catalog', 'API') }}</label>
                        <select name="api_id" class="form-select">
                            <option value="">{{ t('select_api', 'Select API') }}</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_scopes', 'Scopes') }}</label>
                        <input type="text" name="scopes" class="form-control"
                               placeholder="{{ t('enter_scopes', 'e.g., read,write,delete') }}">
                    </div>

                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('btp_api_clients') }}" class="btn btn-outline-secondary">{{ t('cancel', 'Cancel') }}</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> {{ t('save', 'Save Client') }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
