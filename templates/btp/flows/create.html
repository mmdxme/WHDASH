{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-project-diagram fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('btp_create_flow', 'Create Integration Flow') }}
        </h1>
        <a href="{{ url_for('btp_flows') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">{{ t('btp_flow_detail', 'Flow Details') }}</h6>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_flow_name', 'Flow Name') }} *</label>
                        <input type="text" name="flow_name" class="form-control" required placeholder="{{ t('enter_flow_name', 'e.g., SAP to Warehouse Sync') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_flow_code', 'Flow Code') }} *</label>
                        <input type="text" name="flow_code" class="form-control" required placeholder="{{ t('enter_code', 'e.g., FLOW_SAP_001') }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_trigger_type', 'Trigger Type') }}</label>
                        <select name="trigger_type" class="form-select">
                            <option value="manual">{{ t('manual', 'Manual') }}</option>
                            <option value="scheduled">{{ t('scheduled', 'Scheduled') }}</option>
                            <option value="event_based">{{ t('event_based', 'Event Based') }}</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_schedule', 'Schedule (Cron)') }}</label>
                        <input type="text" name="schedule" class="form-control" placeholder="0 0 * * *">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">{{ t('btp_owner', 'Owner') }}</label>
                        <input type="text" name="owner" class="form-control" placeholder="{{ t('enter_owner', 'Owner name') }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_source_entity', 'Source Entity') }}</label>
                        <input type="text" name="source_entity" class="form-control" placeholder="{{ t('enter_source', 'e.g., SAP.SALES_ORDERS') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('btp_target_entity', 'Target Entity') }}</label>
                        <input type="text" name="target_entity" class="form-control" placeholder="{{ t('enter_target', 'e.g., WAREHOUSE.ORDERS') }}">
                    </div>

                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('btp_flows') }}" class="btn btn-outline-secondary">{{ t('cancel', 'Cancel') }}</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> {{ t('save', 'Save Flow') }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
