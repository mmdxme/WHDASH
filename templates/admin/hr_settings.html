<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - {{ get_setting('platform_name', 'WHDASH') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>{% include 'theme_variables.html' %}</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
{% include 'admin_sidebar.html' %}
<div class="ml-64 min-h-screen">
    {% include 'admin_header.html' %}
    <main class="p-6">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800 dark:text-white">{{ page_title }}</h1>
            <p class="text-slate-600 dark:text-slate-400 mt-1">Configure HR policies, leave rules, attendance, and payroll settings</p>
        </div>

        <form method="post" action="{{ url_for('admin_settings_category', category='HR') }}">
            <input type="hidden" name="category" value="HR">

            <!-- Working Hours -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-clock text-blue-600"></i> Working Hours
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Work Week Hours</label>
                        <input type="number" name="hr_work_week_hours" value="{{ settings.hr_work_week_hours or '40' }}" min="1" max="168"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Daily Work Hours</label>
                        <input type="number" name="hr_daily_work_hours" value="{{ settings.hr_daily_work_hours or '8' }}" min="1" max="24"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Shift Start Time</label>
                        <input type="time" name="hr_shift_start" value="{{ settings.hr_shift_start or '09:00' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Shift End Time</label>
                        <input type="time" name="hr_shift_end" value="{{ settings.hr_shift_end or '17:00' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                </div>
            </div>

            <!-- Leave Policy -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-calendar-minus text-green-600"></i> Leave Policy
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Annual Leave Days</label>
                        <input type="number" name="hr_annual_leave_days" value="{{ settings.hr_annual_leave_days or '22' }}" min="0"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Sick Leave Days</label>
                        <input type="number" name="hr_sick_leave_days" value="{{ settings.hr_sick_leave_days or '14' }}" min="0"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Carry-Over Days Limit</label>
                        <input type="number" name="hr_carry_over_limit" value="{{ settings.hr_carry_over_limit or '5' }}" min="0"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Leave Approval Required</label>
                        <div class="flex items-center gap-4 mt-2">
                            <label class="flex items-center gap-2">
                                <input type="radio" name="hr_require_leave_approval" value="1" {% if settings.hr_require_leave_approval == '1' %}checked{% endif %} class="w-4 h-4 text-blue-600">Yes
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="radio" name="hr_require_leave_approval" value="0" {% if settings.hr_require_leave_approval != '1' %}checked{% endif %} class="w-4 h-4 text-blue-600">No
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Probation Period (days)</label>
                        <input type="number" name="hr_probation_days" value="{{ settings.hr_probation_days or '90' }}" min="0"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                </div>
            </div>

            <!-- Attendance -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-user-check text-purple-600"></i> Attendance Rules
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="hr_enable_face_recognition" value="1" {% if settings.hr_enable_face_recognition == '1' %}checked{% endif %}
                               class="w-5 h-5 text-blue-600 rounded border-slate-300">
                        <div>
                            <p class="font-medium text-slate-800 dark:text-white">Enable Face Recognition</p>
                            <p class="text-sm text-slate-500">Use face recognition for attendance</p>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                        <input type="checkbox" name="hr_auto_checkout" value="1" {% if settings.hr_auto_checkout == '1' %}checked{% endif %}
                               class="w-5 h-5 text-blue-600 rounded border-slate-300">
                        <div>
                            <p class="font-medium text-slate-800 dark:text-white">Auto Check-Out</p>
                            <p class="text-sm text-slate-500">Auto check-out after shift end</p>
                        </div>
                    </label>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Late Grace (minutes)</label>
                        <input type="number" name="hr_late_grace_minutes" value="{{ settings.hr_late_grace_minutes or '10' }}" min="0"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Overtime Rate Multiplier</label>
                        <input type="number" name="hr_overtime_multiplier" value="{{ settings.hr_overtime_multiplier or '1.5' }}" step="0.1" min="1"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                </div>
            </div>

            <!-- Salary & Benefits -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-coins text-yellow-600"></i> Salary & Benefits
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Payslip Generation Day</label>
                        <select name="hr_payslip_day" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            {% for d in range(1, 29) %}
                            <option value="{{ d }}" {% if (settings.hr_payslip_day|int) == d %}selected{% endif %}>Day {{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Currency</label>
                        <select name="hr_salary_currency" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="AED" {% if settings.hr_salary_currency == 'AED' %}selected{% endif %}>AED</option>
                            <option value="USD" {% if settings.hr_salary_currency == 'USD' %}selected{% endif %}>USD</option>
                            <option value="EUR" {% if settings.hr_salary_currency == 'EUR' %}selected{% endif %}>EUR</option>
                            <option value="SAR" {% if settings.hr_salary_currency == 'SAR' %}selected{% endif %}>SAR</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Default Cost Center</label>
                        <input type="text" name="hr_default_cost_center" value="{{ settings.hr_default_cost_center or 'HEADQUARTERS' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Save Settings
                </button>
            </div>
        </form>
    </main>
</div>
{% include 'admin_scripts.html' %}
</body>
</html>
