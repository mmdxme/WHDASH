<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Master Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900">
    
    {% include 'admin_sidebar.html' %}
    
    <div class="ml-64 min-h-screen">
        {% include 'admin_header.html' %}
        
        <main class="p-6">
            <!-- Page Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-slate-800 dark:text-white">{{ page_title }}</h1>
                <p class="text-slate-600 dark:text-slate-400 mt-1">Centralized reference data management</p>
            </div>
            
            <!-- Master Data Types Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {% for md_type, md_info in master_data_types.items()|sort %}
                <a href="{{ url_for('admin_master_data_type', md_type=md_type) }}" 
                   class="group bg-white dark:bg-slate-800 rounded-xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 hover:border-blue-500 dark:hover:border-blue-500 transition-all">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 bg-blue-50 dark:bg-blue-900/30 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="fas {{ md_info.icon if md_info.icon else 'fa-circle' }} text-blue-600 dark:text-blue-400 text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-slate-800 dark:text-white mb-1">{{ md_info.label_plural }}</h3>
                            <p class="text-sm text-slate-500 dark:text-slate-400">{{ md_info.label }}</p>
                        </div>
                        <i class="fas fa-chevron-right text-slate-400 self-center group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </a>
                {% endfor %}
            </div>
        </main>
    </div>
    
    {% include 'admin_scripts.html' %}
</body>
</html>
