<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - {{ get_setting('platform_name', 'WHDASH') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>{% include 'theme_variables.html' %}</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
{% include 'admin_sidebar.html' %}
<div class="ml-64 min-h-screen">
    {% include 'admin_header.html' %}
    <main class="p-6">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800 dark:text-white">{{ page_title }}</h1>
            <p class="text-slate-600 dark:text-slate-400 mt-1">Configure language, timezone, date formats, and regional settings</p>
        </div>

        <form method="post" action="{{ url_for('admin_settings_category', category='LOCALIZATION') }}">
            <input type="hidden" name="category" value="LOCALIZATION">

            <!-- Language Settings -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-language text-blue-600"></i> Language & Translation
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Default Language</label>
                        <select name="default_language" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="en" {% if settings.default_language == 'en' %}selected{% endif %}>English</option>
                            <option value="ar" {% if settings.default_language == 'ar' %}selected{% endif %}>العربية (Arabic)</option>
                            <option value="fa" {% if settings.default_language == 'fa' %}selected{% endif %}>فارسی (Persian)</option>
                            <option value="ru" {% if settings.default_language == 'ru' %}selected{% endif %}>Русский (Russian)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Enable RTL Support</label>
                        <div class="flex items-center gap-4 mt-2">
                            <label class="flex items-center gap-2">
                                <input type="radio" name="enable_rtl" value="1" {% if settings.enable_rtl == '1' or not settings.enable_rtl %}checked{% endif %} class="w-4 h-4 text-blue-600">Yes
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="radio" name="enable_rtl" value="0" {% if settings.enable_rtl == '0' %}checked{% endif %} class="w-4 h-4 text-blue-600">No
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Allow User Language Override</label>
                        <div class="flex items-center gap-4 mt-2">
                            <label class="flex items-center gap-2">
                                <input type="radio" name="allow_language_override" value="1" {% if settings.allow_language_override != '0' %}checked{% endif %} class="w-4 h-4 text-blue-600">Allow
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="radio" name="allow_language_override" value="0" {% if settings.allow_language_override == '0' %}checked{% endif %} class="w-4 h-4 text-blue-600">Force Default
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Date & Time -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-calendar-alt text-green-600"></i> Date & Time Format
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Date Format</label>
                        <select name="date_format" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="DD/MM/YYYY" {% if settings.date_format == 'DD/MM/YYYY' %}selected{% endif %}>DD/MM/YYYY (31/12/2026)</option>
                            <option value="MM/DD/YYYY" {% if settings.date_format == 'MM/DD/YYYY' %}selected{% endif %}>MM/DD/YYYY (12/31/2026)</option>
                            <option value="YYYY-MM-DD" {% if settings.date_format == 'YYYY-MM-DD' %}selected{% endif %}>YYYY-MM-DD (2026-12-31)</option>
                            <option value="DD-MM-YYYY" {% if settings.date_format == 'DD-MM-YYYY' %}selected{% endif %}>DD-MM-YYYY (31-12-2026)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Time Format</label>
                        <select name="time_format" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="24h" {% if settings.time_format == '24h' %}selected{% endif %}>24-hour (14:30)</option>
                            <option value="12h" {% if settings.time_format == '12h' %}selected{% endif %}>12-hour (2:30 PM)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Default Timezone</label>
                        <select name="default_timezone" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="Asia/Dubai" {% if settings.default_timezone == 'Asia/Dubai' %}selected{% endif %}>Asia/Dubai (UTC+4)</option>
                            <option value="Asia/Riyadh" {% if settings.default_timezone == 'Asia/Riyadh' %}selected{% endif %}>Asia/Riyadh (UTC+3)</option>
                            <option value="Asia/Tehran" {% if settings.default_timezone == 'Asia/Tehran' %}selected{% endif %}>Asia/Tehran (UTC+3:30)</option>
                            <option value="Europe/London" {% if settings.default_timezone == 'Europe/London' %}selected{% endif %}>Europe/London (UTC+0)</option>
                            <option value="America/New_York" {% if settings.default_timezone == 'America/New_York' %}selected{% endif %}>America/New_York (UTC-5)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Number & Currency -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-calculator text-purple-600"></i> Number & Currency Format
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Number Format</label>
                        <select name="number_format" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="1,234.56" {% if settings.number_format == '1,234.56' %}selected{% endif %}>1,234.56</option>
                            <option value="1.234,56" {% if settings.number_format == '1.234,56' %}selected{% endif %}>1.234,56</option>
                            <option value="1 234.56" {% if settings.number_format == '1 234.56' %}selected{% endif %}>1 234.56</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Decimal Precision</label>
                        <select name="decimal_precision" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="0" {% if settings.decimal_precision == '0' %}selected{% endif %}>0 decimals</option>
                            <option value="1" {% if settings.decimal_precision == '1' %}selected{% endif %}>1 decimal</option>
                            <option value="2" {% if settings.decimal_precision == '2' %}selected{% endif %}>2 decimals</option>
                            <option value="3" {% if settings.decimal_precision == '3' %}selected{% endif %}>3 decimals</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Default Currency</label>
                        <select name="default_currency" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                            <option value="AED" {% if settings.default_currency == 'AED' %}selected{% endif %}>AED - UAE Dirham</option>
                            <option value="USD" {% if settings.default_currency == 'USD' %}selected{% endif %}>USD - US Dollar</option>
                            <option value="EUR" {% if settings.default_currency == 'EUR' %}selected{% endif %}>EUR - Euro</option>
                            <option value="GBP" {% if settings.default_currency == 'GBP' %}selected{% endif %}>GBP - British Pound</option>
                            <option value="SAR" {% if settings.default_currency == 'SAR' %}selected{% endif %}>SAR - Saudi Riyal</option>
                            <option value="IRR" {% if settings.default_currency == 'IRR' %}selected{% endif %}>IRR - Iranian Rial</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Save Settings
                </button>
            </div>
        </form>
    </main>
</div>
{% include 'admin_scripts.html' %}
</body>
</html>
