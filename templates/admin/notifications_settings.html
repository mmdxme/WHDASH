<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ direction }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - {{ get_setting('platform_name', 'MMDx') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>{% include 'theme_variables.html' %}</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
{% include 'admin_sidebar.html' %}
<div class="ml-64 min-h-screen">
    {% include 'admin_header.html' %}
    <main class="p-6">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800 dark:text-white">{{ page_title }}</h1>
            <p class="text-slate-600 dark:text-slate-400 mt-1">Configure system notifications, alerts, and email templates</p>
        </div>

        <form method="post" action="{{ url_for('admin_settings_category', category='NOTIFICATIONS') }}">
            <input type="hidden" name="category" value="NOTIFICATIONS">

            <!-- Email Settings -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-envelope text-blue-600"></i> Email Configuration
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">SMTP Server</label>
                        <input type="text" name="smtp_server" value="{{ settings.smtp_server or '' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white" placeholder="smtp.gmail.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">SMTP Port</label>
                        <input type="number" name="smtp_port" value="{{ settings.smtp_port or '587' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white" placeholder="587">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">SMTP Username</label>
                        <input type="text" name="smtp_username" value="{{ settings.smtp_username or '' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">SMTP Password</label>
                        <input type="password" name="smtp_password" value="{{ settings.smtp_password or '' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">From Email</label>
                        <input type="email" name="smtp_from_email" value="{{ settings.smtp_from_email or '' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">From Name</label>
                        <input type="text" name="smtp_from_name" value="{{ settings.smtp_from_name or 'MMDx' }}"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                </div>
            </div>

            <!-- Notification Events -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-bell text-green-600"></i> Notification Events
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="notify_new_lead" value="1" {% if settings.notify_new_lead == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <span class="text-slate-800 dark:text-white">New Lead Created</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="notify_order_status" value="1" {% if settings.notify_order_status == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <span class="text-slate-800 dark:text-white">Order Status Change</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="notify_low_stock" value="1" {% if settings.notify_low_stock == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <span class="text-slate-800 dark:text-white">Low Stock Alert</span>
                        </label>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="notify_task_assigned" value="1" {% if settings.notify_task_assigned == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <span class="text-slate-800 dark:text-white">Task Assigned</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="notify_approval_needed" value="1" {% if settings.notify_approval_needed == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <span class="text-slate-800 dark:text-white">Approval Needed</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="notify_delivery_update" value="1" {% if settings.notify_delivery_update == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <span class="text-slate-800 dark:text-white">Delivery Update</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Alert Channels -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-broadcast-tower text-purple-600"></i> Alert Channels
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="enable_email_notifications" value="1" {% if settings.enable_email_notifications != '0' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <div>
                                <p class="font-medium text-slate-800 dark:text-white">Email</p>
                                <p class="text-sm text-slate-500">Send via SMTP</p>
                            </div>
                        </label>
                    </div>
                    <div>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="enable_in_app_notifications" value="1" {% if settings.enable_in_app_notifications != '0' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <div>
                                <p class="font-medium text-slate-800 dark:text-white">In-App</p>
                                <p class="text-sm text-slate-500">Show in notification center</p>
                            </div>
                        </label>
                    </div>
                    <div>
                        <label class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-700 rounded-lg cursor-pointer">
                            <input type="checkbox" name="enable_sms_notifications" value="1" {% if settings.enable_sms_notifications == '1' %}checked{% endif %}
                                   class="w-5 h-5 text-blue-600 rounded border-slate-300">
                            <div>
                                <p class="font-medium text-slate-800 dark:text-white">SMS</p>
                                <p class="text-sm text-slate-500">Send to mobile number</p>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Reminder Settings -->
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-6">
                <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-clock text-orange-600"></i> Follow-up Reminders
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Auto Follow-up (days)</label>
                        <input type="number" name="auto_followup_days" value="{{ settings.auto_followup_days or '3' }}" min="1"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                        <p class="text-xs text-slate-500 mt-1">Days before follow-up reminder</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">Escalation After (days)</label>
                        <input type="number" name="escalation_days" value="{{ settings.escalation_days or '7' }}" min="1"
                               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">
                    <i class="fas fa-save mr-2"></i>Save Settings
                </button>
            </div>
        </form>
    </main>
</div>
{% include 'admin_scripts.html' %}
</body>
</html>
