{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if counter %}{{ t('maintenance.edit_counter', 'Edit Counter') }}{% else %}{{ t('maintenance.new_counter', 'New Counter') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.counter_code', 'Counter Code') }}</label>
                    <input type="text" name="counter_code" value="{{ counter.counter_code if counter else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated if blank">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.equipment', 'Equipment') }} *</label>
                    <select name="equipment_id" class="w-full px-3 py-2 border rounded-lg" required>
                        <option value="">-- Select --</option>
                        {% for eq in equipment %}
                        <option value="{{ eq.id }}" {% if counter and counter.equipment_id == eq.id %}selected{% endif %}>
                            {{ eq.asset_code }} - {{ eq.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.counter_type', 'Type') }}</label>
                        <select name="counter_type" class="w-full px-3 py-2 border rounded-lg">
                            <option value="OPERATING_HOURS" {% if counter and counter.counter_type == 'OPERATING_HOURS' %}selected{% endif %}>Operating Hours</option>
                            <option value="PRODUCTION_QTY" {% if counter and counter.counter_type == 'PRODUCTION_QTY' %}selected{% endif %}>Production Quantity</option>
                            <option value="CYCLE_COUNT" {% if counter and counter.counter_type == 'CYCLE_COUNT' %}selected{% endif %}>Cycle Count</option>
                            <option value="DISTANCE" {% if counter and counter.counter_type == 'DISTANCE' %}selected{% endif %}>Distance</option>
                            <option value="CUSTOM" {% if counter and counter.counter_type == 'CUSTOM' %}selected{% endif %}>Custom</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.unit', 'Unit') }}</label>
                        <input type="text" name="unit_of_measure" value="{{ counter.unit_of_measure if counter else 'HOUR' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.warning_threshold', 'Warning Threshold') }}</label>
                        <input type="number" step="any" name="max_warning_threshold"
                               value="{{ counter.max_warning_threshold if counter else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" placeholder="Max">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.critical_threshold', 'Critical Threshold') }}</label>
                        <input type="number" step="any" name="max_critical_threshold"
                               value="{{ counter.max_critical_threshold if counter else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" placeholder="Max">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.reading_source', 'Reading Source') }}</label>
                    <select name="reading_source" class="w-full px-3 py-2 border rounded-lg">
                        <option value="MANUAL" {% if counter and counter.reading_source == 'MANUAL' %}selected{% endif %}>Manual</option>
                        <option value="AUTOMATIC" {% if counter and counter.reading_source == 'AUTOMATIC' %}selected{% endif %}>Automatic</option>
                        <option value="IOT" {% if counter and counter.reading_source == 'IOT' %}selected{% endif %}>IoT Device</option>
                    </select>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not counter or counter.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.equipment_counters_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                    {{ t('common.cancel', 'Cancel') }}
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {{ t('common.save', 'Save') }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
