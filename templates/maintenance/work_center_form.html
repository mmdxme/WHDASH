{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if work_center %}
            {{ t('maintenance.edit_work_center', 'Edit Work Center') }}
            {% else %}
            {{ t('maintenance.new_work_center', 'New Work Center') }}
            {% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.work_center_code', 'Code') }} *</label>
                    <input type="text" name="work_center_code" value="{{ work_center.work_center_code if work_center else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated if blank" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.work_center_name', 'Name') }} *</label>
                    <input type="text" name="work_center_name" value="{{ work_center.work_center_name if work_center else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.category', 'Category') }}</label>
                    <select name="work_center_category" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">General</option>
                        <option value="Mechanical" {% if work_center and work_center.work_center_category == 'Mechanical' %}selected{% endif %}>Mechanical</option>
                        <option value="Electrical" {% if work_center and work_center.work_center_category == 'Electrical' %}selected{% endif %}>Electrical</option>
                        <option value="Instrumentation" {% if work_center and work_center.work_center_category == 'Instrumentation' %}selected{% endif %}>Instrumentation</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.plant', 'Plant') }}</label>
                    <select name="plant_id" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">-- Select --</option>
                        {% for branch in branches %}
                        <option value="{{ branch.id }}" {% if work_center and work_center.plant_id == branch.id %}selected{% endif %}>
                            {{ branch.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.location', 'Functional Location') }}</label>
                    <select name="location_id" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">-- Select --</option>
                        {% for loc in functional_locs %}
                        <option value="{{ loc.id }}" {% if work_center and work_center.location_id == loc.id %}selected{% endif %}>
                            {{ loc.location_code }} - {{ loc.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.supervisor', 'Supervisor') }}</label>
                    <select name="supervisor_id" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">-- Select --</option>
                        {% for sup in supervisors %}
                        <option value="{{ sup.id }}" {% if work_center and work_center.supervisor_id == sup.id %}selected{% endif %}>
                            {{ sup.first_name }} {{ sup.last_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.capacity', 'Daily Capacity (hours)') }}</label>
                    <input type="number" step="0.1" name="available_capacity"
                           value="{{ work_center.available_capacity if work_center else '8.0' }}"
                           class="w-full px-3 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.target_utilization', 'Target Utilization %') }}</label>
                    <input type="number" step="0.1" name="utilization_target"
                           value="{{ work_center.utilization_target if work_center else '100.0' }}"
                           class="w-full px-3 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.cost_center', 'Cost Center') }}</label>
                    <input type="text" name="cost_center" value="{{ work_center.cost_center if work_center else '' }}"
                           class="w-full px-3 py-2 border rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.currency', 'Currency') }}</label>
                    <input type="text" name="currency" value="{{ work_center.currency if work_center else 'USD' }}"
                           class="w-full px-3 py-2 border rounded-lg">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.description', 'Description') }}</label>
                    <textarea name="description" rows="2" class="w-full px-3 py-2 border rounded-lg">{{ work_center.description if work_center else '' }}</textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not work_center or work_center.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.work_centers_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                    {{ t('common.cancel', 'Cancel') }}
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {{ t('common.save', 'Save') }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
