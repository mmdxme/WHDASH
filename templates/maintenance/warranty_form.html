{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ t('maintenance.new_warranty', 'New Warranty Record') }}</h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.equipment', 'Equipment') }} *</label>
                    <select name="equipment_id" class="w-full px-3 py-2 border rounded-lg" required>
                        <option value="">-- Select --</option>
                        {% for eq in equipment %}
                        <option value="{{ eq.id }}">{{ eq.asset_code }} - {{ eq.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.warranty_type', 'Type') }}</label>
                        <select name="warranty_type" class="w-full px-3 py-2 border rounded-lg">
                            <option value="MANUFACTURER">Manufacturer</option>
                            <option value="EXTENDED">Extended</option>
                            <option value="SUPPLIER">Supplier</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.warranty_number', 'Warranty Number') }}</label>
                        <input type="text" name="warranty_number" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.start_date', 'Start Date') }} *</label>
                        <input type="date" name="start_date" class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.end_date', 'End Date') }} *</label>
                        <input type="date" name="end_date" class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.provider', 'Provider') }}</label>
                        <input type="text" name="warranty_provider" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.coverage', 'Coverage') }}</label>
                        <select name="coverage_scope" class="w-full px-3 py-2 border rounded-lg">
                            <option value="FULL">Full</option>
                            <option value="LIMITED">Limited</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.max_claims', 'Max Claims') }}</label>
                        <input type="number" name="maximum_claims" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.max_value', 'Max Value') }}</label>
                        <input type="number" step="0.01" name="maximum_value" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1" checked class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.warranty_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
