{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">New PM Plan</h1>
            <a href="{{ url_for('maintenance.pm_plans') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Asset *</label>
                        <select name="asset_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Select Asset</option>
                            {% for asset in assets %}
                            <option value="{{ asset.id }}">{{ asset.asset_code }} - {{ asset.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Maintenance Type *</label>
                        <select name="maintenance_type_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Select Type</option>
                            {% for mt in maintenance_types %}
                            <option value="{{ mt.id }}">{{ mt.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Schedule Name</label>
                        <input type="text" name="schedule_name" placeholder="e.g., Monthly Inspection" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Frequency</label>
                            <select name="frequency" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                {% for freq in frequencies %}
                                <option value="{{ freq }}" {% if freq == 'Monthly' %}selected{% endif %}>{{ freq }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Interval (days)</label>
                            <input type="number" name="interval_days" value="30" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">First Due Date *</label>
                            <input type="date" name="next_due_date" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Priority</label>
                            <select name="priority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                {% for priority in priorities %}
                                <option value="{{ priority }}" {% if priority == 'Medium' %}selected{% endif %}>{{ priority }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Assigned Technician</label>
                        <select name="assigned_technician_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Unassigned</option>
                            {% for emp in employees %}
                            <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Est. Duration (hrs)</label>
                            <input type="number" step="0.5" name="estimated_duration_hours" value="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Est. Cost</label>
                            <input type="number" step="0.01" name="estimated_cost" value="0" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Notes</label>
                        <textarea name="notes" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <a href="{{ url_for('maintenance.pm_plans') }}" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>Create PM Plan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
