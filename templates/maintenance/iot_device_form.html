{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if device %}{{ t('maintenance.edit_device', 'Edit Device') }}{% else %}{{ t('maintenance.register_device', 'Register IoT Device') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.device_code', 'Device Code') }}</label>
                        <input type="text" name="device_code" value="{{ device.device_code if device else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.device_type', 'Type') }}</label>
                        <select name="device_type" class="w-full px-3 py-2 border rounded-lg">
                            <option value="SENSOR" {% if not device or device.device_type == 'SENSOR' %}selected{% endif %}>Sensor</option>
                            <option value="GATEWAY" {% if device and device.device_type == 'GATEWAY' %}selected{% endif %}>Gateway</option>
                            <option value="CAMERA" {% if device and device.device_type == 'CAMERA' %}selected{% endif %}>Camera</option>
                            <option value="CONTROLLER" {% if device and device.device_type == 'CONTROLLER' %}selected{% endif %}>Controller</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.manufacturer', 'Manufacturer') }}</label>
                        <input type="text" name="manufacturer" value="{{ device.manufacturer if device else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.model', 'Model') }}</label>
                        <input type="text" name="model" value="{{ device.model if device else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.serial_number', 'Serial Number') }}</label>
                        <input type="text" name="serial_number" value="{{ device.serial_number if device else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.protocol', 'Protocol') }}</label>
                        <select name="protocol" class="w-full px-3 py-2 border rounded-lg">
                            <option value="MQTT" {% if not device or device.protocol == 'MQTT' %}selected{% endif %}>MQTT</option>
                            <option value="HTTP" {% if device and device.protocol == 'HTTP' %}selected{% endif %}>HTTP</option>
                            <option value="OPC_UA" {% if device and device.protocol == 'OPC_UA' %}selected{% endif %}>OPC UA</option>
                            <option value="MODBUS" {% if device and device.protocol == 'MODBUS' %}selected{% endif %}>Modbus</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.endpoint_url', 'Endpoint URL') }}</label>
                    <input type="text" name="endpoint_url" value="{{ device.endpoint_url if device else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="mqtt://broker.example.com:1883">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.sampling_interval', 'Sampling Interval (sec)') }}</label>
                        <input type="number" name="sampling_interval_seconds" value="{{ device.sampling_interval_seconds if device else 60 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.data_format', 'Data Format') }}</label>
                        <select name="data_format" class="w-full px-3 py-2 border rounded-lg">
                            <option value="JSON" {% if not device or device.data_format == 'JSON' %}selected{% endif %}>JSON</option>
                            <option value="XML" {% if device and device.data_format == 'XML' %}selected{% endif %}>XML</option>
                            <option value="CSV" {% if device and device.data_format == 'CSV' %}selected{% endif %}>CSV</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.equipment', 'Linked Equipment') }}</label>
                        <select name="equipment_id" class="w-full px-3 py-2 border rounded-lg">
                            <option value="">-- None --</option>
                            {% for eq in equipment %}
                            <option value="{{ eq.id }}" {% if device and device.equipment_id == eq.id %}selected{% endif %}>
                                {{ eq.asset_code }} - {{ eq.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.location', 'Location') }}</label>
                        <select name="location_id" class="w-full px-3 py-2 border rounded-lg">
                            <option value="">-- None --</option>
                            {% for loc in locations %}
                            <option value="{{ loc.id }}" {% if device and device.location_id == loc.id %}selected{% endif %}>
                                {{ loc.location_code }} - {{ loc.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.latitude', 'Latitude') }}</label>
                        <input type="text" name="latitude" value="{{ device.latitude if device else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.longitude', 'Longitude') }}</label>
                        <input type="text" name="longitude" value="{{ device.longitude if device else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not device or device.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.iot_devices_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
