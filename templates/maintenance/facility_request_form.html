{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">New Facility Request</h1>
            <a href="{{ url_for('maintenance.facility_requests_list') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Facility *</label>
                        <select name="facility_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Select Facility</option>
                            {% for facility in facilities %}
                            <option value="{{ facility.id }}">{{ facility.facility_code }} - {{ facility.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Request Type</label>
                            <select name="request_type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                {% for type in request_types %}
                                <option value="{{ type }}">{{ type }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Category</label>
                            <input type="text" name="category" placeholder="e.g., Electrical, HVAC" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Priority</label>
                            <select name="priority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                {% for priority in priorities %}
                                <option value="{{ priority }}" {% if priority == 'Medium' %}selected{% endif %}>{{ priority }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Severity</label>
                            <select name="severity" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                {% for severity in severities %}
                                <option value="{{ severity }}">{{ severity }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Reported Date</label>
                            <input type="date" name="reported_date" value="" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Required By</label>
                            <input type="date" name="required_by_date" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Description *</label>
                        <textarea name="description" required rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none" placeholder="Describe the issue..."></textarea>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" name="is_emergency" id="is_emergency" value="1" class="w-4 h-4 rounded bg-slate-800 border-slate-700">
                        <label for="is_emergency" class="text-slate-300 text-sm">This is an emergency request</label>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Estimated Cost</label>
                        <input type="number" step="0.01" name="estimated_cost" value="0" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <a href="{{ url_for('maintenance.facility_requests_list') }}" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>Submit Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
