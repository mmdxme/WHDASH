{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if indicator %}{{ t('maintenance.edit_indicator', 'Edit Indicator') }}{% else %}{{ t('maintenance.new_indicator', 'New Condition Indicator') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.indicator_code', 'Code') }}</label>
                    <input type="text" name="indicator_code" value="{{ indicator.indicator_code if indicator else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated if blank">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.equipment', 'Equipment') }} *</label>
                    <select name="equipment_id" class="w-full px-3 py-2 border rounded-lg" required>
                        <option value="">-- Select --</option>
                        {% for eq in equipment %}
                        <option value="{{ eq.id }}" {% if indicator and indicator.equipment_id == eq.id %}selected{% endif %}>
                            {{ eq.asset_code }} - {{ eq.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.indicator_name', 'Name') }} *</label>
                        <input type="text" name="indicator_name" value="{{ indicator.indicator_name if indicator else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.type', 'Type') }}</label>
                        <select name="indicator_type" class="w-full px-3 py-2 border rounded-lg">
                            <option value="VIBRATION" {% if indicator and indicator.indicator_type == 'VIBRATION' %}selected{% endif %}>Vibration</option>
                            <option value="TEMPERATURE" {% if indicator and indicator.indicator_type == 'TEMPERATURE' %}selected{% endif %}>Temperature</option>
                            <option value="PRESSURE" {% if indicator and indicator.indicator_type == 'PRESSURE' %}selected{% endif %}>Pressure</option>
                            <option value="FLOW" {% if indicator and indicator.indicator_type == 'FLOW' %}selected{% endif %}>Flow</option>
                            <option value="CURRENT" {% if indicator and indicator.indicator_type == 'CURRENT' %}selected{% endif %}>Current</option>
                            <option value="HUMIDITY" {% if indicator and indicator.indicator_type == 'HUMIDITY' %}selected{% endif %}>Humidity</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.unit', 'Unit') }} *</label>
                        <input type="text" name="unit" value="{{ indicator.unit if indicator else 'mm/s' }}"
                               class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.normal_max', 'Normal Max') }}</label>
                        <input type="number" step="any" name="normal_max" value="{{ indicator.normal_max if indicator else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.warning_max', 'Warning Max') }}</label>
                        <input type="number" step="any" name="warning_max" value="{{ indicator.warning_max if indicator else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.critical_max', 'Critical Max') }}</label>
                    <input type="number" step="any" name="critical_max" value="{{ indicator.critical_max if indicator else '' }}"
                           class="w-full px-3 py-2 border rounded-lg">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.interval', 'Reading Interval (min)') }}</label>
                        <input type="number" name="reading_interval_minutes" value="{{ indicator.reading_interval_minutes if indicator else 60 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.retention_days', 'Data Retention (days)') }}</label>
                        <input type="number" name="data_retention_days" value="{{ indicator.data_retention_days if indicator else 365 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not indicator or indicator.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.condition_indicators_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
