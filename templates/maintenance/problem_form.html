{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ t('maintenance.new_problem', 'New Problem Record') }}</h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.problem_number', 'Number') }}</label>
                    <input type="text" name="problem_number" class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.title', 'Title') }} *</label>
                    <input type="text" name="title" class="w-full px-3 py-2 border rounded-lg" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.priority', 'Priority') }}</label>
                        <select name="priority" class="w-full px-3 py-2 border rounded-lg">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                            <option value="CRITICAL">Critical</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.assigned_to', 'Assigned To') }}</label>
                        <select name="assigned_to" class="w-full px-3 py-2 border rounded-lg">
                            <option value="">-- Select --</option>
                            {% for emp in employees %}
                            <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.description', 'Description') }}</label>
                    <textarea name="description" rows="3" class="w-full px-3 py-2 border rounded-lg"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.category', 'Category') }}</label>
                        <input type="text" name="problem_category" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.type', 'Type') }}</label>
                        <input type="text" name="problem_type" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.root_cause', 'Root Cause Analysis') }}</label>
                        <textarea name="root_cause_analysis" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.corrective_action', 'Corrective Action') }}</label>
                        <textarea name="corrective_action" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.preventive_action', 'Preventive Action') }}</label>
                    <textarea name="preventive_action" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.problems_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
