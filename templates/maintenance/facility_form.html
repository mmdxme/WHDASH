{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">{{ 'Edit Facility' if facility else 'New Facility' }}</h1>
            <a href="{{ url_for('maintenance.facilities_list') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form method="POST">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Name *</label>
                            <input type="text" name="name" required value="{{ facility.name if facility else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Type *</label>
                            <select name="facility_type" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                <option value="Building" {% if facility and facility.facility_type == 'Building' %}selected{% endif %}>Building</option>
                                <option value="Warehouse" {% if facility and facility.facility_type == 'Warehouse' %}selected{% endif %}>Warehouse</option>
                                <option value="Office" {% if facility and facility.facility_type == 'Office' %}selected{% endif %}>Office</option>
                                <option value="Factory" {% if facility and facility.facility_type == 'Factory' %}selected{% endif %}>Factory</option>
                                <option value="Data Center" {% if facility and facility.facility_type == 'Data Center' %}selected{% endif %}>Data Center</option>
                                <option value="Site" {% if facility and facility.facility_type == 'Site' %}selected{% endif %}>Site</option>
                                <option value="Area" {% if facility and facility.facility_type == 'Area' %}selected{% endif %}>Area</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Description</label>
                        <textarea name="description" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">{{ facility.description if facility else '' }}</textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Address</label>
                            <input type="text" name="address" value="{{ facility.address if facility else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">City</label>
                            <input type="text" name="city" value="{{ facility.city if facility else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Contact Person</label>
                            <input type="text" name="contact_person" value="{{ facility.contact_person if facility else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Contact Phone</label>
                            <input type="text" name="contact_phone" value="{{ facility.contact_phone if facility else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Contact Email</label>
                        <input type="email" name="contact_email" value="{{ facility.contact_email if facility else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" name="is_critical" id="is_critical" value="1" {% if facility and facility.is_critical %}checked{% endif %} class="w-4 h-4 rounded bg-slate-800 border-slate-700">
                        <label for="is_critical" class="text-slate-300 text-sm">Critical Facility (requires immediate attention)</label>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <a href="{{ url_for('maintenance.facilities_list') }}" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>{{ 'Update' if facility else 'Create' }} Facility
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
