{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">Log Downtime</h1>
            <a href="{{ url_for('maintenance.downtime_list') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Asset *</label>
                        <select name="asset_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">Select Asset</option>
                            {% for asset in assets %}
                            <option value="{{ asset.id }}" {% if log and log.asset_id == asset.id %}selected{% endif %}>{{ asset.asset_code }} - {{ asset.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Work Order (optional)</label>
                        <select name="work_order_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            <option value="">None</option>
                            {% for wo in work_orders %}
                            <option value="{{ wo.id }}" {% if log and log.work_order_id == wo.id %}selected{% endif %}>{{ wo.work_order_number }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Reason</label>
                        <input type="text" name="downtime_reason" value="{{ log.downtime_reason if log else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Start DateTime *</label>
                            <input type="datetime-local" name="downtime_start" required value="{{ log.downtime_start if log else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">End DateTime</label>
                            <input type="datetime-local" name="downtime_end" value="{{ log.downtime_end if log else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" name="planned_downtime" id="planned" value="1" {% if log and log.planned_downtime %}checked{% endif %} class="w-4 h-4 rounded bg-slate-800 border-slate-700">
                        <label for="planned" class="text-slate-300 text-sm">Planned downtime (maintenance window)</label>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Impact Level</label>
                        <select name="impact_level" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            {% for level in impact_levels %}
                            <option value="{{ level }}" {% if log and log.impact_level == level %}selected{% endif %}>{{ level }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Root Cause</label>
                        <textarea name="root_cause" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">{{ log.root_cause if log else '' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Corrective Action</label>
                        <textarea name="corrective_action" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">{{ log.corrective_action if log else '' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-slate-400 text-xs mb-1">Notes</label>
                        <textarea name="notes" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">{{ log.notes if log else '' }}</textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <a href="{{ url_for('maintenance.downtime_list') }}" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>Save Downtime Log
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
