{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if agreement %}{{ t('maintenance.edit_agreement', 'Edit Agreement') }}{% else %}{{ t('maintenance.new_agreement', 'New Service Agreement') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.agreement_number', 'Agreement Number') }}</label>
                        <input type="text" name="agreement_number" value="{{ agreement.agreement_number if agreement else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.customer', 'Customer') }} *</label>
                        <select name="customer_id" class="w-full px-3 py-2 border rounded-lg" required>
                            <option value="">-- Select --</option>
                            {% for c in customers %}
                            <option value="{{ c.id }}" {% if agreement and agreement.customer_id == c.id %}selected{% endif %}>
                                {{ c.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.type', 'Type') }}</label>
                        <select name="agreement_type" class="w-full px-3 py-2 border rounded-lg">
                            <option value="MAINTENANCE" {% if agreement and agreement.agreement_type == 'MAINTENANCE' %}selected{% endif %}>Maintenance</option>
                            <option value="SERVICE" {% if agreement and agreement.agreement_type == 'SERVICE' %}selected{% endif %}>Service</option>
                            <option value="WARRANTY" {% if agreement and agreement.agreement_type == 'WARRANTY' %}selected{% endif %}>Warranty</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.status', 'Status') }}</label>
                        <select name="status" class="w-full px-3 py-2 border rounded-lg">
                            <option value="DRAFT" {% if agreement and agreement.status == 'DRAFT' %}selected{% endif %}>Draft</option>
                            <option value="ACTIVE" {% if not agreement or agreement.status == 'ACTIVE' %}selected{% endif %}>Active</option>
                            <option value="EXPIRED" {% if agreement and agreement.status == 'EXPIRED' %}selected{% endif %}>Expired</option>
                            <option value="TERMINATED" {% if agreement and agreement.status == 'TERMINATED' %}selected{% endif %}>Terminated</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.start_date', 'Start Date') }} *</label>
                        <input type="date" name="start_date" value="{{ agreement.start_date if agreement else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.end_date', 'End Date') }} *</label>
                        <input type="date" name="end_date" value="{{ agreement.end_date if agreement else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.response_time', 'Response Time (hrs)') }}</label>
                        <input type="number" name="response_time_hours" value="{{ agreement.response_time_hours if agreement else 4 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.resolution_time', 'Resolution Time (hrs)') }}</label>
                        <input type="number" name="resolution_time_hours" value="{{ agreement.resolution_time_hours if agreement else 24 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.contract_value', 'Contract Value') }}</label>
                        <input type="number" step="0.01" name="contract_value" value="{{ agreement.contract_value if agreement else 0 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.billing', 'Billing Frequency') }}</label>
                        <select name="billing_frequency" class="w-full px-3 py-2 border rounded-lg">
                            <option value="MONTHLY" {% if not agreement or agreement.billing_frequency == 'MONTHLY' %}selected{% endif %}>Monthly</option>
                            <option value="QUARTERLY" {% if agreement and agreement.billing_frequency == 'QUARTERLY' %}selected{% endif %}>Quarterly</option>
                            <option value="ANNUALLY" {% if agreement and agreement.billing_frequency == 'ANNUALLY' %}selected{% endif %}>Annually</option>
                        </select>
                    </div>
                    <div>
                        <label class="flex items-center mt-6">
                            <input type="checkbox" name="auto_renewal" value="1"
                                   {% if agreement and agreement.auto_renewal %}checked{% endif %}
                                   class="w-4 h-4 text-blue-600 rounded">
                            <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.auto_renewal', 'Auto Renewal') }}</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.service_agreements_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
