{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if skill %}{{ t('maintenance.edit_skill', 'Edit Skill') }}{% else %}{{ t('maintenance.add_skill', 'Add Skill') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.skill_code', 'Code') }}</label>
                    <input type="text" name="skill_code" value="{{ skill.skill_code if skill else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated if blank">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.skill_name', 'Name') }} *</label>
                    <input type="text" name="skill_name" value="{{ skill.skill_name if skill else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.skill_category', 'Category') }}</label>
                    <select name="skill_category" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">-- Select --</option>
                        <option value="MECHANICAL" {% if skill and skill.skill_category == 'MECHANICAL' %}selected{% endif %}>Mechanical</option>
                        <option value="ELECTRICAL" {% if skill and skill.skill_category == 'ELECTRICAL' %}selected{% endif %}>Electrical</option>
                        <option value="INSTRUMENTATION" {% if skill and skill.skill_category == 'INSTRUMENTATION' %}selected{% endif %}>Instrumentation</option>
                        <option value="SAFETY" {% if skill and skill.skill_category == 'SAFETY' %}selected{% endif %}>Safety</option>
                        <option value="QUALITY" {% if skill and skill.skill_category == 'QUALITY' %}selected{% endif %}>Quality</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.description', 'Description') }}</label>
                    <textarea name="description" rows="2" class="w-full px-3 py-2 border rounded-lg">{{ skill.description if skill else '' }}</textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="flex items-center mt-4">
                            <input type="checkbox" name="certification_required" value="1"
                                   {% if skill and skill.certification_required %}checked{% endif %}
                                   class="w-4 h-4 text-blue-600 rounded">
                            <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.certification_required', 'Certification Required') }}</span>
                        </label>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.validity_months', 'Validity (months)') }}</label>
                        <input type="number" name="validity_months" value="{{ skill.validity_months if skill else '' }}"
                               class="w-full px-3 py-2 border rounded-lg" placeholder="0 = no expiry">
                    </div>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not skill or skill.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.skill_catalog_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                    {{ t('common.cancel', 'Cancel') }}
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {{ t('common.save', 'Save') }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
