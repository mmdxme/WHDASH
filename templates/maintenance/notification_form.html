{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ t('maintenance.new_notification', 'New Notification') }}</h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.notification_number', 'Number') }}</label>
                    <input type="text" name="notification_number" class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.notification_type', 'Type') }}</label>
                    <select name="notification_type" class="w-full px-3 py-2 border rounded-lg">
                        <option value="MALFUNCTION">Malfunction</option>
                        <option value="MAINTENANCE_REQUEST">Maintenance Request</option>
                        <option value="DAMAGE">Damage</option>
                        <option value="ACTIVITY">Activity</option>
                        <option value="INFORMATION">Information</option>
                    </select>
                </div>

                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.short_text', 'Short Description') }} *</label>
                    <input type="text" name="short_text" class="w-full px-3 py-2 border rounded-lg" required>
                </div>

                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.long_text', 'Detailed Description') }}</label>
                    <textarea name="long_text" rows="3" class="w-full px-3 py-2 border rounded-lg"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.equipment', 'Equipment') }}</label>
                    <select name="equipment_id" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">-- Select --</option>
                        {% for eq in equipment %}
                        <option value="{{ eq.id }}">{{ eq.asset_code }} - {{ eq.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.functional_location', 'Location') }}</label>
                    <select name="functional_location_id" class="w-full px-3 py-2 border rounded-lg">
                        <option value="">-- Select --</option>
                        {% for loc in locations %}
                        <option value="{{ loc.id }}">{{ loc.location_code }} - {{ loc.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.priority', 'Priority') }}</label>
                    <select name="priority" class="w-full px-3 py-2 border rounded-lg">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="col-span-2 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.required_start', 'Required Start') }}</label>
                        <input type="date" name="required_start_date" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.required_end', 'Required End') }}</label>
                        <input type="date" name="required_end_date" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.notifications_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
