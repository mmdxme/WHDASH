{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if strategy %}{{ t('maintenance.edit_strategy', 'Edit Strategy') }}{% else %}{{ t('maintenance.new_strategy', 'New Strategy') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.strategy_code', 'Code') }}</label>
                    <input type="text" name="strategy_code" value="{{ strategy.strategy_code if strategy else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated if blank">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.strategy_name', 'Name') }} *</label>
                    <input type="text" name="strategy_name" value="{{ strategy.strategy_name if strategy else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.strategy_type', 'Type') }}</label>
                    <select name="strategy_type" class="w-full px-3 py-2 border rounded-lg">
                        <option value="TIME-BASED" {% if strategy and strategy.strategy_type == 'TIME-BASED' %}selected{% endif %}>Time-Based (Calendar)</option>
                        <option value="COUNTER-BASED" {% if strategy and strategy.strategy_type == 'COUNTER-BASED' %}selected{% endif %}>Counter-Based</option>
                        <option value="CONDITION-BASED" {% if strategy and strategy.strategy_type == 'CONDITION-BASED' %}selected{% endif %}>Condition-Based</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.description', 'Description') }}</label>
                    <textarea name="description" rows="3" class="w-full px-3 py-2 border rounded-lg">{{ strategy.description if strategy else '' }}</textarea>
                </div>

                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not strategy or strategy.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.maintenance_strategies_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                    {{ t('common.cancel', 'Cancel') }}
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {{ t('common.save', 'Save') }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
