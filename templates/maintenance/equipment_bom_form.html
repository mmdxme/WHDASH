{% extends "maintenance/base_maintenance.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">
            {% if bom %}{{ t('maintenance.edit_bom', 'Edit Equipment BOM') }}{% else %}{{ t('maintenance.new_bom', 'New Equipment BOM') }}{% endif %}
        </h1>

        <form method="POST" class="bg-white rounded-lg shadow p-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.bom_code', 'BOM Code') }}</label>
                    <input type="text" name="bom_code" value="{{ bom.bom_code if bom else '' }}"
                           class="w-full px-3 py-2 border rounded-lg" placeholder="Auto-generated if blank">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.equipment', 'Equipment') }} *</label>
                    <select name="equipment_id" class="w-full px-3 py-2 border rounded-lg" required>
                        <option value="">-- Select --</option>
                        {% for eq in equipment %}
                        <option value="{{ eq.id }}" {% if bom and bom.equipment_id == eq.id %}selected{% endif %}>
                            {{ eq.asset_code }} - {{ eq.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.bom_type', 'Type') }}</label>
                        <select name="bom_type" class="w-full px-3 py-2 border rounded-lg">
                            <option value="SpareParts" {% if bom and bom.bom_type == 'SpareParts' %}selected{% endif %}>Spare Parts</option>
                            <option value="Maintenance" {% if bom and bom.bom_type == 'Maintenance' %}selected{% endif %}>Maintenance</option>
                            <option value="Tooling" {% if bom and bom.bom_type == 'Tooling' %}selected{% endif %}>Tooling</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.version', 'Version') }}</label>
                        <input type="number" name="version" value="{{ bom.version if bom else 1 }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.valid_from', 'Valid From') }}</label>
                        <input type="date" name="valid_from" value="{{ bom.valid_from if bom else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.valid_to', 'Valid To') }}</label>
                        <input type="date" name="valid_to" value="{{ bom.valid_to if bom else '' }}"
                               class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ t('maintenance.description', 'Description') }}</label>
                    <textarea name="description" rows="2" class="w-full px-3 py-2 border rounded-lg">{{ bom.description if bom else '' }}</textarea>
                </div>

                <div class="flex gap-6">
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" value="1"
                               {% if not bom or bom.is_active %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_active', 'Is Active') }}</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_template" value="1"
                               {% if bom and bom.is_template %}checked{% endif %}
                               class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-sm text-gray-700">{{ t('maintenance.is_template', 'Is Template') }}</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                <a href="{{ url_for('maintenance.equipment_boms_list') }}" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                    {{ t('common.cancel', 'Cancel') }}
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    {{ t('common.save', 'Save') }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
