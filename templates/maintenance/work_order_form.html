{% extends "base.html" %}

{% block content %}
<div class="p-6 fade-in">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-slate-100">{{ 'Edit Work Order' if work_order else 'New Work Order' }}</h1>
            <a href="{{ url_for('maintenance.work_orders') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back
            </a>
        </div>

        <div class="glass-panel rounded-xl p-6">
            <form method="POST">
                <div class="space-y-6">
                    <!-- Basic Info -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4">Basic Information</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Asset *</label>
                                <select name="asset_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    <option value="">Select Asset</option>
                                    {% for asset in assets %}
                                    <option value="{{ asset.id }}" {% if work_order and work_order.asset_id == asset.id %}selected{% endif %}>{{ asset.asset_code }} - {{ asset.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Maintenance Type *</label>
                                <select name="maintenance_type_id" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    <option value="">Select Type</option>
                                    {% for mt in maintenance_types %}
                                    <option value="{{ mt.id }}" {% if work_order and work_order.maintenance_type_id == mt.id %}selected{% endif %}>{{ mt.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Work Order Type</label>
                                <select name="work_order_type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    {% for type in work_order_types %}
                                    <option value="{{ type }}" {% if work_order and work_order.work_order_type == type %}selected{% endif %}>{{ type }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Priority</label>
                                <select name="priority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    {% for priority in priorities %}
                                    <option value="{{ priority }}" {% if (work_order and work_order.priority == priority) or (not work_order and priority == 'Medium') %}selected{% endif %}>{{ priority }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Dates -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4">Schedule</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Issue Date *</label>
                                <input type="date" name="issue_date" required value="{{ work_order.issue_date if work_order else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Status</label>
                                <select name="status" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    {% for status in statuses %}
                                    <option value="{{ status }}" {% if work_order and work_order.status == status %}selected{% endif %}>{{ status }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Scheduled Start</label>
                                <input type="date" name="scheduled_start_date" value="{{ work_order.scheduled_start_date if work_order else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Scheduled End</label>
                                <input type="date" name="scheduled_end_date" value="{{ work_order.scheduled_end_date if work_order else '' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- Assignment -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4">Assignment</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Assigned Technician</label>
                                <select name="assigned_technician_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    <option value="">Unassigned</option>
                                    {% for tech in technicians %}
                                    <option value="{{ tech.id }}" {% if work_order and work_order.assigned_technician_id == tech.id %}selected{% endif %}>{{ tech.first_name }} {{ tech.last_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">External Vendor</label>
                                <select name="assigned_vendor_id" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                                    <option value="">None</option>
                                    {% for vendor in vendors %}
                                    <option value="{{ vendor.id }}" {% if work_order and work_order.assigned_vendor_id == vendor.id %}selected{% endif %}>{{ vendor.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4">Description</h3>
                        <div>
                            <label class="block text-slate-400 text-xs mb-1">Issue Description *</label>
                            <textarea name="issue_description" required rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none" placeholder="Describe the maintenance issue or required work...">{{ work_order.issue_description if work_order else '' }}</textarea>
                        </div>
                    </div>

                    <!-- Cost -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4">Cost Estimation</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-slate-400 text-xs mb-1">Estimated Cost</label>
                                <input type="number" step="0.01" name="estimated_cost" value="{{ work_order.estimated_cost if work_order else '0' }}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-brand-500 focus:outline-none">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6 pt-6 border-t border-slate-700">
                    <a href="{{ url_for('maintenance.work_orders') }}" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>{{ 'Update' if work_order else 'Create' }} Work Order
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
