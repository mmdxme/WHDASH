<!-- Admin Header -->
<header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6">
    <!-- Left: Page Title -->
    <div class="flex items-center gap-4">
        <h2 class="text-lg font-semibold text-slate-800 dark:text-white">{{ page_title }}</h2>
    </div>
    
    <!-- Right: User Menu -->
    <div class="flex items-center gap-4">
        <!-- Notifications -->
        <button class="relative p-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
            <i class="fas fa-bell text-lg"></i>
            {% if notifications|length > 0 %}
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
            {% endif %}
        </button>
        
        <!-- User Dropdown -->
        <div class="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-700">
            <div class="text-right">
                <p class="text-sm font-medium text-slate-800 dark:text-white">{{ username }}</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">Administrator</p>
            </div>
            <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-blue-700 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-white text-sm"></i>
            </div>
        </div>
    </div>
</header>
