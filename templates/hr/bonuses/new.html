{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div><h1 class="text-3xl font-bold text-white">{{ t('add_bonus', 'Add Bonus') }}</h1></div>
        <a href="{{ url_for('hr.bonuses_list') }}" class="px-4 py-2.5 bg-white/5 text-white rounded-xl font-semibold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i>{{ t('back', 'Back') }}</a>
    </div>
    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-xl">
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('employee', 'Employee') }} *</label>
                <select name="employee_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                    <option value="">{{ t('select', 'Select') }}</option>
                    {% for e in employees %}
                    <option value="{{ e.id }}">{{ e.first_name }} {{ e.last_name }} ({{ e.employee_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('type', 'Type') }} *</label>
                <select name="bonus_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                    <option value="Performance Bonus">{{ t('performance_bonus', 'Performance Bonus') }}</option>
                    <option value="Year End Bonus">{{ t('year_end_bonus', 'Year End Bonus') }}</option>
                    <option value="Spot Bonus">{{ t('spot_bonus', 'Spot Bonus') }}</option>
                    <option value="Attendance Bonus">{{ t('attendance_bonus', 'Attendance Bonus') }}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('amount', 'Amount') }} *</label>
                <input type="number" step="0.01" name="amount" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('month', 'Month') }}</label>
                    <input type="number" name="effective_month" min="1" max="12" value="{{ current_month }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('year', 'Year') }}</label>
                    <input type="number" name="effective_year" value="{{ current_year }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                </div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('reason', 'Reason') }}</label>
                <textarea name="reason" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></textarea>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
