{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('new_training_program', 'New Training Program') }}</h1>
            <p class="text-slate-400 mt-1">{{ t('new_program_subtitle', 'Define a new training program') }}</p>
        </div>
        <a href="{{ url_for('hr.training_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="max-w-2xl">
        <div class="glass-panel rounded-2xl p-6 space-y-5">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('title', 'Title') }} *</label>
                <input type="text" name="title" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('title_arabic', 'Title (Arabic)') }}</label>
                    <input type="text" name="title_ar" dir="rtl" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('title_persian', 'Title (Persian)') }}</label>
                    <input type="text" name="title_fa" dir="rtl" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('description', 'Description') }}</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('category', 'Category') }}</label>
                    <select name="category" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select', 'Select') }}</option>
                        <option value="Technical">{{ t('technical', 'Technical') }}</option>
                        <option value="Soft Skills">{{ t('soft_skills', 'Soft Skills') }}</option>
                        <option value="Compliance">{{ t('compliance', 'Compliance') }}</option>
                        <option value="Leadership">{{ t('leadership', 'Leadership') }}</option>
                        <option value="Safety">{{ t('safety', 'Safety') }}</option>
                        <option value="Onboarding">{{ t('onboarding', 'Onboarding') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('type', 'Type') }}</label>
                    <select name="training_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Technical">{{ t('technical', 'Technical') }}</option>
                        <option value="Non-Technical">{{ t('non_technical', 'Non-Technical') }}</option>
                        <option value="Certificated">{{ t('certificated', 'Certificated') }}</option>
                        <option value="Workshop">{{ t('workshop', 'Workshop') }}</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('provider', 'Provider') }}</label>
                    <input type="text" name="provider" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('cost_per_participant', 'Cost / Participant') }}</label>
                    <input type="number" step="0.01" name="cost_per_participant" value="0" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('duration_hours', 'Duration (Hours)') }}</label>
                    <input type="number" name="duration_hours" value="0" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('cert_validity_months', 'Certification Validity (Months)') }}</label>
                    <input type="number" name="certification_validity_months" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div class="flex items-center gap-3">
                <input type="checkbox" name="is_mandatory" id="is_mandatory" class="w-5 h-5 rounded border-white/20 bg-white/5 text-brand-500 focus:ring-brand-500">
                <label for="is_mandatory" class="text-white">{{ t('is_mandatory', 'Mandatory for all employees') }}</label>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-save"></i> {{ t('create_program', 'Create Program') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
