{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('schedule_training_session', 'Schedule Training Session') }}</h1>
            <p class="text-slate-400 mt-1">{{ t('session_subtitle', 'Create a new training session') }}</p>
        </div>
        <a href="{{ url_for('hr.training_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="max-w-2xl">
        <div class="glass-panel rounded-2xl p-6 space-y-5">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('training_program', 'Training Program') }} *</label>
                <select name="program_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                    <option value="">{{ t('select_program', 'Select Program') }}</option>
                    {% for program in programs %}
                    <option value="{{ program.id }}">{{ program.title }} ({{ program.training_type }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('session_title', 'Session Title') }}</label>
                <input type="text" name="session_title" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('trainer_name', 'Trainer Name') }}</label>
                    <input type="text" name="trainer_name" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('trainer_contact', 'Trainer Contact') }}</label>
                    <input type="text" name="trainer_contact" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('location', 'Location') }}</label>
                    <input type="text" name="location" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('online_link', 'Online Link') }}</label>
                    <input type="url" name="online_link" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('start_date', 'Start Date') }} *</label>
                    <input type="date" name="start_date" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('end_date', 'End Date') }} *</label>
                    <input type="date" name="end_date" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('start_time', 'Start Time') }}</label>
                    <input type="time" name="start_time" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('end_time', 'End Time') }}</label>
                    <input type="time" name="end_time" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
                </div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('max_participants', 'Max Participants') }}</label>
                <input type="number" name="max_participants" value="20" min="1" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50">
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-calendar-plus"></i> {{ t('schedule', 'Schedule Session') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
