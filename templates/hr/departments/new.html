{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('new_department', 'New Department') }}</h1>
        </div>
        <a href="{{ url_for('hr.departments_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-xl">
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('name', 'Name') }} *</label>
                <input type="text" name="name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('code', 'Code') }}</label>
                <input type="text" name="code" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('parent_department', 'Parent Department') }}</label>
                <select name="parent_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                    <option value="">{{ t('none', 'None') }}</option>
                    {% for dept in parent_depts %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('description', 'Description') }}</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('budget', 'Budget') }}</label>
                <input type="number" step="0.01" name="budget" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('create', 'Create') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
