{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('new_hr_case', 'New HR Case') }}</h1>
        </div>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('employee', 'Employee') }} *</label>
                <select name="employee_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">{{ t('select_employee', 'Select Employee') }}</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.employee_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('priority', 'Priority') }}</label>
                <select name="priority" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Low">{{ t('low', 'Low') }}</option>
                    <option value="Medium" selected>{{ t('medium', 'Medium') }}</option>
                    <option value="High">{{ t('high', 'High') }}</option>
                    <option value="Urgent">{{ t('urgent', 'Urgent') }}</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm text-slate-400 mb-2">{{ t('case_title', 'Case Title') }} *</label>
                <input type="text" name="task_title" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('case_title_placeholder', 'e.g., Certificate Request, Benefits Question') }}">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm text-slate-400 mb-2">{{ t('description', 'Description') }}</label>
                <textarea name="task_description" rows="4" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('case_description_placeholder', 'Describe the case details...') }}"></textarea>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('due_date', 'Due Date') }}</label>
                <input type="date" name="due_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
        </div>

        <div class="flex items-center gap-4 pt-4">
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-semibold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('create_case', 'Create Case') }}
            </button>
            <a href="{{ url_for('hr.hr_cases_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all">
                {{ t('cancel', 'Cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
