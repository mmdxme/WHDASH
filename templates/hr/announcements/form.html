{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 mt-1">{{ t('announcement_form_subtitle', 'Create or edit an announcement') }}</p>
        </div>
        <a href="{{ url_for('hr.announcements_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="max-w-3xl">
        <div class="glass-panel rounded-2xl p-6 space-y-6">
            <!-- Title -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('title', 'Title') }} *</label>
                <input type="text" name="title" value="{{ ann.title if ann else '' }}" required
                    class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50 transition-all"
                    placeholder="{{ t('announcement_title_placeholder', 'Enter announcement title...') }}">
            </div>

            <!-- Content -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('content', 'Content') }} *</label>
                <textarea name="content" rows="8" required
                    class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-600 focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50 transition-all resize-none"
                    placeholder="{{ t('announcement_content_placeholder', 'Write your announcement content here...') }}">{{ ann.content if ann else '' }}</textarea>
            </div>

            <!-- Type & Priority Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('type', 'Type') }}</label>
                    <select name="announcement_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50 transition-all">
                        <option value="General" {% if ann and ann.announcement_type == 'General' %}selected{% endif %}>{{ t('general', 'General') }}</option>
                        <option value="Policy" {% if ann and ann.announcement_type == 'Policy' %}selected{% endif %}>{{ t('policy', 'Policy') }}</option>
                        <option value="Event" {% if ann and ann.announcement_type == 'Event' %}selected{% endif %}>{{ t('event', 'Event') }}</option>
                        <option value="Urgent" {% if ann and ann.announcement_type == 'Urgent' %}selected{% endif %}>{{ t('urgent', 'Urgent') }}</option>
                        <option value="HR" {% if ann and ann.announcement_type == 'HR' %}selected{% endif %}>{{ t('hr', 'HR') }}</option>
                        <option value="IT" {% if ann and ann.announcement_type == 'IT' %}selected{% endif %}>{{ t('it', 'IT') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('priority', 'Priority') }}</label>
                    <select name="priority" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50 transition-all">
                        <option value="Low" {% if ann and ann.priority == 'Low' %}selected{% endif %}>{{ t('low', 'Low') }}</option>
                        <option value="Normal" {% if (not ann) or (ann and ann.priority == 'Normal') %}selected{% endif %}>{{ t('normal', 'Normal') }}</option>
                        <option value="High" {% if ann and ann.priority == 'High' %}selected{% endif %}>{{ t('high', 'High') }}</option>
                        <option value="Critical" {% if ann and ann.priority == 'Critical' %}selected{% endif %}>{{ t('critical', 'Critical') }}</option>
                    </select>
                </div>
            </div>

            <!-- Validity Period -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('valid_from', 'Valid From') }}</label>
                    <input type="date" name="valid_from" value="{{ ann.valid_from if ann and ann.valid_from else '' }}"
                        class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50 transition-all">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('valid_to', 'Valid To') }}</label>
                    <input type="date" name="valid_to" value="{{ ann.valid_to if ann and ann.valid_to else '' }}"
                        class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500/50 transition-all">
                </div>
            </div>

            <!-- Active Toggle -->
            <div class="flex items-center gap-3">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="is_active" value="1" {% if (not ann) or (ann and ann.is_active) %}checked{% endif %}
                        class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-600 peer-focus:ring-2 peer-focus:ring-brand-500/50 rounded-full peer peer-checked:after:translate-x-4 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>
                </label>
                <span class="text-white font-medium">{{ t('active_status', 'Active Status') }}</span>
            </div>

            <!-- Submit -->
            <div class="flex items-center gap-3 pt-4">
                <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-save"></i>
                    {{ t('save_announcement', 'Save Announcement') }}
                </button>
                <a href="{{ url_for('hr.announcements_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-times"></i>
                    {{ t('cancel', 'Cancel') }}
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
