{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('edit_candidate', 'Edit Candidate') }}</h1>
        </div>
        <a href="{{ url_for('hr.candidates_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-2xl">
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('first_name', 'First Name') }} *</label>
                    <input type="text" name="first_name" value="{{ candidate.first_name }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('last_name', 'Last Name') }} *</label>
                    <input type="text" name="last_name" value="{{ candidate.last_name }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('email', 'Email') }}</label>
                    <input type="email" name="email" value="{{ candidate.email or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('phone', 'Phone') }}</label>
                    <input type="text" name="phone" value="{{ candidate.phone or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('position_applied', 'Position Applied') }}</label>
                    <input type="text" name="position_applied" value="{{ candidate.position_applied or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('requisition', 'Requisition') }}</label>
                    <select name="requisition_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_requisition', 'Select Requisition') }}</option>
                        {% for r in requisitions %}
                        <option value="{{ r.id }}" {% if candidate.requisition_id == r.id %}selected{% endif %}>{{ r.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('source', 'Source') }}</label>
                    <select name="source" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_source', 'Select Source') }}</option>
                        <option value="Website" {% if candidate.source == 'Website' %}selected{% endif %}>{{ t('website', 'Website') }}</option>
                        <option value="LinkedIn" {% if candidate.source == 'LinkedIn' %}selected{% endif %}>{{ t('linkedin', 'LinkedIn') }}</option>
                        <option value="Referral" {% if candidate.source == 'Referral' %}selected{% endif %}>{{ t('referral', 'Referral') }}</option>
                        <option value="Agency" {% if candidate.source == 'Agency' %}selected{% endif %}>{{ t('agency', 'Agency') }}</option>
                        <option value="Job Fair" {% if candidate.source == 'Job Fair' %}selected{% endif %}>{{ t('job_fair', 'Job Fair') }}</option>
                        <option value="Other" {% if candidate.source == 'Other' %}selected{% endif %}>{{ t('other', 'Other') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('stage', 'Stage') }}</label>
                    <select name="current_stage" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Applied" {% if candidate.current_stage == 'Applied' %}selected{% endif %}>{{ t('applied', 'Applied') }}</option>
                        <option value="Screening" {% if candidate.current_stage == 'Screening' %}selected{% endif %}>{{ t('screening', 'Screening') }}</option>
                        <option value="Interview" {% if candidate.current_stage == 'Interview' %}selected{% endif %}>{{ t('interview', 'Interview') }}</option>
                        <option value="Technical" {% if candidate.current_stage == 'Technical' %}selected{% endif %}>{{ t('technical', 'Technical') }}</option>
                        <option value="Offer" {% if candidate.current_stage == 'Offer' %}selected{% endif %}>{{ t('offer', 'Offer') }}</option>
                        <option value="Hired" {% if candidate.current_stage == 'Hired' %}selected{% endif %}>{{ t('hired', 'Hired') }}</option>
                        <option value="Rejected" {% if candidate.current_stage == 'Rejected' %}selected{% endif %}>{{ t('rejected', 'Rejected') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('score', 'Interview Score') }}</label>
                    <input type="number" step="0.01" name="interview_score" value="{{ candidate.interview_score or '' }}" min="0" max="5" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('status', 'Status') }}</label>
                    <select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Active" {% if candidate.status == 'Active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                        <option value="Inactive" {% if candidate.status == 'Inactive' %}selected{% endif %}>{{ t('inactive', 'Inactive') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('assigned_recruiter', 'Assigned Recruiter') }}</label>
                    <select name="assigned_recruiter_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_recruiter', 'Select Recruiter') }}</option>
                        {% for u in users %}
                        <option value="{{ u.id }}" {% if candidate.assigned_recruiter_id == u.id %}selected{% endif %}>{{ u.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('notes', 'Notes') }}</label>
                    <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ candidate.notes or '' }}</textarea>
                </div>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('update', 'Update') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
