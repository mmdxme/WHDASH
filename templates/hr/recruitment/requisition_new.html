{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('new_requisition', 'New Requisition') }}</h1>
        </div>
        <a href="{{ url_for('hr.recruitment_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-2xl">
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('title', 'Title') }} *</label>
                    <input type="text" name="title" required placeholder="{{ t('job_title_placeholder', 'e.g. Senior Software Engineer') }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('department', 'Department') }} *</label>
                    <select name="department_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_department', 'Select Department') }}</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('position', 'Position') }}</label>
                    <select name="position_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_position', 'Select Position') }}</option>
                        {% for pos in positions %}
                        <option value="{{ pos.id }}">{{ pos.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('vacancies', 'Vacancies') }} *</label>
                    <input type="number" name="vacancy_count" value="1" min="1" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('employment_type', 'Employment Type') }}</label>
                    <select name="employment_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Full-time">{{ t('full_time', 'Full-time') }}</option>
                        <option value="Part-time">{{ t('part_time', 'Part-time') }}</option>
                        <option value="Contract">{{ t('contract', 'Contract') }}</option>
                        <option value="Internship">{{ t('internship', 'Internship') }}</option>
                        <option value="Remote">{{ t('remote', 'Remote') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('salary_min', 'Min Salary') }}</label>
                    <input type="number" step="0.01" name="salary_min" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('salary_max', 'Max Salary') }}</label>
                    <input type="number" step="0.01" name="salary_max" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('description', 'Description') }}</label>
                    <textarea name="description" rows="4" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('job_description_placeholder', 'Describe the role responsibilities...') }}"></textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('requirements', 'Requirements') }}</label>
                    <textarea name="requirements" rows="4" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="{{ t('requirements_placeholder', 'List the required qualifications and experience...') }}"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('status', 'Status') }}</label>
                    <select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Draft">{{ t('draft', 'Draft') }}</option>
                        <option value="Open">{{ t('open', 'Open') }}</option>
                        <option value="Pending Approval">{{ t('pending_approval', 'Pending Approval') }}</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('create_requisition', 'Create Requisition') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
