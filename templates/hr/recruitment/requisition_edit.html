{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('edit_requisition', 'Edit Requisition') }}</h1>
        </div>
        <a href="{{ url_for('hr.recruitment_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-2xl">
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('title', 'Title') }} *</label>
                    <input type="text" name="title" value="{{ requisition.title }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('department', 'Department') }} *</label>
                    <select name="department_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_department', 'Select Department') }}</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}" {% if requisition.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('position', 'Position') }}</label>
                    <select name="position_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_position', 'Select Position') }}</option>
                        {% for pos in positions %}
                        <option value="{{ pos.id }}" {% if requisition.position_id == pos.id %}selected{% endif %}>{{ pos.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('vacancies', 'Vacancies') }} *</label>
                    <input type="number" name="vacancy_count" value="{{ requisition.vacancy_count }}" min="1" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('employment_type', 'Employment Type') }}</label>
                    <select name="employment_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Full-time" {% if requisition.employment_type == 'Full-time' %}selected{% endif %}>{{ t('full_time', 'Full-time') }}</option>
                        <option value="Part-time" {% if requisition.employment_type == 'Part-time' %}selected{% endif %}>{{ t('part_time', 'Part-time') }}</option>
                        <option value="Contract" {% if requisition.employment_type == 'Contract' %}selected{% endif %}>{{ t('contract', 'Contract') }}</option>
                        <option value="Internship" {% if requisition.employment_type == 'Internship' %}selected{% endif %}>{{ t('internship', 'Internship') }}</option>
                        <option value="Remote" {% if requisition.employment_type == 'Remote' %}selected{% endif %}>{{ t('remote', 'Remote') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('salary_min', 'Min Salary') }}</label>
                    <input type="number" step="0.01" name="salary_min" value="{{ requisition.salary_min or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('salary_max', 'Max Salary') }}</label>
                    <input type="number" step="0.01" name="salary_max" value="{{ requisition.salary_max or '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('description', 'Description') }}</label>
                    <textarea name="description" rows="4" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ requisition.description or '' }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('requirements', 'Requirements') }}</label>
                    <textarea name="requirements" rows="4" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">{{ requisition.requirements or '' }}</textarea>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('status', 'Status') }}</label>
                    <select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Draft" {% if requisition.status == 'Draft' %}selected{% endif %}>{{ t('draft', 'Draft') }}</option>
                        <option value="Open" {% if requisition.status == 'Open' %}selected{% endif %}>{{ t('open', 'Open') }}</option>
                        <option value="In Review" {% if requisition.status == 'In Review' %}selected{% endif %}>{{ t('in_review', 'In Review') }}</option>
                        <option value="Pending Approval" {% if requisition.status == 'Pending Approval' %}selected{% endif %}>{{ t('pending_approval', 'Pending Approval') }}</option>
                        <option value="Approved" {% if requisition.status == 'Approved' %}selected{% endif %}>{{ t('approved', 'Approved') }}</option>
                        <option value="Closed" {% if requisition.status == 'Closed' %}selected{% endif %}>{{ t('closed', 'Closed') }}</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('update', 'Update') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
