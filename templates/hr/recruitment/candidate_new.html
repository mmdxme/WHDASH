{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('add_candidate', 'Add Candidate') }}</h1>
        </div>
        <a href="{{ url_for('hr.candidates_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-2xl">
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('first_name', 'First Name') }} *</label>
                    <input type="text" name="first_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('last_name', 'Last Name') }} *</label>
                    <input type="text" name="last_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('email', 'Email') }}</label>
                    <input type="email" name="email" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('phone', 'Phone') }}</label>
                    <input type="text" name="phone" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('position_applied', 'Position Applied') }}</label>
                    <input type="text" name="position_applied" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('requisition', 'Requisition') }}</label>
                    <select name="requisition_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_requisition', 'Select Requisition') }}</option>
                        {% for r in requisitions %}
                        <option value="{{ r.id }}">{{ r.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('source', 'Source') }}</label>
                    <select name="source" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_source', 'Select Source') }}</option>
                        <option value="Website">{{ t('website', 'Website') }}</option>
                        <option value="LinkedIn">{{ t('linkedin', 'LinkedIn') }}</option>
                        <option value="Referral">{{ t('referral', 'Referral') }}</option>
                        <option value="Agency">{{ t('agency', 'Agency') }}</option>
                        <option value="Job Fair">{{ t('job_fair', 'Job Fair') }}</option>
                        <option value="Other">{{ t('other', 'Other') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('stage', 'Stage') }}</label>
                    <select name="current_stage" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="Applied">{{ t('applied', 'Applied') }}</option>
                        <option value="Screening">{{ t('screening', 'Screening') }}</option>
                        <option value="Interview">{{ t('interview', 'Interview') }}</option>
                        <option value="Technical">{{ t('technical', 'Technical') }}</option>
                        <option value="Offer">{{ t('offer', 'Offer') }}</option>
                        <option value="Hired">{{ t('hired', 'Hired') }}</option>
                        <option value="Rejected">{{ t('rejected', 'Rejected') }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('assigned_recruiter', 'Assigned Recruiter') }}</label>
                    <select name="assigned_recruiter_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                        <option value="">{{ t('select_recruiter', 'Select Recruiter') }}</option>
                        {% for u in users %}
                        <option value="{{ u.id }}">{{ u.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-2">{{ t('notes', 'Notes') }}</label>
                    <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
                </div>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('add_candidate', 'Add Candidate') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
