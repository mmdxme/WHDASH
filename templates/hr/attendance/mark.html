{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('mark_attendance', 'Mark Attendance') }}</h1>
            <p class="text-slate-400 mt-1">{{ t('mark_attendance_subtitle', 'Record employee attendance manually') }}</p>
        </div>
        <a href="{{ url_for('hr.attendance_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-xl">
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('employee', 'Employee') }} *</label>
                <select name="employee_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">{{ t('select', 'Select') }}</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.employee_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('date', 'Date') }} *</label>
                <input type="date" name="date" value="{{ default_date }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('check_in', 'Check In') }}</label>
                    <input type="time" name="check_in" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">{{ t('check_out', 'Check Out') }}</label>
                    <input type="time" name="check_out" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                </div>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('status', 'Status') }}</label>
                <select name="status" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Present">{{ t('present', 'Present') }}</option>
                    <option value="Absent">{{ t('absent', 'Absent') }}</option>
                    <option value="Late">{{ t('late', 'Late') }}</option>
                    <option value="Half Day">{{ t('half_day', 'Half Day') }}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('remarks', 'Remarks') }}</label>
                <textarea name="remarks" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
