{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div><h1 class="text-3xl font-bold text-white">{{ t('upload_document', 'Upload Document') }}</h1></div>
        <a href="{{ url_for('hr.documents_list') }}" class="px-4 py-2.5 bg-white/5 text-white rounded-xl font-semibold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i>{{ t('back', 'Back') }}</a>
    </div>
    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-xl">
        <div class="space-y-4">
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('employee', 'Employee') }} *</label><select name="employee_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"><option value="">{{ t('select', 'Select') }}</option>{% for e in employees %}<option value="{{ e.id }}">{{ e.first_name }} {{ e.last_name }}</option>{% endfor %}</select></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('type', 'Type') }} *</label><select name="document_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">{% for t, label in doc_types %}<option value="{{ t }}">{{ label }}</option>{% endfor %}</select></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('document_name', 'Document Name') }} *</label><input type="text" name="document_name" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('number', 'Number') }}</label><input type="text" name="document_number" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div>
            <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm text-slate-400 mb-2">{{ t('issue_date', 'Issue Date') }}</label><input type="date" name="issue_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div><div><label class="block text-sm text-slate-400 mb-2">{{ t('expiry_date', 'Expiry Date') }}</label><input type="date" name="expiry_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('notes', 'Notes') }}</label><textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></textarea></div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
