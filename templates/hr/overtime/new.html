{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('request_overtime', 'Request Overtime') }}</h1>
        </div>
        <a href="{{ url_for('hr.overtime_list') }}" class="px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i>
            {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-xl">
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('date', 'Date') }} *</label>
                <input type="date" name="date" value="{{ default_date }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('hours', 'Hours') }} *</label>
                <input type="number" step="0.5" name="hours" min="0.5" max="12" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('type', 'Type') }}</label>
                <select name="overtime_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="Regular">{{ t('regular', 'Regular') }}</option>
                    <option value="Weekend">{{ t('weekend', 'Weekend') }}</option>
                    <option value="Holiday">{{ t('holiday', 'Holiday') }}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('reason', 'Reason') }}</label>
                <textarea name="reason" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all">
                <i class="fa-solid fa-paper-plane mr-2"></i>{{ t('submit', 'Submit') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
