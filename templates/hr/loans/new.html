{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white">{{ t('new_loan', 'New Loan') }}</h1>
        </div>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('employee', 'Employee') }} *</label>
                <select name="employee_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
                    <option value="">{{ t('select_employee', 'Select Employee') }}</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.employee_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('loan_type', 'Loan Type') }}</label>
                <select name="loan_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white">
                    <option value="Personal">{{ t('personal', 'Personal') }}</option>
                    <option value="Education">{{ t('education', 'Education') }}</option>
                    <option value="Home">{{ t('home', 'Home') }}</option>
                    <option value="Car">{{ t('car', 'Car') }}</option>
                    <option value="Emergency">{{ t('emergency', 'Emergency') }}</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('principal_amount', 'Principal Amount') }} *</label>
                <input type="number" name="principal_amount" step="0.01" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="50000">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('interest_rate', 'Interest Rate') }} %</label>
                <input type="number" name="interest_rate" step="0.01" value="0" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50" placeholder="0">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('tenure_months', 'Tenure (Months)') }} *</label>
                <input type="number" name="tenure_months" value="12" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">{{ t('start_date', 'Start Date') }}</label>
                <input type="date" name="start_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50">
            </div>
        </div>

        <div>
            <label class="block text-sm text-slate-400 mb-2">{{ t('remarks', 'Remarks') }}</label>
            <textarea name="remarks" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-brand-500/50"></textarea>
        </div>

        <div class="flex items-center gap-4 pt-4">
            <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-semibold transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('create_loan', 'Create Loan') }}
            </button>
            <a href="{{ url_for('hr.loans_list') }}" class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all">
                {{ t('cancel', 'Cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
