{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div><h1 class="text-3xl font-bold text-white">{{ t('new_loan', 'New Loan') }}</h1></div>
        <a href="{{ url_for('hr.loans_list') }}" class="px-4 py-2.5 bg-white/5 text-white rounded-xl font-semibold flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i>{{ t('back', 'Back') }}</a>
    </div>
    <form method="POST" class="glass-panel rounded-2xl p-6 max-w-xl">
        <div class="space-y-4">
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('employee', 'Employee') }} *</label><select name="employee_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"><option value="">{{ t('select', 'Select') }}</option>{% for e in employees %}<option value="{{ e.id }}">{{ e.first_name }} {{ e.last_name }}</option>{% endfor %}</select></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('type', 'Type') }}</label><select name="loan_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"><option value="Personal">{{ t('personal', 'Personal') }}</option><option value="Salary Advance">{{ t('salary_advance', 'Salary Advance') }}</option><option value="Education">{{ t('education', 'Education') }}</option></select></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('principal_amount', 'Principal Amount') }} *</label><input type="number" step="0.01" name="principal_amount" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('interest_rate', 'Interest Rate') }} %</label><input type="number" step="0.01" name="interest_rate" value="0" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('tenure_months', 'Tenure (Months)') }} *</label><input type="number" name="tenure_months" min="1" max="60" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div>
            <div><label class="block text-sm text-slate-400 mb-2">{{ t('start_date', 'Start Date') }} *</label><input type="date" name="start_date" value="{{ default_date }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white"></div>
            <button type="submit" class="w-full px-4 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold">{{ t('create', 'Create') }}</button>
        </div>
    </form>
</div>
{% endblock %}
