{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-edit mr-2 text-warning"></i>
                Edit Group
            </h1>
            <p class="text-muted mb-0">{{ group.legal_name }}</p>
        </div>
        <a href="{{ url_for('multi_entity.group_detail', group_id=group.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <!-- Form -->
    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-building mr-2"></i>Group Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="group_code">Group Code</label>
                            <input type="text" class="form-control" id="group_code" name="group_code" 
                                   value="{{ group.group_code }}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="group_type">Group Type</label>
                            <select class="form-control" id="group_type" name="group_type">
                                <option value="holding" {{ 'selected' if group.group_type == 'holding' else '' }}>Holding Company</option>
                                <option value="parent" {{ 'selected' if group.group_type == 'parent' else '' }}>Parent Company</option>
                                <option value="subsidiary" {{ 'selected' if group.group_type == 'subsidiary' else '' }}>Subsidiary Group</option>
                                <option value="division" {{ 'selected' if group.group_type == 'division' else '' }}>Division</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="legal_name">Legal Name</label>
                        <input type="text" class="form-control" id="legal_name" name="legal_name" 
                               value="{{ group.legal_name }}">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="trade_name">Trade Name</label>
                            <input type="text" class="form-control" id="trade_name" name="trade_name" 
                                   value="{{ group.trade_name or '' }}">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name" 
                                   value="{{ group.short_name or '' }}">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="registration_number">Registration Number</label>
                            <input type="text" class="form-control" id="registration_number" 
                                   name="registration_number" value="{{ group.registration_number or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="tax_identification">Tax Identification</label>
                            <input type="text" class="form-control" id="tax_identification" 
                                   name="tax_identification" value="{{ group.tax_identification or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="vat_number">VAT Number</label>
                            <input type="text" class="form-control" id="vat_number" name="vat_number" 
                                   value="{{ group.vat_number or '' }}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="parent_group_id">Parent Group</label>
                        <select class="form-control" id="parent_group_id" name="parent_group_id">
                            <option value="">-- None --</option>
                            {% for pg in parent_groups %}
                            <option value="{{ pg.id }}" {{ 'selected' if group.parent_group_id == pg.id else '' }}>
                                {{ pg.legal_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address & Contact
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address Line 1</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1" 
                               value="{{ group.address_line1 or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="address_line2">Address Line 2</label>
                        <input type="text" class="form-control" id="address_line2" name="address_line2" 
                               value="{{ group.address_line2 or '' }}">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city" 
                                   value="{{ group.city or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="state_region">State/Region</label>
                            <input type="text" class="form-control" id="state_region" name="state_region" 
                                   value="{{ group.state_region or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" 
                                   value="{{ group.country or 'UAE' }}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" 
                                   value="{{ group.phone or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="mobile">Mobile</label>
                            <input type="text" class="form-control" id="mobile" name="mobile" 
                                   value="{{ group.mobile or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ group.email or '' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="default_currency">Default Currency</label>
                        <select class="form-control" id="default_currency" name="default_currency">
                            <option value="AED" {{ 'selected' if group.default_currency == 'AED' else '' }}>AED - UAE Dirham</option>
                            <option value="SAR" {{ 'selected' if group.default_currency == 'SAR' else '' }}>SAR - Saudi Riyal</option>
                            <option value="USD" {{ 'selected' if group.default_currency == 'USD' else '' }}>USD - US Dollar</option>
                            <option value="EUR" {{ 'selected' if group.default_currency == 'EUR' else '' }}>EUR - Euro</option>
                            <option value="GBP" {{ 'selected' if group.default_currency == 'GBP' else '' }}>GBP - British Pound</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="base_language">Base Language</label>
                        <select class="form-control" id="base_language" name="base_language">
                            <option value="en" {{ 'selected' if group.base_language == 'en' else '' }}>English</option>
                            <option value="ar" {{ 'selected' if group.base_language == 'ar' else '' }}>Arabic</option>
                            <option value="fa" {{ 'selected' if group.base_language == 'fa' else '' }}>Persian/Farsi</option>
                            <option value="ru" {{ 'selected' if group.base_language == 'ru' else '' }}>Russian</option>
                            <option value="zh" {{ 'selected' if group.base_language == 'zh' else '' }}>Chinese</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-sticky-note mr-2"></i>Notes
                    </h6>
                </div>
                <div class="card-body">
                    <textarea class="form-control" id="notes" name="notes" rows="4">{{ group.notes or '' }}</textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-warning btn-block">
                <i class="fas fa-save mr-1"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
