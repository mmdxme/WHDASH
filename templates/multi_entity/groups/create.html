<!-- Create Entity Group -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-sitemap mr-2 text-primary"></i>
                Create Entity Group
            </h1>
            <p class="text-muted mb-0">Create a new holding company or group structure</p>
        </div>
        <a href="{{ url_for('multi_entity.group_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back to Groups
        </a>
    </div>

    <!-- Form Card -->
    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-building mr-2"></i>Group Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="group_code">Group Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="group_code" name="group_code" 
                                   required placeholder="e.g., MMD-GROUP">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="group_type">Group Type</label>
                            <select class="form-control" id="group_type" name="group_type">
                                <option value="holding">Holding Company</option>
                                <option value="parent">Parent Company</option>
                                <option value="subsidiary">Subsidiary Group</option>
                                <option value="division">Division</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="legal_name">Legal Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="legal_name" name="legal_name" 
                               required placeholder="Full legal entity name">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="trade_name">Trade Name</label>
                            <input type="text" class="form-control" id="trade_name" name="trade_name" 
                                   placeholder="Operating name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name" 
                                   placeholder="Abbreviated name">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="registration_number">Registration Number</label>
                            <input type="text" class="form-control" id="registration_number" 
                                   name="registration_number" placeholder="Commercial registration">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="tax_identification">Tax Identification</label>
                            <input type="text" class="form-control" id="tax_identification" 
                                   name="tax_identification" placeholder="Tax ID">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="vat_number">VAT Number</label>
                            <input type="text" class="form-control" id="vat_number" name="vat_number">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="parent_group_id">Parent Group</label>
                            <select class="form-control" id="parent_group_id" name="parent_group_id">
                                <option value="">-- None --</option>
                                {% for pg in parent_groups %}
                                <option value="{{ pg.id }}">{{ pg.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address & Contact
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address Line 1</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1">
                    </div>
                    <div class="form-group">
                        <label for="address_line2">Address Line 2</label>
                        <input type="text" class="form-control" id="address_line2" name="address_line2">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="state_region">State/Region</label>
                            <input type="text" class="form-control" id="state_region" name="state_region">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" value="UAE">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="postal_code">Postal Code</label>
                            <input type="text" class="form-control" id="postal_code" name="postal_code">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="mobile">Mobile</label>
                            <input type="text" class="form-control" id="mobile" name="mobile">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="website">Website</label>
                            <input type="text" class="form-control" id="website" name="website">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="default_currency">Default Currency</label>
                        <select class="form-control" id="default_currency" name="default_currency">
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="SAR">SAR - Saudi Riyal</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="INR">INR - Indian Rupee</option>
                            <option value="CNY">CNY - Chinese Yuan</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="fiscal_year_start">Fiscal Year Start</label>
                            <select class="form-control" id="fiscal_year_start" name="fiscal_year_start">
                                {% for m in range(1, 13) %}
                                <option value="{{ m }}" {{ 'selected' if m == 1 else '' }}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="fiscal_year_end">Fiscal Year End</label>
                            <select class="form-control" id="fiscal_year_end" name="fiscal_year_end">
                                {% for m in range(1, 13) %}
                                <option value="{{ m }}" {{ 'selected' if m == 12 else '' }}>{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="base_language">Base Language</label>
                        <select class="form-control" id="base_language" name="base_language">
                            <option value="en">English</option>
                            <option value="ar">Arabic</option>
                            <option value="fa">Persian/Farsi</option>
                            <option value="ru">Russian</option>
                            <option value="zh">Chinese</option>
                            <option value="es">Spanish</option>
                            <option value="hi">Hindi</option>
                            <option value="de">German</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-sticky-note mr-2"></i>Notes
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group mb-0">
                        <textarea class="form-control" id="notes" name="notes" rows="4" 
                                  placeholder="Additional notes..."></textarea>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-save mr-1"></i> Create Group
                    </button>
                    <a href="{{ url_for('multi_entity.group_list') }}" class="btn btn-outline-secondary btn-block mt-2">
                        Cancel
                    </a>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
