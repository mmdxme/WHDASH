<!-- Create Legal Entity -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-building mr-2 text-success"></i>
                Create Legal Entity
            </h1>
            <p class="text-muted mb-0">Register a new legal entity under your organization</p>
        </div>
        <a href="{{ url_for('multi_entity.entity_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back to Entities
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <!-- Basic Info -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Entity Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="entity_code">Entity Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="entity_code" name="entity_code" 
                                   required placeholder="e.g., SDAD, AFRA">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="entity_type">Entity Type</label>
                            <select class="form-control" id="entity_type" name="entity_type">
                                <option value="subsidiary">Subsidiary</option>
                                <option value="branch">Branch Office</option>
                                <option value="representative">Representative Office</option>
                                <option value="joint_venture">Joint Venture</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="legal_name">Legal Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="legal_name" name="legal_name" 
                               required placeholder="Full legal entity name">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="trade_name">Trade Name</label>
                            <input type="text" class="form-control" id="trade_name" name="trade_name" 
                                   placeholder="Operating name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name" 
                                   placeholder="Abbreviated name">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="parent_group_id">Group</label>
                            <select class="form-control" id="parent_group_id" name="parent_group_id">
                                <option value="">-- None --</option>
                                {% for g in groups %}
                                <option value="{{ g.id }}">{{ g.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="parent_entity_id">Parent Entity</label>
                            <select class="form-control" id="parent_entity_id" name="parent_entity_id">
                                <option value="">-- None --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}">{{ e.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Registration -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-file-alt mr-2"></i>Registration Details
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="registration_number">Registration Number</label>
                            <input type="text" class="form-control" id="registration_number" 
                                   name="registration_number">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="license_number">License Number</label>
                            <input type="text" class="form-control" id="license_number" name="license_number">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="tax_identification">Tax ID</label>
                            <input type="text" class="form-control" id="tax_identification" name="tax_identification">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="vat_number">VAT Number</label>
                            <input type="text" class="form-control" id="vat_number" name="vat_number">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="excise_tax_number">Excise Tax #</label>
                            <input type="text" class="form-control" id="excise_tax_number" name="excise_tax_number">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Address -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address Line 1</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1">
                    </div>
                    <div class="form-group">
                        <label for="address_line2">Address Line 2</label>
                        <input type="text" class="form-control" id="address_line2" name="address_line2">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="state_region">State/Region</label>
                            <input type="text" class="form-control" id="state_region" name="state_region">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" value="UAE">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <!-- Settings -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="default_currency">Default Currency</label>
                        <select class="form-control" id="default_currency" name="default_currency">
                            <option value="AED">AED - UAE Dirham</option>
                            <option value="SAR">SAR - Saudi Riyal</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timezone">Timezone</label>
                        <select class="form-control" id="timezone" name="timezone">
                            <option value="Asia/Dubai">Asia/Dubai (GMT+4)</option>
                            <option value="Asia/Riyadh">Asia/Riyadh (GMT+3)</option>
                            <option value="Asia/Kolkata">Asia/Kolkata (GMT+5:30)</option>
                            <option value="Europe/London">Europe/London (GMT+0)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="base_language">Base Language</label>
                        <select class="form-control" id="base_language" name="base_language">
                            <option value="en">English</option>
                            <option value="ar">Arabic</option>
                            <option value="fa">Persian/Farsi</option>
                            <option value="ru">Russian</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ownership_percentage">Ownership %</label>
                        <input type="number" class="form-control" id="ownership_percentage" 
                               name="ownership_percentage" value="100" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label for="intercompany_partner_code">Intercompany Partner Code</label>
                        <input type="text" class="form-control" id="intercompany_partner_code" 
                               name="intercompany_partner_code">
                    </div>
                </div>
            </div>

            <!-- Contact -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-address-card mr-2"></i>Primary Contact
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="primary_contact_name">Contact Name</label>
                        <input type="text" class="form-control" id="primary_contact_name" name="primary_contact_name">
                    </div>
                    <div class="form-group">
                        <label for="primary_contact_email">Email</label>
                        <input type="email" class="form-control" id="primary_contact_email" name="primary_contact_email">
                    </div>
                    <div class="form-group">
                        <label for="primary_contact_phone">Phone</label>
                        <input type="text" class="form-control" id="primary_contact_phone" name="primary_contact_phone">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-block">
                <i class="fas fa-save mr-1"></i> Create Entity
            </button>
            <a href="{{ url_for('multi_entity.entity_list') }}" class="btn btn-outline-secondary btn-block mt-2">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
