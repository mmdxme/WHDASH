{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-edit mr-2 text-warning"></i>
                Edit Entity
            </h1>
            <p class="text-muted mb-0">{{ entity.legal_name }}</p>
        </div>
        <a href="{{ url_for('multi_entity.entity_detail', entity_id=entity.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Entity Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="entity_code">Entity Code</label>
                            <input type="text" class="form-control" id="entity_code" name="entity_code" 
                                   value="{{ entity.entity_code }}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="active" {{ 'selected' if entity.status == 'active' else '' }}>Active</option>
                                <option value="suspended" {{ 'selected' if entity.status == 'suspended' else '' }}>Suspended</option>
                                <option value="inactive" {{ 'selected' if entity.status == 'inactive' else '' }}>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="legal_name">Legal Name</label>
                        <input type="text" class="form-control" id="legal_name" name="legal_name" 
                               value="{{ entity.legal_name }}">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="trade_name">Trade Name</label>
                            <input type="text" class="form-control" id="trade_name" name="trade_name" 
                                   value="{{ entity.trade_name or '' }}">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name" 
                                   value="{{ entity.short_name or '' }}">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="parent_group_id">Group</label>
                            <select class="form-control" id="parent_group_id" name="parent_group_id">
                                <option value="">-- None --</option>
                                {% for g in groups %}
                                <option value="{{ g.id }}" {{ 'selected' if entity.parent_group_id == g.id else '' }}>
                                    {{ g.legal_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="parent_entity_id">Parent Entity</label>
                            <select class="form-control" id="parent_entity_id" name="parent_entity_id">
                                <option value="">-- None --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}" {{ 'selected' if entity.parent_entity_id == e.id else '' }}>
                                    {{ e.legal_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-file-alt mr-2"></i>Registration Details
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="registration_number">Registration Number</label>
                            <input type="text" class="form-control" id="registration_number" 
                                   name="registration_number" value="{{ entity.registration_number or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="tax_identification">Tax ID</label>
                            <input type="text" class="form-control" id="tax_identification" 
                                   name="tax_identification" value="{{ entity.tax_identification or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="vat_number">VAT Number</label>
                            <input type="text" class="form-control" id="vat_number" name="vat_number" 
                                   value="{{ entity.vat_number or '' }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address Line 1</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1" 
                               value="{{ entity.address_line1 or '' }}">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city" 
                                   value="{{ entity.city or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="state_region">State/Region</label>
                            <input type="text" class="form-control" id="state_region" name="state_region" 
                                   value="{{ entity.state_region or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" 
                                   value="{{ entity.country or 'UAE' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="default_currency">Currency</label>
                        <select class="form-control" id="default_currency" name="default_currency">
                            <option value="AED" {{ 'selected' if entity.default_currency == 'AED' else '' }}>AED</option>
                            <option value="SAR" {{ 'selected' if entity.default_currency == 'SAR' else '' }}>SAR</option>
                            <option value="USD" {{ 'selected' if entity.default_currency == 'USD' else '' }}>USD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timezone">Timezone</label>
                        <select class="form-control" id="timezone" name="timezone">
                            <option value="Asia/Dubai" {{ 'selected' if entity.timezone == 'Asia/Dubai' else '' }}>Asia/Dubai</option>
                            <option value="Asia/Riyadh" {{ 'selected' if entity.timezone == 'Asia/Riyadh' else '' }}>Asia/Riyadh</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-warning btn-block">
                <i class="fas fa-save mr-1"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
