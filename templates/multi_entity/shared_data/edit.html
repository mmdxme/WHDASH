<!-- Edit Shared Data Rule -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-database mr-2 text-info"></i>
                Edit Shared Data Rule
            </h1>
            <p class="text-muted mb-0">{{ rule.data_type|title }} - {{ rule.scope|title }}</p>
        </div>
        <a href="{{ url_for('multi_entity.shared_data_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Rule Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="visibility">Visibility</label>
                        <select class="form-control" id="visibility" name="visibility">
                            <option value="public" {{ 'selected' if rule.visibility == 'public' else '' }}>Public</option>
                            <option value="private" {{ 'selected' if rule.visibility == 'private' else '' }}>Private</option>
                            <option value="controlled" {{ 'selected' if rule.visibility == 'controlled' else '' }}>Controlled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sharing_policy">Sharing Policy</label>
                        <select class="form-control" id="sharing_policy" name="sharing_policy">
                            <option value="all" {{ 'selected' if rule.sharing_policy == 'all' else '' }}>All Entities</option>
                            <option value="self" {{ 'selected' if rule.sharing_policy == 'self' else '' }}>Self Only</option>
                            <option value="allowed" {{ 'selected' if rule.sharing_policy == 'allowed' else '' }}>Allowed Entities</option>
                            <option value="none" {{ 'selected' if rule.sharing_policy == 'none' else '' }}>None</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inheritance_mode">Inheritance Mode</label>
                        <select class="form-control" id="inheritance_mode" name="inheritance_mode">
                            <option value="inherit" {{ 'selected' if rule.inheritance_mode == 'inherit' else '' }}>Inherit</option>
                            <option value="override" {{ 'selected' if rule.inheritance_mode == 'override' else '' }}>Override</option>
                            <option value="none" {{ 'selected' if rule.inheritance_mode == 'none' else '' }}>None</option>
                        </select>
                    </div>

                    <div class="custom-controls-inline">
                        <div class="custom-control custom-checkbox mr-3">
                            <input type="checkbox" class="custom-control-input" id="override_allowed" name="override_allowed" value="1"
                                   {{ 'checked' if rule.override_allowed else '' }}>
                            <label class="custom-control-label" for="override_allowed">Override Allowed</label>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="override_requires_approval" name="override_requires_approval" value="1"
                                   {{ 'checked' if rule.override_requires_approval else '' }}>
                            <label class="custom-control-label" for="override_requires_approval">Override Requires Approval</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <button type="submit" class="btn btn-warning btn-block">
                <i class="fas fa-save mr-1"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
