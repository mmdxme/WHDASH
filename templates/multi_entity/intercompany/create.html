{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-exchange-alt mr-2 text-purple"></i>
                Create Intercompany Rule
            </h1>
            <p class="text-muted mb-0">Configure inter-company transaction rules</p>
        </div>
        <a href="{{ url_for('multi_entity.intercompany_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Rule Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="rule_code">Rule Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="rule_code" name="rule_code" required
                                   placeholder="e.g., IC-SALES-001">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="rule_type">Rule Type</label>
                            <select class="form-control" id="rule_type" name="rule_type">
                                <option value="transaction">Transaction</option>
                                <option value="workflow">Workflow</option>
                                <option value="document">Document</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rule_name">Rule Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="rule_name" name="rule_name" required
                               placeholder="e.g., Internal Sales Pricing">
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-building mr-2"></i>Entities
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="source_entity_id">Source Entity</label>
                            <select class="form-control" id="source_entity_id" name="source_entity_id">
                                <option value="">-- All --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}">{{ e.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="target_entity_id">Target Entity</label>
                            <select class="form-control" id="target_entity_id" name="target_entity_id">
                                <option value="">-- All --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}">{{ e.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="pricing_policy">Pricing Policy</label>
                        <input type="text" class="form-control" id="pricing_policy" name="pricing_policy"
                               placeholder="e.g., Cost Plus">
                    </div>
                    <div class="form-group">
                        <label for="markup_percentage">Markup %</label>
                        <input type="number" class="form-control" id="markup_percentage" name="markup_percentage" value="0">
                    </div>
                    <div class="form-group">
                        <label for="credit_limit">Credit Limit</label>
                        <input type="number" class="form-control" id="credit_limit" name="credit_limit" value="0">
                    </div>
                    <div class="form-group mb-0">
                        <label for="payment_terms">Payment Terms</label>
                        <input type="text" class="form-control" id="payment_terms" name="payment_terms"
                               placeholder="e.g., Net 30">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save mr-1"></i> Create Rule
            </button>
        </div>
    </form>
</div>
{% endblock %}
