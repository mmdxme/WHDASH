{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-user-plus mr-2 text-success"></i>
                Assign Entity Access
            </h1>
            <p class="text-muted mb-0">Grant user access to entities</p>
        </div>
        <a href="{{ url_for('multi_entity.access_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-user mr-2"></i>User Selection
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="user_id">Select User <span class="text-danger">*</span></label>
                        <select class="form-control" id="user_id" name="user_id" required>
                            <option value="">-- Select User --</option>
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.username }} ({{ u.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-building mr-2"></i>Entity Scope
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="entity_id">Entity</label>
                        <select class="form-control" id="entity_id" name="entity_id">
                            <option value="">-- All Entities --</option>
                            {% for e in entities %}
                            <option value="{{ e.id }}">{{ e.legal_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="branch_id">Branch</label>
                        <select class="form-control" id="branch_id" name="branch_id">
                            <option value="">-- All Branches --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="group_id">Group</label>
                        <select class="form-control" id="group_id" name="group_id">
                            <option value="">-- All Groups --</option>
                            {% for g in groups %}
                            <option value="{{ g.id }}">{{ g.legal_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-key mr-2"></i>Access Level
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="access_level">Access Level</label>
                        <select class="form-control" id="access_level" name="access_level">
                            <option value="read">Read Only</option>
                            <option value="write">Read / Write</option>
                            <option value="admin">Full Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="role_in_entity">Role</label>
                        <input type="text" class="form-control" id="role_in_entity" name="role_in_entity" 
                               placeholder="e.g., Finance Manager">
                    </div>

                    <div class="custom-controls-inline">
                        <div class="custom-control custom-checkbox mr-3">
                            <input type="checkbox" class="custom-control-input" id="can_view_financials" name="can_view_financials" value="1">
                            <label class="custom-control-label" for="can_view_financials">Can View Financials</label>
                        </div>
                        <div class="custom-control custom-checkbox mr-3">
                            <input type="checkbox" class="custom-control-input" id="can_approve_intercompany" name="can_approve_intercompany" value="1">
                            <label class="custom-control-label" for="can_approve_intercompany">Can Approve Intercompany</label>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="cross_entity_reporting" name="cross_entity_reporting" value="1">
                            <label class="custom-control-label" for="cross_entity_reporting">Cross-Entity Reporting</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-star mr-2"></i>Options
                    </h6>
                </div>
                <div class="card-body">
                    <div class="custom-control custom-checkbox mb-3">
                        <input type="checkbox" class="custom-control-input" id="is_default" name="is_default" value="1">
                        <label class="custom-control-label" for="is_default">Set as Default Entity</label>
                    </div>
                    <div class="form-group">
                        <label for="effective_from">Effective From</label>
                        <input type="date" class="form-control" id="effective_from" name="effective_from">
                    </div>
                    <div class="form-group mb-0">
                        <label for="effective_to">Effective To</label>
                        <input type="date" class="form-control" id="effective_to" name="effective_to">
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-block">
                <i class="fas fa-save mr-1"></i> Assign Access
            </button>
        </div>
    </form>
</div>
{% endblock %}
