{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-hashtag mr-2 text-info"></i>
                Create Numbering Scheme
            </h1>
            <p class="text-muted mb-0">Configure document numbering rules</p>
        </div>
        <a href="{{ url_for('multi_entity.numbering_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Scheme Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="scheme_code">Scheme Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="scheme_code" name="scheme_code" required
                                   placeholder="e.g., INV-SDAD">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="document_type">Document Type <span class="text-danger">*</span></label>
                            <select class="form-control" id="document_type" name="document_type" required>
                                <option value="">-- Select --</option>
                                <option value="invoice">Invoice</option>
                                <option value="quotation">Quotation</option>
                                <option value="purchase_order">Purchase Order</option>
                                <option value="sales_order">Sales Order</option>
                                <option value="delivery">Delivery</option>
                                <option value="receipt">Receipt</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="scheme_name">Scheme Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="scheme_name" name="scheme_name" required
                               placeholder="e.g., SDAD Invoice Numbering">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="entity_id">Entity</label>
                            <select class="form-control" id="entity_id" name="entity_id">
                                <option value="">-- All Entities --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}">{{ e.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="prefix">Prefix</label>
                            <input type="text" class="form-control" id="prefix" name="prefix" placeholder="e.g., INV">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Format Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="custom-control custom-checkbox mb-2">
                                <input type="checkbox" class="custom-control-input" id="include_year" name="include_year" value="1" checked>
                                <label class="custom-control-label" for="include_year">Include Year</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="custom-control custom-checkbox mb-2">
                                <input type="checkbox" class="custom-control-input" id="include_entity_code" name="include_entity_code" value="1">
                                <label class="custom-control-label" for="include_entity_code">Include Entity Code</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="custom-control custom-checkbox mb-2">
                                <input type="checkbox" class="custom-control-input" id="include_branch_code" name="include_branch_code" value="1">
                                <label class="custom-control-label" for="include_branch_code">Include Branch Code</label>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="custom-control custom-checkbox mb-2">
                                <input type="checkbox" class="custom-control-input" id="include_month" name="include_month" value="1">
                                <label class="custom-control-label" for="include_month">Include Month</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-row mt-3">
                        <div class="form-group col-md-4">
                            <label for="year_format">Year Format</label>
                            <select class="form-control" id="year_format" name="year_format">
                                <option value="YYYY">YYYY (2026)</option>
                                <option value="YY">YY (26)</option>
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="sequence_length">Sequence Length</label>
                            <input type="number" class="form-control" id="sequence_length" name="sequence_length" value="5" min="3" max="10">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="separator">Separator</label>
                            <input type="text" class="form-control" id="separator" name="separator" value="-" maxlength="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reset_frequency">Reset Frequency</label>
                        <select class="form-control" id="reset_frequency" name="reset_frequency">
                            <option value="yearly">Yearly</option>
                            <option value="monthly">Monthly</option>
                            <option value="never">Never</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-eye mr-2"></i>Preview
                    </h6>
                </div>
                <div class="card-body text-center">
                    <code class="lead">INV-2026-00001</code>
                    <p class="text-muted small mt-2 mb-0">Example format</p>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save mr-1"></i> Create Scheme
            </button>
        </div>
    </form>
</div>
{% endblock %}
