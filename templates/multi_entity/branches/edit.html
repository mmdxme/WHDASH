{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-edit mr-2 text-warning"></i>
                Edit Branch
            </h1>
            <p class="text-muted mb-0">{{ branch.branch_name }}</p>
        </div>
        <a href="{{ url_for('multi_entity.branch_detail', branch_id=branch.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Branch Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="branch_code">Branch Code</label>
                            <input type="text" class="form-control" id="branch_code" name="branch_code" 
                                   value="{{ branch.branch_code }}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="branch_type">Branch Type</label>
                            <select class="form-control" id="branch_type" name="branch_type">
                                <option value="branch_office" {{ 'selected' if branch.branch_type == 'branch_office' else '' }}>Branch Office</option>
                                <option value="head_office" {{ 'selected' if branch.branch_type == 'head_office' else '' }}>Head Office</option>
                                <option value="warehouse_branch" {{ 'selected' if branch.branch_type == 'warehouse_branch' else '' }}>Warehouse Branch</option>
                                <option value="retail_branch" {{ 'selected' if branch.branch_type == 'retail_branch' else '' }}>Retail Branch</option>
                                <option value="service_branch" {{ 'selected' if branch.branch_type == 'service_branch' else '' }}>Service Branch</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="branch_name">Branch Name</label>
                        <input type="text" class="form-control" id="branch_name" name="branch_name" 
                               value="{{ branch.branch_name }}">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name" 
                                   value="{{ branch.short_name or '' }}">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="active" {{ 'selected' if branch.status == 'active' else '' }}>Active</option>
                                <option value="inactive" {{ 'selected' if branch.status == 'inactive' else '' }}>Inactive</option>
                                <option value="suspended" {{ 'selected' if branch.status == 'suspended' else '' }}>Suspended</option>
                            </select>
                        </div>
                    </div>

                    <div class="custom-control custom-checkbox mb-3">
                        <input type="checkbox" class="custom-control-input" id="is_head_office" name="is_head_office" value="1"
                               {{ 'checked' if branch.is_head_office else '' }}>
                        <label class="custom-control-label" for="is_head_office">Is Head Office</label>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2">{{ branch.description or '' }}</textarea>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address & Contact
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1" 
                               value="{{ branch.address_line1 or '' }}">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city" 
                                   value="{{ branch.city or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="district">District</label>
                            <input type="text" class="form-control" id="district" name="district" 
                                   value="{{ branch.district or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" 
                                   value="{{ branch.country or 'UAE' }}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" 
                                   value="{{ branch.phone or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="mobile">Mobile</label>
                            <input type="text" class="form-control" id="mobile" name="mobile" 
                                   value="{{ branch.mobile or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ branch.email or '' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="default_document_prefix">Document Prefix</label>
                        <input type="text" class="form-control" id="default_document_prefix" name="default_document_prefix"
                               value="{{ branch.default_document_prefix or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="local_timezone">Timezone</label>
                        <select class="form-control" id="local_timezone" name="local_timezone">
                            <option value="Asia/Dubai" {{ 'selected' if branch.local_timezone == 'Asia/Dubai' else '' }}>Asia/Dubai</option>
                            <option value="Asia/Riyadh" {{ 'selected' if branch.local_timezone == 'Asia/Riyadh' else '' }}>Asia/Riyadh</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-warning btn-block">
                <i class="fas fa-save mr-1"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
