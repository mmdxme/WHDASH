{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-code-branch mr-2 text-info"></i>
                Create Branch
            </h1>
            <p class="text-muted mb-0">Add a new branch for {{ entity.legal_name }}</p>
        </div>
        <a href="{{ url_for('multi_entity.entity_detail', entity_id=entity.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Branch Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="branch_code">Branch Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="branch_code" name="branch_code" required 
                                   placeholder="e.g., SDAD-DXB-01">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="branch_type">Branch Type</label>
                            <select class="form-control" id="branch_type" name="branch_type">
                                <option value="branch_office">Branch Office</option>
                                <option value="head_office">Head Office</option>
                                <option value="warehouse_branch">Warehouse Branch</option>
                                <option value="retail_branch">Retail Branch</option>
                                <option value="service_branch">Service Branch</option>
                                <option value="export_office">Export Office</option>
                                <option value="project_office">Project Office</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="branch_name">Branch Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="branch_name" name="branch_name" required
                               placeholder="Full branch name">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name"
                                   placeholder="Abbreviated name">
                        </div>
                        <div class="form-group col-md-6">
                            <div class="custom-control custom-checkbox mt-4">
                                <input type="checkbox" class="custom-control-input" id="is_head_office" name="is_head_office" value="1">
                                <label class="custom-control-label" for="is_head_office">Is Head Office</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address & Contact
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="district">District</label>
                            <input type="text" class="form-control" id="district" name="district">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" value="UAE">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="mobile">Mobile</label>
                            <input type="text" class="form-control" id="mobile" name="mobile">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="default_document_prefix">Document Prefix</label>
                        <input type="text" class="form-control" id="default_document_prefix" name="default_document_prefix"
                               placeholder="e.g., SDAD-DXB">
                    </div>
                    <div class="form-group">
                        <label for="local_timezone">Local Timezone</label>
                        <select class="form-control" id="local_timezone" name="local_timezone">
                            <option value="Asia/Dubai">Asia/Dubai (GMT+4)</option>
                            <option value="Asia/Riyadh">Asia/Riyadh (GMT+3)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="local_language">Local Language</label>
                        <select class="form-control" id="local_language" name="local_language">
                            <option value="en">English</option>
                            <option value="ar">Arabic</option>
                        </select>
                    </div>
                    <div class="form-group mb-0">
                        <label for="notes">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save mr-1"></i> Create Branch
            </button>
        </div>
    </form>
</div>
{% endblock %}
