{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-link mr-2 text-purple"></i>
                Create Relationship
            </h1>
            <p class="text-muted mb-0">Define a relationship between entities</p>
        </div>
        <a href="{{ url_for('multi_entity.relationship_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-link mr-2"></i>Relationship Details
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="source_entity_id">Source Entity <span class="text-danger">*</span></label>
                            <select class="form-control" id="source_entity_id" name="source_entity_id" required>
                                <option value="">-- Select --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}">{{ e.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="target_entity_id">Target Entity <span class="text-danger">*</span></label>
                            <select class="form-control" id="target_entity_id" name="target_entity_id" required>
                                <option value="">-- Select --</option>
                                {% for e in entities %}
                                <option value="{{ e.id }}">{{ e.legal_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="relationship_type">Relationship Type <span class="text-danger">*</span></label>
                            <select class="form-control" id="relationship_type" name="relationship_type" required>
                                <option value="subsidiary">Subsidiary</option>
                                <option value="parent">Parent</option>
                                <option value="sister">Sister Company</option>
                                <option value="associate">Associate</option>
                                <option value=" JV">Joint Venture</option>
                                <option value="franchise">Franchise</option>
                                <option value="supplier">Supplier</option>
                                <option value="customer">Customer</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="ownership_percentage">Ownership %</label>
                            <input type="number" class="form-control" id="ownership_percentage" name="ownership_percentage" 
                                   value="0" min="0" max="100">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="effective_date">Effective Date</label>
                            <input type="date" class="form-control" id="effective_date" name="effective_date">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="end_date">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Terms
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="payment_terms">Payment Terms</label>
                        <input type="text" class="form-control" id="payment_terms" name="payment_terms"
                               placeholder="e.g., Net 30">
                    </div>
                    <div class="form-group">
                        <label for="credit_limit">Credit Limit</label>
                        <input type="number" class="form-control" id="credit_limit" name="credit_limit" value="0">
                    </div>
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="approval_required" name="approval_required" value="1">
                        <label class="custom-control-label" for="approval_required">Approval Required</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save mr-1"></i> Create Relationship
            </button>
        </div>
    </form>
</div>
{% endblock %}
