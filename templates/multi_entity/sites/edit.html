{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-edit mr-2 text-warning"></i>
                Edit Site
            </h1>
            <p class="text-muted mb-0">{{ site.site_name }}</p>
        </div>
        <a href="{{ url_for('multi_entity.site_detail', site_id=site.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Site Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="site_code">Site Code</label>
                            <input type="text" class="form-control" id="site_code" name="site_code" 
                                   value="{{ site.site_code }}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="site_type">Site Type</label>
                            <select class="form-control" id="site_type" name="site_type">
                                <option value="warehouse" {{ 'selected' if site.site_type == 'warehouse' else '' }}>Warehouse</option>
                                <option value="office" {{ 'selected' if site.site_type == 'office' else '' }}>Office</option>
                                <option value="yard" {{ 'selected' if site.site_type == 'yard' else '' }}>Yard</option>
                                <option value="showroom" {{ 'selected' if site.site_type == 'showroom' else '' }}>Showroom</option>
                                <option value="service_center" {{ 'selected' if site.site_type == 'service_center' else '' }}>Service Center</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="site_name">Site Name</label>
                        <input type="text" class="form-control" id="site_name" name="site_name" 
                               value="{{ site.site_name }}">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="active" {{ 'selected' if site.status == 'active' else '' }}>Active</option>
                                <option value="inactive" {{ 'selected' if site.status == 'inactive' else '' }}>Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1" 
                               value="{{ site.address_line1 or '' }}">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city" 
                                   value="{{ site.city or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" 
                                   value="{{ site.country or 'UAE' }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-chart-area mr-2"></i>Capacity
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="site_area_sqm">Area (sqm)</label>
                            <input type="number" class="form-control" id="site_area_sqm" name="site_area_sqm" 
                                   value="{{ site.site_area_sqm or '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="capacity_pallets">Pallet Capacity</label>
                            <input type="number" class="form-control" id="capacity_pallets" name="capacity_pallets" 
                                   value="{{ site.capacity_pallets or '' }}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="contact_name">Contact Name</label>
                        <input type="text" class="form-control" id="contact_name" name="contact_name" 
                               value="{{ site.contact_name or '' }}">
                    </div>
                    <div class="form-group">
                        <label for="contact_email">Contact Email</label>
                        <input type="email" class="form-control" id="contact_email" name="contact_email" 
                               value="{{ site.contact_email or '' }}">
                    </div>
                    <div class="form-group mb-0">
                        <label for="notes">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3">{{ site.notes or '' }}</textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-warning btn-block">
                <i class="fas fa-save mr-1"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
