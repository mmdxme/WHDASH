<!-- Create Site -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1 text-gray-800">
                <i class="fas fa-warehouse mr-2 text-warning"></i>
                Create Site
            </h1>
            <p class="text-muted mb-0">Add a new site for {{ branch.branch_name }}</p>
        </div>
        <a href="{{ url_for('multi_entity.branch_detail', branch_id=branch.id) }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="POST" class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-info-circle mr-2"></i>Site Information
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="site_code">Site Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="site_code" name="site_code" required 
                                   placeholder="e.g., WH-RAS-01">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="site_type">Site Type</label>
                            <select class="form-control" id="site_type" name="site_type">
                                <option value="warehouse">Warehouse</option>
                                <option value="office">Office</option>
                                <option value="yard">Yard</option>
                                <option value="showroom">Showroom</option>
                                <option value="service_center">Service Center</option>
                                <option value="virtual">Virtual Fulfillment</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="site_name">Site Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="site_name" name="site_name" required
                               placeholder="Full site name">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="short_name">Short Name</label>
                            <input type="text" class="form-control" id="short_name" name="short_name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="site_subtype">Subtype</label>
                            <input type="text" class="form-control" id="site_subtype" name="site_subtype">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-map-marker-alt mr-2"></i>Address
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="address_line1">Address</label>
                        <input type="text" class="form-control" id="address_line1" name="address_line1">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="city">City</label>
                            <input type="text" class="form-control" id="city" name="city">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="district">District</label>
                            <input type="text" class="form-control" id="district" name="district">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="country">Country</label>
                            <input type="text" class="form-control" id="country" name="country" value="UAE">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-chart-area mr-2"></i>Capacity
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="site_area_sqm">Area (sqm)</label>
                            <input type="number" class="form-control" id="site_area_sqm" name="site_area_sqm">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="covered_area_sqm">Covered Area (sqm)</label>
                            <input type="number" class="form-control" id="covered_area_sqm" name="covered_area_sqm">
                        </div>
                        <div class="form-group col-md-4">
                            <label for="capacity_pallets">Pallet Capacity</label>
                            <input type="number" class="form-control" id="capacity_pallets" name="capacity_pallets">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-transparent py-3">
                    <h6 class="m-0 font-weight-bold text-gray-800">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </h6>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="contact_name">Contact Name</label>
                        <input type="text" class="form-control" id="contact_name" name="contact_name">
                    </div>
                    <div class="form-group">
                        <label for="contact_email">Contact Email</label>
                        <input type="email" class="form-control" id="contact_email" name="contact_email">
                    </div>
                    <div class="form-group">
                        <label for="contact_phone">Contact Phone</label>
                        <input type="text" class="form-control" id="contact_phone" name="contact_phone">
                    </div>
                    <div class="form-group mb-0">
                        <label for="notes">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save mr-1"></i> Create Site
            </button>
        </div>
    </form>
</div>
{% endblock %}
