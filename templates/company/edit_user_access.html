<!-- Edit User Access -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-key mr-2"></i> Edit User Access
        </h1>
        <a href="{{ url_for('company.company_users', company_id=access.company_id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <!-- Edit Form -->
    <form method="POST">
        <div class="row">
            <div class="col-lg-8">
                <!-- Access Settings -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-key mr-1"></i> Access Settings
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="role_in_company">Role in Company</label>
                                    <select class="form-control" id="role_in_company" name="role_in_company">
                                        <option value="user" {{ 'selected' if access.role_in_company == 'user' else '' }}>User</option>
                                        <option value="manager" {{ 'selected' if access.role_in_company == 'manager' else '' }}>Manager</option>
                                        <option value="admin" {{ 'selected' if access.role_in_company == 'admin' else '' }}>Company Admin</option>
                                        <option value="viewer" {{ 'selected' if access.role_in_company == 'viewer' else '' }}>Viewer</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="branch_id">Branch Scope</label>
                                    <select class="form-control" id="branch_id" name="branch_id">
                                        <option value="">All Branches</option>
                                        {% for branch in branches %}
                                        <option value="{{ branch.id }}" {{ 'selected' if access.branch_id == branch.id else '' }}>
                                            {{ branch.branch_name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="facility_id">Facility Scope</label>
                                    <select class="form-control" id="facility_id" name="facility_id">
                                        <option value="">All Facilities</option>
                                        {% for facility in facilities %}
                                        <option value="{{ facility.id }}" {{ 'selected' if access.facility_id == facility.id else '' }}>
                                            {{ facility.facility_name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="access_scope">Access Scope</label>
                                    <select class="form-control" id="access_scope" name="access_scope">
                                        <option value="company" {{ 'selected' if access.access_scope == 'company' else '' }}>Company Only</option>
                                        <option value="branch" {{ 'selected' if access.access_scope == 'branch' else '' }}>Branch Only</option>
                                        <option value="facility" {{ 'selected' if access.access_scope == 'facility' else '' }}>Facility Only</option>
                                        <option value="allowed" {{ 'selected' if access.access_scope == 'allowed' else '' }}>Specific Entities</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group mb-0">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="is_default"
                                               name="is_default" value="1" {{ 'checked' if access.is_default else '' }}>
                                        <label class="custom-control-label" for="is_default">Default Company</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group mb-0">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="can_view_financials"
                                               name="can_view_financials" value="1" {{ 'checked' if access.can_view_financials else '' }}>
                                        <label class="custom-control-label" for="can_view_financials">View Financials</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group mb-0">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="can_approve_intercompany"
                                               name="can_approve_intercompany" value="1" {{ 'checked' if access.can_approve_intercompany else '' }}>
                                        <label class="custom-control-label" for="can_approve_intercompany">Approve Intercompany</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-4">
                                <div class="form-group mb-0">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="cross_company_reporting"
                                               name="cross_company_reporting" value="1" {{ 'checked' if access.cross_company_reporting else '' }}>
                                        <label class="custom-control-label" for="cross_company_reporting">Cross-Company Reporting</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group mb-0">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="is_active"
                                               name="is_active" value="1" {{ 'checked' if access.is_active else '' }}>
                                        <label class="custom-control-label" for="is_active">Access Active</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Effective Period -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-calendar mr-1"></i> Effective Period
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="effective_from">Effective From</label>
                                    <input type="date" class="form-control" id="effective_from" name="effective_from"
                                           value="{{ access.effective_from or '' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="effective_to">Effective To</label>
                                    <input type="date" class="form-control" id="effective_to" name="effective_to"
                                           value="{{ access.effective_to or '' }}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-save mr-1"></i> Save Changes
                        </button>
                        <a href="{{ url_for('company.company_users', company_id=access.company_id) }}" class="btn btn-secondary btn-block">
                            Cancel
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
