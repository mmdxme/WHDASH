<!-- Edit Company -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-edit mr-2"></i> Edit Company
        </h1>
        <a href="{{ url_for('company.company_detail', company_id=company.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left mr-1"></i> Back to Details
        </a>
    </div>

    <!-- Form -->
    <form method="POST">
        <div class="row">
            <!-- Basic Information -->
            <div class="col-lg-8">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-info-circle mr-1"></i> Basic Information
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="name">Company Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" name="name" required
                                           value="{{ company.name }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="short_name">Short Name</label>
                                    <input type="text" class="form-control" id="short_name" name="short_name"
                                           value="{{ company.short_name or '' }}">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="trade_name">Trade Name</label>
                                    <input type="text" class="form-control" id="trade_name" name="trade_name"
                                           value="{{ company.trade_name or '' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="company_type">Company Type</label>
                                    <select class="form-control" id="company_type" name="company_type">
                                        <option value="subsidiary" {{ 'selected' if company.company_type == 'subsidiary' else '' }}>Subsidiary</option>
                                        <option value="holding" {{ 'selected' if company.company_type == 'holding' else '' }}>Holding</option>
                                        <option value="branch" {{ 'selected' if company.company_type == 'branch' else '' }}>Branch</option>
                                        <option value="division" {{ 'selected' if company.company_type == 'division' else '' }}>Division</option>
                                        <option value="joint_venture" {{ 'selected' if company.company_type == 'joint_venture' else '' }}>Joint Venture</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="parent_company_id">Parent Company</label>
                                    <select class="form-control" id="parent_company_id" name="parent_company_id">
                                        <option value="">-- No Parent --</option>
                                        {% for comp in companies %}
                                        <option value="{{ comp.id }}" {{ 'selected' if company.parent_company_id == comp.id else '' }}>
                                            {{ comp.name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="company_type_detail">Type Detail</label>
                                    <input type="text" class="form-control" id="company_type_detail"
                                           name="company_type_detail" value="{{ company.company_type_detail or '' }}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Registration Info -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-id-card mr-1"></i> Registration Information
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="registration_number">Registration Number</label>
                                    <input type="text" class="form-control" id="registration_number"
                                           name="registration_number" value="{{ company.registration_number or '' }}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="tax_id">Tax ID</label>
                                    <input type="text" class="form-control" id="tax_id" name="tax_id"
                                           value="{{ company.tax_id or '' }}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="vat_number">VAT Number</label>
                                    <input type="text" class="form-control" id="vat_number" name="vat_number"
                                           value="{{ company.vat_number or '' }}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contact Info -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-address-book mr-1"></i> Contact Information
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="address_line1">Address Line 1</label>
                                    <input type="text" class="form-control" id="address_line1" name="address_line1"
                                           value="{{ company.address_line1 or '' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="address_line2">Address Line 2</label>
                                    <input type="text" class="form-control" id="address_line2" name="address_line2"
                                           value="{{ company.address_line2 or '' }}">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="city">City</label>
                                    <input type="text" class="form-control" id="city" name="city"
                                           value="{{ company.city or '' }}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="country">Country</label>
                                    <input type="text" class="form-control" id="country" name="country"
                                           value="{{ company.country or '' }}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="postal_code">Postal Code</label>
                                    <input type="text" class="form-control" id="postal_code" name="postal_code"
                                           value="{{ company.postal_code or '' }}">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="phone">Phone</label>
                                    <input type="tel" class="form-control" id="phone" name="phone"
                                           value="{{ company.phone or '' }}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="mobile">Mobile</label>
                                    <input type="tel" class="form-control" id="mobile" name="mobile"
                                           value="{{ company.mobile or '' }}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           value="{{ company.email or '' }}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Sidebar -->
            <div class="col-lg-4">
                <!-- Regional Settings -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-globe mr-1"></i> Regional Settings
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="main_currency">Currency</label>
                            <select class="form-control" id="main_currency" name="main_currency">
                                <option value="AED" {{ 'selected' if company.main_currency == 'AED' else '' }}>AED</option>
                                <option value="USD" {{ 'selected' if company.main_currency == 'USD' else '' }}>USD</option>
                                <option value="EUR" {{ 'selected' if company.main_currency == 'EUR' else '' }}>EUR</option>
                                <option value="GBP" {{ 'selected' if company.main_currency == 'GBP' else '' }}>GBP</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="timezone">Timezone</label>
                            <select class="form-control" id="timezone" name="timezone">
                                <option value="Asia/Dubai" {{ 'selected' if company.timezone == 'Asia/Dubai' else '' }}>Asia/Dubai</option>
                                <option value="Asia/Riyadh" {{ 'selected' if company.timezone == 'Asia/Riyadh' else '' }}>Asia/Riyadh</option>
                                <option value="Europe/London" {{ 'selected' if company.timezone == 'Europe/London' else '' }}>Europe/London</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="date_format">Date Format</label>
                            <select class="form-control" id="date_format" name="date_format">
                                <option value="DD/MM/YYYY" {{ 'selected' if company.date_format == 'DD/MM/YYYY' else '' }}>DD/MM/YYYY</option>
                                <option value="MM/DD/YYYY" {{ 'selected' if company.date_format == 'MM/DD/YYYY' else '' }}>MM/DD/YYYY</option>
                                <option value="YYYY-MM-DD" {{ 'selected' if company.date_format == 'YYYY-MM-DD' else '' }}>YYYY-MM-DD</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-toggle-on mr-1"></i> Status
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="form-group mb-0">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="is_active" name="is_active"
                                       value="1" {{ 'checked' if company.profile_active != 0 else '' }}>
                                <label class="custom-control-label" for="is_active">Active</label>
                            </div>
                        </div>
                        <hr>
                        <div class="form-group mb-0">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="is_parent" name="is_parent"
                                       value="1" {{ 'checked' if company.is_parent else '' }}>
                                <label class="custom-control-label" for="is_parent">Is Parent Company</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notes -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            <i class="fas fa-sticky-note mr-1"></i> Notes
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="form-group mb-0">
                            <textarea class="form-control" id="notes" name="notes" rows="4">{{ company.notes or '' }}</textarea>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="card shadow">
                    <div class="card-body">
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-save mr-1"></i> Save Changes
                        </button>
                        <a href="{{ url_for('company.company_detail', company_id=company.id) }}" class="btn btn-secondary btn-block">
                            Cancel
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
