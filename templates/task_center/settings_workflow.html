{% extends "base.html" %}

{% block content %}
<div class="space-y-6 pb-20 fade-in">
    <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
        <div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Workflow Settings</h1>
            <p class="mt-1 text-sm text-slate-400">Configure task workflow statuses and priorities.</p>
        </div>
    </div>

    <!-- Statuses -->
    <div class="glass-panel rounded-3xl border border-white/5 p-6">
        <h3 class="text-lg font-bold text-white">Task Statuses</h3>
        <div class="mt-4 grid grid-cols-2 gap-4 md:grid-cols-5">
            {% for status in statuses %}
            <div class="rounded-xl border border-white/10 bg-white/5 p-4 text-center">
                <p class="font-bold text-white">{{ status }}</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Priorities -->
    <div class="glass-panel rounded-3xl border border-white/5 p-6">
        <h3 class="text-lg font-bold text-white">Priority Levels</h3>
        <div class="mt-4 grid grid-cols-2 gap-4 md:grid-cols-4">
            {% for priority in priorities %}
            <div class="rounded-xl border border-white/10 bg-white/5 p-4 text-center">
                <p class="font-bold text-{{ 'rose' if priority == 'Critical' else 'orange' if priority == 'High' else 'yellow' if priority == 'Medium' else 'green' }}-400">{{ priority }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
