{% extends "base.html" %}

{% block content %}
<div class="space-y-6 pb-20 fade-in">
    <!-- Header -->
    <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
        <div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Task Reports</h1>
            <p class="mt-1 text-sm text-slate-400">Access detailed analytics and reports.</p>
        </div>
    </div>

    <!-- Reports Grid -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-4">
        <a href="{{ url_for('task_center.task_reports_productivity') }}" class="glass-panel rounded-3xl border border-white/5 p-6 hover:border-brand-500/50 transition-colors group">
            <div class="flex items-center gap-4">
                <div class="rounded-xl bg-brand-500/10 p-4 group-hover:bg-brand-500/20 transition-colors">
                    <i class="fa-solid fa-chart-line text-2xl text-brand-400"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">Productivity</h3>
                    <p class="mt-1 text-sm text-slate-500">User productivity metrics</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('task_center.task_reports_completion') }}" class="glass-panel rounded-3xl border border-white/5 p-6 hover:border-emerald-500/50 transition-colors group">
            <div class="flex items-center gap-4">
                <div class="rounded-xl bg-emerald-500/10 p-4 group-hover:bg-emerald-500/20 transition-colors">
                    <i class="fa-solid fa-chart-pie text-2xl text-emerald-400"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">Completion Rate</h3>
                    <p class="mt-1 text-sm text-slate-500">Task completion analytics</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('task_center.task_reports_by_user') }}" class="glass-panel rounded-3xl border border-white/5 p-6 hover:border-cyan-500/50 transition-colors group">
            <div class="flex items-center gap-4">
                <div class="rounded-xl bg-cyan-500/10 p-4 group-hover:bg-cyan-500/20 transition-colors">
                    <i class="fa-solid fa-user text-2xl text-cyan-400"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">By User</h3>
                    <p class="mt-1 text-sm text-slate-500">Task distribution per user</p>
                </div>
            </div>
        </a>

        <a href="{{ url_for('task_center.task_reports_by_department') }}" class="glass-panel rounded-3xl border border-white/5 p-6 hover:border-purple-500/50 transition-colors group">
            <div class="flex items-center gap-4">
                <div class="rounded-xl bg-purple-500/10 p-4 group-hover:bg-purple-500/20 transition-colors">
                    <i class="fa-solid fa-building text-2xl text-purple-400"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">By Department</h3>
                    <p class="mt-1 text-sm text-slate-500">Task distribution per dept</p>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
