{% extends "base.html" %}

{% block content %}
<div class="space-y-6 pb-20 fade-in">
    <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
        <div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Task Types</h1>
            <p class="mt-1 text-sm text-slate-400">Manage task departments/categories.</p>
        </div>
    </div>

    <div class="glass-panel rounded-3xl border border-white/5">
        <div class="border-b border-white/5 bg-white/[0.02] p-6">
            <h3 class="text-lg font-bold text-white">Departments / Types</h3>
        </div>
        <div class="divide-y divide-white/5">
            {% for dept in departments %}
            <div class="flex items-center justify-between p-4 hover:bg-white/[0.02]">
                <div>
                    <p class="font-bold text-white">{{ dept.name }}</p>
                    <p class="mt-1 text-xs text-slate-500">{{ dept.description or 'No description' }}</p>
                </div>
                <span class="badge badge-{{ dept.status|lower }}">{{ dept.status }}</span>
            </div>
            {% else %}
            <div class="p-6 text-center">
                <i class="fa-solid fa-tags text-4xl text-slate-600/30"></i>
                <p class="mt-3 text-sm font-bold text-slate-500">No task types configured</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
