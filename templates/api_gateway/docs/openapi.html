{% extends "api_gateway/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">OpenAPI / Swagger Specification</h1>
    <div class="header-actions">
        <a href="#" class="btn btn-primary" onclick="downloadSpec()">
            <i class="fas fa-download"></i> Download JSON
        </a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">OpenAPI 3.0 Specification</h3>
    </div>
    <div style="padding: 20px;">
        <p style="margin-bottom: 15px;">This is the machine-readable OpenAPI specification for the MMDx API.</p>
        <div class="code-block" style="max-height: 500px; overflow-y: auto;">
<pre id="openapi-content">{{ openapi_spec }}</pre>
        </div>
    </div>
</div>

<script>
function downloadSpec() {
    const spec = document.getElementById('openapi-content').textContent;
    const blob = new Blob([spec], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'MMDx-api-spec.json';
    a.click();
}
</script>
{% endblock %}
