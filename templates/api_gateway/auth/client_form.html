{% extends "api_gateway/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if client %}Edit{% else %}Create{% endif %} API Client</h1>
    <div class="header-actions">
        <a href="{{ url_for('api_gateway_clients') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Client Name *</label>
                <input type="text" name="client_name" value="{{ client.client_name if client else '' }}" required>
            </div>
            <div class="form-group">
                <label>Client Type</label>
                <select name="client_type">
                    <option value="external" {% if client and client.client_type == 'external' %}selected{% endif %}>External</option>
                    <option value="internal" {% if client and client.client_type == 'internal' %}selected{% endif %}>Internal</option>
                    <option value="partner" {% if client and client.client_type == 'partner' %}selected{% endif %}>Partner</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Owner Name</label>
                <input type="text" name="owner_name" value="{{ client.owner_name if client else '' }}">
            </div>
            <div class="form-group">
                <label>Owner Email</label>
                <input type="email" name="owner_email" value="{{ client.owner_email if client else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department" value="{{ client.department if client else '' }}">
            </div>
            <div class="form-group">
                <label>Integration Purpose</label>
                <input type="text" name="integration_purpose" value="{{ client.integration_purpose if client else '' }}" placeholder="e.g., E-commerce sync, Mobile app">
            </div>
        </div>

        <div class="form-group">
            <label>Rate Limit Profile</label>
            <select name="rate_limit_profile">
                {% for profile in rl_profiles %}
                <option value="{{ profile.profile_code }}" {% if client and client.rate_limit_profile == profile.profile_code %}selected{% endif %}>
                    {{ profile.profile_name }} ({{ profile.requests_per_minute }}/min)
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Allowed IP Addresses (comma-separated, leave empty for any)</label>
            <input type="text" name="allowed_ip_addresses" value="{{ client.allowed_ip_addresses if client else '' }}" placeholder="192.168.1.1, 10.0.0.0/8">
        </div>

        <div class="form-group">
            <label>Maximum Requests Per Day</label>
            <input type="number" name="max_requests_per_day" value="{{ client.max_requests_per_day if client else '' }}">
        </div>

        {% if not client %}
        <div class="form-group">
            <label>
                <input type="checkbox" name="require_approval"> Require Approval Before Activation
            </label>
        </div>
        {% else %}
        <div class="form-row">
            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    <option value="active" {% if client.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if client.status == 'inactive' %}selected{% endif %}>Inactive</option>
                    <option value="pending" {% if client.status == 'pending' %}selected{% endif %}>Pending</option>
                    <option value="suspended" {% if client.status == 'suspended' %}selected{% endif %}>Suspended</option>
                </select>
            </div>
        </div>
        {% endif %}

        <div class="form-group">
            <label>Allowed Modules</label>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px;">
                {% for mod_code, mod_name in modules %}
                <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
                    <input type="checkbox" name="allowed_modules" value="{{ mod_code }}"
                           {% if client and mod_code in client.allowed_modules_list %}checked{% endif %}>
                    {{ mod_name }}
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label>Allowed Scopes</label>
            <div style="max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px;">
                {% for scope in scopes %}
                <label style="display: flex; align-items: center; gap: 5px; font-weight: normal; padding: 5px;">
                    <input type="checkbox" name="allowed_scopes" value="{{ scope.scope_code }}"
                           {% if client and scope.scope_code in client.allowed_scopes_list %}checked{% endif %}>
                    <code style="font-size: 0.8rem;">{{ scope.scope_code }}</code>
                    <span style="color: var(--secondary); font-size: 0.8rem;"> - {{ scope.scope_name }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3">{{ client.notes if client else '' }}</textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
            <a href="{{ url_for('api_gateway_clients') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> {% if client %}Update{% else %}Create{% endif %} Client
            </button>
        </div>
    </form>
</div>
{% endblock %}
