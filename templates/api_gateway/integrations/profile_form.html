{% extends "api_gateway/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Create Integration Profile</h1>
    <div class="header-actions">
        <a href="{{ url_for('api_gateway_integrations') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Integration Name *</label>
                <input type="text" name="integration_name" required placeholder="e.g., Shopify E-commerce Sync">
            </div>
            <div class="form-group">
                <label>Integration Type *</label>
                <select name="integration_type" required>
                    <option value="">Select type...</option>
                    {% for type_code, type_name in integration_types %}
                    <option value="{{ type_code }}">{{ type_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Module *</label>
                <select name="module" required>
                    <option value="">Select module...</option>
                    {% for mod_code, mod_name in modules %}
                    <option value="{{ mod_code }}">{{ mod_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Direction *</label>
                <select name="direction" required>
                    <option value="">Select direction...</option>
                    <option value="inbound">Inbound</option>
                    <option value="outbound">Outbound</option>
                    <option value="bidirectional">Bidirectional</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="2" placeholder="Describe what this integration does..."></textarea>
        </div>

        <div class="form-group">
            <label>Module Scope (which modules this integration affects)</label>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px;">
                {% for mod_code, mod_name in modules %}
                <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
                    <input type="checkbox" name="module_scope" value="{{ mod_code }}">
                    {{ mod_name }}
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Sync Schedule</label>
                <input type="text" name="sync_schedule" placeholder="e.g., */15 * * * * for every 15 min">
            </div>
            <div class="form-group">
                <label>Sync Trigger</label>
                <select name="sync_trigger">
                    <option value="manual">Manual</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="event">Event-based</option>
                    <option value="webhook">Webhook</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Timeout (seconds)</label>
                <input type="number" name="timeout_seconds" value="30">
            </div>
            <div class="form-group">
                <label>Max Retries</label>
                <input type="number" name="max_retries" value="3">
            </div>
        </div>

        <div class="form-group">
            <label>Retry Backoff Strategy</label>
            <select name="retry_backoff">
                <option value="exponential">Exponential</option>
                <option value="linear">Linear</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Owner Name</label>
                <input type="text" name="owner_name">
            </div>
            <div class="form-group">
                <label>Owner Email</label>
                <input type="email" name="owner_email">
            </div>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" name="department">
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3"></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
            <a href="{{ url_for('api_gateway_integrations') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Create Integration
            </button>
        </div>
    </form>
</div>
{% endblock %}
