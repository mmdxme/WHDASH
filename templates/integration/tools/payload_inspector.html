{% extends "base.html" %}

{% block title %}{{ t('payload_inspector', 'Payload Inspector') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-search fa-fw me-2 text-primary"></i>
            {{ t('payload_inspector', 'Payload Inspector') }}
        </h1>
        <a href="{{ url_for('integration_tools') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label for="payload" class="form-label">{{ t('payload_json', 'Payload (JSON)') }}</label>
                    <textarea class="form-control" id="payload" name="payload" rows="10" placeholder='{"key": "value"}'></textarea>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check me-1"></i> {{ t('validate', 'Validate') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
