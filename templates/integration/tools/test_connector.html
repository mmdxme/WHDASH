{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plug fa-fw me-2 text-success"></i>
            {{ t('connector_tester', 'Connector Tester') }}
        </h1>
        <a href="{{ url_for('integration_tools') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label for="connector_id" class="form-label">{{ t('connector', 'Connector') }}</label>
                    <select class="form-select" id="connector_id" name="connector_id" required>
                        <option value="">{{ t('select_connector', 'Select a connector') }}</option>
                        {% for c in connectors %}
                        <option value="{{ c.id }}">{{ c.name }} ({{ c.type }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="test_payload" class="form-label">{{ t('test_payload', 'Test Payload (JSON)') }}</label>
                    <textarea class="form-control" id="test_payload" name="test_payload" rows="8" placeholder='{}'></textarea>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-play me-1"></i> {{ t('run_test', 'Run Test') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
