{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plus fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('create_webhook', 'Create New Webhook') }}
        </h1>
        <a href="{{ url_for('integration_webhooks') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="{{ t('webhook_name_placeholder', 'e.g., Order Created Notification') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="event_type" class="form-label">{{ t('event_type', 'Event Type') }} *</label>
                    <input type="text" class="form-control" id="event_type" name="event_type" required placeholder="{{ t('event_type_placeholder', 'e.g., order.created') }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="source_system" class="form-label">{{ t('source_system', 'Source System') }}</label>
                    <input type="text" class="form-control" id="source_system" name="source_system" placeholder="{{ t('source_system_placeholder', 'e.g., ecommerce') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="target_url" class="form-label">{{ t('target_url', 'Target URL') }} *</label>
                    <input type="url" class="form-control" id="target_url" name="target_url" required placeholder="https://example.com/webhook">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="http_method" class="form-label">{{ t('http_method', 'HTTP Method') }}</label>
                    <select class="form-select" id="http_method" name="http_method">
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="GET">GET</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="auth_type" class="form-label">{{ t('auth_type', 'Auth Type') }}</label>
                    <select class="form-select" id="auth_type" name="auth_type">
                        <option value="hmac_sha256">HMAC SHA256</option>
                        <option value="bearer_token">Bearer Token</option>
                        <option value="api_key">API Key</option>
                        <option value="none">None</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="timeout_seconds" class="form-label">{{ t('timeout_seconds', 'Timeout') }}</label>
                    <input type="number" class="form-control" id="timeout_seconds" name="timeout_seconds" value="30" min="1" max="120">
                </div>
            </div>

            <div class="mb-3">
                <label for="secret_key" class="form-label">{{ t('secret_key', 'Secret Key') }}</label>
                <input type="password" class="form-control" id="secret_key" name="secret_key" placeholder="{{ t('secret_key_placeholder', 'For HMAC signature verification') }}">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="2"></textarea>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="is_outbound" name="is_outbound" checked>
                <label class="form-check-label" for="is_outbound">{{ t('is_outbound', 'Outbound Webhook (send events to target)') }}</label>
            </div>

            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_webhooks') }}" class="btn btn-outline-secondary me-2">{{ t('cancel', 'Cancel') }}</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ t('create_webhook', 'Create Webhook') }}</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
