{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plus fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('create_endpoint', 'Create New Endpoint') }}
        </h1>
        <a href="{{ url_for('integration_endpoints') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="{{ t('endpoint_name_placeholder', 'e.g., Get Orders') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="endpoint_type" class="form-label">{{ t('type', 'Type') }}</label>
                    <select class="form-select" id="endpoint_type" name="endpoint_type">
                        <option value="inbound">{{ t('inbound', 'Inbound') }}</option>
                        <option value="outbound">{{ t('outbound', 'Outbound') }}</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="http_method" class="form-label">{{ t('http_method', 'HTTP Method') }}</label>
                    <select class="form-select" id="http_method" name="http_method">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="url_path" class="form-label">{{ t('url_path', 'URL Path') }} *</label>
                    <input type="text" class="form-control" id="url_path" name="url_path" required placeholder="/api/v1/orders">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="auth_type" class="form-label">{{ t('auth_type', 'Auth Type') }}</label>
                    <select class="form-select" id="auth_type" name="auth_type">
                        <option value="none">{{ t('none', 'None') }}</option>
                        <option value="api_key">{{ t('api_key', 'API Key') }}</option>
                        <option value="bearer_token">{{ t('bearer_token', 'Bearer Token') }}</option>
                        <option value="basic_auth">{{ t('basic_auth', 'Basic Auth') }}</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="endpoint_group" class="form-label">{{ t('group', 'Group') }}</label>
                    <select class="form-select" id="endpoint_group" name="endpoint_group">
                        <option value="">None</option>
                        {% for g in groups %}
                        <option value="{{ g }}">{{ g|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="timeout_seconds" class="form-label">{{ t('timeout_seconds', 'Timeout') }}</label>
                    <input type="number" class="form-control" id="timeout_seconds" name="timeout_seconds" value="30" min="1" max="300">
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="2"></textarea>
            </div>

            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_endpoints') }}" class="btn btn-outline-secondary me-2">{{ t('cancel', 'Cancel') }}</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ t('create_endpoint', 'Create Endpoint') }}</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
