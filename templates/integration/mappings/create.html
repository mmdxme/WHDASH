{% extends "base.html" %}

{% block title %}{{ t('create_mapping', 'Create Mapping') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plus fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('create_mapping', 'Create Field Mapping') }}
        </h1>
        <a href="{{ url_for('integration_mappings') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="source_system" class="form-label">{{ t('source_system', 'Source System') }}</label>
                    <input type="text" class="form-control" id="source_system" name="source_system">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="target_system" class="form-label">{{ t('target_system', 'Target System') }}</label>
                    <input type="text" class="form-control" id="target_system" name="target_system">
                </div>
            </div>
            <div class="mb-3">
                <label for="entity_type" class="form-label">{{ t('entity_type', 'Entity Type') }}</label>
                <input type="text" class="form-control" id="entity_type" name="entity_type" placeholder="{{ t('entity_placeholder', 'e.g., orders, customers') }}">
            </div>
            <div class="mb-3">
                <label for="mappings_json" class="form-label">{{ t('mappings_json', 'Mappings (JSON)') }}</label>
                <textarea class="form-control" id="mappings_json" name="mappings_json" rows="10" placeholder='[{"source_field": "order_id", "target_field": "id"}]'></textarea>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="2"></textarea>
            </div>
            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_mappings') }}" class="btn btn-outline-secondary me-2">{{ t('cancel', 'Cancel') }}</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ t('create', 'Create') }}</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
