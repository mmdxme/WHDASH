{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plus fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('create_new_connector', 'Create New Connector') }}
        </h1>
        <a href="{{ url_for('integration_connectors') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required
                           placeholder="{{ t('connector_name_placeholder', 'e.g., Shopify Production') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="connector_type" class="form-label">{{ t('type', 'Type') }} *</label>
                    <select class="form-select" id="connector_type" name="connector_type" required>
                        <option value="">{{ t('select_type', 'Select Type') }}</option>
                        {% for ct in connector_types %}
                        <option value="{{ ct.code }}">{{ ct.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="direction" class="form-label">{{ t('direction', 'Direction') }}</label>
                    <select class="form-select" id="direction" name="direction">
                        <option value="bidirectional">{{ t('bidirectional', 'Bidirectional') }}</option>
                        <option value="inbound">{{ t('inbound', 'Inbound') }}</option>
                        <option value="outbound">{{ t('outbound', 'Outbound') }}</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="owner_module" class="form-label">{{ t('owner_module', 'Owner Module') }}</label>
                    <select class="form-select" id="owner_module" name="owner_module">
                        <option value="">{{ t('select_module', 'Select Module') }}</option>
                        {% for mod in modules %}
                        <option value="{{ mod }}">{{ mod|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="environment" class="form-label">{{ t('environment', 'Environment') }}</label>
                    <select class="form-select" id="environment" name="environment">
                        <option value="production">{{ t('production', 'Production') }}</option>
                        <option value="staging">{{ t('staging', 'Staging') }}</option>
                        <option value="development">{{ t('development', 'Development') }}</option>
                        <option value="testing">{{ t('testing', 'Testing') }}</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="auth_method" class="form-label">{{ t('auth_method', 'Auth Method') }}</label>
                    <select class="form-select" id="auth_method" name="auth_method">
                        <option value="">{{ t('none', 'None') }}</option>
                        <option value="api_key">{{ t('api_key', 'API Key') }}</option>
                        <option value="bearer_token">{{ t('bearer_token', 'Bearer Token') }}</option>
                        <option value="basic_auth">{{ t('basic_auth', 'Basic Auth') }}</option>
                        <option value="oauth2">{{ t('oauth2', 'OAuth 2.0') }}</option>
                        <option value="hmac_sha256">{{ t('hmac_sha256', 'HMAC SHA256') }}</option>
                        <option value="ssh_key">{{ t('ssh_key', 'SSH Key') }}</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="timeout_seconds" class="form-label">{{ t('timeout_seconds', 'Timeout (seconds)') }}</label>
                    <input type="number" class="form-control" id="timeout_seconds" name="timeout_seconds" value="30" min="1" max="300">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="max_retries" class="form-label">{{ t('max_retries', 'Max Retries') }}</label>
                    <input type="number" class="form-control" id="max_retries" name="max_retries" value="3" min="0" max="10">
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="3"
                          placeholder="{{ t('description_placeholder', 'Describe the purpose of this connector...') }}"></textarea>
            </div>

            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_connectors') }}" class="btn btn-outline-secondary me-2">
                    {{ t('cancel', 'Cancel') }}
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> {{ t('create_connector', 'Create Connector') }}
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
