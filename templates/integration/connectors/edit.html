{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-edit fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('edit_connector', 'Edit Connector') }}
        </h1>
        <a href="{{ url_for('integration_connector_detail', connector_id=connector.id) }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required value="{{ connector.name }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="connector_type" class="form-label">{{ t('type', 'Type') }} *</label>
                    <select class="form-select" id="connector_type" name="connector_type" required>
                        {% for ct in connector_types %}
                        <option value="{{ ct.code }}" {% if connector.connector_type == ct.code %}selected{% endif %}>{{ ct.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="direction" class="form-label">{{ t('direction', 'Direction') }}</label>
                    <select class="form-select" id="direction" name="direction">
                        <option value="bidirectional" {% if connector.direction == 'bidirectional' %}selected{% endif %}>{{ t('bidirectional', 'Bidirectional') }}</option>
                        <option value="inbound" {% if connector.direction == 'inbound' %}selected{% endif %}>{{ t('inbound', 'Inbound') }}</option>
                        <option value="outbound" {% if connector.direction == 'outbound' %}selected{% endif %}>{{ t('outbound', 'Outbound') }}</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="owner_module" class="form-label">{{ t('owner_module', 'Owner Module') }}</label>
                    <select class="form-select" id="owner_module" name="owner_module">
                        {% for mod in modules %}
                        <option value="{{ mod }}" {% if connector.owner_module == mod %}selected{% endif %}>{{ mod|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="environment" class="form-label">{{ t('environment', 'Environment') }}</label>
                    <select class="form-select" id="environment" name="environment">
                        <option value="production" {% if connector.environment == 'production' %}selected{% endif %}>{{ t('production', 'Production') }}</option>
                        <option value="staging" {% if connector.environment == 'staging' %}selected{% endif %}>{{ t('staging', 'Staging') }}</option>
                        <option value="development" {% if connector.environment == 'development' %}selected{% endif %}>{{ t('development', 'Development') }}</option>
                        <option value="testing" {% if connector.environment == 'testing' %}selected{% endif %}>{{ t('testing', 'Testing') }}</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="auth_method" class="form-label">{{ t('auth_method', 'Auth Method') }}</label>
                    <select class="form-select" id="auth_method" name="auth_method">
                        <option value="">None</option>
                        <option value="api_key" {% if connector.auth_method == 'api_key' %}selected{% endif %}>API Key</option>
                        <option value="bearer_token" {% if connector.auth_method == 'bearer_token' %}selected{% endif %}>Bearer Token</option>
                        <option value="basic_auth" {% if connector.auth_method == 'basic_auth' %}selected{% endif %}>Basic Auth</option>
                        <option value="oauth2" {% if connector.auth_method == 'oauth2' %}selected{% endif %}>OAuth 2.0</option>
                        <option value="hmac_sha256" {% if connector.auth_method == 'hmac_sha256' %}selected{% endif %}>HMAC SHA256</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="timeout_seconds" class="form-label">{{ t('timeout_seconds', 'Timeout (seconds)') }}</label>
                    <input type="number" class="form-control" id="timeout_seconds" name="timeout_seconds" value="{{ connector.timeout_seconds }}" min="1" max="300">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="active_status" class="form-label">{{ t('status', 'Status') }}</label>
                    <select class="form-select" id="active_status" name="active_status">
                        <option value="active" {% if connector.active_status == 'active' %}selected{% endif %}>{{ t('active', 'Active') }}</option>
                        <option value="inactive" {% if connector.active_status == 'inactive' %}selected{% endif %}>{{ t('inactive', 'Inactive') }}</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ connector.description or '' }}</textarea>
            </div>

            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_connector_detail', connector_id=connector.id) }}" class="btn btn-outline-secondary me-2">
                    {{ t('cancel', 'Cancel') }}
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> {{ t('save_changes', 'Save Changes') }}
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
