{% extends "base.html" %}

{% block title %}{{ t('edit_flow', 'Edit Flow') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-edit fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('edit_flow', 'Edit Flow') }}
        </h1>
        <a href="{{ url_for('integration_flow_detail', flow_id=flow.id) }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="name" class="form-label">{{ t('flow_name', 'Flow Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required value="{{ flow.name }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="trigger_type" class="form-label">{{ t('trigger_type', 'Trigger Type') }}</label>
                    <select class="form-select" id="trigger_type" name="trigger_type">
                        <option value="scheduled" {% if flow.trigger_type == 'scheduled' %}selected{% endif %}>{{ t('scheduled', 'Scheduled') }}</option>
                        <option value="event" {% if flow.trigger_type == 'event' %}selected{% endif %}>{{ t('event', 'Event') }}</option>
                        <option value="webhook" {% if flow.trigger_type == 'webhook' %}selected{% endif %}>{{ t('webhook', 'Webhook') }}</option>
                        <option value="manual" {% if flow.trigger_type == 'manual' %}selected{% endif %}>{{ t('manual', 'Manual') }}</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="source_system" class="form-label">{{ t('source_system', 'Source System') }}</label>
                    <select class="form-select" id="source_system" name="source_system">
                        {% for mod in modules %}
                        <option value="{{ mod }}" {% if flow.source_system == mod %}selected{% endif %}>{{ mod|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="destination_system" class="form-label">{{ t('destination_system', 'Destination System') }}</label>
                    <select class="form-select" id="destination_system" name="destination_system">
                        {% for mod in modules %}
                        <option value="{{ mod }}" {% if flow.destination_system == mod %}selected{% endif %}>{{ mod|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="direction" class="form-label">{{ t('direction', 'Direction') }}</label>
                    <select class="form-select" id="direction" name="direction">
                        <option value="outbound" {% if flow.direction == 'outbound' %}selected{% endif %}>{{ t('outbound', 'Outbound') }}</option>
                        <option value="inbound" {% if flow.direction == 'inbound' %}selected{% endif %}>{{ t('inbound', 'Inbound') }}</option>
                        <option value="bidirectional" {% if flow.direction == 'bidirectional' %}selected{% endif %}>{{ t('bidirectional', 'Bidirectional') }}</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="data_entity" class="form-label">{{ t('data_entity', 'Data Entity') }}</label>
                    <input type="text" class="form-control" id="data_entity" name="data_entity" value="{{ flow.data_entity or '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="retry_strategy" class="form-label">{{ t('retry_strategy', 'Retry Strategy') }}</label>
                    <select class="form-select" id="retry_strategy" name="retry_strategy">
                        <option value="exponential" {% if flow.retry_strategy == 'exponential' %}selected{% endif %}>{{ t('exponential', 'Exponential') }}</option>
                        <option value="linear" {% if flow.retry_strategy == 'linear' %}selected{% endif %}>{{ t('linear', 'Linear') }}</option>
                        <option value="fixed" {% if flow.retry_strategy == 'fixed' %}selected{% endif %}>{{ t('fixed', 'Fixed') }}</option>
                        <option value="none" {% if flow.retry_strategy == 'none' %}selected{% endif %}>{{ t('none', 'None') }}</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="logging_level" class="form-label">{{ t('logging_level', 'Logging Level') }}</label>
                    <select class="form-select" id="logging_level" name="logging_level">
                        <option value="info" {% if flow.logging_level == 'info' %}selected{% endif %}>{{ t('info', 'Info') }}</option>
                        <option value="debug" {% if flow.logging_level == 'debug' %}selected{% endif %}>{{ t('debug', 'Debug') }}</option>
                        <option value="warning" {% if flow.logging_level == 'warning' %}selected{% endif %}>{{ t('warning', 'Warning') }}</option>
                        <option value="error" {% if flow.logging_level == 'error' %}selected{% endif %}>{{ t('error', 'Error') }}</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ flow.description or '' }}</textarea>
            </div>

            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_flow_detail', flow_id=flow.id) }}" class="btn btn-outline-secondary me-2">{{ t('cancel', 'Cancel') }}</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ t('save_changes', 'Save Changes') }}</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
