{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plus fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('create_credential', 'Create Credential') }}
        </h1>
        <a href="{{ url_for('integration_credentials') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="connector_id" class="form-label">{{ t('connector', 'Connector') }}</label>
                    <select class="form-select" id="connector_id" name="connector_id">
                        <option value="">{{ t('none', 'None') }}</option>
                        {% for c in connectors %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="credential_type" class="form-label">{{ t('type', 'Type') }}</label>
                    <select class="form-select" id="credential_type" name="credential_type">
                        <option value="api_key">API Key</option>
                        <option value="oauth2">OAuth 2.0</option>
                        <option value="basic_auth">Basic Auth</option>
                        <option value="bearer_token">Bearer Token</option>
                        <option value="ssh_key">SSH Key</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="auth_method" class="form-label">{{ t('auth_method', 'Auth Method') }}</label>
                    <input type="text" class="form-control" id="auth_method" name="auth_method" placeholder="{{ t('auth_method_placeholder', 'e.g., client_secret_post') }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="expires_at" class="form-label">{{ t('expires_at', 'Expires At') }}</label>
                    <input type="date" class="form-control" id="expires_at" name="expires_at">
                </div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">{{ t('username', 'Username') }}</label>
                <input type="text" class="form-control" id="username" name="username">
            </div>
            <div class="mb-3">
                <label for="api_key" class="form-label">{{ t('api_key', 'API Key') }}</label>
                <input type="password" class="form-control" id="api_key" name="api_key">
            </div>
            <div class="mb-3">
                <label for="encrypted_secret" class="form-label">{{ t('secret', 'Secret') }}</label>
                <input type="password" class="form-control" id="encrypted_secret" name="encrypted_secret">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="2"></textarea>
            </div>
            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_credentials') }}" class="btn btn-outline-secondary me-2">{{ t('cancel', 'Cancel') }}</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ t('create', 'Create') }}</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
