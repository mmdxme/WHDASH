{% extends "base.html" %}

{% block title %}{{ t('create_transformation', 'Create Transformation') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-plus fa-fw me-2" style="color: var(--primary-color, #4e73df);"></i>
            {{ t('create_transformation', 'Create Transformation Rule') }}
        </h1>
        <a href="{{ url_for('integration_transformations') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> {{ t('back', 'Back') }}
        </a>
    </div>

    <form method="post" class="card shadow">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">{{ t('name', 'Name') }} *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="rule_type" class="form-label">{{ t('type', 'Type') }}</label>
                    <select class="form-select" id="rule_type" name="rule_type">
                        <option value="direct_map">Direct Map</option>
                        <option value="constant">Constant</option>
                        <option value="formula">Formula</option>
                        <option value="conditional">Conditional</option>
                        <option value="string_replace">String Replace</option>
                        <option value="regex_cleanup">Regex Cleanup</option>
                        <option value="date_formatting">Date Formatting</option>
                        <option value="number_normalization">Number Normalization</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="category" class="form-label">{{ t('category', 'Category') }}</label>
                    <select class="form-select" id="category" name="category">
                        <option value="mapping">Mapping</option>
                        <option value="validation">Validation</option>
                        <option value="enrichment">Enrichment</option>
                        <option value="normalization">Normalization</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="transformation_logic" class="form-label">{{ t('logic', 'Transformation Logic') }} *</label>
                <textarea class="form-control" id="transformation_logic" name="transformation_logic" rows="4" required placeholder="{{ t('logic_placeholder', 'Describe the transformation logic...') }}"></textarea>
            </div>
            <div class="mb-3">
                <label for="expression" class="form-label">{{ t('expression', 'Expression') }}</label>
                <input type="text" class="form-control" id="expression" name="expression" placeholder="{{ t('expression_placeholder', 'e.g., value.upper() or value * 1.1') }}">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">{{ t('description', 'Description') }}</label>
                <textarea class="form-control" id="description" name="description" rows="2"></textarea>
            </div>
            <hr>
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('integration_transformations') }}" class="btn btn-outline-secondary me-2">{{ t('cancel', 'Cancel') }}</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ t('create', 'Create') }}</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
