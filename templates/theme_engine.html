{# 
Theme Engine Template
====================
This template generates all CSS variables and theme-aware styles.
It is included in base.html and applies the current theme.
#}

<style>

/* Default theme tokens (used until JS applies data-theme) */

    --theme-bg: #0f172a;

    --theme-surface-raised: #334155;

    --theme-accent: #38bdf8;
    --theme-accent-hover: #7dd3fc;

        this._applyTheme(themeId);

        return {{ available_themes|tojson }};
    },

    // Get chart palette for theme
    getChartPalette: function(themeId) {
        const palettes = {{ chart_palette|tojson }};
        return palettes[themeId] || palettes['dark'];

    // Apply theme to document
    _applyTheme: function(themeId) {
        const html = document.documentElement;
        const body = document.body;
        
        // Remove old theme
        html.removeAttribute('data-theme');
        body.removeAttribute('data-theme');

        html.classList.remove('dark', 'light');
        body.classList.remove('dark', 'light');

        html.setAttribute('data-theme', themeId);
        body.setAttribute('data-theme', themeId);
        
        // Apply class for Tailwind dark: variants
        if (ThemeManager.isLightTheme()) {
            html.classList.add('light');
            html.classList.remove('dark');
        } else {
            html.classList.add('dark');
            html.classList.remove('light');

        this.saveThemePreference(themeId);

        // Apply theme

            localStorage.setItem('MMDx_theme', themeId);
        } catch (e) {
            console.warn('Could not save theme to localStorage:', e);
        }
    },

    // Get saved theme preference
    getSavedTheme: function() {
        try {
            return localStorage.getItem('MMDx_theme');
        } catch (e) {
            return null;
        }
    },

    // Setup chart refresh on theme change
    _setupChartRefresh: function() {
        // Dispatch event for charts to listen to
        window.addEventListener('theme-changed', function(e) {
            // Charts can listen to this event and update
            if (window.refreshAllCharts) {
                window.refreshAllCharts(e.detail.theme);
            }
        });
    },

    // Refresh all charts with new theme colors
    _refreshCharts: function(themeId) {
        // Dispatch custom event for charts
        window.dispatchEvent(new CustomEvent('theme-changed', {
            detail: { theme: themeId }
        }));
    },

    // Get current theme
    getCurrentTheme: function() {
        return this._currentTheme;
    },

    // Check if current theme is dark
    isDarkTheme: function() {
        const darkThemes = ['dark', 'blue', 'green', 'orange', 'purple'];
        return darkThemes.includes(this._currentTheme);
    },

    // Get themes that should use light class (Tailwind compatibility)
    isLightTheme: function() {
        const lightThemes = ['light', 'day', 'warm', 'forest', 'ocean', 'slate'];
        return lightThemes.includes(this._currentTheme);
    }
};

// Initialize theme on page load
document.addEventListener('DOMContentLoaded', function() {
    // Get theme from template data or localStorage
    var initialTheme = window.appPreferences?.theme || 
                       ThemeManager.getSavedTheme() || 
                       '{{ user_preferences.theme }}';
    
    ThemeManager.init(initialTheme);
    
    // Expose globally
    window.themeManager = ThemeManager;
});

 */

    // Apply theme colors to a Chart.js instance
    applyToChart: function(chart, themeId) {
        var colors = this.getChartColors(themeId);
        
        // Update chart options
        if (chart.options.scales) {
            Object.keys(chart.options.scales).forEach(function(scaleId) {
                var scale = chart.options.scales[scaleId];
                if (scale.ticks) {
                    scale.ticks.color = colors.textColor;
                }
                if (scale.gridLines) {
                    scale.gridLines.color = colors.gridColor;
                }
            });
        }
        
        // Update plugins
        if (chart.options.plugins && chart.options.plugins.legend) {
            chart.options.plugins.legend.labels.color = colors.textColor;
        }
        
        chart.update('none');
    },

    // Create a Chart.js config with theme colors
    createChartConfig: function(type, data, options, themeId) {
        var colors = this.getChartColors(themeId);
        
        var defaultOptions = {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    labels: {
                        color: colors.textColor,
                        usePointStyle: true,
                        padding: 20
                    }
                }
            },
            scales: type !== 'pie' && type !== 'doughnut' ? {
                x: {
                    ticks: { color: colors.textColor },
                    grid: { color: colors.gridColor }
                },
                y: {
                    ticks: { color: colors.textColor },
                    grid: { color: colors.gridColor }
                }
            } : undefined
        };
        
        // Merge with provided options
        if (options) {
            Object.keys(options).forEach(function(key) {
                if (typeof options[key] === 'object' && defaultOptions[key]) {
                    Object.assign(defaultOptions[key], options[key]);
                } else {
                    defaultOptions[key] = options[key];
                }
            });
        }
        
        // Apply colors to datasets
        if (data && data.datasets) {
            data.datasets.forEach(function(dataset, index) {
                if (!dataset.backgroundColor) {
                    dataset.backgroundColor = colors.colors[index % colors.colors.length] + 'cc';
                }
                if (!dataset.borderColor) {
                    dataset.borderColor = colors.colors[index % colors.colors.length];
                }
                if (!dataset.pointBackgroundColor) {
                    dataset.pointBackgroundColor = colors.colors[index % colors.length];
                }
            });
        }
        
        return {
            type: type,
            data: data,
            options: defaultOptions
        };
    }
};
