{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_warehouses') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white transition-all text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Basic Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Company *</label>
                    <select name="company_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for c in companies %}
                        <option value="{{ c.id }}" {% if warehouse and warehouse.company_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Code *</label>
                    <input type="text" name="code" value="{{ warehouse.code if warehouse else '' }}" required placeholder="e.g. WH-01" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Name *</label>
                    <input type="text" name="name" value="{{ warehouse.name if warehouse else '' }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Type</label>
                    <select name="type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="main" {% if warehouse and warehouse.type == 'main' %}selected{% endif %}>Main Warehouse</option>
                        <option value="branch" {% if warehouse and warehouse.type == 'branch' %}selected{% endif %}>Branch</option>
                        <option value="distribution" {% if warehouse and warehouse.type == 'distribution' %}selected{% endif %}>Distribution Center</option>
                        <option value="transit" {% if warehouse and warehouse.type == 'transit' %}selected{% endif %}>Transit</option>
                        <option value="cold" {% if warehouse and warehouse.type == 'cold' %}selected{% endif %}>Cold Storage</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">City</label>
                    <input type="text" name="city" value="{{ warehouse.city if warehouse else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Country</label>
                    <input type="text" name="country" value="{{ warehouse.country if warehouse else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Address</label>
                    <textarea name="address" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">{{ warehouse.address if warehouse else '' }}</textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Phone</label>
                    <input type="text" name="phone" value="{{ warehouse.phone if warehouse else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Email</label>
                    <input type="email" name="email" value="{{ warehouse.email if warehouse else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Default Rotation Policy</label>
                    <select name="default_rotation_policy" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="FIFO" {% if warehouse and warehouse.default_rotation_policy == 'FIFO' %}selected{% endif %}>FIFO</option>
                        <option value="LIFO" {% if warehouse and warehouse.default_rotation_policy == 'LIFO' %}selected{% endif %}>LIFO</option>
                        <option value="FEFO" {% if warehouse and warehouse.default_rotation_policy == 'FEFO' %}selected{% endif %}>FEFO</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Operations</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Allow Receiving</p>
                        <p class="text-xs text-slate-400">Inbound operations</p>
                    </div>
                    <input type="checkbox" name="allow_receiving" value="1" {% if warehouse and warehouse.allow_receiving %}checked{% else %}checked{% endif %} class="w-5 h-5 rounded accent-brand-500">
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Allow Shipping</p>
                        <p class="text-xs text-slate-400">Outbound operations</p>
                    </div>
                    <input type="checkbox" name="allow_shipping" value="1" {% if warehouse and warehouse.allow_shipping %}checked{% else %}checked{% endif %} class="w-5 h-5 rounded accent-brand-500">
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Allow Storage</p>
                        <p class="text-xs text-slate-400">General storage</p>
                    </div>
                    <input type="checkbox" name="allow_storage" value="1" {% if warehouse and warehouse.allow_storage %}checked{% else %}checked{% endif %} class="w-5 h-5 rounded accent-brand-500">
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Notes</h3>
            <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">{{ warehouse.notes if warehouse else '' }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('wms_warehouses') }}" class="px-6 py-3 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white transition-all text-sm font-medium">Cancel</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 transition-all text-sm font-medium">
                <i class="fa-solid fa-save mr-2"></i>Save Warehouse
            </button>
        </div>
    </form>
</div>
{% endblock %}
