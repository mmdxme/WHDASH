{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ t('new_quality_hold', 'New Quality Hold') }}</h1>
        <a href="{{ url_for('wms_quality_holds') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white transition-all text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>{{ t('back', 'Back') }}
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <!-- Basic Information -->
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">{{ t('basic_information', 'Basic Information') }}</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('warehouse', 'Warehouse') }} *</label>
                    <select name="warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- {{ t('select_warehouse', 'Select Warehouse') }} --</option>
                        {% for w in warehouses %}
                        <option value="{{ w.id }}">{{ w.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('hold_type', 'Hold Type') }}</label>
                    <select name="hold_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="INSPECTION">Inspection</option>
                        <option value="NCR">NCR (Non-Conformance)</option>
                        <option value="REGULATORY">Regulatory</option>
                        <option value="CUSTOMER">Customer Claim</option>
                        <option value="SUSPICION">Suspicion of Issue</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('item', 'Item') }} *</label>
                    <select name="item_id" id="itemSelect" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- {{ t('select_item', 'Select Item') }} --</option>
                        {% for i in items %}
                        <option value="{{ i.id }}">{{ i.item_code }} - {{ i.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('quantity_held', 'Quantity Held') }}</label>
                    <input type="number" name="quantity_held" step="0.01" min="0" placeholder="0.00" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('source_inspection', 'Source Inspection') }}</label>
                    <select name="source_inspection_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- {{ t('none', 'None') }} --</option>
                        {% for ins in inspection_ids %}
                        <option value="{{ ins.id }}">{{ ins.inspection_number }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('hold_reason', 'Hold Reason') }} *</label>
                    <input type="text" name="hold_reason" required placeholder="{{ t('describe_hold_reason', 'Describe why this inventory is being held...') }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">{{ t('notes', 'Notes') }}</label>
                    <textarea name="hold_notes" rows="3" placeholder="{{ t('additional_notes', 'Additional notes about this hold...') }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white"></textarea>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3">
            <a href="{{ url_for('wms_quality_holds') }}" class="px-6 py-2.5 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 rounded-xl text-white text-sm font-medium transition-all">
                <i class="fa-solid fa-shield-halved mr-2"></i>{{ t('create_hold', 'Create Hold') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
