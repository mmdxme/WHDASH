{% extends "base.html" %}
{% block content %}
<div class="space-y-6 fade-in">
    <h1 class="text-2xl font-bold text-white">{{ title }}</h1>

    <div class="glass-panel rounded-2xl overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-slate-800/50 text-slate-400 border-b border-white/5 text-xs uppercase tracking-wider">
                    <th class="text-left py-3 px-4 font-semibold">Task #</th>
                    <th class="text-left py-3 px-4 font-semibold">Order</th>
                    <th class="text-left py-3 px-4 font-semibold">Warehouse</th>
                    <th class="text-center py-3 px-4 font-semibold">Cartons</th>
                    <th class="text-center py-3 px-4 font-semibold">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for t in tasks %}
                <tr class="border-b border-white/5 hover:bg-white/5">
                    <td class="py-3 px-4 text-brand-400 font-medium">{{ t.task_number }}</td>
                    <td class="py-3 px-4 text-slate-300">{{ t.order_number or '-' }}</td>
                    <td class="py-3 px-4 text-slate-400">{{ t.warehouse_name }}</td>
                    <td class="py-3 px-4 text-center text-pink-400 font-bold tabular-nums">{{ t.carton_count or 1 }}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="px-3 py-1 rounded-lg text-xs font-bold uppercase {% if t.status == 'COMPLETED' %}bg-emerald-500/10 text-emerald-400{% else %}bg-slate-500/10 text-slate-400{% endif %}">
                            {{ t.status }}
                        </span>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="py-16 text-center text-slate-500"><i class="fa-solid fa-boxes-packing text-4xl mb-3 block opacity-20"></i>No pack tasks</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
