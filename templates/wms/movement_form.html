{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_movements') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Internal Movement</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Movement Type</label>
                    <select name="movement_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="TRANSFER">Bin-to-Bin Transfer</option>
                        <option value="RECLASSIFY">Reclassification</option>
                        <option value="REPACK">Repacking</option>
                        <option value="RELABEL">Relabeling</option>
                        <option value="QUARANTINE">Move to Quarantine</option>
                        <option value="DAMAGE">Move to Damaged</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Item *</label>
                    <select name="item_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select Item --</option>
                        {% for it in items %}
                        <option value="{{ it.id }}">{{ it.item_code }} - {{ it.name[:40] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Source Location *</label>
                    <input type="text" name="source_location_id" required placeholder="Location code..." class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Destination Location *</label>
                    <input type="text" name="destination_location_id" required placeholder="Location code..." class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Quantity *</label>
                    <input type="number" step="0.01" name="quantity" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Reason Code</label>
                    <select name="reason_code" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for rc in reason_codes %}
                        <option value="{{ rc.code }}">{{ rc.code }} - {{ rc.description }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white"></textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('wms_movements') }}" class="px-6 py-3 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium">
                <i class="fa-solid fa-save mr-2"></i>Create Movement
            </button>
        </div>
    </form>
</div>
{% endblock %}
