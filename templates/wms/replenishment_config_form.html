{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in max-w-3xl mx-auto">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_replenishment_config') }}" class="px-4 py-2 bg-slate-500/10 text-slate-400 rounded-xl text-sm">{{ t('back', 'Back') }}</a>
    </div>

    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('item', 'Item') }} *</label>
                <select name="item_id" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    {% for item in items %}
                    <option value="{{ item.id }}">{{ item.item_code }} - {{ item.name[:30] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('warehouse', 'Warehouse') }} *</label>
                <select name="warehouse_id" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    {% for wh in warehouses %}
                    <option value="{{ wh.id }}">{{ wh.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('min_quantity', 'Min Qty') }}</label>
                <input type="number" name="min_quantity" value="0" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('max_quantity', 'Max Qty') }}</label>
                <input type="number" name="max_quantity" value="100" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('reorder_point', 'Reorder Point') }}</label>
                <input type="number" name="reorder_point" value="20" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('reorder_quantity', 'Reorder Qty') }}</label>
                <input type="number" name="reorder_quantity" value="50" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('safety_stock', 'Safety Stock') }}</label>
                <input type="number" name="safety_stock" value="10" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('lead_time_days', 'Lead Time (days)') }}</label>
                <input type="number" name="lead_time_days" value="7" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('method', 'Method') }}</label>
                <select name="replenishment_method" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    <option value="MIN_MAX">Min/Max</option>
                    <option value="KANBAN">Kanban</option>
                    <option value="ROP">Reorder Point</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end gap-4 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_replenishment_config') }}" class="px-6 py-3 bg-slate-500/10 text-slate-400 rounded-xl">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
