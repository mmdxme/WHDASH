{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_warehouses') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Warehouse *</label>
                    <select name="warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}" {% if selected_warehouse|int == wh.id %}selected{% endif %}>{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Code *</label>
                    <input type="text" name="code" value="{{ zone.code if zone else '' }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Name *</label>
                    <input type="text" name="name" value="{{ zone.name if zone else '' }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Zone Type *</label>
                    <select name="zone_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="STORAGE" {% if zone and zone.zone_type == 'STORAGE' %}selected{% endif %}>Storage</option>
                        <option value="PICKING" {% if zone and zone.zone_type == 'PICKING' %}selected{% endif %}>Picking</option>
                        <option value="RECEIVING" {% if zone and zone.zone_type == 'RECEIVING' %}selected{% endif %}>Receiving</option>
                        <option value="DISPATCH" {% if zone and zone.zone_type == 'DISPATCH' %}selected{% endif %}>Dispatch</option>
                        <option value="QUARANTINE" {% if zone and zone.zone_type == 'QUARANTINE' %}selected{% endif %}>Quarantine</option>
                        <option value="RETURNS" {% if zone and zone.zone_type == 'RETURNS' %}selected{% endif %}>Returns</option>
                        <option value="COLD" {% if zone and zone.zone_type == 'COLD' %}selected{% endif %}>Cold Storage</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Description</label>
                    <input type="text" name="description" value="{{ zone.description if zone else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Sort Order</label>
                    <input type="number" name="sort_order" value="{{ zone.sort_order if zone else 0 }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium"><i class="fa-solid fa-save mr-2"></i>Save Zone</button>
        </div>
    </form>
</div>
{% endblock %}
