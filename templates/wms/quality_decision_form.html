{% extends "base.html" %}
{% block content %}
<div class="space-y-6 fade-in max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('item', 'Item') }} *</label>
            <select name="item_id" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                {% for item in items %}
                <option value="{{ item.id }}">{{ item.item_code }} - {{ item.name[:30] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('decision_code', 'Decision Code') }}</label>
                <select name="decision_code" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    <option value="ACCEPT">ACCEPT</option>
                    <option value="REJECT">REJECT</option>
                    <option value="CONCESSION">CONCESSION</option>
                    <option value="RETURN">RETURN</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('quantity', 'Quantity') }}</label>
                <input type="number" name="quantity" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('disposition', 'Disposition') }}</label>
            <input type="text" name="disposition" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
            <textarea name="notes" rows="3" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"></textarea>
        </div>
        <div class="flex justify-end gap-4 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_quality_decisions') }}" class="px-6 py-3 bg-slate-500/10 text-slate-400 rounded-xl">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
