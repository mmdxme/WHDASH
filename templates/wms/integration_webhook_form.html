{% extends "base.html" %}
{% block content %}
<div class="space-y-6 fade-in max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('event_type', 'Event Type') }} *</label>
            <select name="event_type" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                <option value="RECEIPT_CREATED">Receipt Created</option>
                <option value="PICK_COMPLETED">Pick Completed</option>
                <option value="SHIPMENT_SHIPPED">Shipment Shipped</option>
                <option value="INVENTORY_LOW">Inventory Low</option>
                <option value="QC_FAILED">QC Failed</option>
            </select>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('url', 'Webhook URL') }} *</label>
            <input type="url" name="url" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('secret', 'Secret') }}</label>
            <input type="text" name="secret" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
        </div>
        <div>
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="is_active" value="1" checked class="w-5 h-5 rounded bg-slate-700 border-slate-600 text-brand-500">
                <span class="text-white">{{ t('active', 'Active') }}</span>
            </label>
        </div>
        <div class="flex justify-end gap-4 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_integration_webhooks') }}" class="px-6 py-3 bg-slate-500/10 text-slate-400 rounded-xl">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
