{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('code', 'Code') }} *</label>
                <input type="text" name="code" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('category', 'Category') }} *</label>
                <select name="category" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    <option value="DIMENSIONAL">Dimensional</option>
                    <option value="VISUAL">Visual</option>
                    <option value="FUNCTIONAL">Functional</option>
                    <option value="PACKAGING">Packaging</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('description', 'Description') }}</label>
            <textarea name="description" rows="2" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('severity', 'Severity') }}</label>
                <select name="severity" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    <option value="MINOR">Minor</option>
                    <option value="MAJOR">Major</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-2">{{ t('disposition', 'Disposition') }}</label>
                <select name="disposition" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                    <option value="REWORK">Rework</option>
                    <option value="SCRAP">Scrap</option>
                    <option value="RETURN">Return to Supplier</option>
                    <option value="ACCEPT">Accept as-is</option>
                </select>
            </div>
        </div>
        <div class="flex justify-end gap-4 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_quality_defect_codes') }}" class="px-6 py-3 bg-slate-500/10 text-slate-400 rounded-xl">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
