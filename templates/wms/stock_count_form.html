{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_stock_counts') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Stock Count Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Count Type *</label>
                    <select name="count_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="CYCLE_COUNT">Cycle Count</option>
                        <option value="FULL_COUNT">Full Count</option>
                        <option value="SPOT_COUNT">Spot Count</option>
                        <option value="DAILY">Daily Count</option>
                        <option value="WEEKLY">Weekly Count</option>
                        <option value="MONTHLY">Monthly Count</option>
                        <option value="ANNUAL">Annual Count</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Warehouse *</label>
                    <select name="warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}">{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Scheduled Date</label>
                    <input type="date" name="scheduled_date" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Count Method</label>
                    <select name="count_method" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="MANUAL">Manual</option>
                        <option value="SCANNER">Scanner</option>
                        <option value="MOBILE">Mobile</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Category Filter</label>
                    <select name="category_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">All Categories</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Blind Count</p>
                        <p class="text-xs text-slate-400">Hide system quantities from counter</p>
                    </div>
                    <input type="checkbox" name="is_blind_count" value="1" class="w-5 h-5 rounded accent-brand-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white"></textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium">
                <i class="fa-solid fa-save mr-2"></i>Create Stock Count
            </button>
        </div>
    </form>
</div>
{% endblock %}
