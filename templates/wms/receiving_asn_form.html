{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in max-w-3xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
            <p class="text-slate-400 text-sm mt-1">{{ t('asn_form_desc', 'Create or edit Advanced Shipping Notice') }}</p>
        </div>
        <a href="{{ url_for('wms_receiving_asn') }}" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-medium transition-all">
            <i class="fa-solid fa-times mr-2"></i>{{ t('cancel', 'Cancel') }}
        </a>
    </div>

    <!-- Form -->
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- ASN Number -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('asn_number', 'ASN Number') }}</label>
                <input type="text" name="asn_number" value="{{ asn.asn_number if asn else '' }}"
                       class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none"
                       placeholder="{{ t('auto_generate', 'Auto-generate if blank') }}">
            </div>

            <!-- Partner -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('partner', 'Partner') }}</label>
                <select name="partner_id" class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
                    <option value="">{{ t('select_partner', 'Select Partner') }}</option>
                    {% for p in partners %}
                    <option value="{{ p.id }}" {% if asn and asn.partner_id == p.id %}selected{% endif %}>{{ p.partner_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Warehouse -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('warehouse', 'Warehouse') }}</label>
                <select name="warehouse_id" class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
                    <option value="">{{ t('select_warehouse', 'Select Warehouse') }}</option>
                    {% for w in warehouses %}
                    <option value="{{ w.id }}" {% if asn and asn.warehouse_id == w.id %}selected{% endif %}>{{ w.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Expected Date -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('expected_date', 'Expected Date') }}</label>
                <input type="date" name="expected_date" value="{{ asn.expected_date[:10] if asn and asn.expected_date else '' }}"
                       class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
            </div>

            <!-- PO Number -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('po_number', 'PO Number') }}</label>
                <input type="text" name="po_number" value="{{ asn.po_number if asn else '' }}"
                       class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none"
                       placeholder="{{ t('enter_po', 'Enter PO number') }}">
            </div>

            <!-- Status -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('status', 'Status') }}</label>
                <select name="status" class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
                    <option value="EXPECTED" {% if not asn or asn.status == 'EXPECTED' %}selected{% endif %}>{{ t('expected', 'Expected') }}</option>
                    <option value="RECEIVED" {% if asn and asn.status == 'RECEIVED' %}selected{% endif %}>{{ t('received', 'Received') }}</option>
                    <option value="PARTIAL" {% if asn and asn.status == 'PARTIAL' %}selected{% endif %}>{{ t('partial', 'Partial') }}</option>
                    <option value="CLOSED" {% if asn and asn.status == 'CLOSED' %}selected{% endif %}>{{ t('closed', 'Closed') }}</option>
                </select>
            </div>
        </div>

        <!-- Notes -->
        <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('notes', 'Notes') }}</label>
            <textarea name="notes" rows="3"
                      class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">{{ asn.notes if asn else '' }}</textarea>
        </div>

        <!-- Submit -->
        <div class="flex justify-end gap-3 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_receiving_asn') }}" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-medium transition-all">
                {{ t('cancel', 'Cancel') }}
            </a>
            <button type="submit" class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-medium transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
