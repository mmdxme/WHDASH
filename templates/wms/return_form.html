{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_returns') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Return Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Return Type *</label>
                    <select name="return_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="CUSTOMER_RETURN">Customer Return</option>
                        <option value="SUPPLIER_RETURN">Supplier Return</option>
                        <option value="SALES_RETURN">Sales Return</option>
                        <option value="DAMAGED_RETURN">Damaged Return</option>
                        <option value="WARRANTY_RETURN">Warranty Return</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Warehouse *</label>
                    <select name="warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}">{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Customer</label>
                    <select name="customer_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Supplier</label>
                    <select name="supplier_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">RMA Number</label>
                    <input type="text" name="rma_number" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Original Order #</label>
                    <input type="text" name="original_order_number" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Reason Code</label>
                    <select name="reason_code" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for rc in reason_codes %}
                        <option value="{{ rc.code }}">{{ rc.description }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white"></textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium">
                <i class="fa-solid fa-save mr-2"></i>Create Return
            </button>
        </div>
    </form>
</div>
{% endblock %}
