{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_receiving') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Inbound Receipt Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Receipt Type *</label>
                    <select name="receipt_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="PO_RECEIPT" {% if receipt and receipt.receipt_type == 'PO_RECEIPT' %}selected{% endif %}>Purchase Order Receipt</option>
                        <option value="TRANSFER_RECEIPT" {% if receipt and receipt.receipt_type == 'TRANSFER_RECEIPT' %}selected{% endif %}>Transfer Receipt</option>
                        <option value="RETURN_RECEIPT" {% if receipt and receipt.receipt_type == 'RETURN_RECEIPT' %}selected{% endif %}>Return Receipt</option>
                        <option value="BLIND_RECEIPT" {% if receipt and receipt.receipt_type == 'BLIND_RECEIPT' %}selected{% endif %}>Blind Receipt</option>
                        <option value="ASN_RECEIPT" {% if receipt and receipt.receipt_type == 'ASN_RECEIPT' %}selected{% endif %}>ASN Receipt</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Warehouse *</label>
                    <select name="warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}" {% if receipt and receipt.warehouse_id == wh.id %}selected{% endif %}>{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Supplier</label>
                    <select name="supplier_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}" {% if receipt and receipt.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Expected Date</label>
                    <input type="date" name="expected_date" value="{{ receipt.expected_date[:10] if receipt and receipt.expected_date else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">PO Reference</label>
                    <input type="text" name="po_reference" value="{{ receipt.po_reference if receipt else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">ASN Reference</label>
                    <input type="text" name="asn_reference" value="{{ receipt.asn_reference if receipt else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">{{ receipt.notes if receipt else '' }}</textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('wms_receiving') }}" class="px-6 py-3 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium">
                <i class="fa-solid fa-save mr-2"></i>Create Receipt
            </button>
        </div>
    </form>
</div>
{% endblock %}
