{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_transfers') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back
        </a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Transfer Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Transfer Type</label>
                    <select name="transfer_type" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="WAREHOUSE_TO_WAREHOUSE">Warehouse to Warehouse</option>
                        <option value="BRANCH_TO_BRANCH">Branch to Branch</option>
                        <option value="INTER_COMPANY">Inter-Company</option>
                        <option value="RETURN_TRANSFER">Return Transfer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Source Warehouse *</label>
                    <select name="source_warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}">{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Destination Warehouse *</label>
                    <select name="destination_warehouse_id" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}">{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Priority</label>
                    <input type="number" name="priority" value="5" min="1" max="10" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Notes</label>
                    <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white"></textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium">
                <i class="fa-solid fa-save mr-2"></i>Create Transfer
            </button>
        </div>
    </form>
</div>
{% endblock %}
