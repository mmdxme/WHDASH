{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('rule_name', 'Rule Name') }} *</label>
            <input type="text" name="rule_name" value="{{ rule.rule_name if rule else '' }}" required
                   class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none"
                   placeholder="{{ t('enter_rule_name', 'Enter rule name') }}">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('inspection_level', 'Inspection Level') }}</label>
                <select name="inspection_level" class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
                    <option value="I" {% if rule and rule.inspection_level == 'I' %}selected{% endif %}>Level I (Reduced)</option>
                    <option value="II" {% if not rule or rule.inspection_level == 'II' %}selected{% endif %}>Level II (Normal)</option>
                    <option value="III" {% if rule and rule.inspection_level == 'III' %}selected{% endif %}>Level III (Tightened)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('aql_level', 'AQL Level') }}</label>
                <select name="aql_level" class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
                    <option value="0.65" {% if rule and rule.aql_level == 0.65 %}selected{% endif %}>0.65 (Tight)</option>
                    <option value="1.0" {% if not rule or rule.aql_level == 1.0 %}selected{% endif %}>1.0 (Standard)</option>
                    <option value="1.5" {% if rule and rule.aql_level == 1.5 %}selected{% endif %}>1.5 (Relaxed)</option>
                    <option value="2.5" {% if rule and rule.aql_level == 2.5 %}selected{% endif %}>2.5 (Loose)</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('lot_size_min', 'Lot Size Min') }}</label>
                <input type="number" name="lot_size_min" value="{{ rule.lot_size_min if rule else 1 }}" min="1"
                       class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">{{ t('lot_size_max', 'Lot Size Max') }}</label>
                <input type="number" name="lot_size_max" value="{{ rule.lot_size_max if rule else 50000 }}" min="1"
                       class="w-full bg-slate-800/50 border border-slate-600/30 rounded-xl px-4 py-2.5 text-white text-sm focus:border-brand-500 focus:outline-none">
            </div>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_quality_aql_rules') }}" class="px-6 py-3 bg-slate-500/10 text-slate-400 rounded-xl hover:bg-slate-500/20 transition-all">
                {{ t('cancel', 'Cancel') }}
            </a>
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl transition-all">
                <i class="fa-solid fa-save mr-2"></i>{{ t('save', 'Save') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
