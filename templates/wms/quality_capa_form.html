{% extends "base.html" %}
{% block content %}
<div class="space-y-6 fade-in max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
    <form method="POST" class="glass-panel rounded-2xl p-6 space-y-6">
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('defect_code', 'Related Defect') }}</label>
            <select name="defect_id" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                <option value="">-- None --</option>
                {% for d in defect_codes %}
                <option value="{{ d.id }}">{{ d.code }} - {{ d.category }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('root_cause', 'Root Cause') }} *</label>
            <textarea name="root_cause" required rows="2" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"></textarea>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('corrective_action', 'Corrective Action') }} *</label>
            <textarea name="corrective_action" required rows="2" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"></textarea>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('preventive_action', 'Preventive Action') }} *</label>
            <textarea name="preventive_action" required rows="2" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"></textarea>
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-2">{{ t('priority', 'Priority') }}</label>
            <select name="priority" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>
        </div>
        <div class="flex justify-end gap-4 pt-4 border-t border-white/5">
            <a href="{{ url_for('wms_quality_capa') }}" class="px-6 py-3 bg-slate-500/10 text-slate-400 rounded-xl">{{ t('cancel', 'Cancel') }}</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white rounded-xl">{{ t('save', 'Save') }}</button>
        </div>
    </form>
</div>
{% endblock %}
