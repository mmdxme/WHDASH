{% extends "base.html" %}

{% block content %}
<div class="space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_item_brands_new') }}" class="px-4 py-2 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium">
            <i class="fa-solid fa-plus mr-2"></i>New Brand
        </a>
    </div>

    <div class="glass-panel rounded-2xl overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-slate-800/50 text-slate-400 border-b border-white/5 text-xs uppercase tracking-wider">
                    <th class="text-left py-3 px-4 font-semibold">Code</th>
                    <th class="text-left py-3 px-4 font-semibold">Name</th>
                    <th class="text-left py-3 px-4 font-semibold">Manufacturer</th>
                    <th class="text-left py-3 px-4 font-semibold">Country</th>
                    <th class="text-center py-3 px-4 font-semibold">Items</th>
                </tr>
            </thead>
            <tbody>
                {% for br in brands %}
                <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                    <td class="py-3 px-4 text-brand-400 font-mono font-medium">{{ br.code }}</td>
                    <td class="py-3 px-4 text-white font-medium">{{ br.name }}</td>
                    <td class="py-3 px-4 text-slate-400">{{ br.manufacturer or '-' }}</td>
                    <td class="py-3 px-4 text-slate-400">{{ br.country or '-' }}</td>
                    <td class="py-3 px-4 text-center text-slate-300">{{ br.item_count }}</td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="py-16 text-center text-slate-500"><i class="fa-solid fa-tag text-4xl mb-3 block opacity-20"></i>No brands</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
