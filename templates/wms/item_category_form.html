{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_item_categories') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Code *</label>
                    <input type="text" name="code" value="{{ category.code if category else '' }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Name *</label>
                    <input type="text" name="name" value="{{ category.name if category else '' }}" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Parent Category</label>
                    <select name="parent_id" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- None --</option>
                        {% for pc in parent_categories %}
                        <option value="{{ pc.id }}" {% if category and category.parent_id == pc.id %}selected{% endif %}>{{ pc.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Sort Order</label>
                    <input type="number" name="sort_order" value="{{ category.sort_order if category else 0 }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Description</label>
                    <textarea name="description" rows="2" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">{{ category.description if category else '' }}</textarea>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium"><i class="fa-solid fa-save mr-2"></i>Save Category</button>
        </div>
    </form>
</div>
{% endblock %}
