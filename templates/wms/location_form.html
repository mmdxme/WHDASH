{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6 fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">{{ title }}</h1>
        <a href="{{ url_for('wms_locations') }}" class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Back</a>
    </div>

    <form method="POST" class="space-y-6">
        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Location Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Warehouse *</label>
                    <select name="warehouse_id" id="warehouse-select" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- Select --</option>
                        {% for wh in warehouses %}
                        <option value="{{ wh.id }}" {% if selected_warehouse|int == wh.id or (location and location.warehouse_id == wh.id) %}selected{% endif %}>{{ wh.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Zone</label>
                    <select name="zone_id" id="zone-select" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        <option value="">-- No Zone --</option>
                        {% for z in zones %}
                        <option value="{{ z.id }}" {% if location and location.zone_id == z.id %}selected{% endif %}>{{ z.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Location Code *</label>
                    <input type="text" name="code" value="{{ location.code if location else '' }}" required placeholder="e.g. 01-12-03-05-A" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                    <p class="text-xs text-slate-500 mt-1">Format: 01-12-03-05-A or free text up to 50 chars</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Barcode</label>
                    <input type="text" name="barcode" value="{{ location.barcode if location else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Name</label>
                    <input type="text" name="name" value="{{ location.name if location else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Location Type *</label>
                    <select name="location_type" required class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                        {% for lt in location_types %}
                        <option value="{{ lt.code }}" {% if (location and location.location_type == lt.code) or lt.code == 'STORAGE' %}selected{% endif %}>{{ lt.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Capacity</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Capacity (Pallets)</label>
                    <input type="number" name="capacity_pallets" value="{{ location.capacity_pallets if location else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Capacity (Weight kg)</label>
                    <input type="number" step="0.01" name="capacity_weight_kg" value="{{ location.capacity_weight_kg if location else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Capacity (Volume m³)</label>
                    <input type="number" step="0.001" name="capacity_volume_m3" value="{{ location.capacity_volume_m3 if location else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Capacity (Cartons)</label>
                    <input type="number" name="capacity_cartons" value="{{ location.capacity_cartons if location else '' }}" class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white">
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Operations</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Picking Enabled</p>
                        <p class="text-xs text-slate-400">Can be used for picking</p>
                    </div>
                    <input type="checkbox" name="picking_enabled" value="1" {% if location and location.picking_enabled %}checked{% else %}checked{% endif %} class="w-5 h-5 rounded accent-brand-500">
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Putaway Enabled</p>
                        <p class="text-xs text-slate-400">Can receive putaway</p>
                    </div>
                    <input type="checkbox" name="putaway_enabled" value="1" {% if location and location.putaway_enabled %}checked{% else %}checked{% endif %} class="w-5 h-5 rounded accent-brand-500">
                </div>
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/10">
                    <div>
                        <p class="text-sm font-semibold text-white">Replenishment</p>
                        <p class="text-xs text-slate-400">Can be replenished</p>
                    </div>
                    <input type="checkbox" name="replenishment_enabled" value="1" {% if location and location.replenishment_enabled %}checked{% else %}checked{% endif %} class="w-5 h-5 rounded accent-brand-500">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="{{ url_for('wms_locations') }}" class="px-6 py-3 bg-white/5 border border-white/10 rounded-xl text-slate-400 hover:text-white text-sm">Cancel</a>
            <button type="submit" class="px-6 py-3 bg-brand-500 text-white rounded-xl hover:bg-brand-400 text-sm font-medium"><i class="fa-solid fa-save mr-2"></i>Save Location</button>
        </div>
    </form>
</div>
{% endblock %}
