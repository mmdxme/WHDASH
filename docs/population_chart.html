<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمودار پرجمعیت‌ترین کشورهای جهان</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #8892b0;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(0, 255, 136, 0.1));
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
        }

        .stat-card h3 {
            color: #00d9ff;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #8892b0;
            font-size: 0.9rem;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 پرجمعیت‌ترین کشورهای جهان</h1>
        <p class="subtitle">آمار جمعیت بر اساس اطلاعات سال ۲۰۲۶ (میلیون نفر)</p>

        <div class="chart-container">
            <canvas id="populationChart"></canvas>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>1.45B</h3>
                <p>هند - پرجمعیت‌ترین</p>
            </div>
            <div class="stat-card">
                <h3>8B</h3>
                <p>جمعیت کل جهان</p>
            </div>
            <div class="stat-card">
                <h3>195</h3>
                <p>تعداد کشورها</p>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('populationChart').getContext('2d');

        const countries = [
            'هند', 'چین', 'آمریکا', 'اندونزی', 'پاکستان',
            'نیجریه', 'برزیل', 'بنگلادش', 'روسیه', 'مکزیک'
        ];

        const populations = [1450, 1400, 340, 280, 240, 220, 215, 170, 145, 130];

        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
            '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9'
        ];

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: countries,
                datasets: [{
                    label: 'جمعیت (میلیون نفر)',
                    data: populations,
                    backgroundColor: colors,
                    borderColor: colors.map(c => c),
                    borderWidth: 2,
                    borderRadius: 10,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleFont: { size: 16 },
                        bodyFont: { size: 14 },
                        padding: 15,
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y + ' میلیون نفر';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#fff',
                            font: { size: 12 }
                        },
                        title: {
                            display: true,
                            text: 'جمعیت (میلیون نفر)',
                            color: '#8892b0',
                            font: { size: 14 }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#fff',
                            font: { size: 12 }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
