<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMD DASH - Warehouse Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                        },
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-gray-100 font-sans antialiased transition-colors duration-200">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-slate-900 px-4 relative overflow-hidden">
        <!-- Decorative background elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
            <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-brand-500/20 blur-3xl"></div>
            <div class="absolute bottom-10 right-10 w-80 h-80 rounded-full bg-purple-500/20 blur-3xl"></div>
        </div>
        
        <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 z-10 border border-gray-200 dark:border-slate-700 transform transition-all">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-500 text-white mb-4 shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">MMD DASH</h2>
                <p class="text-gray-500 dark:text-gray-400 mt-2">Warehouse Management System</p>
            </div>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username or Email</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="username" class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-slate-600 rounded-lg bg-gray-50 dark:bg-slate-700/50 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors" placeholder="admin" value="admin">
                    </div>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-slate-600 rounded-lg bg-gray-50 dark:bg-slate-700/50 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors" placeholder="••••••••" value="password">
                    </div>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-brand-600 focus:ring-brand-500 border-gray-300 rounded dark:bg-slate-700 dark:border-slate-600">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-brand-600 hover:text-brand-500 dark:text-brand-400">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                    Sign in
                </button>
            </form>
            
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300 dark:border-slate-600"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-slate-800 text-gray-500">Or continue with</span>
                    </div>
                </div>

                <div class="mt-6">
                    <button type="button" class="w-full flex justify-center items-center py-3 px-4 border border-gray-300 dark:border-slate-600 rounded-lg shadow-sm bg-white dark:bg-slate-700/50 text-sm font-medium text-gray-700 dark:text-white hover:bg-gray-50 dark:hover:bg-slate-600 focus:outline-none transition-colors">
                        <i class="fa-brands fa-google text-red-500 mr-2"></i>
                        Sign in with Google
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-dashboard" class="hidden h-screen overflow-hidden flex bg-gray-100 dark:bg-slate-900">
        
        <!-- Sidebar container will be populated by JS -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-slate-850 border-r border-gray-200 dark:border-slate-700 flex flex-col transition-all duration-300 z-20 hidden md:flex">
            <!-- Handled by JS -->
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header (Navbar) -->
            <header class="h-16 bg-white dark:bg-slate-850 border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-4 lg:px-6 z-10 transition-colors duration-200">
                <div class="flex items-center flex-1">
                    <button id="mobile-menu-btn" class="md:hidden text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white mr-4 p-2 rounded-md focus:outline-none focus:bg-gray-100 dark:focus:bg-slate-700">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    
                    <!-- Global Search -->
                    <div class="relative w-full max-w-xl group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-search text-gray-400 group-focus-within:text-brand-500 transition-colors"></i>
                        </div>
                        <input type="text" id="global-search" class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-slate-600 rounded-lg leading-5 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 sm:text-sm transition-all shadow-sm" placeholder="Search Part Number (e.g. PN-8842-AX) or description...">
                        <!-- Search Results Dropdown -->
                        <div id="search-results" class="hidden absolute top-full left-0 w-full mt-1 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg shadow-xl overflow-hidden z-50 max-h-96 overflow-y-auto">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4 ml-4">
                    <div id="company-selector-container" class="hidden sm:block">
                        <!-- Populated by JS -->
                    </div>
                    
                    <button class="relative p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white focus:outline-none rounded-full hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-bell"></i>
                        <span class="absolute top-1 right-1 block w-2 h-2 rounded-full bg-red-500 ring-2 ring-white dark:ring-slate-800"></span>
                    </button>

                    <button id="theme-toggle" class="p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white focus:outline-none rounded-full hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:block"></i>
                    </button>
                    
                    <div class="relative flex items-center gap-3 border-l border-gray-200 dark:border-slate-700 pl-4 ml-2">
                        <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white font-semibold shadow-sm">
                            <span class="text-sm">AD</span>
                        </div>
                        <div class="hidden md:block text-sm">
                            <p class="font-medium text-gray-900 dark:text-white">Admin User</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Holding Manager</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-6 pb-24 relative" id="main-content">
                <!-- Dynamic Content Container -->
                <div id="view-container" class="space-y-6 max-w-7xl mx-auto">
                    <!-- Dashboard/Inventory views rendered here via JS -->
                </div>
            </main>
        </div>
        
        <!-- Mobile Sidebar Overlay -->
        <div id="mobile-sidebar-overlay" class="fixed inset-0 bg-gray-900/50 dark:bg-slate-900/80 z-20 hidden md:hidden backdrop-blur-sm transition-opacity"></div>
        
        <!-- Mobile Sidebar -->
        <aside id="mobile-sidebar" class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-slate-850 border-r border-gray-200 dark:border-slate-700 flex flex-col z-30 transform -translate-x-full transition-transform duration-300 md:hidden shadow-2xl">
            <!-- Handled by JS -->
        </aside>
    </div>

    <!-- Part Detail Modal -->
    <div id="part-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-gray-900/50 dark:bg-slate-900/80 backdrop-blur-sm transition-opacity" id="part-modal-overlay"></div>
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="relative bg-white dark:bg-slate-800 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-4xl w-full flex flex-col max-h-[90vh] border border-gray-200 dark:border-slate-700 slide-up">
                
                <!-- Modal Header -->
                <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-850">
                    <div class="flex items-center gap-4">
                        <h3 class="text-xl leading-6 font-bold text-gray-900 dark:text-white" id="modal-part-number">
                            Part Details
                        </h3>
                        <span id="modal-critical-badge" class="hidden px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800">
                            Critical Stock
                        </span>
                    </div>
                    <button id="close-modal-btn" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 focus:outline-none p-1 rounded-md hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <!-- Modal Body (Scrollable) -->
                <div class="px-6 py-6 overflow-y-auto flex-1 custom-scrollbar">
                    <div id="modal-content-container">
                        <!-- Populated iteratively by JS -->
                    </div>
                </div>
                
                <!-- Modal Footer -->
                <div class="px-6 py-4 bg-gray-50 dark:bg-slate-850 border-t border-gray-200 dark:border-slate-700 flex justify-end gap-3">
                    <button id="modal-export-btn" class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-slate-600 shadow-sm text-sm font-medium rounded-lg text-gray-700 dark:text-gray-200 bg-white dark:bg-slate-700 hover:bg-gray-50 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                        <i class="fa-solid fa-file-excel text-green-600 dark:text-green-500 mr-2"></i>
                        Export Record
                    </button>
                    <button class="inline-flex justify-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                        Create Reorder PO
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
