[tool.poetry]
name = "whdash"
version = "1.0.0"
description = "MMDx ERP System"
authors = ["MMDx Team <team@example.com>"]
readme = "README.md"
packages = [{include = "application"}]

[tool.poetry.dependencies]
python = "^3.9"
Flask = "3.1.3"
pandas = "3.0.1"
openpyxl = "3.1.5"
xlsxwriter = "3.1.0"
requests = "2.31.0"
gunicorn = "23.0.0"
cryptography = "43.0.1"
Pillow = "10.4.0"
reportlab = "4.2.5"
weasyprint = "62.3"
arabic-reshaper = "3.0.0"
python-bidi = "0.4.2"
python-docx = "1.1.2"
qrcode = "7.4.2"
xmltodict = "0.14.2"
webpush = "1.0.0"
py-vapid = "1.9.2"
playwright = "1.48.0"
alembic = "1.14.0"
sqlalchemy = "2.0.36"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.0"
pytest-cov = "5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
