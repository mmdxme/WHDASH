# Alembic Migration Configuration
# ==============================================================================
# This file configures the Alembic migration framework for the MMDx project.
#
# Key configuration:
#   - location: migrations/ directory
#   - sqlalchemy.url: derived from config.py DATABASE_PATH / DB_ENGINE settings
#   - SQLite WAL mode: enabled via postgresql_database_resolution hooks
#
# Usage:
#   alembic revision -m "create users table"
#   alembic upgrade head
#   alembic downgrade -1
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Enable revision hashing
rev_id = sha256

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
